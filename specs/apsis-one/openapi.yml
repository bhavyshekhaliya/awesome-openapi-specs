openapi: 3.0.0
info:
  title: Apsis One API community specification
  version: '2026-10-03'
  description: Community-maintained structural representation of the public Apsis One API. Vendor-authored explanations
    and examples are omitted; consult the official Developer Hub for guidance and current limitations.
tags:
- name: Definitions
- name: Profiles
- name: Attributes, tags and events
- name: Consents
- name: Profile export
- name: Segments
- name: Profile import
- name: Email
- name: SMS
- name: Website
- name: Marketing Automation
- name: Forms & Pages
- name: Folders
security:
- bearerToken: []
servers:
- url: https://api.apsis.one
- url: https://api-apac.apsis.one
paths:
  /audience/keyspaces:
    get:
      tags:
      - Definitions
      operationId: getKeyspaces
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Keyspaces'
          description: Response for HTTP 200.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: GET /audience/keyspaces
  /audience/keyspaces/{keyspace_discriminator}/sections/{section_discriminator}/profiles:
    post:
      tags:
      - Profiles
      operationId: createNewProfile
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/section_discriminator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueIdentifier'
          description: Response for HTTP 201.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: POST /audience/keyspaces/{keyspace_discriminator}/sections/{section_discriminator}/profiles
  /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/tags:
    patch:
      tags:
      - Attributes, tags and events
      operationId: setTagsOnProfile
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TaggedProfile'
      responses:
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: PATCH /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/tags
    get:
      tags:
      - Attributes, tags and events
      operationId: getAllProfileTags
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggedProfile'
          description: Response for HTTP 200.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: GET /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/tags
  /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes:
    get:
      tags:
      - Attributes, tags and events
      operationId: getAllProfileAttributes
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
