            application/json:
              schema:
                $ref: '#/components/schemas/AttributedProfile'
          description: Response for HTTP 200.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: GET /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes
    patch:
      tags:
      - Attributes, tags and events
      operationId: setAttributesOnProfile
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AttributeVersionIdsAndValues'
      responses:
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: PATCH /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes
  /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes:
    patch:
      tags:
      - Attributes, tags and events
      operationId: setAttributesOnProfileV2
      parameters:
      - $ref: '#/components/parameters/profile_key_update_method'
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AttributeDiscriminatorsAndValues'
      responses:
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: PATCH /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes
  ? /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes/{version_id}
  : delete:
      tags:
      - Attributes, tags and events
      operationId: clearAttributeValueOnProfile
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      - $ref: '#/components/parameters/version_id'
      responses:
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: DELETE /audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes/{version_id}
  ? /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes/{attribute_discriminator}
  : delete:
      tags:
      - Attributes, tags and events
      operationId: clearAttributeValueOnProfileV2
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      - $ref: '#/components/parameters/attribute_discriminator'
      responses:
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealm'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: DELETE /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/attributes/{attribute_discriminator}
  /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/consents:
    post:
      tags:
      - Consents
      operationId: createConsentV2
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
      responses:
        '201':
          description: Response for HTTP 201.
        '204':
          description: Response for HTTP 204.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/KeyspaceLacksOneApiRealmOrManageSubscriptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictingConsentState'
        '410':
          $ref: '#/components/responses/ProfileLocked'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: POST /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/consents
    get:
      tags:
      - Consents
      operationId: getConsentsV2
      parameters:
      - $ref: '#/components/parameters/keyspace_discriminator'
      - $ref: '#/components/parameters/profile_key'
      - $ref: '#/components/parameters/section_discriminator'
      - in: query
        name: consent_types
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - opt-in
            - opt-out
            - pending-opt-in
            - confirmed-opt-in
      - in: query
        name: suppression_channel_discriminator
        schema:
          type: string
      - in: query
        name: suppression_address
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConsentsResponse'
          description: Response for HTTP 200.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Response for HTTP default.
      summary: GET /v2/audience/keyspaces/{keyspace_discriminator}/profiles/{profile_key}/sections/{section_discriminator}/consents
