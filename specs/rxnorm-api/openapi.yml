        url: https://lhncbc.nlm.nih.gov/RxNav/APIs/api-RxNorm.getAllNDCsByStatus.html
      parameters:
      - name: status
        in: query
        required: false
        description: See the linked NLM function page for accepted values and behavior.
        schema:
          type: string
          default: ALL
      responses:
        '200':
          description: RxNorm JSON response object.
          content:
            application/json:
              schema:
