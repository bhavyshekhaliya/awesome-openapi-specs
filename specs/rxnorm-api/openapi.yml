openapi: 3.1.0
info:
  title: RxNorm API
  version: 3.1.355
  description: Community-maintained definition of the documented RxNorm JSON resources. RxNav returns
    XML when the format suffix is omitted; these paths use the documented `.json` suffix. The NLM documentation
    describes JSON responses as objects; this definition leaves function-specific fields open. The proprietary-information
    operation can use a UMLS UTS bearer key to include restricted source-vocabulary data; ordinary RxNorm
    API use does not require a license.
  externalDocs:
    description: NLM RxNorm API documentation
    url: https://lhncbc.nlm.nih.gov/RxNav/APIs/RxNormAPIs.html
servers:
- url: https://rxnav.nlm.nih.gov/REST
  description: NLM RxNav REST API
