          $ref: '#/components/responses/ServerError'

  /billing/purchase-products:
    post:
      tags: ["Billing & Usage"]
      operationId: purchaseProducts
      summary: Quote or purchase additional products
      description: The official CLI sends a quote request without confirm_charge_cents, then sends a confirmed purchase with that value and an idempotency key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable key used by the official CLI to make purchase retries idempotent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseProductsRequest'
      responses:
        '2XX':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The official CLI handles this response as a quote result; quote details are returned in the error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Outrank API key (prefix outr_live_)
      description: Create keys in the Outrank dashboard. Keys are scoped to one organization and shown only once.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Product or article identifier.
      schema:
        type: string
    Limit100:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor.
      schema:
        type: string
  requestBodies:
    UndocumentedJsonObject:
      required: true
      description: JSON object body; the public API reference does not document the supported fields for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenJsonObject'
    ArticleGeneration:
      required: true
      description: Request body used by the official CLI to precreate or generate an article.
      content:
        application/json:
          schema:
            type: object
            required: [keyword_id]
            properties:
              keyword_id:
                type: string
                description: Identifier of the keyword for which to create the article.
            additionalProperties: true
    SearchConsoleUrlInspection:
      required: true
      description: Request body fields exposed by the official CLI.
      content:
        application/json:
          schema:
            type: object
            required: [inspection_url]
            properties:
              inspection_url:
                type: string
                description: URL to inspect.
              language_code:
                type: string
                description: Optional language code.
            additionalProperties: true
  responses:
    Success:
      description: Successful response. The reference does not specify the success status code or response fields for this operation. Includes Outrank rate-limit headers.
      content:
        application/json:
          schema: {}
    BadRequest:
      description: Invalid request body or query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, malformed, expired, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The organization's plan does not support the operation or access to the resource is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or belongs to another organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded. Honor Retry-After before retrying.
      headers:
        Retry-After:
          description: How long to wait before retrying.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Transient server error. Retry idempotent calls with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OpenJsonObject:
      type: object
      description: Open object schema used where the published API reference omits request fields.
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Error details; the reference does not publish its fields.
          additionalProperties: true
      additionalProperties: true
    PurchaseProductsRequest:
      type: object
      required: [additional_products]
      properties:
        additional_products:
          type: integer
          minimum: 1
          maximum: 30
          description: Integer range accepted by the official CLI; the public reference does not define its semantics.
        confirm_charge_cents:
          type: integer
          minimum: 0
          description: Confirmed charge amount in cents for the purchase flow.
      additionalProperties: true
