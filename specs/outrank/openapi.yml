openapi: 3.2.1
info:
  title: Outrank REST API
  summary: Organization-scoped API for Outrank products, keywords, articles, Search Console, billing, and usage.
  version: 0.1.0
  description: |
    OpenAPI description of the endpoints listed in Outrank's public REST API reference.

    Requests use JSON and an organization-scoped bearer API key. The API reference does not publish
    field-level request and response schemas for every operation; open schemas below mark those
    undocumented contracts without inventing fields. Query parameters and request fields are included
    where exposed by Outrank's official CLI (see the [CLI package](https://www.npmjs.com/package/outrank-cli)).

    Rate limits are 120 requests per minute and 10,000 requests per day per API key. Outrank states
    that responses include X-RateLimit-* headers; the reference does not enumerate their exact names.
  externalDocs:
    description: Outrank REST API documentation
    url: https://www.outrank.so/docs/api
servers:
  - url: https://www.outrank.so/api/agent/v1
    description: Outrank production API
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Verify API key identity and organization.
  - name: Products
    description: Manage websites in the organization.
  - name: Keywords
    description: Generate, list, schedule, and manage keywords.
  - name: Articles
    description: Generate, retrieve, replace, and publish articles.
  - name: Search Console
    description: Connect Google Search Console and inspect performance.
  - name: Billing & Usage
    description: Inspect subscription and usage or manage billing.
paths:
  /auth/whoami:
    get:
      tags: [Auth]
      operationId: getCurrentIdentity
      summary: Verify the API key
      description: Returns the user, organization, and remaining article credits associated with the key.
      responses:
        '2XX':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '5XX':
          $ref: '#/components/responses/ServerError'

