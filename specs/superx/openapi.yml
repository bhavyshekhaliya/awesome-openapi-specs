      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: upstream_unavailable
              message: "The scheduling service is temporarily unavailable. Retry with the same Idempotency-Key."

    AccountsUnavailable:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: Linked-account verification is temporarily unavailable (fail closed). The main account keeps working.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: accounts_unavailable
              message: "Account information is temporarily unavailable. Try again shortly."

    DatasetNotFound:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: No dataset with that id belongs to this key, or it has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: dataset_not_found
              message: "No dataset with that id belongs to this key, or it has expired (datasets are kept for 30 days)"

    DatasetNotReady:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: |
        The dataset id is valid but the dataset is not `ready`. The error
        carries the current `dataset_status`: `collecting` finishes on its own
