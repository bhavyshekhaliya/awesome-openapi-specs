  /v1/inspiration:
    get:
      tags: [Inspiration]
      operationId: searchInspiration
      summary: Search the inspiration library
      description: |
        Search a library of 50M+ real high-performing posts by topic. Use the
        results for structures, hooks and angles to remix, never to copy.

        The library is user-level, so there is no `account_id` parameter.
        Results are relevance-ranked: the strongest matches come first, more
        loosely related posts after. A page can return fewer posts than
        `limit` once weak and promotional matches are removed. Pagination is
        heuristic; `has_more` means more library pages may exist (pages run
        1 to 7).

        Each result carries an `outlier_score`: the post's engagement rate vs
        the expected rate for its author's follower tier, x10 (10 = expected,
        higher = overperformed). Null when the author's follower count is
        unknown.
      parameters:
        - name: q
          in: query
          required: true
          description: Topic or theme to search for (1-200 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: sort
          in: query
          description: |
            Result ordering. `relevant` (default) is relevance-ranked, the
            strongest matches first.
          schema:
            type: string
            enum: [relevant, recent, likes, reposts, impressions, outlier]
            default: relevant
        - name: min_likes
          in: query
          description: Only posts with at least this many likes.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_reposts
          in: query
          description: Only posts with at least this many reposts.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_replies
          in: query
          description: Only posts with at least this many replies.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_bookmarks
          in: query
          description: Only posts with at least this many bookmarks.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_impressions
          in: query
          description: Only posts with at least this many impressions.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_length
          in: query
          description: Only posts with at least this many characters.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: min_followers
          in: query
          description: Only posts from authors with at least this many followers.
          schema: { type: [integer, 'null'], minimum: 0 }
        - name: max_followers
          in: query
          description: Only posts from authors with at most this many followers.
          schema: { type: [integer, 'null'], minimum: 0 }
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: lang
          in: query
          description: Language code.
          schema:
            type: string
            default: en
        - name: exclude_topics
          in: query
          description: Comma-separated topics to exclude (keyword filter).
          schema:
            type: string
            example: "crypto,politics"
        - name: limit
          in: query
          description: Maximum posts per page, 1 to 50. Pages can be shorter after filtering.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: page
          in: query
          description: 1-based page number, 1 to 7.
          schema:
            type: integer
            minimum: 1
            maximum: 7
            default: 1
      responses:
        "200":
          description: A page of matching posts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InspirationPost" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1938765432109876543"
                    url: "https://x.com/buildersam/status/1938765432109876543"
                    text: "I built my first product in 30 days with zero audience. Here is exactly what I would do differently:"
                    posted_at: "2026-06-20T15:04:00.000Z"
                    lang: "en"
                    likes: 4211
                    replies: 312
                    reposts: 388
                    bookmarks: 1904
                    impressions: 512000
                    outlier_score: 14.2
                    author:
                      handle: "buildersam"
                      name: "Sam Fields"
                      followers: 8421
                      verified: true
                pagination: { page: 1, limit: 20, has_more: true }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/inspiration/media:
    get:
      tags: [Inspiration]
      operationId: searchInspirationMedia
      summary: Search the inspiration media index
      description: |
        Search the cross-platform media index behind the SuperX app's
        Inspiration > Media tab: short-form video and image posts from X,
        Instagram, YouTube, Threads, Reddit and LinkedIn, with captions, a
        content summary and engagement counts. Use it for visual format and
        hook research, never to copy.

        Media file URLs are not exposed through the API; open `source_url`
        for the original post.

        Owner-scoped, so there is no `account_id`. Omit `q` to BROWSE the
        newest media instead of searching; `meta.mode` reports which ran, and
        only `search` results carry a `score`. Unlike the app there is no
        personalisation: the app fills an empty search box from the signed-in
        person's profile and click history, which an owner-scoped key has no
        equivalent of.

        There is NO pagination: the index returns at most 120 items per
        query, and `limit` only trims that. Ask for the 120 and filter on
        your side rather than looking for a page parameter.

        Counts as a read and costs no enrichment units. The media index has
        two caps of its own, per account: a burst of 20 refilling one every
        3 seconds, and 500 FRESH searches per UTC day. Repeats of a recent
        identical search are served from a short-lived cache and do not count
        against the daily cap. Both return `429 rate_limited` with
        `Retry-After`.
      parameters:
        - name: q
          in: query
          description: What to search for (max 300 characters). Omit to browse the newest media.
          schema: { type: [string, 'null'], maxLength: 300 }
        - name: platforms
          in: query
          description: |
            Comma-separated platforms to include. Default:
            `instagram,youtube,x,threads`.
          schema:
            type: string
            example: "youtube,instagram"
        - name: time_filter
          in: query
          description: How recent the media must be.
          schema:
            type: string
            enum: [all, "24h", "7d", "30d"]
            default: all
        - name: media_type
          in: query
          description: Media kind.
          schema:
            type: string
            enum: [all, video, image]
            default: all
        - name: content_type
          in: query
          description: |
            Free-text content-type label as stored in the index (max 50
            characters). There is no enumerated list: a label the index does
            not use returns zero items and still counts against the daily
            search cap, so leave it off unless you know the label.
          schema: { type: [string, 'null'], maxLength: 50 }
        - name: limit
          in: query
          description: Items to return (1-120). 120 is everything one query can return.
          schema: { type: [integer, 'null'], minimum: 1, maximum: 120, default: 20 }
      responses:
        "200":
          description: Matching media items.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MediaItem" }
                  meta:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum: [search, browse]
                        description: search = ranked against your query, browse = newest first.
                      total:
                        type: integer
                        description: Items the index returned before the `limit` slice.
              example:
                data:
                  - id: "ig_3421887766"
                    platform: instagram
                    title: "3 hooks that made this reel go to 2M"
                    caption: "The first second is everything."
                    summary: "Creator breaks down three opening lines and why each one holds attention."
                    content_type: "educational"
                    source_url: "https://instagram.com/p/Cxyz123"
                    author_username: "hookschool"
                    author_url: "https://instagram.com/hookschool"
                    posted_at: "2026-08-28T12:11:00.000Z"
                    like_count: 48211
                    view_count: 2041882
                    comment_count: 611
                    share_count: 2044
                    engagement_tier: "high"
                    score: 0.7412
                meta: { mode: search, total: 120 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/audience/{kind}:
    get:
      tags: [Audience]
      operationId: getAudience
      summary: Read an audience list
      description: |
        A page of the account's followers, following, repliers or reposters
        from SuperX's synced snapshot.

        These four are the system lists in the app's Contacts tab. They live
        in SuperX's own audience store rather than in the contact lists you
        create, which is why `/v1/contact-lists/{id}/members` will not read
        them and this endpoint exists.

        Paging is by CURSOR, not page number: pass `pagination.next_cursor`
        back as `cursor` to continue. A cursor points at the last row of the
        page you were given, so new rows arriving mid-walk never shift the
        pages you already read. There is no `total`; `meta.synced_count` is
        the size of the whole list.

        `followers` and `following` come from the follow graph SuperX syncs
        for the account, so `meta` reports the sync `status`, the plan's
        `backfill_cap` and whether the account is deeper than that cap.
        `repliers` and `reposters` are a rolling 90-day window
        (`meta.window_days`), so someone whose last reply ages past 90 days
        drops out and reappears on their next reply.

        `engaged_count` is replies plus reposts in the last 90 days for the
        follow lists, and this list's own action count for `repliers` and
        `reposters`. `icp_score` and `icp_rationale` are always null here:
        scoring belongs to signal-agent deposits, not to the snapshot.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [followers, following, repliers, reposters]
        - $ref: "#/components/parameters/AccountId"
        - name: cursor
          in: query
          description: next_cursor from the previous page. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of the audience.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AudienceMember" }
                  meta: { $ref: "#/components/schemas/AudienceMeta" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
              example:
                data:
                  - id: "44196397001234567"
                    x_user_id: "44196397001234567"
                    username: "activefan"
                    name: "Sam Porter"
                    avatar_url: "https://pbs.twimg.com/profile_images/example3.jpg"
                    location: "Lisbon"
                    followers_count: 3120
                    following_count: 480
                    engaged_count: 12
                    source: followers
                    added_at: "2026-08-30T09:14:00.000Z"
                    icp_score: null
                    icp_rationale: null
                    can_dm: true
                meta:
                  kind: followers
                  account_id: "9HVHDe4WsJfJcR5SFauMD"
                  x_account_id: "1178367350552305665"
                  synced_count: 13270
                  status: complete
                  backfill_cap: 25000
                  is_capped: false
                  window_days: null
                pagination:
                  limit: 50
                  has_more: true
                  next_cursor: "MTc1NjU0NDA0MDAwMDo0NDE5NjM5NzAwMTIzNDU2Nw"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

