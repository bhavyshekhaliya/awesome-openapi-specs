  /v1/x/posts/{id}/replies:
    get:
      tags: [X Lookups]
      operationId: getXPostReplies
      summary: Top replies to a public post
      description: |
        The best-liked DIRECT replies to a public post, read live from X.

        This walks up to 3 relevance-ranked upstream pages (about 60
        candidate replies), ranks what it found by likes and returns the top
        `limit`. It is a SAMPLE of the strongest replies, not every reply and
        not chronological order, and it cannot page further. To collect
        everyone who replied to a post, use the audience collections built in
        the SuperX app (`GET /v1/datasets`).

        Unlike the same feature inside the SuperX app, replies written by the
        account owner themselves are NOT filtered out: an owner-scoped read
        has no "active account" to compare against.

        Costs a flat THREE live-enrichment units and draws on the shared
        300/day live-lookup allowance (one unit of that per page actually
        fetched). `data.post` is the post being replied to when the upstream
        payload carried it, and null otherwise; it is never a second lookup.

        The `X-RateLimit-*` headers on this endpoint report the ENRICHMENT
        window, not the ordinary read window.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric X post id.
          schema: { type: [string, 'null'], pattern: "^[0-9]{1,25}$" }
        - name: limit
          in: query
          description: Replies to return, best-liked first (1-20).
          schema: { type: [integer, 'null'], minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: The top replies found.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      post_id: { type: string }
                      post:
                        anyOf:
                          - $ref: "#/components/schemas/XPost"
                          - type: 'null'
                        description: The post being replied to, when the payload carried it.
                      replies:
                        type: array
                        items: { $ref: "#/components/schemas/XPost" }
                      replies_scanned:
                        type: integer
                        description: Direct replies seen across the pages walked, before the `limit` slice.
                      note:
                        type: string
                        description: What this sample covers, in plain words.
              example:
                data:
                  post_id: "1938765432109876543"
                  post: null
                  replies:
                    - id: "1938767777109876543"
                      url: "https://x.com/janedev/status/1938767777109876543"
                      text: "The 30-day constraint is the whole trick. Deadlines beat motivation."
                      created_at: "2026-06-20T15:31:00.000Z"
                      author:
                        x_user_id: "1290011"
                        username: "janedev"
                        name: "Jane"
                        avatar_url: "https://pbs.twimg.com/profile_images/2/avatar.jpg"
                        verified: false
                        followers_count: 3110
                      metrics:
                        likes: 288
                        replies: 12
                        reposts: 4
                        quotes: 0
                        views: 41022
                        bookmarks: 19
                      in_reply_to_id: "1938765432109876543"
                  replies_scanned: 47
                  note: "Top direct replies by likes, from up to 3 relevance-ranked pages (about 60 candidates). Not exhaustive and not chronological. Replies the account owner wrote themselves are included."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/PostNotFound" }
        "429": { $ref: "#/components/responses/LookupQuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/x/users/{handle}:
    get:
      tags: [X Lookups]
      operationId: lookupXUser
      summary: Look up one public profile live
      description: |
        Read one public X profile as it is right now: bio, location, link,
        follower and following counts, post count, join date and pinned post
        id. The handle may be given with or without a leading `@`.

        Owner-scoped, no `account_id`. Costs ONE live-enrichment unit and
        draws on the shared 300/day live-lookup allowance. Repeat lookups
        within 15 minutes may be served from a server-side cache.

        This is a public lookup for ANY handle, unlike `GET /v1/contacts/{id}`,
        which is limited to people this account already has a relationship
        with and returns SuperX's stored profile plus the lists they are in.

        The `X-RateLimit-*` headers on this endpoint report the ENRICHMENT
        window, not the ordinary read window.
      parameters:
        - name: handle
          in: path
          required: true
          description: The account's @handle, 1-15 letters, numbers or underscores (a leading @ is allowed).
          schema: { type: string }
      responses:
        "200":
          description: The profile.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/XProfile" }
              example:
                data:
                  x_user_id: "44196397"
                  username: "buildersam"
                  name: "Sam Fields"
                  avatar_url: "https://pbs.twimg.com/profile_images/1/avatar.jpg"
                  bio: "Building small products in public."
                  location: "Lisbon"
                  url: "https://buildersam.com"
                  verified: true
                  followers_count: 8421
                  following_count: 512
                  posts_count: 9210
                  created_at: "2019-03-04T09:12:00.000Z"
                  pinned_post_id: "1938765432109876543"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "429": { $ref: "#/components/responses/LookupQuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/x/users/{handle}/posts:
    get:
      tags: [X Lookups]
      operationId: getXUserPosts
      summary: Latest posts of a public account
      description: |
        One live timeline page (about 20 posts) for any public account,
        newest first, with engagement counts. The up-to-the-minute source for
        what an account just posted.

        Replies are included and carry `in_reply_to_id`; a post flagged
        `is_pinned` is the account's pinned post and is usually old, not
        recent. `exclude_reposts=true` drops reposts, and because only ONE
        page is fetched, fewer than `limit` posts can come back after the
        filter.

        Owner-scoped, no `account_id`. Costs ONE live-enrichment unit when
        SuperX already knows the handle and TWO when it does not (a live
        profile lookup resolves the handle first);
        `data.profile_resolved_locally` reports which happened. Draws on the
        shared 300/day live-lookup allowance either way.

        The `X-RateLimit-*` headers on this endpoint report the ENRICHMENT
        window, not the ordinary read window.
      parameters:
        - name: handle
          in: path
          required: true
          description: The account's @handle, 1-15 letters, numbers or underscores (a leading @ is allowed).
          schema: { type: string }
        - name: limit
          in: query
          description: Posts to return (1-20).
          schema: { type: [integer, 'null'], minimum: 1, maximum: 20, default: 10 }
        - name: exclude_reposts
          in: query
          description: Return only the account's own posts, dropping reposts.
          schema: { type: [boolean, 'null'], default: false }
      responses:
        "200":
          description: The account's latest posts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      handle: { type: string }
                      profile_resolved_locally:
                        type: boolean
                        description: |
                          True when SuperX already knew the handle, so this
                          call cost one unit rather than two.
                      posts:
                        type: array
                        items: { $ref: "#/components/schemas/XPost" }
                      note:
                        type: string
                        description: What this page covers, in plain words.
              example:
                data:
                  handle: "buildersam"
                  profile_resolved_locally: true
                  posts:
                    - id: "1938765432109876543"
                      url: "https://x.com/buildersam/status/1938765432109876543"
                      text: "I built my first product in 30 days with zero audience."
                      created_at: "2026-06-20T15:04:00.000Z"
                      author:
                        x_user_id: "44196397"
                        username: "buildersam"
                        name: "Sam Fields"
                        avatar_url: "https://pbs.twimg.com/profile_images/1/avatar.jpg"
                        verified: true
                        followers_count: 8421
                      metrics:
                        likes: 4211
                        replies: 312
                        reposts: 388
                        quotes: 44
                        views: 512000
                        bookmarks: 1904
                      in_reply_to_id: null
                  note: "One live timeline page, newest first. A post flagged is_pinned is the pinned post and is usually old. Replies are included (they carry in_reply_to_id)."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "429": { $ref: "#/components/responses/LookupQuotaExceeded" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/docs:
    get:
      tags: [Meta]
      operationId: getDocs
      summary: Machine-readable quickstart
      description: A short markdown quickstart (auth header, base URL, endpoint list, rate limits). No authentication required.
      security: []
      responses:
        "200":
          description: The quickstart document.
          content:
            text/markdown:
              schema:
                type: string
              example: |
                # SuperX API v1 quickstart

                Base URL: `https://api.superx.so/v1`
                ...

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A SuperX API key ("sxk_..."), created in the SuperX app under Account > API / MCP / CLI. Keys are server-side secrets.

  headers:
    X-RateLimit-Limit:
      description: The limit of the rate window closest to exhaustion.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in that window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix timestamp (seconds) when that window resets.
      schema:
        type: integer
    X-Credits-Charged:
      description: >-
        AI credits kept for this call. Sent on every endpoint that settles its
        charge before answering, which is all of them except the ones that
        answer 202 and finish in the background.
      schema:
        type: integer
    X-Credits-Remaining:
      description: AI credits left in the account's pool, bonus credits included.
      schema:
        type: integer
    X-Credits-Reset:
      description: Unix timestamp (seconds) when the AI credit pool refills.
      schema:
        type: integer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Unique key (max 64 characters) for safe retries. Replays carry the
        "Idempotency-Replayed" response header set to "true". Keys are
        retained for 24 hours.
      schema:
        type: string
        maxLength: 64

    AccountId:
      name: account_id
      in: query
      required: false
      description: Account to act on, from `GET /v1/accounts`. Defaults to your main account. An id outside your accounts returns `404 account_not_found`.
      schema:
        type: string
    Since:
      name: since
      in: query
      required: false
      description: UTC ISO-8601 lower bound (explicit Z or offset required).
      schema:
        type: string
        format: date-time
    Until:
      name: until
      in: query
      required: false
      description: UTC ISO-8601 upper bound (explicit Z or offset required).
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    DatasetId:
      name: id
      in: path
      required: true
      description: The dataset id from `GET /v1/datasets`.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
    SuggestionId:
      name: id
      in: path
      required: true
      description: The suggestion's numeric id, from `GET /v1/workers/suggestions`.
      schema:
        type: integer
        minimum: 1

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
            retry_after:
              type: integer
              description: Seconds to wait before retrying (rate-limit errors only).

    CreditExhaustedError:
      type: object
      required: [error]
      description: |
        The `429 ai_credits_exhausted` body: the standard envelope plus the
        credit counters. Sent with a `Retry-After` header and the
        `X-Credits-Remaining` / `X-Credits-Reset` headers. `code` is stable;
        the counters are additive fields, safe to ignore.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [ai_credits_exhausted]
            message:
              type: string
            credits_required:
              type: integer
              description: Credits the call needed.
            credits_remaining:
              type: [integer, 'null']
              description: Credits available when it was refused.
            reset_at:
              type: [integer, 'null']
              description: Unix timestamp (seconds) when the pool refills.

    ActionLimitedError:
      type: object
      required: [error]
      description: |
        The `429 ai_action_limited` body: a per-day cap on how many times an
        expensive action can run, counted separately from the credit pool and
        from the request rate limits. Sent with a `Retry-After` header. Caps
        reset at midnight UTC.

        Read `scope` before telling a user anything: `account` means the
        plan's own daily cap for that action, `platform` means the
        platform-wide fair-use ceiling on live-data actions, which is shared
        with every SuperX account. A `platform` refusal is not about this
        account's quota, so wait and retry rather than reporting the account
        as out.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [ai_action_limited]
            message:
              type: string
            scope:
              type: string
              enum: [account, platform]
              description: |
                Whose ceiling refused the call: this account's own per-day cap
                for the action, or the platform-wide fair-use ceiling on
                live-data actions.
            retry_after:
              type: integer
              description: Seconds to wait before the cap resets.
            reset_at:
              type: integer
              description: Unix seconds when the cap resets (the next UTC midnight).

    LegacyErrorEnvelope:
      type: object
      required: [error]
      description: |
        Legacy shape used ONLY by the shared subscription middleware: a plain
        string `error` field. Seen on `403` when the subscription has lapsed
        (string starts with "subscription_required:") and on `500` when
        subscription verification fails (string starts with "internal_error:").
      properties:
        error:
          type: string
          example: "subscription_required: The SuperX API requires an active subscription"

    Pagination:
      type: object
      required: [page, limit, has_more]
      properties:
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        total:
          type: integer
          description: Present only where cheap to compute.

    CursorPagination:
      type: object
      description: |
        Keyset pagination. `next_cursor` is present only when `has_more` is
        true; pass it back as `cursor` to read the next page. Cursors are
        opaque and are not valid across different queries.
      required: [has_more]
      properties:
        limit:
          type: integer
          description: Absent on endpoints whose page size is fixed upstream.
        has_more:
          type: boolean
        next_cursor:
          type: string

    AudienceMember:
      type: object
      description: |
        One person in a system audience list. Field names match
        ContactListMember so one mapping covers both, but `id` here is the X
        user id rather than a membership id (there is nothing to remove).
      properties:
        id:
          type: string
          description: The person's X user id (same value as x_user_id).
        x_user_id:
          type: string
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        location:
          type: [string, 'null']
        followers_count:
          type: [integer, 'null']
        following_count:
          type: [integer, 'null']
        engaged_count:
          type: integer
          description: |
            Replies + reposts to the account in the last 90 days for
            followers/following; this list's own action count for
            repliers/reposters.
        source:
          type: string
          description: The audience kind this row came from.
        added_at:
          type: [string, 'null']
          format: date-time
          description: |
            When SuperX first saw the follow edge, or the person's most
            recent reply or repost.
        icp_score:
          type: [integer, 'null']
          description: Always null here; lead scoring belongs to signal-agent deposits.
        icp_rationale:
          type: [string, 'null']
          description: Always null here.
        can_dm:
          type: [boolean, 'null']
          description: Whether the person's DMs looked open when SuperX last saw them.

    AudienceMeta:
      type: object
      description: The state of the whole audience list, not of this page.
      properties:
        kind:
          type: string
          enum: [followers, following, repliers, reposters]
        account_id:
          type: string
          description: |
            The account id you pass as `account_id`, echoed back. Same id
            space as every other /v1 surface.
        x_account_id:
          type: string
          description: The X user id the audience is stored under.
        synced_count:
          type: integer
          description: |
            How many people SuperX has synced for this list. For followers
            and following this counts synced edges rather than re-checking
            every one against X, so it may exceed the rows a full walk
            returns: edges that were later removed are still counted.
        status:
          type: string
          description: |
            Sync state: missing (never started), pending, running, complete
            or paused for the follow lists; missing, running or complete for
            repliers and reposters.
        backfill_cap:
          type: [integer, 'null']
          description: |
            How deep the plan syncs the follow graph. Null for repliers and
            reposters.
        is_capped:
          type: [boolean, 'null']
          description: |
            True when the account is deeper than backfill_cap, so the list is
            the most recent slice rather than everyone. Null for repliers and
            reposters.
        window_days:
          type: [integer, 'null']
          description: |
            The rolling window repliers and reposters are measured over (90).
            Null for the follow lists, which are not windowed.

    Account:
      type: object
      properties:
        id:
          type: string
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        is_main:
          type: boolean
        shared:
          type: boolean
          description: True when this account was shared with you by its owner (manual share or team share) rather than owned by you.
        permission:
          type: string
          enum: [full, editor]
          description: What you may change on this account. Your own accounts are always `full`. On an `editor` share you can change queue settings but not context settings.

    Me:
      type: object
      properties:
        owner:
          type: object
          properties:
            id:
              type: string
            name:
              type: [string, 'null']
            email:
              type: [string, 'null']
        plan:
          type: [object, 'null']
          properties:
            tier:
              type: integer
            label:
              type: string
            is_trial:
              type: boolean
        key:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            key_prefix:
              type: string
            scopes:
              type: array
              items:
                type: string
                enum: [read, write]
            created_at:
              type: [string, 'null']
              format: date-time
            last_used_at:
              type: [string, 'null']
              format: date-time
        credits:
          type: [object, 'null']
          description: >-
            The AI credit pool the paid endpoints draw from, or null when it
            cannot be read. One credit is one cent of measured model spend.
          properties:
            remaining:
              type: integer
              description: Credits left, bonus credits included.
            pool:
              type: integer
              description: Size of the plan's pool for the current period.
            period:
              type: string
              enum: [month, day]
              description: Paid plans refill monthly; trials refill daily.
            period_end:
              type: [string, 'null']
              format: date-time
              description: When the pool refills.
            bonus:
              type: integer
              description: Bonus credits, spent before the pool.

    PostMetrics:
      type: object
      properties:
        likes:
          type: integer
        replies:
          type: integer
        reposts:
          type: integer
        quotes:
          type: integer
        bookmarks:
          type: integer
        impressions:
          type: integer

    Post:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        posted_at:
          type: [string, 'null']
          format: date-time
        url:
          type: string
        is_reply:
          type: boolean
          description: >-
            True when this is a reply to another account. A reply to one of
            your own posts is a thread continuation, so it reads false here
            and true on `is_thread`. A reply whose target account is not on
            record reads true.
        is_repost:
          type: boolean
          description: True when this row is a repost of someone else's post.
        is_thread:
          type: boolean
          description: >-
            True when this is a thread continuation, a reply to one of your
            own posts. It counts as a post everywhere in the API, never as a
            reply.
        in_reply_to_id:
          type: [string, 'null']
        is_quote:
          type: boolean
        thread_id:
          type: [string, 'null']
        metrics:
          $ref: "#/components/schemas/PostMetrics"
        metrics_pending:
          type: boolean
          description: >-
            Present (and true) only on a reply that was sent from the SuperX
            app in the last few hours and whose engagement X has not reported
            yet. Its `metrics` are all zero and are not a measurement. Absent
            on every other post. See GET /v1/replies.

    Analytics:
      type: object
      properties:
        range:
          type: object
          properties:
            since:
              type: string
              format: date-time
            until:
              type: string
              format: date-time
        totals:
          $ref: "#/components/schemas/AnalyticsTotals"
        followers:
          type: object
          properties:
            start:
              type: [integer, 'null']
            end:
              type: [integer, 'null']
            change:
              type: [integer, 'null']
        series:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDay"

    AnalyticsTotals:
      type: object
      properties:
        posts:
          type: integer
          description: >-
            Original posts in range, plus thread continuations, which are
            replies to the account's own posts. Replies to other accounts and
            reposts are excluded.
        replies_sent:
          type: integer
          description: Replies the account sent to other accounts in range.
        reposts_sent:
          type: integer
          description: The account's own reposts in range.
        likes:
          type: integer
          description: Likes received by the posts counted in posts, in range.
        replies:
          type: integer
          description: >-
            Replies received by the posts counted in posts, in range, not
            replies the account sent. See replies_sent for those.
        reposts:
          type: integer
          description: >-
            Reposts received by the posts counted in posts, in range, not
            reposts the account made. See reposts_sent for those.
        quotes:
          type: integer
          description: >-
            Quote posts received by the posts counted in posts, in range.
        bookmarks:
          type: integer
          description: Bookmarks received by the posts counted in posts, in range.
        impressions:
          type: integer
          description: >-
            Impressions received by the posts counted in posts, in range.

    AnalyticsDay:
      allOf:
        - $ref: "#/components/schemas/AnalyticsTotals"
        - type: object
          properties:
            date:
              type: string
              description: UTC day, YYYY-MM-DD.
            followers:
              type: [integer, 'null']
              description: Follower sample for the day, when tracked.

    InspirationPost:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          description: Link to the post on X.
        text:
          type: string
        posted_at:
          type: [string, 'null']
          format: date-time
        lang:
          type: [string, 'null']
        likes:
          type: integer
        replies:
          type: integer
        reposts:
          type: integer
        bookmarks:
          type: integer
        impressions:
          type: integer
        outlier_score:
          type: [number, 'null']
          description: Engagement rate vs the expected rate for the author's follower tier, x10 (10 = expected, higher = overperformed). Null when the author's follower count is unknown.
        author:
          type: object
          properties:
            handle:
              type: [string, 'null']
            name:
              type: [string, 'null']
            followers:
              type: integer
            verified:
              type: boolean

    Contact:
      type: object
      properties:
        id:
          type: string
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        replies_90d:
          type: integer
        reposts_90d:
          type: integer

    ContactReply:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        posted_at:
          type: [string, 'null']
          format: date-time
        metrics:
          type: object
          properties:
            likes:
              type: integer
        in_reply_to:
          type: [object, 'null']
          properties:
            id:
              type: string
            text:
              type: string
            posted_at:
              type: [string, 'null']
              format: date-time

    ReceivedReply:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        posted_at:
          type: [string, 'null']
          format: date-time
        metrics:
          type: object
          properties:
            likes:
              type: integer
        author:
          type: object
          description: The replier. Profile fields are null when no stored profile exists.
          properties:
            id:
              type: string
            username:
              type: [string, 'null']
            name:
              type: [string, 'null']
            avatar_url:
              type: [string, 'null']
        in_reply_to:
          type: [object, 'null']
          properties:
            id:
              type: string
            text:
              type: string
            posted_at:
              type: [string, 'null']
              format: date-time

    ContactDetail:
      type: object
      description: One person's stored profile plus the lists you created that they are in.
      properties:
        id:
          type: string
          description: The person's numeric X user id.
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        location:
          type: [string, 'null']
        url:
          type: [string, 'null']
          description: The website on their X profile, expanded.
        followers_count:
          type: [integer, 'null']
        following_count:
          type: [integer, 'null']
        is_blue_verified:
          type: [boolean, 'null']
          description: null when the verified state is unknown; never fabricated.
        verified_type:
          type: [string, 'null']
        lists:
          type: array
          description: Lists you created that this person is a member of. System lists are never listed here.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              member_id:
                type: string
                description: The membership id the remove endpoints take.

    ContactNote:
      type: object
      description: A private note about one person. Notes live inside SuperX and are never posted.
      properties:
        id:
          type: string
        body:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: object
          description: The account the note was written as. Notes written through the API carry the account named by account_id.
          properties:
            x_user_id:
              type: [string, 'null']
            username:
              type: [string, 'null']

    ContactList:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        is_system:
          type: boolean
        kind:
          type: [string, 'null']
          enum: [followers, following, repliers, reposters, null]
          description: Set on system lists only.
        member_count:
          type: integer
          description: Members in the list. Always 0 for system lists (their membership is maintained automatically and is not exposed here).
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    ContactListMember:
      type: object
      properties:
        id:
          type: string
          description: The membership id used by the remove endpoint.
        x_user_id:
          type: string
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        location:
          type: [string, 'null']
        followers_count:
          type: [integer, 'null']
        following_count:
          type: [integer, 'null']
        engaged_count:
          type: integer
          description: Replies + reposts to the account in the last 90 days.
        source:
          type: [string, 'null']
          description: How the member entered the list (for example manual).
        added_at:
          type: [string, 'null']
          format: date-time

    AddedContactListMember:
      type: object
      description: Compact member shape returned by the add endpoint.
      properties:
        id:
          type: string
        x_user_id:
          type: string
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        added_at:
          type: [string, 'null']
          format: date-time

    BulkAddResult:
      type: object
      description: |
        Counters from a bulk member add. added + duplicates + failed equals the number of resolvable ids; not_found ids never reached the list.
        Members are inserted one at a time upstream, so a 502 or 503 can land after some of them were already added. Retrying the same request is safe: the list dedupes on (list, person), so anything that got in the first time comes back in `duplicates` rather than being added twice.
      properties:
        added:
          type: integer
          description: New members created.
        duplicates:
          type: integer
          description: Ids already in the list. Nothing was written for them.
        failed:
          type: integer
          description: Resolvable ids whose insert failed.
        not_found:
          type: array
          description: Submitted ids with no stored profile. Nothing was sent for them and no placeholder member was created; add these by handle instead.
          items:
            type: string
        total_in_list_after:
          type: integer
          description: Members in the list once the call finished.

    BulkRemoveResult:
      type: object
      properties:
        deleted:
          type: integer
          description: Members actually removed. Lower than the ids sent when some were not in this list.
        total_in_list_after:
          type: integer

    SignalAgentSignal:
      type: object
      description: One watched signal on an agent. Which fields are set depends on the type (handle/name/avatar for profile and follower watches, query for keyword watches, list_name for list watches).
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [profile_watch, follower_watch, keyword_watch, list_watch]
        handle:
          type: [string, 'null']
        name:
          type: [string, 'null']
        avatar:
          type: [string, 'null']
        query:
          type: [string, 'null']
        list_name:
          type: [string, 'null']
        status:
          type: string
        status_detail:
          type: [string, 'null']
        last_run_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time

    SignalAgent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          description: active, paused, or error.
        status_detail:
          type: [string, 'null']
        icp_description:
          type: string
          description: The ideal customer profile the agent scores people against.
        precision_mode:
          type: string
          enum: [high, discovery]
        destination_list_id:
          type: [string, 'null']
          description: The contact list deposits go to; joins to `GET /v1/contact-lists`.
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        deposited_count:
          type: integer
          description: Leads already saved to the destination list.
        last_checked:
          type: [string, 'null']
          format: date-time
          description: The most recent signal run across the agent's signals.
        signals:
          type: array
          items: { $ref: "#/components/schemas/SignalAgentSignal" }

    SignalLead:
      type: object
      properties:
        id:
          type: integer
        agent:
          type: object
          description: The agent that found this lead, with its current status.
          properties:
            id:
              type: integer
            name:
              type: string
            status:
              type: string
        user:
          type: object
          description: The lead's stored profile. Profile fields are null when no snapshot is stored; the lead is still returned.
          properties:
            x_user_id:
              type: [string, 'null']
            username:
              type: [string, 'null']
            name:
              type: [string, 'null']
            avatar_url:
              type: [string, 'null']
            followers_count:
              type: [integer, 'null']
            following_count:
              type: [integer, 'null']
            location:
              type: [string, 'null']
        icp_score:
          type: [integer, 'null']
          description: How strongly the person matched the agent's ideal customer profile.
        icp_rationale:
          type: [string, 'null']
        deposited:
          type: boolean
          description: Whether the lead has been saved to the agent's contact list yet.
        deposited_at:
          type: [string, 'null']
          format: date-time
        discovered_at:
          type: [string, 'null']
          format: date-time
        feedback:
          type: [string, 'null']
          enum: [fit, not_fit, null]
          description: The account's own verdict on this lead, set through `POST /v1/signals/leads/{id}/feedback`. Null when no verdict was recorded.
        feedback_at:
          type: [string, 'null']
          format: date-time
          description: When the verdict was recorded.
        provenance:
          type: [object, 'null']
          description: How the lead was discovered. Null when no provenance is stored.
          properties:
            type:
              type: [string, 'null']
            action:
              type: [string, 'null']
            source_ref:
              type: [string, 'null']
            tweet_id:
              type: [string, 'null']
            tweet_text:
              type: [string, 'null']
            target_handle:
              type: [string, 'null']
            posted_at:
              type: [string, 'null']
              format: date-time
              description: >-
                When the matched post was written, decoded from `tweet_id`;
                null for follower/list watches and reposts.

    SignalInput:
      type: object
      required: [type]
      description: >-
        One thing for a signal agent to watch. The target field depends on
        `type`: `query` for keyword_watch, `handle` for profile_watch and
        follower_watch, `list` for list_watch.
      properties:
        type:
          type: string
          enum: [keyword_watch, profile_watch, follower_watch, list_watch]
        query:
          type: string
          maxLength: 180
          description: keyword_watch only. A plain-language description of what the target customer posts about, or an X search. Operators pass through; engagement filters such as min_faves are rejected.
        handle:
          type: string
          maxLength: 15
          description: profile_watch and follower_watch only. An X username, with or without a leading @.
        list:
          type: string
          description: list_watch only. A public X list id, or a link like https://x.com/i/lists/1234567890.

    SignalWarning:
      type: object
      description: One entry a create could not add. The agent was still created from the entries that landed.
      properties:
        type:
          type: string
          description: The signal type of the rejected entry.
        target:
          type: string
          description: The query, handle, or list reference as you sent it.
        code:
          type: string
          description: >-
            Why it was rejected: `user_not_found`, `x_list_not_found`,
            `duplicate_signal`, `cap_reached`, `invalid_parameter`,
            `agent_not_found`, `upstream_unavailable`, or `upstream_error`.

    LeadFeedback:
      type: object
      properties:
        id:
          type: integer
          description: The lead id.
        feedback:
          type: [string, 'null']
          enum: [fit, not_fit, null]
        feedback_at:
          type: [string, 'null']
          format: date-time

    CoverStyle:
      type: object
      properties:
        id:
          type: string
          description: Pass this as `style_id` to POST /v1/articles/{id}/cover.
        name:
          type: string
        thumbnail_url:
          type: [string, 'null']
          description: A preview image of the style. Null until a render made with it backfills one.
        source:
          type: [string, 'null']
          description: "`cover` = saved from a generated cover, `custom` = typed by hand."
        created_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time

    Dataset:
      type: object
      properties:
        id:
          type: string
          description: Pass this to the other dataset endpoints.
        title:
          type: string
        source:
          type: string
          enum: [repliers, quoters, reposters, list_members, my_replies, my_posts, research]
          description: What the collection walked. `my_posts` / `my_replies` hold posts, everything else holds people.
        status:
          type: string
          enum: [ready, collecting, failed]
        target_ref:
          type: string
          description: What the collection was pointed at - a post id, an X list id, or free text for a research brief.
        x_account_id:
          type: string
          description: The X account the collection ran as. Not a filter - datasets belong to the key owner, not to one account.
        ask_chat_id:
          type: [string, 'null']
          description: The Ask SuperX chat the dataset was built in, when known.
        columns:
          type: array
          items:
            type: string
          description: The row keys this dataset carries, in export order.
        row_count:
          type: integer
        scanned_count:
          type: integer
          description: What the walk went through (people datasets), or the rows kept (own-content datasets).
        total_estimate:
          type: [integer, 'null']
        coverage_complete:
          type: boolean
          description: False when the collection hit its row cap before the end.
        has_people:
          type: boolean
          description: False for own-content datasets - there is nobody in them to add to a contact list.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Datasets are kept for 30 days.

    DatasetProgress:
      type: object
      description: Live progress of a collection that is still running.
      properties:
        page:
          type: integer
        scanned:
          type: integer
        matched:
          type: integer
        total_estimate:
          type: [integer, 'null']
        started_at:
          type: string
          format: date-time

    DatasetDetail:
      allOf:
        - $ref: "#/components/schemas/Dataset"
        - type: object
          properties:
            coverage:
              type: string
              description: An honest one-line coverage statement. Ready datasets only.
            filters:
              type: object
              additionalProperties: true
              description: The filters the collection applied. Ready datasets only.
            progress:
              $ref: "#/components/schemas/DatasetProgress"
            failure_note:
              type: string
              description: Why the collection stopped. Failed datasets only.

    CreateDatasetRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [repliers, quoters, reposters, list_members, my_replies, my_posts, research]
          description: |
            Who to collect. repliers, quoters and reposters need a post
            target; list_members needs a public X list; my_posts and
            my_replies read the account's own synced posts and take no
            target.

            `research` is different: it reads people's recent posts and writes
            an outreach brief per person instead of walking an audience. It
            takes exactly ONE of `handles`, `list_id`, `agent_id` or
            `dataset_id`, plus `focus` and a `max_rows` of 1-25 (default 10),
            and ignores `target` and `filters`.
        target:
          type: string
          description: |
            An x.com post URL or numeric post id, or for list_members an
            x.com list URL (/i/lists/<id>) or numeric list id. Omit for
            my_posts and my_replies.
        title:
          type: string
          maxLength: 120
          description: Title for the dataset. A sensible one is generated when omitted.
        max_rows:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
          description: |
            Rows to collect at most. For `source: "research"` the range is
            1-25 and the default is 10 (one profile per row).
        account_id:
          type: string
          description: Which of your accounts to collect as. Omit for the main account.
        handles:
          type: array
          maxItems: 25
          items:
            type: string
          description: "`research` only: research these X handles (with or without the @). Exactly one source field."
        list_id:
          type: string
          description: "`research` only: research the members of this contact list. Exactly one source field."
        agent_id:
          type: integer
          minimum: 1
          description: "`research` only: research this signal agent's leads. Exactly one source field."
        dataset_id:
          type: string
          description: "`research` only: research the people in this dataset. Exactly one source field."
        focus:
          type: string
          maxLength: 300
          description: "`research` only: an optional steer, e.g. \"founders who might need audience-growth tooling\"."
        filters:
          type: object
          properties:
            keywords:
              type: array
              items:
                type: string
              description: |
                Keep only rows whose reply, quote or (own content) post text
                contains one of these. Not applied to reposters or list
                members, whose rows carry no text.
            bio_keywords:
              type: array
              items:
                type: string
              description: Keep only people whose X bio contains one of these. Ignored for own content.
            min_followers:
              type: integer
              minimum: 0
              description: Keep only people with at least this many followers. Ignored for own content.
            require_website:
              type: boolean
              description: Keep only people with a website link in their profile. Ignored for own content.
            require_can_dm:
              type: boolean
              description: Keep only people whose DMs look open. Ignored for own content.
            since_days:
              type: integer
              minimum: 1
              description: "Own content only: keep posts from the last N days."
            sort:
              type: string
              enum: [recent, likes, impressions]
              description: "Own content only: which posts to keep when max_rows cuts the list."

    LeadSearchRequest:
      type: object
      required: [keywords, icp_description]
      properties:
        keywords:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: |
            Seed ANGLES for the search plan, not the query itself: 2-5 short
            phrases (2-3 words each) of how the BUYER talks on a normal working
            day, their workflows, the tools they already pay for, their jargon,
            a specific symptom. One comma-separated string or a list of strings
            (a list is joined with commas), 3-300 characters in total. Never the
            product's own name, never a full sentence, no search operators.
        icp_description:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Who counts as a good lead, in one or two sentences: role, domain,
            and the buying intent or pain that qualifies them.
        offer:
          type: string
          minLength: 3
          maxLength: 300
          description: |
            What you are selling, in one sentence: the product or service and
            what it does. Optional, and the single strongest input: the search
            plan is written from it, so a search with an `offer` finds people
            talking about the problem rather than only people naming the
            product.
        precision:
          type: string
          enum: [high, discovery]
          default: discovery
          description: high keeps only confident matches; discovery also returns adjacent ones.
        max_leads:
          type: integer
          minimum: 1
          maximum: 30
          default: 10
        max_post_age_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
          description: |
            Only posts written within the last N days count. Older matching
            posts are skipped and counted in `freshness.stale_skipped`. Use 7
            for a pain point or buying intent worth catching while it is
            fresh, 1-3 for today, 30 for anyone who is simply active.
        account_id:
          type: string
          description: Which of your accounts to search as. Omit for the main account.

    LeadSearchLead:
      type: object
      properties:
        user:
          type: object
          properties:
            x_user_id:
              type: string
              description: The X account id, as a string (X ids exceed 2^53).
            username:
              type: [string, 'null']
              description: X handle without the @.
            name:
              type: [string, 'null']
            avatar_url:
              type: [string, 'null']
            followers_count:
              type: [integer, 'null']
            posts_count:
              type: [integer, 'null']
              description: Lifetime posts, not recent activity.
        icp_score:
          type: [integer, 'null']
          description: How well this person matches the profile, 2-5 (anything lower is dropped).
        icp_rationale:
          type: [string, 'null']
        provenance:
          type: object
          description: How the person was found. Mirrors the provenance on stored signal leads.
          properties:
            action:
              type: string
              description: Always "authored" here, meaning they wrote a matching post.
            tweet_id:
              type: [string, 'null']
              description: |
                The matched post's id, as a string, named as it is on stored
                signal leads. Pass it to the endpoints that take a post id,
                such as `POST /v1/engage/reply-draft`.
            tweet_text:
              type: [string, 'null']
              description: The matched post, shortened.
            target_handle:
              type: [string, 'null']
            posted_at:
              type: [string, 'null']
              format: date-time
              description: When the matched post was written (UTC).
            post_age_days:
              type: [integer, 'null']
              description: |
                How many days ago the matched post was written. Never above
                the request's `max_post_age_days`.

    LeadSearchResult:
      type: object
      properties:
        query_used:
          type: string
          description: |
            The first query of the plan, kept for callers that read a single
            query. Read `query_plan` for everything that ran.
        query_source:
          type: string
          enum: [planned, compiled, keywords]
          description: |
            planned = a model wrote the search plan from your offer, ICP and
            seed angles; keywords = the deterministic fallback, one query per
            seed phrase. compiled is the retired single-query path.
        queries_used:
          type: integer
          description: How many of the planned queries actually reached X.
        query_plan:
          type: array
          description: |
            Every planned query, its angle, and what it brought back. Angles are
            workflow, pain, competitor and adjacent for a planned search, and
            keywords for the fallback.
          items:
            type: object
            properties:
              query:
                type: string
              angle:
                type: string
              posts_in_window:
                type: integer
                description: Matching posts this query found inside the recency window.
              candidates:
                type: integer
                description: People this query contributed to the scored pool.
        partial:
          type: boolean
          description: |
            True when a time or request budget cut the search short, so the
            plan was not run to the end. The leads returned are still real.
        precision:
          type: string
          enum: [high, discovery]
        requests_used:
          type: integer
          description: Live requests this search spent.
        posts_scanned:
          type: integer
        candidates_scored:
          type: integer
        credits_charged:
          type: integer
        freshness:
          type: object
          description: The recency window this search ran with, and what it cost in matches.
          properties:
            max_post_age_days:
              type: integer
              description: The window that was applied, in days.
            posts_in_window:
              type: integer
              description: Matching posts that were inside the window.
            stale_skipped:
              type: integer
              description: |
                Matching posts that were older than the window and were
                skipped. Above 0 with no leads means people do post about
                this, just not lately.
            oldest_skipped_days:
              type: [integer, 'null']
              description: Age of the oldest skipped post, in days. null when none were skipped.
        leads:
          type: array
          items: { $ref: "#/components/schemas/LeadSearchLead" }

    ToolMeta:
      type: object
      description: What the call cost and which account it ran as.
      properties:
        credits_charged:
          type: integer
          description: AI credits kept for this call, settled from the models' real cost.
        account_id:
          type: string
          description: The X account the call ran as.

    ReplyPostShape:
      type: object
      required: [text]
      description: A post, supplied by you rather than read from X.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        author_name:
          type: string
          maxLength: 200
          description: The author's display name.
        author_handle:
          type: string
          maxLength: 200
          description: The author's handle. A leading @ is accepted and stripped.

    ReplyDraftRequest:
      type: object
      description: Exactly one of post_id and post is required.
      properties:
        post_id:
          type: string
          pattern: "^[0-9]{1,25}$"
          description: An X post id. The API reads the post live, which costs one live lookup on top of the credit.
        post:
          $ref: "#/components/schemas/ReplyPostShape"
        conversation:
          type: array
          maxItems: 10
          description: The thread so far, OLDEST FIRST, so the reply fits the conversation.
          items: { $ref: "#/components/schemas/ReplyPostShape" }
        quoted_post:
          allOf:
            - $ref: "#/components/schemas/ReplyPostShape"
          description: The post that the post being replied to quotes. Filled in automatically when you pass post_id.
        thoughts:
          type: string
          maxLength: 2000
          description: What the person wants the reply to convey. Ask them; do not invent an opinion for them.
        tone:
          type: string
          enum: [engaging, humorous, creative, sarcastic, inspirational, concise]
        account_id:
          type: string

    RemixPostRequest:
      type: object
      required: [text, closeness]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The post to remix.
        closeness:
          type: integer
          minimum: 0
          maximum: 100
          description: 0 keeps only the idea, 100 stays very close to the original wording.
        instructions:
          type: string
          maxLength: 500
          description: Extra direction for this remix.
        account_id:
          type: string

    InlineEditRequest:
      type: object
      required: [text]
      description: At least one of instruction and edit_type is required.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The selected piece of the post to edit.
        full_text:
          type: string
          maxLength: 4000
          description: The whole post the selection sits in, so the edit matches its style.
        instruction:
          type: string
          maxLength: 500
          description: "Free-text direction, e.g. 'make this one line, lowercase'."
        edit_type:
          type: string
          enum:
            [
              grammar,
              translate,
              hook,
              details,
              concise,
              engaging,
              humorous,
              creative,
              sarcastic,
              inspirational,
              fix-grammar,
              expand,
              simplify,
              rewrite,
              change-tone,
            ]
          description: A preset edit. The last five are older names kept working.
        thread_context:
          type: array
          maxItems: 25
          description: The thread's other parts, in order, for context only.
          items:
            type: string
            maxLength: 4000
        account_id:
          type: string

    RephraseRequest:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum:
            [
              improve,
              grammar,
              translate,
              hook,
              details,
              clarity,
              engaging,
              humorous,
              positive,
              creative,
              sarcastic,
              inspirational,
              concise,
            ]
          description: Which rewrite to apply.
        text:
          type: string
          minLength: 1
          maxLength: 4000
        account_id:
          type: string

    FactCheckRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The statement to check.
        account_id:
          type: string

    FactCheckResult:
      type: object
      properties:
        result:
          type: string
          enum: ["true", "false", unknown]
          description: The model's verdict. `unknown` is a real answer, not an error.
        comment:
          type: [string, 'null']
          description: One sentence explaining the verdict.
        sources:
          type: array
          description: The search results the verdict was read from. Show these alongside it.
          items:
            type: object
            properties:
              link: { type: string }
              title: { type: string }
              snippet: { type: string }

    ViralScoreRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: The draft to score.
        has_image:
          type: boolean
          description: True when an image would be attached.
        has_video:
          type: boolean
          description: True when a video would be attached.
        is_quote:
          type: boolean
          description: True when the post quotes another post.
        post_at:
          type: string
          format: date-time
          description: When it would go out (ISO-8601 with an explicit Z or offset). Defaults to now.
        baseline:
          type: string
          enum: [account, population]
          description: |
            `account` (the default) scores against the account's own recent
            posts; `population` scores against the average training post. An
            account with too little history falls back to `population`.
        account_id:
          type: string

    ViralScoreCounter:
      type: object
      description: |
        What to expect on one counter, versus this account's own median post.
        The multiples are measured out of fold for posts that scored into the
        same band, not modelled, and the distribution is heavily right
        skewed: `multiple` is the median and the honest headline, `p75` and
        `p90` are the spread.
      properties:
        multiple:
          type: number
          description: Median multiple of the account's own median post.
        p75:
          type: number
        p90:
          type: number
        breakout_share:
          type: number
          description: Share of posts in this band that broke out for the author.
        probability:
          type: number
          description: Probability this draft beats the account's normal post on this counter.
        confidence:
          type: string
          enum: [normal, low]
          description: '`low` on reposts+quotes and views: text says much less about those.'
        own_median:
          type: [number, 'null']
          description: |
            The account's own median for this counter, or null on a
            population baseline. A median over an even number of posts can
            land on a half, so this is not always a whole number.
        expected:
          type: [integer, 'null']
          description: own_median x multiple, or null on a population baseline.

    ViralScoreReason:
      type: object
      properties:
        key:
          type: string
          description: The feature id, stable across versions.
        label:
          type: string
          description: What the feature is, in plain English.
        detail:
          type: string
          description: What it did on this draft, versus the account's normal post.
        effect:
          type: number
          description: Signed contribution to the score. Bigger absolute value, bigger effect.

    ViralScoreData:
      type: object
      properties:
        score:
          type: integer
          description: 0 to 100. How this draft compares with the account's own normal post.
        beats_own_normal:
          type: number
          description: The same figure as a probability, to four decimal places.
        baseline:
          type: object
          properties:
            kind:
              type: string
              enum: [account, population]
            posts_used:
              type: integer
              description: How many of the account's own posts the baseline was built from.
            account_id:
              type: string
        counters:
          type: object
          properties:
            likes: { $ref: "#/components/schemas/ViralScoreCounter" }
            replies: { $ref: "#/components/schemas/ViralScoreCounter" }
            reposts_and_quotes: { $ref: "#/components/schemas/ViralScoreCounter" }
            views: { $ref: "#/components/schemas/ViralScoreCounter" }
        helped:
          type: array
          description: Up to three things that pushed the score up. Fewer when fewer qualify.
          items: { $ref: "#/components/schemas/ViralScoreReason" }
        hurt:
          type: array
          description: Up to three things that pushed the score down.
          items: { $ref: "#/components/schemas/ViralScoreReason" }
        warnings:
          type: array
          description: |
            What the score never rewards, whatever else the draft does.
            Rewrite what a warning names rather than working around it.
          items: { type: string }
        accuracy:
          type: object
          description: The measured accuracy of the engine that produced this score.
          properties:
            pair_accuracy: { type: number }
            posts: { type: integer }
            authors: { type: integer }
            pairs:
              type: [integer, 'null']
              description: Post pairs the accuracy was measured on, null if the engine does not report it.
            creators:
              type: [integer, 'null']
              description: Creators those pairs came from, null if the engine does not report it.
            line:
              type: string
              description: The sentence to quote when you show the score.
        engine:
          type: object
          properties:
            generated:
              type: string
              description: When the scoring engine was fit.
            question_set:
              type: string

    TriageRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 80
          description: |
            What to search for, on one line: a topic, a phrase, a hashtag, or
            a search expression with quotes or operators. A plain multi-word
            query is also searched as an exact phrase.
        max_age_days:
          type: integer
          minimum: 1
          maximum: 7
          default: 3
          description: How far back to search, in days.
        account_id:
          type: string

    TriagedPostMedia:
      type: object
      description: |
        One image, video or gif attached to the post. Video and gif carry a
        still frame in `poster`; the playable file is not returned.
      properties:
        kind:
          type: string
          enum: [image, video, gif]
        url:
          type: string
          description: The image, or the still frame for a video or a gif.
        poster:
          type: string
          description: Still frame. Present on video and gif only.
        w:
          type: integer
          description: Original width in pixels, omitted when upstream did not report it.
        h:
          type: integer
          description: Original height in pixels, omitted when upstream did not report it.

    TriagedPost:
      type: object
      description: |
        One judged post. The lane, the percentage and the answers all come
        from the TEXT of the post: nothing about its author is in what the
        model reads.
      properties:
        id:
          type: string
        url:
          type: string
          description: Link to the post on X.
        text:
          type: string
        created_at:
          type: string
          description: |
            When the post went out, UTC ISO-8601. An EMPTY STRING when
            upstream gave no usable timestamp, so parse defensively rather
            than assuming a date is always there.
        author:
          type: object
          description: Who posted it, for display only. The model never saw any of it.
          properties:
            name: { type: string }
            handle: { type: string }
            avatar: { type: string }
            verified: { type: boolean }
        media:
          type: array
          items: { $ref: "#/components/schemas/TriagedPostMedia" }
        counts:
          type: object
          properties:
            likes: { type: integer }
            replies: { type: integer }
            reposts:
              type: integer
              description: Reposts and quotes together.
            views: { type: integer }
        lane:
          type: string
          enum: [read, pass, unsure]
          description: |
            `read` is worth a reader's time, `pass` is not, and `unsure` is
            the middle the rule refuses to call either way.
        pct:
          type: integer
          description: |
            **How CLEAR the call was, not how good the post is. Always read it
            together with `lane`, never on its own.**

            On `read` and on `pass` it runs 50 to 99, measuring the distance
            from the threshold in whichever direction the lane went: a post
            that is confidently NOT worth reading is a `pass` at 99, exactly
            as a clearly worthwhile post is a `read` at 99. An anti-signal
            strong enough to fail a post on its own is always 99.

            On `unsure` it is the raw worth-reading score instead, which is
            what makes that lane interesting.

            So never sort or compare posts by `pct` across lanes, and never
            render it as a quality score.
        kind:
          type: string
          enum: ["", insight, story, data, progress, news, question, intro, launch, joke, opinion]
          description: |
            What sort of post it is. An EMPTY STRING when no readable label
            came back, so treat that as "unknown" rather than as a category.
        answers:
          type: object
          description: |
            The yes/no questions behind the call, each a probability from 0 to
            1. Quote these when explaining a lane rather than inventing a
            reason.
          properties:
            r_specific:
              type: number
              description: Names a particular that carries information (a result, a mechanism, a mistake and its cost).
            r_new:
              type: number
              description: Says something a regular reader of this topic has not already heard many times.
            r_bait:
              type: number
              description: "Engagement bait: reply, like, follow or connect asks, or a cliffhanger with no content."
            r_promo:
              type: number
              description: Primarily sells, launches or plugs something.
            r_platitude:
              type: number
              description: Motivational or aphoristic filler with no information.
            r_reply_room:
              type: number
              description: A knowledgeable reader could add something worthwhile in a reply.
            farm:
              type: number
              description: |
                How much the post's own counts look like engagement farming
                (replies or reposts far out of step with likes). Read off the
                counts rather than the words, so it is the one figure here
                that is not a question about the text.

    TriageReceipt:
      type: object
      description: What the run actually cost.
      properties:
        posts:
          type: integer
          description: Posts judged, including any dropped before they were returned.
        questions_answered:
          type: integer
        ms:
          type: integer
          description: Wall-clock milliseconds spent judging the batch.
        usd:
          type: number
          description: Measured model spend for the run, in US dollars.

    TriageData:
      type: object
      properties:
        query:
          type: string
          description: The query as searched, trimmed.
        max_age_days:
          type: integer
        posts_searched:
          type: integer
          description: Distinct posts the searches returned, before the 40-post cap.
        posts:
          type: array
          description: The judged posts, most liked first. Can be shorter than `receipt.posts`.
          items: { $ref: "#/components/schemas/TriagedPost" }
        receipt: { $ref: "#/components/schemas/TriageReceipt" }

    DraftOutreachRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          minLength: 10
          maxLength: 1000
          description: |
            The template or example message every draft should follow. Keep
            `[name]`, `[first]` and `[handle]` tokens if you want them filled
            in per recipient at send time.
        instructions:
          type: string
          maxLength: 500
          description: "Optional extra steer: tone, what to emphasize, what to avoid."
        account_id:
          type: string
          description: Which of your accounts to draft as. Omit for the main account.

    OutreachDraftsResult:
      type: object
      properties:
        dataset_id:
          type: string
        title:
          type: string
        total:
          type: integer
          description: Rows in the dataset.
        drafted:
          type: integer
          description: Messages personalized from real hook quotes.
        generic:
          type: integer
          description: Messages that follow the format with no personal claims, because the brief had no usable hook.
        failed:
          type: integer
          description: Rows the model could not draft for. Their previous message, if any, was cleared.
        contaminated:
          type: integer
          description: Drafts discarded because they named a different recipient. Run again to retry those rows.
        long_messages:
          type: integer
          description: Drafts over 500 characters. Worth tightening before anyone sends them.
        sample_messages:
          type: array
          description: A few drafts, shortened. Read them all with GET /v1/datasets/{id}/rows.
          items:
            type: object
            properties:
              handle:
                type: [string, 'null']
              message:
                type: string

    RefineDatasetRequest:
      type: object
      required: [criterion]
      properties:
        criterion:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            What the rows to match look like, judged on each row's own text,
            e.g. "supportive or neutral; not mean, sarcastic, or hostile".
        keep_matching:
          type: boolean
          default: true
          description: true keeps the rows that MATCH the criterion; false keeps the rows that do NOT.
        sort_by:
          type: string
          enum: [followers, likes, none]
          default: none
          description: Sort the kept rows descending before the limit is applied.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Keep at most this many rows after filtering and sorting.
        title:
          type: string
          maxLength: 120
          description: Title for the new dataset. A sensible one is generated when omitted.
        account_id:
          type: string
          description: Which of your accounts to refine as. Omit for the main account.

    RefineMeta:
      type: object
      description: Counts for the refinement. On a 202 only the source id and row count are known.
      properties:
        source_dataset_id:
          type: string
        rows_with_text:
          type: integer
          description: Rows that will be judged (202 only).
        kept:
          type: integer
        dropped:
          type: integer
        unclear:
          type: integer
          description: Rows the classifier could not judge. They were KEPT.
        limited:
          type: integer
          description: Kept rows cut by `limit`.
        self_excluded:
          type: integer
          description: Rows of your own account, always removed.
        credits_charged:
          type: integer

    DatasetRow:
      type: object
      additionalProperties: true
      description: |
        One collected row, verbatim. Its keys are the dataset's `columns`
        plus, on people datasets, `user_id` (the X account id as a string)
        and `avatar`. Values are not shortened.

    DatasetContactsResult:
      type: object
      properties:
        added:
          type: integer
        duplicates:
          type: integer
          description: People already in the list. Never an error.
        failed:
          type: integer
        skipped_without_id:
          type: integer
          description: |
            Rows with no X account id or no usable handle. Nothing was sent
            for them. Repeat rows for a person already collected are deduped
            silently and are not counted here.
        total_in_list_after:
          type: integer

    DatasetNotReadyError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            error:
              type: object
              properties:
                dataset_status:
                  type: string
                  enum: [collecting, failed]
                  description: |
                    The dataset's current status. `collecting` finishes on its
                    own, `failed` has to be rebuilt in the SuperX app. Named
                    `dataset_status` so it never reads as the HTTP status.
      description: |
        The `409 dataset_not_ready` body: the standard envelope plus the
        dataset's current status, so a poller can tell "wait" from "wrong id".

    XPost:
      type: object
      description: |
        One public X post read live. Text is never shortened. Optional keys
        (`is_pinned`, `is_repost`, `entities`, `media`, `card`, `quoted_post`)
        are present only when the post has them.
      properties:
        id:
          type: string
          description: Numeric X post id, as a string.
        url:
          type: string
        text:
          type: string
          description: The full post text.
        created_at:
          type: [string, 'null']
          format: date-time
        author:
          type: [object, 'null']
          properties:
            x_user_id: { type: string }
            username: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            avatar_url: { type: [string, 'null'] }
            verified:
              type: [boolean, 'null']
              description: |
                Null when the upstream payload for that read does not carry
                it (single-post lookups and their quoted posts).
            followers_count: { type: [integer, 'null'] }
        metrics:
          type: object
          properties:
            likes: { type: integer }
            replies: { type: integer }
            reposts: { type: integer }
            quotes: { type: integer }
            views: { type: [integer, 'null'] }
            bookmarks: { type: integer }
        in_reply_to_id:
          type: [string, 'null']
          description: Set when this post is a reply; the id of the post it answers.
        is_pinned:
          type: boolean
          description: Present and true only on the account's pinned post (timeline reads).
        is_repost:
          type: boolean
          description: Present and true only on a repost of someone else's post.
        entities:
          type: array
          description: t.co link mappings, so short links can be rendered as their real destination.
          items:
            type: object
            properties:
              url: { type: string }
              display_url: { type: [string, 'null'] }
              expanded_url: { type: [string, 'null'] }
        media:
          type: array
          description: Attached media. `video_url` is a playable MP4 for videos and GIFs.
          items:
            type: object
            properties:
              type: { type: [string, 'null'], example: photo }
              url: { type: [string, 'null'] }
              video_url: { type: [string, 'null'] }
              width: { type: integer }
              height: { type: integer }
        card:
          type: object
          description: Link preview card, when the post has one.
          properties:
            url: { type: [string, 'null'] }
            title: { type: string }
            description: { type: [string, 'null'] }
            domain: { type: [string, 'null'] }
            image: { type: [string, 'null'] }
        quoted_post:
          anyOf:
            - $ref: "#/components/schemas/XPost"
            - type: 'null'
          description: |
            The post this one quotes, ONE level deep only - a quote of a
            quote is not nested further.

    XProfile:
      type: object
      description: One public X profile read live.
      properties:
        x_user_id: { type: string }
        username: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        bio:
          type: string
          description: Empty string when the account has no bio.
        location: { type: [string, 'null'] }
        url:
          type: [string, 'null']
          description: The link in the profile, expanded past t.co where X provides it.
        verified: { type: boolean }
        followers_count: { type: [integer, 'null'] }
        following_count: { type: [integer, 'null'] }
        posts_count: { type: [integer, 'null'] }
        created_at:
          type: [string, 'null']
          format: date-time
          description: When the account joined X.
        pinned_post_id:
          type: [string, 'null']
          description: Pass it to GET /v1/x/posts/{id} for the pinned post itself.
        bio_entities:
          type: array
          description: t.co link mappings for links in the bio, when it has any.
          items:
            type: object
            properties:
              url: { type: string }
              display_url: { type: [string, 'null'] }
              expanded_url: { type: [string, 'null'] }

    MediaItem:
      type: object
      description: One item from the cross-platform inspiration media index.
      properties:
        id: { type: string }
        platform:
          type: string
          enum: [x, instagram, youtube, threads, reddit, linkedin]
        title: { type: string }
        caption: { type: [string, 'null'] }
        summary:
          type: [string, 'null']
          description: A short description of what the media shows.
        content_type: { type: [string, 'null'] }
        source_url:
          type: [string, 'null']
          description: |
            The original post on its own platform, and the ONLY link returned
            here. The media files themselves (thumbnail, video) are not
            exposed through the API; open `source_url` for the post.
        author_username: { type: [string, 'null'] }
        author_url: { type: [string, 'null'] }
        posted_at: { type: [string, 'null'], format: date-time }
        like_count: { type: integer }
        view_count: { type: integer }
        comment_count: { type: integer }
        share_count: { type: integer }
        engagement_tier: { type: [string, 'null'] }
        score:
          type: number
          description: |
            Relevance against your query, 0 to 1, higher is closer. Present
            in `search` mode only (never when browsing).

    EngageFeed:
      type: object
      properties:
        id:
          type: string
          description: Pass this to GET /v1/engage/feeds/{id}/posts.
        name:
          type: string
        type:
          type: string
          enum: [keywords, list, x_list]
          description: keywords = a saved keyword search, list = a SuperX contact list, x_list = an X list.
        keywords:
          type: array
          description: Keyword feeds only.
          items:
            type: string
        list_id:
          type: string
          description: Contact list id, list feeds only.
        x_list_id:
          type: string
          description: X list id, x_list feeds only.
        list_name:
          type: string
          description: List feeds only.
        active:
          type: boolean
          description: Whether this is the feed currently selected in the app.
        fetch_units:
          type: integer
          description: >-
            Feed-bucket units one fetch of this feed costs. List feeds count
            as up to 3 (a pure imported X list resolves to 1 at fetch time);
            everything else is 1.

    EngageFeedPostAuthor:
      type: [object, 'null']
      properties:
        id:
          type: [string, 'null']
        username:
          type: [string, 'null']
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
          description: The author's X bio. Not always present on list feeds.
        followers_count:
          type: [integer, 'null']
        following_count:
          type: [integer, 'null']
        verified:
          type: boolean

    EngageFeedPost:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
          description: Post text with shortened links expanded.
        created_at:
          type: [string, 'null']
          format: date-time
        url:
          type: string
        author:
          $ref: "#/components/schemas/EngageFeedPostAuthor"
        metrics:
          type: object
          properties:
            likes:
              type: integer
            replies:
              type: integer
            reposts:
              type: integer
            bookmarks:
              type: integer
            impressions:
              type: integer
        media:
          type: array
          description: Image URLs attached to the post, best effort.
          items:
            type: string
        quoted_post:
          type: object
          description: Present only when the post quotes another one.
          properties:
            id:
              type: string
            text:
              type: string
            author_username:
              type: [string, 'null']
        replied:
          type: boolean
          description: Present only when include_replied=true. True when the account already replied to this post.

    MentionParentPost:
      type: object
      description: A post a mention is replying to.
      properties:
        id:
          type: string
        text:
          type: string
        created_at:
          type: [string, 'null']
          format: date-time
        author:
          type: [object, 'null']
          properties:
            id:
              type: string
            username:
              type: [string, 'null']
            name:
              type: [string, 'null']
            avatar_url:
              type: [string, 'null']
        parent_post:
          type: object
          description: |
            One further level of ancestry, present when the parent was itself
            a reply. Same shape as this object, without nesting any deeper.

    MentionPost:
      allOf:
        - $ref: "#/components/schemas/EngageFeedPost"
        - type: object
          properties:
            mention_type:
              type: [string, 'null']
              enum: [reply, mention, null]
              description: |
                reply = a direct reply to one of the account's posts;
                mention = any other @-mention (standalone, in a chain, or
                tagged in someone else's reply).
            parent_post:
              anyOf:
                - $ref: "#/components/schemas/MentionParentPost"
                - type: 'null'
              description: Null when the mention is not a reply, or the parent could not be fetched.

    Worker:
      type: object
      description: A scheduled AI writer set up in the SuperX app. Read-only here.
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          description: active or paused.
        voice_source:
          type: string
          enum: [my_voice, creator_style, hybrid]
          description: Whose voice the Worker writes in.
        voice_creator:
          type: [object, 'null']
          description: The creator whose style is being borrowed, when voice_source is creator_style or hybrid.
        topic_source:
          type: string
          enum: [product, custom, niche_trending, for_you]
          description: Where the Worker gets what to write about.
        topic_config:
          type: object
          description: The topic settings behind topic_source, for example the product it writes about or the custom topic text.
        style_instructions:
          type: [string, 'null']
          description: Per-Worker writing instructions, applied after the account's own rules.
        use_account_rules:
          type: integer
          enum: [0, 1]
          description: 1 when the account's SuperX rules apply to this Worker as well.
        format_collection:
          type: [string, 'null']
          description: The post-format collection the Worker writes to, when one is pinned.
        style_mode:
          type: string
          enum: [one_shot, reference_remix]
          description: one_shot writes fresh; reference_remix mirrors the shape of a real high-performing post.
        batch_size:
          type: integer
          description: Posts produced per run.
        output_mode:
          type: string
          enum: [suggest, auto_draft]
          description: suggest leaves the run in "To review"; auto_draft saves each post as a draft straight away.
        schedule:
          type: string
          enum: [manual, daily, weekly]
        schedule_time:
          type: [string, 'null']
          description: "Run time as HH:mm in the Worker's timezone."
        schedule_day:
          type: [integer, 'null']
          description: Day of week for a weekly Worker, 0 = Sunday.
        timezone:
          type: [string, 'null']
        next_run_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    WorkerSuggestion:
      type: object
      description: One post a Worker wrote, waiting for a person to act on it.
      properties:
        id:
          type: integer
          description: Pass this to the draft, schedule and dismiss endpoints.
        worker_id:
          type: integer
          description: The Worker that wrote it; joins to `GET /v1/workers`.
        text:
          type: string
        status:
          type: string
          enum: [to_review, drafted, scheduled, dismissed]
          description: A dismissed suggestion reads as dismissed even if it was saved first.
        reference:
          type: [object, 'null']
          description: What kind of source the Worker wrote from. The collection and reference ids stay private.
          properties:
            source:
              type: string
              enum: [collection, search]
              description: collection = a saved post-format collection, search = a high-performing post the run found. Null `reference` means the Worker wrote without one.
        generated_at:
          type: [string, 'null']
          format: date-time
        drafted_at:
          type: [string, 'null']
          format: date-time
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: When it was saved as a scheduled post, not when it goes out.
        dismissed_at:
          type: [string, 'null']
          format: date-time
        post_id:
          type: [string, 'null']
          description: The post it was saved as, once drafted or scheduled. Joins to `GET /v1/scheduled-posts`.

    WorkerSuggestionDrafted:
      type: object
      properties:
        id:
          type: integer
        post_id:
          type: string
          description: The new draft; read or edit it at `/v1/scheduled-posts`.
        drafted_at:
          type: [string, 'null']
          format: date-time

    WorkerSuggestionScheduled:
      type: object
      properties:
        id:
          type: integer
        post_id:
          type: string
          description: The new scheduled post; retime or cancel it at `/v1/scheduled-posts/{id}`.
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: When the suggestion was queued.
        scheduled_for:
          type: [string, 'null']
          format: date-time
          description: When the post goes out.

    WorkerSuggestionDismissed:
      type: object
      properties:
        id:
          type: integer
        dismissed_at:
          type: [string, 'null']
          format: date-time

    ScheduledPost:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [draft, scheduled, sent, error]
        scheduled_for:
          type: [string, 'null']
          format: date-time
          description: Null for drafts.
        parts:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              media:
                type: array
                description: Present only when the part carries media.
                items:
                  type: object
                  properties:
                    object_key:
                      type: string
                      description: Re-use this on PATCH to keep the attachment.
                    url:
                      type: string
                    file_type:
                      type: string
                    size:
                      type: [integer, 'null']
                    alt_text:
                      type: [string, 'null']
        title:
          type: [string, 'null']
          description: Draft title shown in the SuperX app. Never posted.
        scratchpad:
          type: [string, 'null']
          description: Private working notes. Never posted.
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              color:
                type: string
        created_at:
          type: [string, 'null']
          format: date-time
        auto_retweet:
          type: [object, 'null']
          description: Applied auto-retweet setting; null when off.
          properties:
            after_hours:
              type: [integer, 'null']
            remove_after_hours:
              type: [integer, 'null']
        auto_delete:
          type: [object, 'null']
          description: Applied auto-delete setting; null when off.
          properties:
            after_hours:
              type: [integer, 'null']
            threshold:
              type: [integer, 'null']
        auto_plug:
          type: [object, 'null']
          description: Applied auto-plug setting; null when off.
          properties:
            template_id:
              type: [string, 'null']
            threshold:
              type: [integer, 'null']
        auto_dm:
          type: [object, 'null']
          description: "Applied Auto DM setting; null when off. Read-only here, and the DM text is never returned, only that one is attached."
          properties:
            enabled:
              type: boolean
            max_dms:
              type: [integer, 'null']
            batch_mode:
              type: boolean
            triggers:
              type: object
              properties:
                reply:
                  type: boolean
                retweet:
                  type: boolean
        super_followers_only:
          type: boolean
        x_post_id:
          type: string
          description: >-
            The X post id. Present whenever the post has an X id, which in
            practice means a post that went out; absent on drafts and on
            queued posts that have not been published yet.
        url:
          type: string
          description: >-
            Permalink to the post on X. Present exactly when `x_post_id` is.

    PlugTemplate:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        has_media:
          type: boolean
          description: True when the template replies with media attached.

    Context:
      type: object
      description: >-
        The account's Context settings - the background SuperX's AI uses when
        writing for the account. `style_guide.generated` is read-only.
      properties:
        profile_description:
          type: object
          properties:
            text: { type: string }
            enabled: { type: boolean }
        interests:
          type: array
          items: { type: string }
        rules:
          type: string
          description: Mandatory instructions applied on every AI surface.
        reply:
          type: object
          properties:
            custom_instructions: { type: string }
            include_author_name: { type: boolean }
        voice:
          type: object
          properties:
            favorite_creators:
              type: array
              items: { $ref: "#/components/schemas/FavoriteCreator" }
            use_own_posts_as_examples: { type: boolean }
        style_guide:
          type: object
          properties:
            audience_override:
              type: [string, 'null']
              description: Manual override; outranks the generated guide until cleared.
            vocabulary_override:
              type: [string, 'null']
            generated:
              type: object
              description: The app-generated style guide (read-only).
              properties:
                audience: { type: [string, 'null'] }
                vocabulary: { type: [string, 'null'] }
                generated_at: { type: [string, 'null'], format: date-time }
        products:
          type: array
          items: { $ref: "#/components/schemas/ContextProduct" }

    FavoriteCreator:
      type: object
      properties:
        screen_name:
          type: string
        id:
          type: [string, 'null']
        name:
          type: [string, 'null']
        profile_image_url_https:
          type: [string, 'null']

    ContextProduct:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        positioning:
          type: [string, 'null']
        features:
          type: [string, 'null']
        updates:
          type: [string, 'null']
        last_scraped_at:
          type: [string, 'null']
          format: date-time
          description: When SuperX last refreshed the product's details from its url (read-only).
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    AutoDm:
      type: [object, 'null']
      required: [message]
      description: |
        Auto DM settings for one post. The DM goes to the people who reply to
        or repost the post once it is live, sent by the SuperX app's
        scheduler inside the account's DM limits.
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: "The direct message. `[name]`, `[first]` and `[handle]` are filled in per recipient. Always required on a non-null `auto_dm`."
        triggers:
          type: object
          additionalProperties: false
          description: "Who gets the DM. At least one must be true; defaults to reply only. Any other key is rejected with `400 invalid_parameter`."
          properties:
            reply:
              type: boolean
              description: DM the people who reply to the post.
            repost:
              type: boolean
              description: DM the people who repost the post.
            retweet:
              type: boolean
              description: "Alias of `repost`, accepted so the value a post reads back (which reports `retweet`) can be sent straight back. Sending both with different values is a `400`."
        enabled:
          type: boolean
          default: true
          description: "`false` behaves exactly like sending `auto_dm: null`: the Auto DM is cleared and nothing is stored. Prefer `null`."
        max_dms:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
          description: Most people to DM for this post. The plan's per-post cap still applies.
        batch_mode:
          type: boolean
          description: Send the DMs in one batch rather than as engagement arrives.

    DmCampaign:
      type: object
      description: The result of queueing a campaign. Counts, not deliveries.
      properties:
        id:
          type: [string, 'null']
          description: "Campaign id. Use it with `GET`/`DELETE /v1/dm/campaigns/{id}` and as `campaign_id` on `GET /v1/dm/queue`. **null when nothing was queued** (every recipient skipped): no row carries an id, so there is none to hand back."
        queued:
          type: integer
          description: Messages placed in the queue by this call.
        queued_now:
          type: integer
          description: How many of those are due to go out in the current daily window.
        scheduled:
          type: array
          description: Per-day placement of the rest, when `spread` was true.
          items:
            type: object
            properties:
              day:
                type: string
                format: date
              count:
                type: integer
        scheduled_total:
          type: integer
        skipped:
          type: integer
          description: Recipients not queued (duplicates, the monthly cap, or the daily cap without `spread`).
        duplicates:
          type: integer
          description: Recipients skipped because this account messaged them in the last 24 hours, or because they are the sending account.
        remaining_this_month:
          type: integer
          description: Messages left in the monthly allowance after this campaign.

    DmQueueItem:
      type: object
      description: One message in the DM queue.
      properties:
        id: { type: string }
        campaign_id:
          type: [string, 'null']
          description: null for messages queued in the SuperX app.
        recipient:
          type: object
          properties:
            x_user_id: { type: [string, 'null'] }
            handle: { type: [string, 'null'] }
            name: { type: [string, 'null'] }
            avatar_url: { type: [string, 'null'] }
        message:
          type: [string, 'null']
          description: The message as it will be sent, with the tokens already filled in.
        template:
          type: [string, 'null']
          description: The message before token substitution.
        status:
          type: string
          enum: [pending, sending, sent, failed, skipped]
        error: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        scheduled_at:
          type: [string, 'null']
          format: date-time
          description: null means the message is in the current daily window rather than placed on a later day.
        sent_at: { type: [string, 'null'], format: date-time }

    DmLimits:
      type: object
      description: The account's DM allowances. Plan limits, not AI credits.
      properties:
        tier: { type: [string, 'null'] }
        monthly:
          type: object
          properties:
            max: { type: integer }
            used: { type: integer }
            committed:
              type: integer
              description: Messages queued and not yet sent. They are held against the monthly allowance until they go out or are cancelled.
            remaining: { type: integer }
            reset_at: { type: [string, 'null'], format: date-time }
        daily_bulk:
          type: object
          properties:
            max: { type: integer }
            used: { type: integer }
            remaining: { type: integer }
        per_post_max:
          type: integer
          description: Most people one post's auto DM may message.
        posts_with_auto_dm:
          type: object
          description: How many scheduled posts a month may carry an auto DM.
          properties:
            max: { type: integer }
            used: { type: integer }
            remaining: { type: integer }
        scheduled_ahead:
          type: integer
          description: Unsent messages placed on a later day.
        scheduling_enabled:
          type: boolean
          description: Whether placing messages on later days is currently available.

    StyleGuideGenerated:
      type: object
      description: The style guide SuperX writes from the account's recent posts. Your own style_guide overrides outrank it.
      properties:
        audience:
          type: [string, 'null']
          description: Who the account writes for.
        vocabulary:
          type: [string, 'null']
          description: How the account writes, with how often each habit shows up.
        generated_at:
          type: [string, 'null']
          format: date-time

    KeywordSuggestion:
      type: object
      properties:
        query:
          type: string
          description: A plain-language phrase to watch. Not an X search query; SuperX compiles it when the keyword is added to an agent.

    IcpRubric:
      type: object
      description: The structured qualification rubric a signal agent scores people against.
      properties:
        who:
          type: string
          description: One sentence describing exactly who the ideal customer is.
        needs:
          type: array
          items: { type: string }
          description: The needs or pains that make someone a fit.
        disqualifiers:
          type: array
          items: { type: string }
          description: What rules a profile out even when it looks adjacent.
        example_match:
          type: string
          description: A hypothetical X bio of someone who clearly fits.
        example_non_match:
          type: string
          description: A hypothetical X bio of someone who looks close but does not fit.

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Palette color name rendered by the SuperX app (for example rose, amber, blue, violet).
        created_at:
          type: [string, 'null']
          format: date-time

    QueueSlot:
      type: object
      required: [time, days]
      properties:
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time in the account's queue timezone, `HH:MM`.
          example: "09:00"
        days:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Weekdays this slot runs on, 0 = Sunday. Sorted ascending on read; duplicates are deduped on write.
          example: [1, 3, 5]

    QueueSettings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone the slot times run in.
        timezone_is_default:
          type: boolean
          description: True when the account has never set a timezone and SuperX is using its default (UTC).
        slots:
          type: array
          items: { $ref: "#/components/schemas/QueueSlot" }
          description: The predefined posting slots, sorted by time.
        slots_are_default:
          type: boolean
          description: True when the account has never set a schedule and SuperX is using its default slots. A stored empty list is explicit and reports false.
        slot_count:
          type: integer
          description: Total number of time and day pairs across all slots.

    ReflowSummary:
      type: object
      description: What changing the slots did to the already-queued posts.
      properties:
        moved:
          type: integer
          description: Queued posts retimed onto the new slots.
        skipped:
          type: integer
          description: Posts that published or were deleted while the reflow ran; nothing was lost.
        bailed:
          type: boolean
          description: >-
            True when the settings were saved but the queue was deliberately
            left untouched (a post had nowhere to land, or the move set was
            too large). Retrying the same request is safe.

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, publishing, published, failed]
        content_markdown:
          type: string
          description: The article body as markdown. Present on single-article responses only, never in lists.
        cover:
          type: [object, 'null']
          properties:
            url:
              type: string
        scheduled_for:
          type: [string, 'null']
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        x_post_id:
          type: [string, 'null']
          description: The X post id once published.
        created_at:
          type: [string, 'null']
          format: date-time
          description: Null in list responses.
        updated_at:
          type: [string, 'null']
          format: date-time

  responses:
    InvalidParameter:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: A parameter is missing, malformed, or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_parameter
              message: "since must be a UTC ISO-8601 timestamp"

    Unauthorized:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: Missing/malformed Authorization header (`unauthorized`) or an unknown/revoked key (`invalid_api_key`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: invalid_api_key
              message: "Unknown or revoked API key"

    SubscriptionRequired:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: |
        Subscription lapsed. NOTE the legacy body shape: `error` is a plain
        string here, not the `{ code, message }` object. Read-only keys on
        write endpoints instead get the object envelope with code
        `insufficient_scope`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
              - $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error: "subscription_required: The SuperX API requires an active subscription"

    WriteForbidden:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), or a lapsed subscription (legacy string envelope).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: insufficient_scope
              message: "This API key is read-only. Create a key with the write scope to use this endpoint."

    ContextWriteForbidden:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: >-
        Read-only key (`insufficient_scope`), an account shared with you with
        `editor` permission (`editor_restricted` - only the owner can change
        context settings; queue settings stay editable), or a lapsed
        subscription (legacy string envelope). Context writes are per-account
        and never return `writes_main_account_only`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: editor_restricted
              message: "This account is shared with you with Editor permission. Only the account owner can change these settings."

    QueueWriteForbidden:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: >-
        Read-only key (`insufficient_scope`) or a lapsed subscription (legacy
        string envelope). Queue settings are a per-account write that any
        linked or shared account can use, Editor-permission shares included,
        so `writes_main_account_only` and `editor_restricted` never apply
        here.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - $ref: "#/components/schemas/LegacyErrorEnvelope"
          example:
            error:
              code: insufficient_scope
              message: "This API key is read-only. Create a key with the write scope to use this endpoint."

