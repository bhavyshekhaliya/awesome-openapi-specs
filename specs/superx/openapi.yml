                    row_count: 214
                    scanned_count: 214
                    total_estimate: 214
                    coverage_complete: true
                    has_people: true
                    created_at: "2026-09-05T10:12:00.000Z"
                    expires_at: "2026-10-05T10:12:00.000Z"
                pagination:
                  page: 1
                  limit: 20
                  has_more: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Datasets]
      operationId: createDataset
      summary: Collect an audience into a dataset
      description: |
        Collect the repliers, quote posters or reposters of a post, the
        members of a public X list, or the account's own posts or replies,
        into a stored dataset you can then read, export, or copy into a
        contact list.

        `source: "research"` is the exception: instead of walking an audience
        it reads people's recent posts and writes a short outreach brief for
        each one (what they do, what they are building, recent topics,
        personalization hooks that QUOTE their real posts, and an opener
        angle). Give it exactly one source - `handles`, `list_id`, `agent_id`
        or `dataset_id` - plus optional `focus`, `title` and `max_rows` (1-25,
        default 10). The briefs land as an ordinary dataset, so
        `GET /v1/datasets/{id}/rows`, `/export` and `/contacts` read them
        unchanged. More than 5 profiles research in the background and answer
        `202`. If none of them could be researched, the answer is `200` with
        `data: null`, the reasons in `meta.skipped`, and every credit
        returned.

        **This endpoint can answer before the work is finished.** A small
        collection runs inside the request and answers `200` with a `ready`
        dataset. A big one, **or one whose size cannot be established up
        front**, answers `202` with a `collecting` dataset: poll
        `GET /v1/datasets/{id}` until `status` is `ready` (or `failed`) before
        reading its rows. Only one background collection runs per account at a
        time; a second one gets `409 collection_in_progress`.

        If nothing matched the filters, the response is `200` with
        `data: null` and a `note`: no dataset is created for an empty result,
        and the daily collection slot is given back.

        `my_posts` and `my_replies` read the account's own synced posts: they
        take no `target`, always finish inside the request, and ignore the
        profile filters (the response `note` says so rather than dropping them
        silently).

        **Cost.** Every collection counts against a limit of 10 per day for
        the account, shared with the collections Ask SuperX runs in the app
        (`429 collection_quota_exceeded`). Collections that read X also spend
        the enrichment allowance: one unit for the size estimate, plus the
        pages the walk is expected to need, all charged before the walk
        starts so `X-RateLimit-Remaining` stays honest about work that
        outlives the response. Own-content collections spend nothing.

        **Research is charged in AI credits, not collections.**
        `source: "research"` costs a flat 1 credit per profile ACTUALLY
        researched: profiles that could not be researched come back in
        `meta.skipped` and their credits are returned. It spends one of the
        plan's daily profile-research runs (`429 ai_action_limited` with
        `scope: "account"`) and a slice of a platform-wide fair-use ceiling on
        live-data actions shared by every SuperX account
        (`429 ai_action_limited` with `scope: "platform"`), and it does NOT
        count against the 10 collections a day. An empty credit pool is
        `429 ai_credits_exhausted`. What was charged comes back in
        `meta.credits_charged` and in the `X-Credits-*` headers on the `200`;
        a background research run settles when it finishes, so its `202`
        carries neither, and the figure lands on `GET /v1/me` and your ledger.

        Datasets created here appear alongside the ones Ask SuperX built, and
        are kept for 30 days.

        Send an `Idempotency-Key` header to make retries safe: the same key
        with the same body replays the first response with
        `Idempotency-Replayed: true`, and the same key with a different body
        is rejected with `409 idempotency_key_reuse`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDatasetRequest" }
            example:
              source: repliers
              target: "https://x.com/robj3d3/status/1234567890123456789"
              title: "Repliers to my launch post"
              max_rows: 500
              filters:
                min_followers: 500
                require_can_dm: true
      responses:
        "200":
          description: |
            The collection finished inside the request. `data` is null when
            nothing matched, with a `note` explaining why. A research run
            adds `meta` (what was requested, what was researched, what it
            cost) and the `X-Credits-*` headers.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged:
              description: Credits kept for this call. Research runs only.
              schema:
                type: integer
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/DatasetDetail"
                      - type: 'null'
                  meta:
                    type: object
                    description: Research runs only. Absent on audience collections.
                    properties:
                      requested:
                        type: integer
                        description: Profiles the source resolved to.
                      researched:
                        type: integer
                        description: Profiles a brief was actually written for.
                      credits_charged:
                        type: integer
                        description: Credits kept, one per researched profile.
                      skipped:
                        type: array
                        description: Profiles that produced no brief, with the reason.
                        items:
                          type: object
                          properties:
                            handle:
                              type: [string, 'null']
                            reason:
                              type: string
                  note:
                    type: string
                    description: Present when something needs saying, such as an empty result or ignored filters.
              examples:
                collection:
                  value:
                    data:
                      id: "VKcPAVU1FSkx4kzPuehGK"
                      title: "Repliers to my launch post"
                      source: repliers
                      status: ready
                      target_ref: "1234567890123456789"
                      x_account_id: "1178367350552305665"
                      ask_chat_id: null
                      columns: ["handle", "name", "bio", "website", "followers", "following", "location", "can_dm", "verified"]
                      row_count: 64
                      scanned_count: 71
                      total_estimate: 71
                      coverage_complete: true
                      has_people: true
                      created_at: "2026-09-10T10:12:00.000Z"
                      expires_at: "2026-10-10T10:12:00.000Z"
                      coverage: "Includes all 71 direct replies to the post."
                      filters: { minFollowers: 500, requireCanDm: true }
                research:
                  summary: source "research", 3 profiles, finished in the request
                  value:
                    data:
                      id: "Rk2PAVU1FSkx4kzPuehGK"
                      title: "Outreach briefs (3 profiles)"
                      source: research
                      status: ready
                      target_ref: "handles"
                      x_account_id: "1178367350552305665"
                      ask_chat_id: null
                      columns: ["handle", "name", "followers", "can_dm", "bio", "does", "building", "recent_topics", "hooks", "opener_angle"]
                      row_count: 3
                      scanned_count: 3
                      total_estimate: 3
                      coverage_complete: true
                      has_people: true
                      created_at: "2026-09-10T10:12:00.000Z"
                      expires_at: "2026-10-10T10:12:00.000Z"
                      coverage: "Researched all 3 requested profiles."
                    meta:
                      requested: 3
                      researched: 3
                      credits_charged: 3
                    note: "Every hook quotes one of the person's real posts; proposed quotes that failed the verbatim check were dropped. Briefs are text for a person to act on: read the full rows with GET /v1/datasets/{id}/rows."
        "202":
          description: |
            The collection, or the research run, started in the background.
            Poll `GET /v1/datasets/{id}` until `status` is `ready`. Research
            settles its credits when the run finishes, so no `X-Credits-*`
            header is sent here and `meta` carries no charge.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DatasetDetail" }
                  meta:
                    type: object
                    description: Research runs only. Absent on audience collections.
                    properties:
                      requested:
                        type: integer
                        description: Profiles the source resolved to.
                      skipped:
                        type: array
                        description: Profiles rejected before the run started, with the reason.
                        items:
                          type: object
                          properties:
                            handle:
                              type: [string, 'null']
                            reason:
                              type: string
                  note:
                    type: string
              example:
                data:
                  id: "Jc9PxVU1FSkx4kzPuehGK"
                  title: "Repliers to my launch post"
                  source: repliers
                  status: collecting
                  target_ref: "1234567890123456789"
                  x_account_id: "1178367350552305665"
                  ask_chat_id: null
                  columns: ["handle", "name", "bio", "website", "followers", "following", "location", "can_dm", "verified"]
                  row_count: 0
                  scanned_count: 0
                  total_estimate: 4200
                  coverage_complete: false
                  has_people: true
                  created_at: "2026-09-10T10:12:00.000Z"
                  expires_at: "2026-10-10T10:12:00.000Z"
                  progress:
                    page: 0
                    scanned: 0
                    matched: 0
                    total_estimate: 4200
                    started_at: "2026-09-10T10:12:00.000Z"
                note: "Collecting in the background; poll GET /v1/datasets/{id} until status is ready."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            `account_not_found` when `account_id` is not one of your accounts.
            On `source: "research"` the source id is named too:
            `list_not_found`, `agent_not_found`, or `not_found` for a dataset
            id that is unknown or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                account_not_found:
                  value:
                    error:
                      code: account_not_found
                      message: "No account with that id belongs to this key"
                list_not_found:
                  value:
                    error:
                      code: list_not_found
                      message: "No contact list with that id belongs to this account."
                agent_not_found:
                  value:
                    error:
                      code: agent_not_found
                      message: "No signal agent with that id belongs to this account."
                not_found:
                  value:
                    error:
                      code: not_found
                      message: "No dataset with that id. Use the dataset_id from a collect_audience or refine_dataset result."
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            Another background collection is still running for this account
            (`collection_in_progress`), the `Idempotency-Key` was reused with a
            different request body (`idempotency_key_reuse`), or the dataset a
            research run was pointed at is not ready yet
            (`dataset_not_ready`, carrying `dataset_status`). None of them
            started anything.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                dataset_not_ready:
                  value:
                    error:
                      code: dataset_not_ready
                      message: "The source dataset is not ready yet. Poll GET /v1/datasets/{id} until status is ready, then research it."
                      dataset_status: collecting
                collection_in_progress:
                  value:
                    error:
                      code: collection_in_progress
                      message: "Another audience collection is still running for this account. Poll it with GET /v1/datasets/{id} and start this one when it finishes."
                idempotency_key_reuse:
                  value:
                    error:
                      code: idempotency_key_reuse
                      message: "This Idempotency-Key was already used with a different request body."
        "429":
          description: |
            Read `error.code`. A collection is refused when today's 10
            collections are used up (`collection_quota_exceeded`, shared with
            Ask SuperX in the app) or the enrichment allowance the walk needs
            is exhausted (`rate_limited`). A research run is refused when the
            plan's daily research runs are used up (`ai_action_limited` with
            `scope: "account"`), when the platform-wide fair-use ceiling on
            live-data actions is reached (`ai_action_limited` with
            `scope: "platform"`, shared by every account and not about your
            own quota), or when the AI credit pool is empty
            (`ai_credits_exhausted`). Every flavour carries `Retry-After`, and
            the two `ai_action_limited` ones carry `reset_at` (unix seconds)
            as well. Nothing was started or charged.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
            X-Credits-Remaining:
              description: Credits left in the pool. Sent only on `ai_credits_exhausted`.
              schema:
                type: integer
            X-Credits-Reset:
              description: Unix seconds when the pool refills. Sent only on `ai_credits_exhausted`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/ActionLimitedError"
                  - $ref: "#/components/schemas/CreditExhaustedError"
              examples:
                collection_quota_exceeded:
                  value:
                    error:
                      code: collection_quota_exceeded
                      message: "You have used today's audience collections. Existing datasets still read and export; the limit resets at midnight UTC."
                      retry_after: 20400
                      limit: 10
                      reset_at: 1789430400
                rate_limited:
                  value:
                    error:
                      code: rate_limited
                      message: "Rate limit exceeded for the Pro plan (5 enrichment requests/min). This collection needs 4 lookups."
                      retry_after: 42
                ai_action_limited_account:
                  summary: source "research", the plan's daily research runs are used up
                  value:
                    error:
                      code: ai_action_limited
                      message: "Daily limit reached for this action on your plan (10 profile research runs per day). It resets at midnight UTC."
                      scope: account
                      retry_after: 20400
                      reset_at: 1789430400
                ai_action_limited_platform:
                  summary: source "research", the shared fair-use ceiling is reached
                  value:
                    error:
                      code: ai_action_limited
                      message: "The platform-wide fair-use ceiling for live-data actions has been reached for today. It resets at midnight UTC."
                      scope: platform
                      retry_after: 20400
                      reset_at: 1789430400
                ai_credits_exhausted:
                  summary: source "research", not enough credits for the batch
                  value:
                    error:
                      code: ai_credits_exhausted
                      message: "Not enough AI credits. Resets in 5 hours."
                      credits_required: 10
                      credits_remaining: 4
                      reset_at: 1790812800
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/datasets/{id}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get a dataset
      description: |
        One dataset's status, counts and coverage.

        Every status answers 200, so this is the endpoint to poll while a
        collection runs: `collecting` carries live `progress`, `failed`
        carries a `failure_note`, and `ready` carries the honest `coverage`
        sentence and the `filters` the collection applied. The counts on a
        collecting dataset are not final.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: The dataset, whatever its status.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DatasetDetail" }
              example:
                data:
                  id: "VKcPAVU1FSkx4kzPuehGK"
                  title: "Repliers to my launch post"
                  source: repliers
                  status: ready
                  target_ref: "1234567890123456789"
                  x_account_id: "1178367350552305665"
                  ask_chat_id: "aB3dEf9"
                  columns: ["handle", "name", "bio", "website", "followers", "following", "location", "can_dm", "verified"]
                  row_count: 214
                  scanned_count: 214
                  total_estimate: 214
                  coverage_complete: true
                  has_people: true
                  created_at: "2026-09-05T10:12:00.000Z"
                  expires_at: "2026-10-05T10:12:00.000Z"
                  coverage: "Scanned all 214 direct replies available (relevance-ranked order)."
                  filters:
                    minFollowers: 500
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/DatasetNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/datasets/{id}/rows:
    get:
      tags: [Datasets]
      operationId: getDatasetRows
      summary: Get dataset rows
      description: |
        A page of a ready dataset's rows.

        Rows come back exactly as the collection stored them: the keys listed
        in the dataset's `columns`, plus `user_id` (the X account id as a
        string) and `avatar` on people datasets. Text fields are not
        shortened.

        Each call parses the whole dataset (up to about 5MB), so page through
        with `limit` and `page` rather than looping at `limit=1`. A dataset
        that is not `ready` returns 409 `dataset_not_ready`.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: Rows per page, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of rows, with the dataset's row count as `total`.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DatasetRow" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - handle: "@levelsio"
                    name: "levels.io"
                    bio: "Indie maker"
                    website: "https://levels.io"
                    followers: 600000
                    following: 1200
                    location: "Everywhere"
                    can_dm: true
                    verified: true
                    user_id: "944883311"
                    avatar: "https://pbs.twimg.com/profile_images/example.jpg"
                pagination:
                  page: 1
                  limit: 50
                  has_more: true
                  total: 214
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/DatasetNotFound" }
        "409": { $ref: "#/components/responses/DatasetNotReady" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/datasets/{id}/export:
    get:
      tags: [Datasets]
      operationId: exportDataset
      summary: Export a dataset as CSV
      description: |
        The whole dataset as a CSV file.

        This response is NOT wrapped in the `data` envelope: the body is the
        raw CSV, with a `Content-Disposition` filename matching the app
        download's naming pattern
        (`superx-dataset-<title>-<YYYY-MM-DD>.csv`). Treat the name as a
        convenience, not a contract: unusual titles can slug differently from
        the app's own download. Only the columns listed
        in `columns` are exported (the `user_id` and `avatar` extras stay
        out, exactly like the app download).

        CSV is the only format here; XLSX downloads stay in the SuperX app.
        A dataset that is not `ready` returns 409 `dataset_not_ready`.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: format
          in: query
          required: false
          description: Only `csv` is supported. Any other value returns 400.
          schema:
            type: string
            enum: [csv]
            default: csv
      responses:
        "200":
          description: The dataset as CSV. Not wrapped in the `data` envelope.
          headers:
            Content-Disposition:
              description: 'attachment; filename="superx-dataset-<title>-<date>.csv"'
              schema:
                type: string
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            text/csv:
              schema:
                type: string
              example: |
                handle,name,followers
                @levelsio,levels.io,600000
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/DatasetNotFound" }
        "409": { $ref: "#/components/responses/DatasetNotReady" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/datasets/{id}/contacts:
    post:
      tags: [Datasets]
      operationId: addDatasetToContacts
      summary: Add a dataset's people to a contact list
      description: |
        Copy the people in a ready dataset into a contact list you created.

        Costs ONE WRITE and no enrichment: the profiles come from the dataset
        the collection already hydrated, which is why people SuperX has never
        stored still land in the list.

        People are deduped by X account id before the write, and rows without
        an X account id or a usable handle are counted in
        `skipped_without_id` rather than added as blank members, so
        `added + duplicates` can be lower than the dataset's `row_count`.
        Re-running is safe: people already in the list come back in
        `duplicates`.

        Own-content datasets (your posts, your replies) hold no people and
        return 400 `dataset_has_no_people`; so does a dataset whose rows all
        lack an X account id. A dataset that is not `ready` returns 409
        `dataset_not_ready`, and a system list returns 400
        `system_list_read_only`.

        Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only. Needs the
        write scope.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_id]
              properties:
                list_id:
                  type: string
                  description: A contact list you created, from `GET /v1/contact-lists`.
                account_id:
                  type: string
            example:
              list_id: "cl_9f2b71"
      responses:
        "200":
          description: The add finished. Read the counters for what happened.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DatasetContactsResult" }
              example:
                data:
                  added: 198
                  duplicates: 12
                  failed: 0
                  skipped_without_id: 4
                  total_in_list_after: 242
        "400": { $ref: "#/components/responses/DatasetHasNoPeople" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            Either end of the copy is missing: `dataset_not_found` (no dataset
            with that id belongs to this key, or it has expired) or
            `list_not_found` (no contact list with that id belongs to this
            account). Read `error.code` to tell them apart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: list_not_found
                  message: "No contact list with that id belongs to this account."
        "409": { $ref: "#/components/responses/DatasetNotReady" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/datasets/{id}/outreach-drafts:
    post:
      tags: [Datasets]
      operationId: draftDatasetOutreach
      summary: Draft outreach messages onto a research dataset
      description: |
        Writes one personalized message per person in a research dataset,
        following the `format` you supply.

        **The drafts are text and nothing is sent.** Each message is stored on
        the dataset's `message` column and read back with
        `GET /v1/datasets/{id}/rows`. No endpoint in this API sends a DM, and
        this one does not either: a person reviews the messages and sends them
        from the SuperX app.

        Personalization comes only from that person's stored brief and its
        verbatim hook quotes, never invented details. A brief with no usable
        hook gets an honest generic message that still follows your format,
        counted separately in `generic`. `[name]`, `[first]` and `[handle]`
        tokens are left intact for per-recipient fill-in at send time.

        A message that mentions a DIFFERENT recipient's handle is discarded
        rather than stored (counted in `contaminated`); run the endpoint again
        to retry those rows. Re-running overwrites every draft on the dataset.

        The dataset must have been created with `source: "research"` and be
        `ready`. Costs AI credits (measured, usually a few) and spends no
        live-data allowance: the briefs are already stored. Needs a key with
        the `write` scope.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftOutreachRequest" }
            example:
              format: "hey [first]! been following what you're building. <personalization>. would love to trade notes sometime"
              instructions: "Keep it under three sentences and never pitch."
      responses:
        "200":
          description: The messages were drafted and saved onto the dataset.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OutreachDraftsResult" }
                  meta:
                    type: object
                    properties:
                      credits_charged:
                        type: integer
                  note:
                    type: string
              example:
                data:
                  dataset_id: "VKcPAVU1FSkx4kzPuehGK"
                  title: "Outreach briefs (10 profiles)"
                  total: 10
                  drafted: 8
                  generic: 1
                  failed: 0
                  contaminated: 1
                  long_messages: 0
                  sample_messages:
                    - handle: "@robj3d3"
                      message: "hey [first]! been following what you're building..."
                meta:
                  credits_charged: 2
                note: "Drafts are text only and are stored on the dataset's `message` column; a person sends them from the SuperX app. The API never sends DMs."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/DatasetNotFound" }
        "409": { $ref: "#/components/responses/DatasetNotReady" }
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/datasets/{id}/refine:
    post:
      tags: [Datasets]
      operationId: refineDataset
      summary: Refine a dataset by what each person wrote
      description: |
        Judges each row's own text against a natural-language `criterion` and
        keeps or drops it, then optionally sorts and caps what is left into a
        NEW dataset. The source dataset is never modified.

        Only datasets whose rows carry text can be refined this way (a
        repliers or quoters collection). Anything else answers `400`: use the
        profile filters on `POST /v1/datasets` instead.

        Rows the classifier cannot judge confidently are **kept** and counted
        as `unclear`, never silently dropped. Classification is best-effort:
        read the kept rows before acting on them.

        **This endpoint can answer before the work is finished.** Up to 100
        rows with text classify inside the request and answer `200`; more than
        that answers `202` with a `collecting` dataset to poll through
        `GET /v1/datasets/{id}`. If nothing was kept, the answer is `200` with
        `data: null` and a `note`.

        **Cost.** A refinement creates a dataset, so it counts against the
        same 10 collections a day this account shares with Ask SuperX
        (`429 collection_quota_exceeded`), and it costs AI credits, measured
        from the classifier's real cost. It spends no live-data allowance.
        Needs a key with the `write` scope.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefineDatasetRequest" }
            example:
              criterion: "supportive or neutral; not mean, sarcastic, or hostile"
              keep_matching: true
              sort_by: followers
              limit: 200
      responses:
        "200":
          description: |
            The refinement finished inside the request. `data` is null when
            nothing was kept, with a `note` explaining why.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/DatasetDetail"
                      - type: 'null'
                  meta: { $ref: "#/components/schemas/RefineMeta" }
                  note:
                    type: string
              example:
                data:
                  id: "Jc9PxVU1FSkx4kzPuehGK"
                  title: "Refined: Repliers to my launch post"
                  source: repliers
                  status: ready
                  target_ref: "1234567890123456789"
                  x_account_id: "1178367350552305665"
                  ask_chat_id: null
                  columns: ["handle", "name", "bio", "text", "followers", "can_dm"]
                  row_count: 48
                  scanned_count: 64
                  total_estimate: 64
                  coverage_complete: true
                  has_people: true
                  created_at: "2026-09-10T10:20:00.000Z"
                  expires_at: "2026-10-10T10:20:00.000Z"
                meta:
                  source_dataset_id: "VKcPAVU1FSkx4kzPuehGK"
                  kept: 48
                  dropped: 14
                  unclear: 2
                  limited: 0
                  self_excluded: 0
                  credits_charged: 2
        "202":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            The refinement started in the background. Poll
            `GET /v1/datasets/{id}` until `status` is `ready`. Credits are
            settled when it finishes, so no credit headers are sent here.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DatasetDetail" }
                  meta: { $ref: "#/components/schemas/RefineMeta" }
                  note:
                    type: string
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/DatasetNotFound" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            The dataset is not ready yet (`dataset_not_ready`), or another
            background collection or refinement is still running for this
            account (`collection_in_progress`). Neither started anything, and
            `collection_in_progress` does not use up one of the day's 10.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                dataset_not_ready:
                  value:
                    error:
                      code: dataset_not_ready
                      message: "This dataset is not ready yet. Poll GET /v1/datasets/{id} until status is ready."
                      dataset_status: collecting
                collection_in_progress:
                  value:
                    error:
                      code: collection_in_progress
                      message: "Another collection or refinement is still running for this account. Poll it with GET /v1/datasets/{id} and start this one when it finishes."
        "429":
          description: |
            Today's 10 dataset collections are used up
            (`collection_quota_exceeded`, shared with Ask SuperX in the app),
            the AI credit pool is spent (`ai_credits_exhausted`), or a plan
            cap on refinements was hit (`ai_action_limited`). Read
            `error.code`; all carry `Retry-After`.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreditExhaustedError"
                  - $ref: "#/components/schemas/ActionLimitedError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: collection_quota_exceeded
                  message: "You have used today's dataset collections. Existing datasets still read and export; the limit resets at midnight UTC."
                  retry_after: 20400
                  limit: 10
                  reset_at: 1789430400
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/x/posts/{id}:
    get:
      tags: [X Lookups]
      operationId: lookupXPost
      summary: Look up one public post live
      description: |
        Read one public X post as it is right now: full text (never
        shortened), author, engagement counts, media, link card, and the
        quoted post one level deep when there is one.

        Owner-scoped, so there is no `account_id`: nothing upstream is
        per-X-account. Costs ONE live-enrichment unit, TWO with
        `include_quotes`, and also draws on the shared allowance of 300 live
        lookups per UTC day that Ask SuperX in the app uses (see
        [Rate limits](/rate-limits#live-x-lookups)). Repeat lookups of the
        same post within 15 minutes may be served from a server-side cache:
        they still cost their enrichment units but do not touch the daily
        allowance.

        `404 post_not_found` means the post is deleted, protected, or the id
        is wrong. Because the upstream batch read reports a missing post and
        a failed read identically, an occasional transient upstream failure
        surfaces here too, so retry once before concluding the post is gone.

        The `X-RateLimit-*` headers on this endpoint report the ENRICHMENT
        window, not the ordinary read window.
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric X post id (the digits at the end of a post URL).
          schema: { type: [string, 'null'], pattern: "^[0-9]{1,25}$" }
        - name: include_quotes
          in: query
          description: |
            Also return a page of the posts quoting this one (up to 20, not
            exhaustive). Costs a second enrichment unit.
          schema: { type: [boolean, 'null'], default: false }
      responses:
        "200":
          description: The post.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      post: { $ref: "#/components/schemas/XPost" }
                      quotes:
                        type: array
                        description: Present only when `include_quotes` was set.
                        items: { $ref: "#/components/schemas/XPost" }
                      quotes_note:
                        type: string
                        description: |
                          What the `quotes` page covers, or why it is empty.
                          Present only when `include_quotes` was set.
              example:
                data:
                  post:
                    id: "1938765432109876543"
                    url: "https://x.com/buildersam/status/1938765432109876543"
