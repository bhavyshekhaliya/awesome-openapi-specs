      description: |
        The audience collections Ask SuperX built for the key owner in the
        app: the repliers, quoters or reposters of a post, the members of an
        X list, the owner's own posts or replies, or a research brief.
        Newest first, expired datasets excluded.

        Datasets belong to the person, not to one X account, so there is no
        `account_id` parameter here. The account a collection ran as is
