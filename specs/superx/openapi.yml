  /v1/signals/icp/expand:
    post:
      tags: [Signals]
      operationId: expandIcp
      summary: Expand an audience description into a rubric
      description: |
        Turns a plain description of an audience into the structured rubric
        signal agents score people against: who the ideal customer is, the
        needs that make someone a fit, the disqualifiers, and one example of
        a match and a non-match.

        Free. Nothing is created and no AI credits are charged. The rubric is
        a reading of the description rather than a field you can store:
        agents are created with `icp_description`, so use this to sharpen
        that text before calling `POST /v1/signals/agents`, or to score
        people yourself.

        This helper runs in SuperX's own process rather than through the
        app, so the app's short-term limiter does not apply and your plan's
        request rate limit is the only bound. It is still a model call each
        time, so keep it occasional.

        Needs a key with the `write` scope. Every non-GET route on this API
        does, and this one is a POST because the description goes in the
        body; it still creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [icp_description]
              properties:
                icp_description:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: Who the ideal customer is, in plain language.
                account_id: { type: string }
            example:
              icp_description: "Indie founders building SaaS in public"
      responses:
        "200":
          description: The scoring rubric.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
