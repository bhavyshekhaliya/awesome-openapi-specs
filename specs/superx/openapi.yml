      content:
        application/json:
          schema: { $ref: "#/components/schemas/DatasetNotReadyError" }
          example:
            error:
              code: dataset_not_ready
              message: "This dataset is not ready yet. Check GET /v1/datasets/{id}: a collecting dataset finishes on its own, and a failed one has to be rebuilt in the SuperX app."
              dataset_status: collecting

    DatasetHasNoPeople:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: The dataset holds no people to add (`dataset_has_no_people`), a system list was targeted (`system_list_read_only`), or the body was malformed (`invalid_parameter`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: dataset_has_no_people
              message: "This dataset has no people to add: own-content datasets hold your posts, and rows without an X account id are skipped."

    PostNotFound:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: |
        No public post with that id: it is deleted, protected, or the id is
        wrong. The upstream batch read reports a missing post and a failed
        read identically, so an occasional transient failure surfaces here
        too - retry once before concluding the post is gone.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: post_not_found
              message: "No public post with that id. It may be deleted, protected, or the id may be wrong. A live lookup that fails upstream can also report this."

    UserNotFound:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: No public X account matches that handle (suspended, renamed, or misspelled).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: user_not_found
              message: "No public X account matches that handle. It may be suspended, renamed, or misspelled."

    LookupQuotaExceeded:
      description: |
        A live-lookup 429. Either the plan's per-minute or per-day enrichment
        bucket is exhausted (`rate_limited`), or a daily live-lookup gate
        stopped the call (`lookup_quota_exceeded`). Read `error.code` to tell
        those two apart; both carry `Retry-After`.

        `lookup_quota_exceeded` covers three cases and the body says which:
        your own allowance is used up (`limit` is present, and that allowance
        is shared with Ask SuperX in the app, resetting at midnight UTC); the
        SuperX-wide allowance is used up (no `limit`, since it is not your
        account's budget, still resetting at midnight); or the counter could
        not be verified, in which case the call is refused rather than run
        unmetered (no `limit`, short `retry_after`). Always read
        `error.retry_after` rather than assuming midnight.
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      retry_after:
                        type: integer
                        description: Seconds to wait before retrying.
                      limit:
                        type: integer
                        description: |
                          Your daily live-lookup allowance. Present ONLY when
                          it is your own allowance that ran out; absent for a
                          SuperX-wide cap or an unverifiable counter.
                      reset_at:
                        type: integer
                        description: |
                          Unix seconds at the next UTC midnight. Present on
                          the two allowance cases, absent when the counter
                          could not be verified.
          example:
            error:
              code: lookup_quota_exceeded
              message: "Today's live X lookup allowance (300 lookups) is used up. It is shared with Ask SuperX in the app and resets at midnight UTC."
              retry_after: 20400
              limit: 300
              reset_at: 1789430400

    ProfileNotSynced:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: |
        The account's X profile has not synced into SuperX yet, so there is
        no handle to search mentions for. Open the account in the SuperX app
        once and retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: profile_not_synced
              message: "This account's X profile has not synced yet. Open it in the SuperX app once, then retry."

    CampaignNotFound:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: No DM campaign with that id belongs to this account, or it queued nothing in the first place, or every message it queued is gone.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: campaign_not_found
              message: "No DM campaign with that id belongs to this account."

    DmLimitReached:
      description: >-
        The account's DM allowance is used up (`dm_limit_reached`). `scope` is
        `month` or `day`; the monthly refusal also carries `reset_at`. These
        are plan limits, not AI credits.
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: dm_limit_reached
              message: "This account's monthly DM allowance is used up."
              scope: month
              retry_after: 86400
              reset_at: "2026-10-01T00:00:00.000Z"

    AiActionLimited:
      description: |
        Rate limited (`rate_limited`, honor `Retry-After`), the AI credit pool
        is used up (`ai_credits_exhausted`, with the credit counters), or a
        daily cap on the action was hit (`ai_action_limited`).

        On `ai_action_limited`, `error.scope` says which ceiling. `account`
        is one of your own: the plan's daily cap for a metered action, the
        once-an-hour limit on style guide regeneration (where `reset_at` is an
        hour after the last run rather than midnight), the 3 live style-guide
        attempts a day, or the 20 page reads a day shared with the SuperX app.
        `platform` is the platform-wide fair-use ceiling on live-data actions,
        shared with every SuperX account: a `platform` refusal is not about
        this account's quota, so wait for `reset_at` and retry.

        The free endpoints send `X-Credits-Remaining` and `X-Credits-Reset` on
        this 429 as they do on a 200, since nothing was charged either way.
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        Retry-After:
          description: Seconds to wait before retrying. Sent on every flavour of this 429.
          schema:
            type: integer
        X-Credits-Remaining:
          description: Credits left in the pool. Sent only on `ai_credits_exhausted`.
          schema:
            type: integer
        X-Credits-Reset:
          description: Unix seconds when the pool refills. Sent only on `ai_credits_exhausted`.
          schema:
            type: integer
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/CreditExhaustedError"
              - $ref: "#/components/schemas/ActionLimitedError"
              - $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            ai_action_limited_account:
              value:
                error:
                  code: ai_action_limited
                  message: "Daily limit reached for this action on your plan (10 lead searches per day). It resets at midnight UTC."
                  scope: account
                  retry_after: 20400
                  reset_at: 1789430400
            ai_action_limited_platform:
              value:
                error:
                  code: ai_action_limited
                  message: "The platform-wide fair-use ceiling for live-data actions has been reached for today. It resets at midnight UTC."
                  scope: platform
                  retry_after: 20400
                  reset_at: 1789430400
            ai_credits_exhausted:
              value:
                error:
                  code: ai_credits_exhausted
                  message: "Not enough AI credits. Resets in 5 hours."
                  credits_required: 2
                  credits_remaining: 0
                  reset_at: 1790812800

    CollectionInProgress:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: |
        Another background collection is still running for this account. Poll
        it with `GET /v1/datasets/{id}` and start the next one when it
        finishes.

        Nothing was started, so this does NOT use up one of the day's 10
        collections. The one enrichment unit spent establishing the size of
        the requested audience is not refunded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: collection_in_progress
              message: "Another audience collection is still running for this account. Poll it with GET /v1/datasets/{id} and start this one when it finishes."

    CollectionQuotaExceeded:
      description: |
        Today's audience collections are used up. The limit is 10 per day and
        is shared with the collections Ask SuperX runs in the app; existing
        datasets still read and export.
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      retry_after:
                        type: integer
                        description: Seconds to wait before retrying.
                      limit:
                        type: integer
                        description: Collections allowed per day.
                      reset_at:
                        type: integer
                        description: Unix seconds at the next UTC midnight.
          example:
            error:
              code: collection_quota_exceeded
              message: "You have used today's audience collections. Existing datasets still read and export; the limit resets at midnight UTC."
              retry_after: 20400
              limit: 10
              reset_at: 1789430400
