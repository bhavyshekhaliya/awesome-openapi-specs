openapi: 3.2.1
info:
  title: SuperX API
  version: "1.0.0"
  description: |
    The SuperX public API: your Twitter/X content, analytics, audience and
    scheduling data over REST.

    All endpoints require an API key (`Authorization: Bearer sxk_...`) except
    `GET /v1/docs`. Keys are created in the SuperX app under Account > API / MCP / CLI
    and are server-side secrets.

    Timestamps are UTC ISO-8601 in both directions; inputs must carry an explicit
    `Z` or numeric offset. Every authenticated response carries
    `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers.
  contact:
    name: SuperX
    url: https://superx.so
servers:
  - url: https://api.superx.so
externalDocs:
  description: Official SuperX API documentation
  url: https://docs.superx.so/
security:
  - apiKey: []
tags:
  - name: Identity
  - name: Content
  - name: Analytics
  - name: Inspiration
  - name: Audience
  - name: Contact Lists
  - name: Signals
  - name: Datasets
    description: |
      The audience collections Ask SuperX builds in the app: the repliers,
      quoters or reposters of a post, the members of an X list, your own
      posts or replies, or a research brief.

      Collect a new one with `POST /v1/datasets` (a big collection answers
      202 and finishes in the background), read it, export it, or copy the
      people in it into a contact list you created. Datasets are kept for 30
      days, and the ones Ask SuperX builds in the app show up here too.
  - name: Engage
    description: |
      The account's saved Engage feeds and the candidate posts in them, for
      an agent to score and a person to act on.

      Read-only by design. These endpoints return feed candidates for a
      person to review; replies are written and sent by a person in the
      SuperX app, which is why there is no reply endpoint here. Sending
      spammy, automated, or AI-generated replies that read as inauthentic
      may get your X account suspended under X's inauthentic-behavior
      rules and your SuperX account terminated. AI suggestions must be
      reviewed and meaningfully edited before they are sent, and you are
      solely responsible for what you post. Reply activity is logged and
      may be audited.
  - name: X Lookups
    description: |
      Read any public post, its top replies, any public profile, or an
      account's latest posts LIVE from X, rather than from SuperX's stored
      data.

      These are owner-scoped, so none of them take an `account_id`: nothing
      about a public lookup is per-X-account. They cost the tighter
      live-enrichment allowance and share a daily allowance of 300 live
      lookups with Ask SuperX inside the app, so use them for what you
      actually need rather than to sweep. Repeat lookups within 15 minutes
      may be served from a short-lived server-side cache.
  - name: Tools
    description: |
      The composer helpers from the SuperX app, over the API: rewrite a post,
      edit one selected piece of it, apply one preset rewrite, check a claim,
      or compare two versions.

      Every one of them returns TEXT and writes nothing. Nothing here is
      posted, scheduled or sent; save what you keep with
      `POST /v1/posts/draft` or `POST /v1/scheduled-posts`. They cost AI
      credits, measured from the models' real cost, and spend no live-data
      allowance.
  - name: Media
  - name: Workers
    description: |
      The posts the account's Workers have written, and the three things a
      person does with one: save it as a draft, schedule it, or dismiss it.

      A Worker is a scheduled AI writer set up in the SuperX app. Creating,
      editing and running one stays in the app, so there is no create or run
      endpoint here. What a run produces lands in the app's "To review" queue
      and is read with `GET /v1/workers/suggestions`.

      NOTHING HERE POSTS TO X. Drafting or scheduling a suggestion writes a
      post the user can see in the app and on `GET /v1/scheduled-posts`,
      exactly like the app's own buttons. AI output must be reviewed and
      meaningfully edited by a person before it goes out, so show the text to
      the user and confirm the time before you schedule anything.
  - name: Scheduling
  - name: Tags
  - name: Context
  - name: Queue
  - name: DMs
    description: |
      Queue direct messages into the account's own DM pipeline, and read or
      cancel what is waiting.

      NOTHING HERE SENDS A MESSAGE. `POST /v1/dm/campaigns` enqueues; the
      SuperX app's scheduler is what sends, within the account's daily and
      monthly DM limits, so the create response is counts, not deliveries.
      Unsent messages can be cancelled until the scheduler picks them up.

      You are responsible for the messages you queue. Unsolicited or
      automated bulk DMs may get an X account suspended under X's rules and
      a SuperX account terminated, so confirm the recipient list and the
      exact wording with the person on whose behalf you are queueing.
  - name: Articles
  - name: Meta

paths:
  /v1/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Get the key owner
      description: Returns the key owner, their plan, the calling key's name and scopes, and the AI credit pool.
      responses:
        "200":
          description: The authenticated identity.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Me"
              example:
                data:
                  owner:
                    id: "1178367350552305665"
                    name: "Jordan Rivers"
                    email: "jordan@example.com"
                  plan:
                    tier: 2
                    label: "Pro"
                    is_trial: false
                  key:
                    id: 3
                    name: "My script"
                    key_prefix: "sxk_Ab3dEf9h"
                    scopes: ["read", "write"]
                    created_at: "2026-07-01T09:15:00.000Z"
                    last_used_at: "2026-07-06T08:41:03.000Z"
                  credits:
                    remaining: 712
                    pool: 750
                    period: "month"
                    period_end: "2026-10-01T00:00:00.000Z"
                    bonus: 0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/accounts:
    get:
      tags: [Identity]
      operationId: listAccounts
      summary: List your accounts
      description: |
        The accounts this key may act on: your main account plus any linked
        accounts. When linked accounts cannot be verified, the response degrades
        to the main account only and carries a top-level `degraded: true` flag;
        retry shortly for the full list.
      responses:
        "200":
          description: Main and linked accounts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
                  degraded:
                    type: boolean
                    description: Present and true only when linked accounts could not be verified and the list contains the main account only.
              example:
                data:
                  - id: "1178367350552305665"
                    username: "mainhandle"
                    name: "Main Account"
                    avatar_url: "https://pbs.twimg.com/profile_images/example.jpg"
                    is_main: true
                  - id: "1299139023923867648"
                    username: "brandhandle"
                    name: "Brand Account"
                    avatar_url: "https://pbs.twimg.com/profile_images/example2.jpg"
                    is_main: false
                pagination: { page: 1, limit: 2, has_more: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/posts:
    get:
      tags: [Content]
      operationId: listPosts
      summary: List published posts
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: type
          in: query
          description: >-
            Which posts to include. `posts` returns original posts, quote
            posts and thread continuations (replies to your own posts), never
            replies to other accounts and never reposts. `replies` returns
            replies to other accounts. `all` returns everything the account
            wrote, reposts included.
          schema:
            type: string
            enum: [posts, replies, all]
            default: posts
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
        - name: sort
          in: query
          schema:
            type: string
            enum: [posted_at, likes, impressions]
            default: posted_at
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of posts, newest first by default.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Post" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "1941123456789012345"
                    text: "Consistency beats intensity. Post every day for 30 days and watch what happens."
                    posted_at: "2026-07-05T14:02:11.000Z"
                    url: "https://x.com/mainhandle/status/1941123456789012345"
                    is_reply: false
                    is_repost: false
                    is_thread: false
                    in_reply_to_id: null
                    is_quote: false
                    thread_id: "1941123456789012345"
                    metrics:
                      likes: 231
                      replies: 18
                      reposts: 40
                      quotes: 3
                      bookmarks: 55
                      impressions: 48210
                pagination: { page: 1, limit: 20, has_more: true }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/posts/analytics:
    get:
      tags: [Analytics]
      operationId: getPostAnalytics
      summary: Get analytics
      description: |
        Totals and a per-day series (posts, engagement, impressions, follower
        samples) for the selected account. Totals and series cover the
        account's own posts: original posts plus thread continuations, which
        are replies to the account's own posts. Replies to other accounts and
        reposts are counted separately as replies_sent and reposts_sent, and
        every engagement figure is what the counted posts received. Default
        range is the last 30 days; the maximum range is 366 days.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Until"
      responses:
        "200":
          description: Totals, follower change and per-day series.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Analytics"
              example:
                data:
                  range:
                    since: "2026-06-06T00:00:00.000Z"
                    until: "2026-07-06T00:00:00.000Z"
                  totals:
                    posts: 92
                    replies_sent: 140
                    reposts_sent: 6
                    likes: 4110
                    replies: 380
                    reposts: 512
                    quotes: 44
                    bookmarks: 903
                    impressions: 812400
                  followers:
                    start: 12180
                    end: 12544
                    change: 364
                  series:
                    - date: "2026-07-04"
                      posts: 3
                      replies_sent: 5
                      reposts_sent: 0
                      likes: 140
                      replies: 12
                      reposts: 17
                      quotes: 1
                      bookmarks: 31
                      impressions: 27400
                      followers: 12520
                    - date: "2026-07-05"
                      posts: 4
                      replies_sent: 7
                      reposts_sent: 1
                      likes: 231
                      replies: 18
                      reposts: 40
                      quotes: 3
                      bookmarks: 55
                      impressions: 48210
                      followers: 12544
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/posts/draft:
    post:
      tags: [Scheduling]
      operationId: draftPost
      summary: Write post drafts in your voice
      description: |
        Writes post drafts from a brief, in the account's own voice. Nothing
        is scheduled and nothing is stored: the response is text for you to
        review and edit, then send to `POST /v1/scheduled-posts` to save a
        draft or schedule it.

        Every draft copies the SHAPE of a proven post, never its content.
        Pass one in `mirror` (the text of a post from `GET /v1/inspiration`
        works well), or leave `mirror` out and a proven shape is picked for
        you, optionally biased toward a `collection`.

        Voice: `mine` (default) writes as the account in `account_id`, from
        that account's own posts, style guide and rules (your main account
        when `account_id` is omitted), `creator` writes in a creator's style,
        and `hybrid` keeps the account's substance with the creator's flavor.
        The creator's style guide is prepared in the
        background the first time you name them; that first call returns
        `409 creator_style_pending` and the retry a minute later succeeds.

        Costs AI credits per draft (drafts that fail are refunded), and a
        call takes roughly 20 to 40 seconds. `Idempotency-Key` is NOT
        supported: generation is not idempotent, and a replay would produce
        different text anyway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief]
              properties:
                brief:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: "What the post should say: the data, angle, or notes to write from."
                count:
                  type: integer
                  minimum: 1
                  maximum: 3
                  default: 1
                  description: How many drafts to write. Each one costs credits.
                voice:
                  type: string
                  enum: [mine, creator, hybrid]
                  default: mine
                  description: "Whose voice to write in. `mine` is the voice of the account in `account_id`: its own posts, style guide and rules. Omit `account_id` and that is your main account."
                creator:
                  type: string
                  description: X handle to borrow style from, for example `@naval`. Required when `voice` is `creator` or `hybrid`, rejected when `voice` is `mine`.
                mirror:
                  type: string
                  minLength: 50
                  maxLength: 1500
                  description: "Plain text of a proven post whose shape to copy. Only the form is reused, never the content. Pick a mirror with room for your data: a two-line aphorism squeezes the facts out. Omit to have a shape picked for you."
                collection:
                  type: string
                  description: "Format collection id to bias the picked shape toward, for example `numbered_list` or `contrarian_take`. Used only when `mirror` is omitted; an id that is unknown or not usable as a mirror fails with `400 invalid_collection`, which lists the ids that do work."
                instructions:
                  type: string
                  maxLength: 500
                  description: Extra style instructions for this batch.
                account_id:
                  type: string
                  description: "Any account you own, meaning your main account (the default when omitted) or one linked to it. With `voice: mine` the drafts use this account's own posts and style guide. An account shared with you returns `403 writes_main_account_only`."
            examples:
              simple:
                summary: One draft in your own voice
                value:
                  brief: "We cut churn from 6.2% to 3.8% by replacing the onboarding video with a 3-step checklist."
              mirrored:
                summary: Three drafts copying a proven post's shape
                value:
                  brief: "We shipped a public API. 40 developers signed up in 48 hours."
                  count: 3
                  mirror: "Most people think they need more discipline.\n\nThey do not.\n\nThey need a smaller first step. Discipline is what you build after the habit already exists, not before."
              creator_voice:
                summary: Your substance, a creator's flavor
                value:
                  brief: "Removing our free plan tripled conversion."
                  voice: "hybrid"
                  creator: "@naval"
      responses:
        "201":
          description: The generated drafts. Nothing was scheduled or stored.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      drafts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              description: The draft post text. Send it to `POST /v1/scheduled-posts` when the user is happy with it.
                            mirrored:
                              type: [object, 'null']
                              description: Which proven shape this draft copied, or `null` when the draft copied no shape (no usable one was found and it was written from the brief alone).
                              properties:
                                source:
                                  type: string
                                  enum: [you, collection]
                                  description: "`you` when you passed `mirror`, `collection` when a shape was picked for you."
                                collection:
                                  type: string
                                  description: Format collection the shape came from. Absent when `source` is `you`.
                                reference_id:
                                  type: string
                                  description: Id of the post whose shape was copied. Absent when `source` is `you`.
                      credits_charged:
                        type: integer
                        description: AI credits kept for this call. Drafts that failed are refunded and are not counted here.
              example:
                data:
                  drafts:
                    - text: "Most founders think they need better retention strategies.\n\nThey do not.\n\nThey need simpler onboarding."
                      mirrored: { source: "you" }
                  credits_charged: 3
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: >-
            Invalid or missing field (`invalid_parameter`), a `mirror` that
            cannot be used as a shape (`mirror_rejected`, with the reason),
            an unknown or unusable `collection` (`invalid_collection`), a
            `creator` SuperX has no posts for (`unknown_creator`), or a
            creator whose style guide could not be built at all
            (`creator_style_unavailable`, terminal: do not retry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: mirror_rejected
                  message: "That post cannot be used as a mirror (url). Pass the plain text of a substantial post with no links and no engagement bait."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: >-
            Read-only key (`insufficient_scope`), an account shared with you
            (`writes_main_account_only`), or a lapsed subscription (legacy
            string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: writes_main_account_only
                  message: "Accounts shared with you are read-only through the API. Drafting works on your own main and linked accounts."
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: >-
            The creator's style guide is being prepared
            (`creator_style_pending`). It is ready in about a minute; retry
            the same request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: creator_style_pending
                  message: "Style guide for @naval is being prepared, retry in about a minute."
        "429":
          description: >-
            Rate limited (`rate_limited`, honor `Retry-After`), the AI credit
            pool is used up (`ai_credits_exhausted`, with the credit
            counters), or the plan's daily cap on drafting runs is spent
            (`ai_action_limited`, honor `Retry-After`). No plan caps drafting
            today; the shape is documented so a future cap cannot surprise a
            client.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Retry-After:
              description: >-
                Seconds to wait before retrying. Sent on every flavour of this
                429.
              schema:
                type: integer
            X-Credits-Remaining:
              description: >-
                Credits left in the pool. Sent only on
                `ai_credits_exhausted`, never on `rate_limited` or
                `ai_action_limited`, which do not consult the pool.
              schema:
                type: integer
            X-Credits-Reset:
              description: >-
                Unix timestamp (seconds) when the pool refills. Sent only on
                `ai_credits_exhausted`, on the same terms as
                `X-Credits-Remaining`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreditExhaustedError"
                  - $ref: "#/components/schemas/ActionLimitedError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: ai_credits_exhausted
                  message: "Not enough AI credits. Resets in 5 hours."
                  credits_required: 9
                  credits_remaining: 2
                  reset_at: 1790812800
        "500": { $ref: "#/components/responses/InternalError" }
        "502":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Every draft failed to generate (`generation_failed`). All credits for the call were refunded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: generation_failed
                  message: "Drafting failed and no credits were spent. Try again shortly."

  /v1/posts/remix:
    post:
      tags: [Scheduling]
      operationId: remixPost
      summary: Rewrite a post in your voice
      description: |
        Rewrites a post in the account's own voice, as close to or as far from
        the original as you ask. `closeness: 0` keeps only the idea,
        `closeness: 100` stays very close to the original wording.

        This is the same engine as the app composer's Remix button, so a
        script and the app produce the same kind of output.

        Nothing is posted, scheduled or stored: the response is TEXT for a
        person to review, then send to `POST /v1/posts/draft` or
        `POST /v1/scheduled-posts`.

        Costs AI credits, measured from the models' real cost and typically 2.
        Spends no live-data allowance. Needs a key with the `write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemixPostRequest" }
            example:
              text: "Most founders think they have a traffic problem. They have a positioning problem."
              closeness: 70
              instructions: "Make it a question."
      responses:
        "200":
          description: The remixed text.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
