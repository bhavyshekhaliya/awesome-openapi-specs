        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/bulk:
    post:
      tags: [Contact Lists]
      operationId: addContactListMembers
      summary: Add contact list members in bulk
      description: |
        Add up to 500 people to a list you created, by numeric X user id.

        This endpoint does NO live profile lookup, which is why it costs one
        write and no enrichment: it builds each member from the profile SuperX
        already stores. Ids SuperX has never seen come back in `not_found` and
        are NOT added, so no placeholder members are ever created. Add those
        one at a time with `POST /v1/contact-lists/{id}/members` and a
        `handle`, which does resolve live (and costs one enrichment unit).

        Re-adding an existing member is counted in `duplicates`, never an
        error. Duplicate ids inside one call are collapsed. System lists return
        400 `system_list_read_only`.

        Works for your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x_user_ids]
              properties:
                x_user_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: Numeric X user ids.
                account_id:
                  type: string
            example:
              x_user_ids: ["944883311", "44196397", "1234567890"]
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The bulk add finished. Read the counters for what happened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BulkAddResult" }
              example:
                data:
                  added: 2
                  duplicates: 0
                  failed: 0
                  not_found: ["1234567890"]
                  total_in_list_after: 44
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/contact-lists/{id}/members/bulk-delete:
    post:
      tags: [Contact Lists]
      operationId: removeContactListMembers
      summary: Remove contact list members in bulk
      description: |
        Remove up to 500 members from a list you created, by member id (the
        `id` from `GET /v1/contact-lists/{id}/members`).

        POST rather than DELETE because the ids travel in a body. The delete is
        scoped to this list, so ids that are not in it are skipped and
        `deleted` can be lower than the number you sent. There is deliberately
        no "delete everything matching a filter" mode. System lists return 400
        `system_list_read_only`.

        Works for your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The list id from `GET /v1/contact-lists`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: Member ids from `GET /v1/contact-lists/{id}/members`.
                account_id:
                  type: string
            example:
              member_ids: ["m1a2b3c4d5e6f7g8h9i0j", "m2b3c4d5e6f7g8h9i0j1k"]
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The bulk removal finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/BulkRemoveResult" }
              example:
                data:
                  deleted: 2
                  total_in_list_after: 42
        "400": { $ref: "#/components/responses/SystemListReadOnly" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/ListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents:
    get:
      tags: [Signals]
      operationId: listSignalAgents
      summary: List signal agents
      description: |
        The account's signal agents: the automated lead finders from the
        SuperX app. Each agent watches one or more signals (profiles,
        followers, keywords, or lists) and scores the people it finds
        against its ideal customer profile. Agents can be created, paused,
        resumed, and deleted through the API; name, ICP, precision, and
        destination edits happen in the SuperX app. `destination_list_id`
        joins to `GET /v1/contact-lists` for the target list's name. Not
        paginated (agent counts are capped per account).
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's signal agents.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SignalAgent" }
              example:
                data:
                  - id: 3
                    name: "Founder prospects"
                    status: active
                    status_detail: null
                    icp_description: "Early-stage SaaS founders posting about growth"
                    precision_mode: high
                    destination_list_id: "contact:V1StGXR8_Z5jdHi6B-myT"
                    created_at: "2026-06-20T09:00:00.000Z"
                    updated_at: "2026-07-01T18:30:00.000Z"
                    deposited_count: 42
                    last_checked: "2026-07-08T06:15:00.000Z"
                    signals:
                      - id: 7
                        type: profile_watch
                        handle: "naval"
                        name: "Naval"
                        avatar: "https://pbs.twimg.com/profile_images/..."
                        query: null
                        list_name: null
                        status: active
                        status_detail: null
                        last_run_at: "2026-07-08T06:15:00.000Z"
                        created_at: "2026-06-20T09:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

    post:
      tags: [Signals]
      operationId: createSignalAgent
      summary: Create a signal agent
      description: |
        Create a signal agent: it watches X for the given keywords and scores
        the people it finds against `icp_description`. Matching leads land in
        Signals (and `GET /v1/signals/leads`) over the following minutes and
        days; nothing is returned synchronously.

        `keywords` is shorthand for keyword watches; `signals` carries all
        four watch types (`keyword_watch`, `profile_watch`, `follower_watch`,
        `list_watch`). Send either or both: 1-5 distinct entries combined,
        keywords first. Omit both and 1-3 keyword watches are suggested from
        the ICP (if suggestion fails, nothing is created and you get 502
        `upstream_error`). Omit `destination_list_id` and a contact list
        named `Leads: <agent name>` is created for the leads, flagged
        `destination_list_created: true` in the response.

        PARTIAL SUCCESS: entries the add path rejects (an unknown handle, a
        private list, a duplicate, the per-agent signal cap) come back in
        `warnings` and the agent is still created from the entries that
        landed. Only when EVERY entry fails is the agent rolled back and an
        error returned. Read `warnings` before reporting what the agent
        watches, and re-add the fixed entries with
        `POST /v1/signals/agents/{id}/signals`.

        A create carrying any `profile_watch`, `follower_watch` or
        `list_watch` entry resolves those targets live and consumes ONE unit
        of the enrichment allowance (one per call, not per entry).

        Plan limits apply (403 `cap_reached`). Supports `Idempotency-Key`
        (max 64 chars): retries with the same key and body replay the
        original response with `Idempotency-Replayed: true`. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icp_description]
              properties:
                name:
                  type: string
                  maxLength: 80
                  description: Agent name shown in SuperX.
                icp_description:
                  type: string
                  maxLength: 500
                  description: Who the ideal leads are; found people are scored against this.
                precision_mode:
                  type: string
                  enum: [high, discovery]
                  default: high
                  description: high = fewer, stricter matches; discovery = broader net.
                keywords:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    maxLength: 180
                  description: Plain-language descriptions of what the target customer posts about. Omit to auto-suggest from the ICP. Keywords beyond your plan's per-agent signal limit are dropped; the response lists the signals actually created.
                signals:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { $ref: "#/components/schemas/SignalInput" }
                  description: Non-keyword watches to add alongside `keywords`. Combined with `keywords`, at most 5 distinct entries.
                destination_list_id:
                  type: string
                  description: Contact list id (from `GET /v1/contact-lists`) that receives the leads. Omit to auto-create one.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              name: "Build in public founders"
              icp_description: "Indie founders building SaaS in public, sharing MRR and launch updates"
              precision_mode: high
              keywords: ["building in public", "just shipped my MVP"]
      responses:
        "201":
          description: The created agent with its keyword signals, plus whether a destination list was auto-created.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Idempotency-Replayed:
              description: Present and "true" when this response was replayed from a previous request with the same Idempotency-Key.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SignalAgent"
                      - type: object
                        properties:
                          destination_list_created:
                            type: boolean
                            description: true when destination_list_id was omitted and a list was created for the agent.
                          warnings:
                            type: array
                            description: Present only when at least one keyword or signal entry was rejected. The agent was created from the entries that landed.
                            items: { $ref: "#/components/schemas/SignalWarning" }
              example:
                data:
                  id: 12
                  name: "Build in public founders"
                  status: active
                  status_detail: null
                  icp_description: "Indie founders building SaaS in public, sharing MRR and launch updates"
                  precision_mode: high
                  destination_list_id: "contact:V1StGXR8_Z5jdHi6B-myT"
                  created_at: "2026-07-08T10:00:00.000Z"
                  updated_at: "2026-07-08T10:00:00.000Z"
                  deposited_count: 0
                  last_checked: null
                  signals:
                    - id: 31
                      type: keyword_watch
                      handle: null
                      name: null
                      avatar: null
                      query: "building in public"
                      list_name: null
                      status: active
                      status_detail: null
                      last_run_at: null
                      created_at: "2026-07-08T10:00:00.000Z"
                  destination_list_created: true
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: A parameter is missing, malformed, or out of range (`invalid_parameter`), or the create was rejected upstream (`invalid_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: invalid_parameter
                  message: "icp_description is required (1-500 characters)"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), lapsed subscription (legacy string envelope), or the plan's agent limit is reached (`cap_reached`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: cap_reached
                  message: "You've reached your plan's signal agent limit (1 on the pro plan). Pause and delete an agent, or upgrade your plan."
        "404": { $ref: "#/components/responses/ListNotFound" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: idempotency_key_reuse
                  message: "This Idempotency-Key was already used with a different request body."
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents/{id}:
    patch:
      tags: [Signals]
      operationId: updateSignalAgent
      summary: Update a signal agent
      description: |
        Edit an agent's `name`, `icp_description`, `precision_mode`,
        `destination_list_id`, `status`, or any combination. At least one
        field is required.

        Editing the ICP changes how NEW leads are scored; leads already found
        keep their scores. A `destination_list_id` that is not one of your
        own usable lists returns 404 `list_not_found`. `status` is `active`
        or `paused`: paused agents stop finding leads, and resuming picks up
        where the agent left off (a resume is rejected with
        `invalid_request` when the agent's stored destination list is gone -
        send a new `destination_list_id` first).

        The agent's SIGNALS are not edited here: each one resolves its target
        upstream, so they have their own endpoints
        (`POST /v1/signals/agents/{id}/signals`,
        `DELETE /v1/signals/agents/{id}/signals/{signalId}`). Naturally
        idempotent, so there is no `Idempotency-Key` support. Works for your
        main account or any account linked to it (`account_id`); accounts
        shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                icp_description:
                  type: string
                  minLength: 1
                  maxLength: 500
                precision_mode:
                  type: string
                  enum: [high, discovery]
                destination_list_id:
                  type: string
                  description: Contact list id (from `GET /v1/contact-lists`) that receives the leads.
                status:
                  type: string
                  enum: [active, paused]
            example:
              status: paused
      responses:
        "200":
          description: The updated agent.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SignalAgent" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AgentOrListNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

    delete:
      tags: [Signals]
      operationId: deleteSignalAgent
      summary: Delete a signal agent
      description: |
        Delete an agent. The leads it already saved and its destination
        contact list stay untouched. Deleting the same id again returns 404
        `agent_not_found`. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The agent was deleted.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      deleted:
                        type: boolean
              example:
                data:
                  id: 12
                  deleted: true
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AgentNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents/{id}/signals:
    post:
      tags: [Signals]
      operationId: addSignalAgentSignal
      summary: Add a signal to an agent
      description: |
        Add one thing for the agent to watch: a search (`keyword_watch`), an
        account's posts (`profile_watch`), the people an account follows
        (`follower_watch`), or the members of a public X list
        (`list_watch`). New leads start arriving over the following minutes
        and days; nothing is returned synchronously.

        One target per call: each add resolves its target live or compiles
        the search, so there is no batch form. Each plan caps how many
        signals one agent may hold (403 `cap_reached`) and an agent may watch
        each target once (409 `duplicate_signal`). `profile_watch`,
        `follower_watch` and `list_watch` consume one unit of the enrichment
        allowance; `keyword_watch` consumes none. Only PUBLIC X lists can be
        watched.

        No `Idempotency-Key`: the duplicate rule already makes a repeat
        harmless. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SignalInput"
                - type: object
                  properties:
                    account_id:
                      type: string
                      description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              type: follower_watch
              handle: "naval"
      responses:
        "201":
          description: The created signal.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SignalAgentSignal" }
              example:
                data:
                  id: 118
                  type: follower_watch
                  handle: "naval"
                  name: "Naval"
                  avatar: "https://pbs.twimg.com/profile_images/..."
                  query: null
                  list_name: null
                  status: active
                  status_detail: null
                  last_run_at: null
                  created_at: "2026-09-07T10:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`), a lapsed subscription, or the agent's per-plan signal limit is reached (`cap_reached`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: cap_reached
                  message: "This agent has reached its limit of 3 signals on the pro plan. Remove a signal in SuperX or upgrade your plan."
        "404": { $ref: "#/components/responses/SignalTargetNotFound" }
        "409": { $ref: "#/components/responses/DuplicateSignal" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/agents/{id}/signals/{signalId}:
    delete:
      tags: [Signals]
      operationId: removeSignalAgentSignal
      summary: Remove a signal from an agent
      description: |
        Remove one signal. Leads it already found stay, and so does the
        agent's de-duplication state. Removing the agent's LAST signal is
        allowed: the agent stays, finding nothing, until a signal is added
        back. Deleting the same id again returns 404 `signal_not_found`.
        Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The signal agent's numeric id (from `GET /v1/signals/agents`).
          schema:
            type: integer
        - name: signalId
          in: path
          required: true
          description: The signal's numeric id (from the agent's `signals` in `GET /v1/signals/agents`).
          schema:
            type: integer
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The signal was removed.
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/SignalNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/leads/{id}/feedback:
    post:
      tags: [Signals]
      operationId: setSignalLeadFeedback
      summary: Set feedback on a lead
      description: |
        Record the account's verdict on one lead - `fit`, `not_fit`, or
        `null` to clear it.

        The id is the numeric LEAD id from `GET /v1/signals/leads`, not the
        person's X user id: the same person can be a lead of two agents with
        a different verdict on each. The verdict is what the scorer's
        examples and the lead sweep learn from, so it is worth recording on
        leads you act on, and it is mirrored onto the person's row in the
        agent's destination contact list. It reads back as `feedback` /
        `feedback_at` on `GET /v1/signals/leads`.

        Naturally idempotent (the verdict is a value, not a counter), so
        there is no `Idempotency-Key` support. Works for your main account or
        any account linked to it (`account_id`); accounts shared with you are
        read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The lead's numeric id (from `GET /v1/signals/leads`).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: [string, 'null']
                  enum: [fit, not_fit, null]
                  description: fit = a good lead, not_fit = a bad one, null clears the verdict.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              feedback: fit
      responses:
        "200":
          description: The stored verdict.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LeadFeedback" }
              example:
                data:
                  id: 4821
                  feedback: fit
                  feedback_at: "2026-09-07T10:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/LeadNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/signals/leads/search:
    post:
      tags: [Signals]
      operationId: searchLeads
      summary: Search for leads on X now
      description: |
        One live keyword search over X, scored against an ideal-customer
        profile, returned in the response.

        **It creates nothing.** No signal agent, no saved leads, no contact
        list membership: the leads exist only in this response. For an
        audience that keeps filling up on its own, create a signal agent
        (`POST /v1/signals/agents`) instead, and read what it finds with
        `GET /v1/signals/leads`.

        **It plans, then searches.** From `offer`, `icp_description` and your
        seed angles, a model writes up to 10 short queries across the angles
        that find buyers (the buyer's working day, their pains, the tools they
        already pay for, adjacent roles), runs them all, and scores everyone it
        finds. `queries_used` says how many reached X, `query_plan` shows each
        query with its angle and what it contributed, and `partial` is true
        when a time budget cut the run short.

        So `keywords` are seed ANGLES, not the query: 2-5 short phrases of how
        the BUYER talks on a normal working day, not the product's own name and
        not a full sentence. `offer` is optional but it is the strongest input
        you can give. `precision: high` keeps only confident matches;
        `discovery` (the default) also returns adjacent ones.

        The search takes up to a minute. Each lead comes from ONE matched
        post, so treat `posts_count` as lifetime volume rather than proof of
        current activity.

        **Only recent posts count.** `max_post_age_days` sets the window
        (1-90, 30 by default): a matching post older than that is skipped and
        counted in `freshness.stale_skipped`, and every lead carries its
        post's `posted_at` and `post_age_days`. Leads come back freshest
        first within each score. An empty `leads` with a `stale_skipped`
        above 0 means people do post about this, just not inside the window:
        broaden the keywords, or raise `max_post_age_days` when you want
        people who are active over a longer stretch rather than a fresh pain
        point.

        **Cost.** Reading X live costs AI credits, measured from what the
        search actually spends: at least 1 credit for any search that reaches
        X, typically 1-2. It also uses one of the plan's daily lead searches
        (`429 ai_action_limited` with `scope: "account"`) and a slice of a
        platform-wide fair-use ceiling on live-data actions (`scope:
        "platform"`, shared with every account, so wait and retry rather than
        assuming your own quota is gone). A search that never reaches X is
        not charged.

        Nothing is written by this endpoint, but it still needs a key with
        the `write` scope, because it spends AI credits and live requests:
        every non-GET `/v1` request needs that scope anyway. The MCP
        `search_leads` tool needs the write scope for the same reason. On
        both surfaces an account shared with you works, unlike the endpoints
        that really write: nothing is written to the account, and the credits
        come from the key owner's pool.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadSearchRequest" }
            example:
              keywords: "cancelled today, mrr dropped, renewal call, churn rate"
              icp_description: "Founders of small B2B SaaS companies who are worried about retention and would try a churn-reduction tool."
              offer: "ChurnRadar, retention analytics that flags the accounts about to cancel."
              precision: discovery
              max_leads: 10
              max_post_age_days: 7
      responses:
        "200":
          description: |
            The search finished. `leads` is empty when nothing qualified,
            with a `note` saying so.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/LeadSearchResult" }
                  note:
                    type: string
              example:
                data:
                  query_used: "(\"cancelled today\" OR \"they churned\" OR \"lost a customer\") (saas OR mrr OR retention) lang:en -filter:replies -filter:retweets"
                  query_source: planned
                  queries_used: 10
                  query_plan:
                    - query: "(\"cancelled today\" OR \"they churned\" OR \"lost a customer\") (saas OR mrr OR retention) lang:en -filter:replies -filter:retweets"
                      angle: workflow
                      posts_in_window: 24
                      candidates: 11
                    - query: "(churnzero OR chartmogul OR baremetrics) (churn OR retention OR mrr) lang:en -filter:replies -filter:retweets"
                      angle: competitor
                      posts_in_window: 9
                      candidates: 4
                  partial: false
                  precision: discovery
                  requests_used: 12
                  posts_scanned: 194
                  candidates_scored: 60
                  credits_charged: 2
                  freshness:
                    max_post_age_days: 7
                    posts_in_window: 31
                    stale_skipped: 4
                    oldest_skipped_days: 212
                  leads:
                    - user:
                        x_user_id: "1178367350552305665"
                        username: "robj3d3"
                        name: "Rob"
                        avatar_url: "https://pbs.twimg.com/profile_images/abc_normal.jpg"
                        followers_count: 8213
                        posts_count: 4102
                      icp_score: 4
                      icp_rationale: "Runs a small B2B SaaS and is actively complaining about cancellations."
                      provenance:
                        action: authored
                        tweet_id: "1969318805251100000"
                        tweet_text: "third cancellation this week and I still cannot tell why they left"
                        target_handle: null
                        posted_at: "2026-09-12T08:41:07.000Z"
                        post_age_days: 2
                note: "Nothing was saved: this search creates no signal agent and stores no leads."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/signals/leads:
