            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The page could not be read (`scrape_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: scrape_failed
                  message: "That page could not be read. Check the url and try again."
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/engage/feeds:
    get:
      tags: [Engage]
      operationId: listEngageFeeds
      summary: List Engage feeds
      description: |
        The account's saved Engage feeds: the keyword and list feeds it
        browses in the SuperX app's Engage tab. Feeds are created and edited
        in the app; this endpoint only reads them. `fetch_units` is what one
        fetch of that feed costs against the feed bucket (list feeds count as
        up to 3, resolved exactly at fetch time). This endpoint never touches
        the feed bucket itself.

        Read-only by design. These endpoints return feed candidates for a
        person to review; replies are written and sent by a person in the
        SuperX app, which is why there is no reply endpoint here. Sending
        spammy, automated, or AI-generated replies that read as inauthentic
        may get your X account suspended under X's inauthentic-behavior
        rules and your SuperX account terminated. AI suggestions must be
        reviewed and meaningfully edited before they are sent, and you are
        solely responsible for what you post. Reply activity is logged and
        may be audited.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's saved feeds.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EngageFeed" }
              example:
                data:
                  - id: "feed_kw_1"
                    name: "Bootstrapped SaaS"
                    type: keywords
                    keywords: ["bootstrapped saas", "indie hackers"]
                    active: true
                    fetch_units: 1
                  - id: "feed_list_2"
                    name: "Founders I follow"
                    type: list
                    list_id: "184"
                    list_name: "Founders"
                    active: false
                    fetch_units: 3
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

    post:
      tags: [Engage]
      operationId: createEngageFeed
      summary: Create an Engage feed
      description: |
        Save a new Engage feed on the account: a set of keywords, a public X
        list, or one of the account's own contact lists. The feed appears in
        `GET /v1/engage/feeds`, can be fetched with
        `GET /v1/engage/feeds/{id}/posts`, and shows up for the person in the
        SuperX app's Engage tab.

        The new feed does NOT become the feed the app has open: the API must
        not move someone's view while they are working in it. The response
        carries the account's current `active` feed unchanged.

        Send exactly ONE source: `keywords` (1-5), `x_list_id` or
        `x_list_url`, or `list_id`. `type` must agree with the fields you
        send. An X list is looked up live and only PUBLIC lists are accepted,
        so those calls also consume one unit of the tighter enrichment
        allowance; keyword and contact-list feeds consume none. Up to 8 feeds
        per account. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Feed name shown in SuperX.
                type:
                  type: string
                  enum: [keywords, x_list, list]
                  description: Must match the source fields sent below.
                keywords:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    maxLength: 100
                  description: For type keywords. Trimmed, de-duplicated case-insensitively.
                x_list_id:
                  type: string
                  description: For type x_list. A numeric X list id. Use this OR x_list_url.
                x_list_url:
                  type: string
                  description: For type x_list. A link like https://x.com/i/lists/1234567890.
                list_id:
                  type: string
                  description: For type list. A contact list id from `GET /v1/contact-lists`.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              name: "Bootstrapped SaaS"
              type: keywords
              keywords: ["bootstrapped saas", "indie hackers"]
      responses:
        "201":
          description: The created feed. `active` is false unless the account had no active feed.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EngageFeed" }
              example:
                data:
                  id: "V1StGXR8_Z5jdHi6B-myT"
                  name: "Bootstrapped SaaS"
                  type: keywords
                  keywords: ["bootstrapped saas", "indie hackers"]
                  active: false
                  fetch_units: 1
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/FeedSourceNotFound" }
        "409": { $ref: "#/components/responses/FeedLimitReached" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/engage/feeds/{id}:
    patch:
      tags: [Engage]
      operationId: updateEngageFeed
      summary: Update an Engage feed
      description: |
        Rename a saved feed, replace what it watches, or both. Send at most
        ONE source family per call (`keywords`, `x_list_id`/`x_list_url`, or
        `list_id`); two families in one body is a 400, because the intent is
        ambiguous. The feed keeps its id and its place in the account's feed
        list, so a feed may change type and anything holding its id keeps
        working. The active feed is not changed.

        Swapping in an X list is a live lookup (public lists only) and
        consumes one unit of the enrichment allowance. Naturally idempotent,
        so there is no `Idempotency-Key` support. Works for your main account
        or any account linked to it (`account_id`); accounts shared with you
        are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed id (from `GET /v1/engage/feeds`).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                keywords:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    maxLength: 100
                  description: Replace the feed's keywords (makes it a keyword feed).
                x_list_id:
                  type: string
                  description: Point the feed at this numeric X list id. Use this OR x_list_url.
                x_list_url:
                  type: string
                  description: Point the feed at this X list link.
                list_id:
                  type: string
                  description: Point the feed at this contact list.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              name: "Bootstrapped SaaS 2026"
      responses:
        "200":
          description: The updated feed.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EngageFeed" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/FeedSourceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

    delete:
      tags: [Engage]
      operationId: deleteEngageFeed
      summary: Delete an Engage feed
      description: |
        Remove a saved feed. If it was the feed the SuperX app has open, the
        first remaining feed takes over (or none, when the last feed goes).
        Posts the feed surfaced are not stored on it and are unaffected.
        Deleting the same id again returns 404 `feed_not_found`. Works for
        your main account or any account linked to it (`account_id`);
        accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          description: The feed id (from `GET /v1/engage/feeds`).
          schema: { type: string }
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The feed was deleted.
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/FeedNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/engage/feeds/{id}/posts:
    get:
      tags: [Engage]
      operationId: getEngageFeedPosts
      summary: Get posts from an Engage feed
      description: |
        Candidate posts from one saved feed, with the author profile and
        engagement metrics you need to score them for relevance, author size
        and recency.

        Paging works through `exclude_post_ids`, not page numbers: pass the
        ids you already hold to get the next batch. There is no `pagination`
        object; `has_more` tells you whether the feed had more to give.

        `limit` applies to keyword feeds. List feeds ignore it upstream and
        return one page per fetch: about 10 posts for a member list, 20 to 25
        for an imported X list (`limit` only trims that page). The size
        follows the list's resolved kind rather than the feed's `type`, so a
        `list` feed backed by a pure imported X list pages like an `x_list`
        feed. Page list feeds with `exclude_post_ids` instead of raising
        `limit`.

        Each fetch charges the plan's feed bucket, and a list feed that
        rotates its members costs 3 units instead of 1. On a keyword feed a
        50-post page costs exactly the same as a 20-post page, so ask for
        `limit=50` a few times a day and filter on your side rather than
        polling; feeds refresh over hours, so fetching more often than
        hourly returns the same posts. Feed fetches also run a few at a time
        across all API users; on a `429` with `Retry-After`, wait and retry.
        The bucket is charged before the fetch, so a fetch that then fails
        upstream still costs its units.

        Posts returned here count as seen and are demoted in later fetches.
        On a list feed, paging with `exclude_post_ids` also advances, and
        `fresh=true` resets, the same list cursor the SuperX app uses, so
        both move the position a person browsing that feed in the app sees.
        A plain fetch after a pause resets that cursor too, matching the
        app's own session timeout.

        Read-only by design. These endpoints return feed candidates for a
        person to review; replies are written and sent by a person in the
        SuperX app, which is why there is no reply endpoint here. Sending
        spammy, automated, or AI-generated replies that read as inauthentic
        may get your X account suspended under X's inauthentic-behavior
        rules and your SuperX account terminated. AI suggestions must be
        reviewed and meaningfully edited before they are sent, and you are
        solely responsible for what you post. Reply activity is logged and
        may be audited.
      parameters:
        - name: id
          in: path
          required: true
          description: Feed id from `GET /v1/engage/feeds`.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          description: >-
            Posts to return, up to 50. Default 20. Applies to keyword feeds;
            list feeds return one page per fetch whatever you ask for, about
            10 posts for a member list and 20 to 25 for an imported X list.
            On a keyword feed a big page costs the same as a small one.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: mode
          in: query
          description: Ranking for keyword feeds. `top` (default) blends quality and relevance, `latest` is pure recency.
          schema:
            type: string
            enum: [top, latest]
            default: top
        - name: fresh
          in: query
          description: Skip the short-lived result cache and refetch. Default false.
          schema:
            type: boolean
            default: false
        - name: include_replied
          in: query
          description: "Keep posts the account already replied to, flagged with `replied: true`. Default false removes them."
          schema:
            type: boolean
            default: false
        - name: exclude_post_ids
          in: query
          description: Comma-separated post ids to leave out, up to 100. This is how you page.
          schema:
            type: string
      responses:
        "200":
          description: Candidate posts from the feed.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EngageFeedPost" }
                  has_more:
                    type: boolean
                  feed:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      type:
                        type: string
                        enum: [keywords, list, x_list]
              example:
                data:
                  - id: "1941300000000000002"
                    text: "We doubled activation by rewriting onboarding emails."
                    created_at: "2026-09-01T09:41:00.000Z"
                    url: "https://x.com/founderhandle/status/1941300000000000002"
                    author:
                      id: "944883311"
                      username: "founderhandle"
                      name: "Founder Name"
                      description: "Bootstrapping a SaaS in public."
                      followers_count: 4210
                      following_count: 388
                      verified: true
                    metrics:
                      likes: 142
                      replies: 18
                      reposts: 9
                      bookmarks: 27
                      impressions: 21400
                    media: []
                has_more: true
                feed: { id: "feed_kw_1", name: "Bootstrapped SaaS", type: keywords }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/FeedNotFound" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/engage/mentions:
    get:
      tags: [Engage]
      operationId: getMentions
      summary: Get mentions of the account
      description: |
        The posts that @-mention the selected account right now, newest first
        (or ranked by engagement with `sort=top`), each with the post it
        replies to and one further level of ancestry.

        This reads X live rather than SuperX's stored posts, and one call
        walks several upstream pages plus the parent posts, so it charges a
        flat 3 units of the plan's feed bucket. Read a page and work from it
        rather than polling.

        By default, mentions the account has already replied to on X are left
        out. `include_replied=true` keeps them and sets `replied` on each one.
        `mention_type` separates a direct reply to one of the account's posts
        (`reply`) from any other @-mention (`mention`).

        Paging is by cursor: pass `pagination.next_cursor` back as `cursor`.

        The app's Mentions tab also hides posts you skipped or blocked there.
        That list is a UI preference stored with the app, so it is not applied
        here: the API returns every mention and lets you filter your own way.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: cursor
          in: query
          description: next_cursor from the previous page. Omit for the first page.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, top]
            default: latest
        - name: include_replied
          in: query
          description: Keep mentions already replied to, flagged with `replied`.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of mentions.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MentionPost" }
                  pagination: { $ref: "#/components/schemas/CursorPagination" }
              example:
                data:
                  - id: "2097720536478446009"
                    text: "@robj3d3 how do you handle the scheduling side of this?"
                    created_at: "2026-09-09T16:15:24.000Z"
                    url: "https://x.com/activefan/status/2097720536478446009"
                    author:
                      id: "44196397001234567"
                      username: "activefan"
                      name: "Sam Porter"
                      description: "Building in public."
                      followers_count: 3120
                      following_count: 480
                      verified: false
                    metrics:
                      likes: 4
                      replies: 1
                      reposts: 0
                      bookmarks: 0
                      impressions: 940
                    media: []
                    mention_type: reply
                    parent_post:
                      id: "2097710000000000000"
                      text: "Here is how the queue works."
                      created_at: "2026-09-09T15:02:00.000Z"
                      author:
                        id: "1178367350552305665"
                        username: "robj3d3"
                        name: "Rob Hallam"
                        avatar_url: "https://pbs.twimg.com/profile_images/example_400x400.jpg"
                pagination:
                  has_more: true
                  next_cursor: "DAADDAABCgABF..."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "409": { $ref: "#/components/responses/ProfileNotSynced" }
        "429": { $ref: "#/components/responses/FeedRateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/engage/reply-draft:
    post:
      tags: [Engage]
      operationId: draftEngageReply
      summary: Draft one reply to a post
      description: |
        Writes ONE reply draft in the account's own voice, using the same
        engine, prompts and voice settings as the Generate Reply button in the
        SuperX app.

        **The draft is text. A person posts it.** No endpoint in this API
        posts a reply, and this one does not either: it returns wording for
        someone to read, edit and send from X or from the SuperX app. Sending
        replies that read as inauthentic can get an X account suspended under
        X's inauthentic-behavior rules and a SuperX account terminated. AI
        output must be reviewed and meaningfully edited by a person before it
        is posted.

        Name the post exactly one of two ways:

        - `post_id` reads the post LIVE, so the draft sees the real text, the
          real author and the quoted post if there is one. That read costs one
          live lookup on top of the credit, from the same allowance the
          `/v1/x/*` endpoints use.
        - `post` supplies the text (and optionally the author) yourself, and
          nothing is read live.

        Add `conversation` (oldest first) when the post sits in a thread, and
        `quoted_post` when it quotes something you already have. `thoughts` is
        what the person wants the reply to convey: ask them for it rather than
        inventing an opinion on their behalf. `tone` picks the register.

        Costs AI credits, measured from the models' real cost and typically 2
        (the reply write plus the shared post-editor pass that runs after it).
        Needs a key with the `write` scope. Accounts shared with you work
        here: the draft changes nothing on the account, and the credits come
        from the key owner's pool.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyDraftRequest" }
            examples:
              by_post_id:
                summary: Read the post live
                value:
                  post_id: "1899000000000000000"
                  thoughts: "agree, and we saw the same thing after switching onboarding"
                  tone: concise
              by_text:
                summary: Supply the post yourself
                value:
                  post:
                    text: "Most founders think they have a traffic problem."
                    author_name: "Pieter Levels"
                    author_handle: "levelsio"
                  tone: engaging
      responses:
        "200":
          description: The reply draft.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reply:
                        type: string
                        description: The draft reply. Nothing was posted or sent.
                      post_id:
                        type: [string, 'null']
                        description: The post replied to, when you named one by id.
                      author_handle:
                        type: [string, 'null']
                        description: The author replied to, without the @, when it is known.
                  meta: { $ref: "#/components/schemas/ToolMeta" }
                  note:
                    type: string
              example:
                data:
                  reply: "had the exact same thing, it was positioning the whole time"
                  post_id: "1899000000000000000"
                  author_handle: "levelsio"
                meta:
                  credits_charged: 2
                  account_id: "1178367350552305665"
                note: "The draft is text. Nothing is posted or sent; a person reviews and posts it."
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: No public post with that id, or it is protected or deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: post_not_found
                  message: "No public post with that id."
        "422":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The post was read but carries no text to reply to. Supply the text yourself with `post`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: post_has_no_text
                  message: "That post carries no text to reply to. Supply the text yourself with `post` instead."
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/media:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Presign an image upload
      description: |
        Registers an image upload and returns a presigned `upload_url`. PUT
        the raw file bytes to `upload_url` within 20 minutes, with the
        `Content-Type` header set to the same `file_type` you declared here.
        Then reference the returned `object_key` in `parts[].media` on the
        scheduled-posts create/update endpoints.

        Images only: `image/jpeg`, `image/png`, `image/webp` (5 MB max each)
        and `image/gif` (15 MB max). The attach step re-checks the real bytes
        (size and magic-byte type), so a mismatched upload fails at attach
        time. Uploads never attached to a post are deleted after 24 hours.

        Needs the write scope. Quota: 100 uploads per key per day, on top of
        the normal write rate limits. No `Idempotency-Key` handling: a
        duplicate presign is just an unused upload that expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, file_type, size]
              properties:
                filename:
                  type: string
                  description: Original filename; sanitized into the object key.
                file_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/gif]
                size:
                  type: integer
                  description: File size in bytes. 5 MB max (15 MB for GIF).
            example:
              filename: "chart.png"
              file_type: "image/png"
              size: 48213
      responses:
        "201":
          description: The registered upload and its presigned PUT URL.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      object_key:
                        type: string
                        description: Pass this in `parts[].media` when creating or editing a post.
                      url:
                        type: string
                        description: The public URL the file will have once uploaded.
                      upload_url:
                        type: string
                        description: Presigned PUT URL. Upload the raw bytes here with `Content-Type` equal to `file_type`.
                      expires_at:
                        type: string
                        format: date-time
                        description: When the upload_url stops working (20 minutes).
              example:
                data:
                  object_key: "u123/api_1751980800000_9f3a1c2b_chart.png"
                  url: "https://media.superx.so/u123/api_1751980800000_9f3a1c2b_chart.png"
                  upload_url: "https://<bucket-host>/u123/api_1751980800000_9f3a1c2b_chart.png?X-Amz-..."
                  expires_at: "2026-07-08T15:20:00.000Z"
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Invalid parameter, unsupported type (`unsupported_media_type`; videos land here), or over the size cap (`media_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: unsupported_media_type
                  message: "file_type must be one of: image/jpeg, image/png, image/webp, image/gif. Videos are not supported yet."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`) or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "429":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Write rate limit (`rate_limited`) or the daily media quota (`media_quota_exceeded`, 100/day). `Retry-After` indicates the wait.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: media_quota_exceeded
                  message: "Daily media upload limit reached (100/day). Retry after the indicated delay."
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Media storage is not configured (`media_not_configured`) or temporarily unavailable (`upstream_unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: media_not_configured
                  message: "Media storage is not configured on this server. Try again later."

  /v1/workers:
    get:
      tags: [Workers]
      operationId: listWorkers
      summary: List Workers
      description: |
        The account's Workers, newest first: the scheduled AI writers set up
        in the SuperX app, each with its voice, topic source, batch size,
        schedule and next run time.

        Read what they wrote with `GET /v1/workers/suggestions`. Workers are
        created, edited and run in the app, so there is no create or run
        endpoint here. Not paginated: how many Workers an account can hold is
        capped by its plan.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's Workers, created_at descending.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Worker" }
              example:
                data:
                  - id: 12
                    name: "Daily build in public"
                    status: "active"
                    voice_source: "my_voice"
                    voice_creator: null
                    topic_source: "product"
                    topic_config: { product_id: "aB3xWnA0kLpR7sVtYu3zc" }
                    style_instructions: null
                    use_account_rules: 1
                    format_collection: null
                    style_mode: "one_shot"
                    batch_size: 3
                    output_mode: "suggest"
                    schedule: "daily"
                    schedule_time: "09:00"
                    schedule_day: null
                    timezone: "Europe/London"
                    next_run_at: "2026-09-13T08:00:00.000Z"
                    created_at: "2026-08-01T10:00:00.000Z"
                    updated_at: "2026-09-01T10:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/workers/suggestions:
    get:
      tags: [Workers]
      operationId: listWorkerSuggestions
      summary: List Worker suggestions
      description: |
        The posts the account's Workers wrote, newest first. The default
        `status=to_review` is the app's "To review" queue: suggestions nobody
        has drafted, scheduled or dismissed yet.

        Each row carries the text, the Worker that wrote it, the timestamps of
        whatever has been done with it, and `post_id` once it was saved as a
        post (join it to `GET /v1/scheduled-posts`). `reference` says what kind
        of source the Worker wrote from; the Worker's own collection and
        reference ids stay private.

        Reading changes nothing and spends no AI credits. Act on a row with the
        draft, schedule or dismiss endpoints below.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: status
          in: query
          description: to_review (default) = waiting on a person; drafted, scheduled and dismissed = already acted on; all = every suggestion. A dismissed suggestion reads as dismissed even if it was saved first.
          schema:
            type: string
            enum: [to_review, drafted, scheduled, dismissed, all]
            default: to_review
        - name: worker_id
          in: query
          description: Narrow to one Worker by its numeric id (from `GET /v1/workers`). An unknown or foreign id returns 404 `worker_not_found`.
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of suggestions, generated_at descending.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkerSuggestion" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: 4821
                    worker_id: 12
                    text: "Three things we changed after watching ten people use the onboarding."
                    status: "to_review"
                    reference: { source: "collection" }
                    generated_at: "2026-09-12T08:00:00.000Z"
                    drafted_at: null
                    scheduled_at: null
                    dismissed_at: null
                    post_id: null
                  - id: 4818
                    worker_id: 12
                    text: "The onboarding rewrite doubled activation. Here is what we cut."
                    status: "drafted"
                    reference: null
                    generated_at: "2026-09-11T08:00:00.000Z"
                    drafted_at: "2026-09-11T09:14:00.000Z"
                    scheduled_at: null
                    dismissed_at: null
                    post_id: "V1StGXR8_Z5jdHi6B-myT"
                pagination: { page: 1, limit: 20, has_more: false, total: 2 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/WorkerNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AccountsUnavailable" }

  /v1/workers/suggestions/{id}/draft:
    post:
      tags: [Workers]
      operationId: draftWorkerSuggestion
      summary: Save a suggestion as a draft
      description: |
        Turn one Worker suggestion into a DRAFT post. Nothing is posted to X:
        the draft shows up in the user's Drafts in the app and at the top of
        `GET /v1/scheduled-posts?status=draft`, and the response gives you its
        `post_id` directly.

        The text is saved exactly as the Worker wrote it. To change the wording
        first, rewrite it with `POST /v1/posts/remix` or
        `POST /v1/tools/rephrase`, save your version with
        `POST /v1/scheduled-posts`, then dismiss the original.

        One suggestion can only be saved once: a second draft or schedule call
        on the same id returns 400 `already_saved`, and a dismissed one returns
        400 `already_dismissed`. Naturally one-shot, so there is no
        `Idempotency-Key` support. Works for your main account or any account
        linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - $ref: "#/components/parameters/SuggestionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              account_id: "1178367350552305665"
      responses:
        "200":
          description: The suggestion and the draft it became.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WorkerSuggestionDrafted" }
              example:
                data:
                  id: 4821
                  post_id: "V1StGXR8_Z5jdHi6B-myT"
                  drafted_at: "2026-09-12T09:14:00.000Z"
        "400": { $ref: "#/components/responses/SuggestionNotActionable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/SuggestionNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/workers/suggestions/{id}/schedule:
    post:
      tags: [Workers]
      operationId: scheduleWorkerSuggestion
      summary: Schedule a suggestion
      description: |
        Turn one Worker suggestion into a SCHEDULED post. The SuperX scheduler
        posts it at `scheduled_for`, the same as any other queued post, so
        confirm the time and the text with the user before you call this.

        Afterwards it is an ordinary scheduled post: retime it with
        `PATCH /v1/scheduled-posts/{id}` or cancel it with
        `DELETE /v1/scheduled-posts/{id}`, using the `post_id` in the response.

        A Worker post never inherits the account's Default Post Settings, only
        what you send here. One suggestion can only be saved once: a second
        call returns 400 `already_saved`, a dismissed one 400
        `already_dismissed`. Naturally one-shot, so there is no
        `Idempotency-Key` support. Works for your main account or any account
        linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - $ref: "#/components/parameters/SuggestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_for]
              properties:
                scheduled_for:
                  type: string
                  format: date-time
                  description: When to post it. UTC ISO-8601 with an explicit Z or offset, at least 60 seconds in the future.
                autoRetweet:
                  type: [object, 'null']
                  description: Auto Retweet settings for this post, in the composer's own shape. Omit to leave it off.
                autoPlug:
                  type: [object, 'null']
                  description: Auto Plug settings for this post, in the composer's own shape. Omit to leave it off.
                autoDelete:
                  type: [object, 'null']
                  description: Auto Delete settings for this post, in the composer's own shape. Omit to leave it off.
                enablePostingTwitter:
                  type: boolean
                  description: Post it to X. Omit to leave the account's own behaviour unchanged.
                enablePostingBsky:
                  type: boolean
                  description: Also cross-post it to Bluesky. Omit to leave the account's own behaviour unchanged.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              scheduled_for: "2026-09-15T14:00:00Z"
      responses:
        "200":
          description: The suggestion and the scheduled post it became.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WorkerSuggestionScheduled" }
              example:
                data:
                  id: 4821
                  post_id: "V1StGXR8_Z5jdHi6B-myT"
                  scheduled_at: "2026-09-12T09:14:00.000Z"
                  scheduled_for: "2026-09-15T14:00:00.000Z"
        "400": { $ref: "#/components/responses/SuggestionNotActionable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/SuggestionNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/workers/suggestions/{id}/dismiss:
    post:
      tags: [Workers]
      operationId: dismissWorkerSuggestion
      summary: Dismiss a suggestion
      description: |
        Drop one Worker suggestion out of the "To review" queue. No post is
        created and no post is removed: a suggestion already saved as a draft
        or a scheduled post keeps that post, which you delete separately with
        `DELETE /v1/scheduled-posts/{id}` if that is what the user wants.

        Dismissing is allowed on any suggestion the account owns, including one
        already saved, and it still reads back under
        `GET /v1/workers/suggestions?status=dismissed`. Naturally idempotent in
        effect, so there is no `Idempotency-Key` support. Works for your main
        account or any account linked to it (`account_id`); accounts shared
        with you are read-only.
      parameters:
        - $ref: "#/components/parameters/SuggestionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              account_id: "1178367350552305665"
      responses:
        "200":
          description: The dismissed suggestion.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WorkerSuggestionDismissed" }
              example:
                data:
                  id: 4821
                  dismissed_at: "2026-09-12T09:20:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/SuggestionNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/scheduled-posts:
    get:
      tags: [Scheduling]
      operationId: listScheduledPosts
      summary: List drafts and scheduled posts
      description: |
        The account's drafts and scheduled posts, most recently updated first,
        so page 1 is the newest work. Use `page` to walk back through older
        ones rather than raising `limit`. That ordering covers every `status`,
        not just drafts: scheduled and sent posts come back most recently
        updated first too.

        A `from` or `to` filter makes this a calendar query instead: those
        results come back in post-time order, oldest first, whatever the
        status.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: status
          in: query
          description: Comma list of statuses to include. Default is all four. `draft` also covers legacy board drafts stored under internal statuses; they come back as `"draft"`.
          schema:
            type: string
            example: "scheduled,draft"
        - name: tags
          in: query
          description: Comma list of tag ids (from `GET /v1/tags`). Returns posts carrying ANY of the listed tags.
          schema:
            type: string
            example: "V1StGXR8_Z5jdHi6B-myT"
        - name: from
          in: query
          description: Include posts scheduled at or after this UTC ISO-8601 time (explicit Z or offset required).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Include posts scheduled at or before this UTC ISO-8601 time (explicit Z or offset required).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: A page of scheduled posts and drafts.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduledPost" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "V1StGXR8_Z5jdHi6B-myT"
                    status: "scheduled"
                    scheduled_for: "2026-07-08T15:00:00.000Z"
                    parts:
                      - text: "Shipping day. Here is everything new in this release:"
                      - text: "1. A public API. Docs at docs.superx.so"
                    title: null
                    scratchpad: null
                    tags: []
                    created_at: "2026-07-06T09:30:00.000Z"
                  - id: "Fq2xWnA0kLpR7sVtYu3zc"
                    status: "draft"
                    scheduled_for: null
                    parts:
                      - text: "Rough idea: why most scheduling tools get threads wrong."
                    title: "Threads take"
                    scratchpad: null
                    tags:
                      - { id: "aB3xWnA0kLpR7sVtYu3zc", name: "Launch week", color: "amber" }
                    created_at: "2026-07-05T20:11:00.000Z"
                pagination: { page: 1, limit: 20, has_more: false, total: 2 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Scheduling]
      operationId: createScheduledPost
      summary: Create a draft or scheduled post, or publish now
      description: |
        Creates a post: a draft when `scheduled_for` is omitted, a scheduled
        post otherwise. Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only. Supports the
        `Idempotency-Key` header for safe retries (see the Idempotency guide).
        Successful creation returns `201`.

        **Publishing now.** Send `scheduled_for: "now"` and the post goes to X
        immediately. This is irreversible, so the rules are tighter:

        - `Idempotency-Key` is REQUIRED (`400 invalid_parameter` without it).
          Reuse the same key on any retry: it never publishes twice.
        - `title` and `scratchpad` are rejected with `400` (a published post
          has no draft to organize), and Bluesky is never cross-posted.
        - A retry that arrives while the first attempt is still publishing
          returns `409 idempotency_in_flight` with a `Retry-After` header.
          After that window the API checks whether the first attempt landed
          and replays its result instead of posting again.
        - The `201` carries `status: "sent"` with `posted_at`, `x_post_id`
          and `url`, and `scheduled_for: null`.
        - Advanced settings and Auto DM inherit your Default Post Settings
          exactly as they do for a scheduled post.
        - A thread that fails part way through leaves no scheduled-post record
          at all, so check `GET /v1/posts` before retrying: the parts X did
          accept are already live.

        Images attach per part: `parts[].media` is an array of
        `{ object_key, alt_text? }` items, with `object_key` from
        `POST /v1/media` (uploaded bytes required first). Up to 4 images or
        exactly 1 GIF per part; `alt_text` is capped at 1,000 characters.
        Video is not supported yet.

        Advanced settings (`auto_retweet`, `auto_delete`, `auto_plug`,
        `auto_dm`, `super_followers_only`): omit a setting to inherit its
        Default Post Settings value from the SuperX app, send an object (or
        `true`/`false` for `super_followers_only`) to override, or send
        `null` to turn it off for this post. Exactly five settings inherit
        this way: auto retweet, auto delete, auto plug, auto DM, and Super
        Followers only. Other composer defaults (for example Bluesky
        cross-posting or share-with-followers) are never applied to API
        posts.

        `auto_dm` direct-messages the people who reply to or repost the post
        once it is live. Your plan caps how many posts a month may carry one
        (`posts_with_auto_dm` in `GET /v1/dm/limits`): when that cap stops
        it, the post is still created and the response carries
        `auto_dm_skipped: true` instead of failing. Reading a post back shows
        that an auto DM is attached but never its message text.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Unique key (max 64 characters) for safe retries. Replays carry the
            "Idempotency-Replayed" response header set to "true". Keys are
            retained for 24 hours.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The post text (single post). Provide either `text` or `parts`.
                parts:
                  type: array
                  description: Thread parts, 1 to 25 items. Total text across parts is limited to 25,000 characters.
                  items:
                    type: object
                    required: [text]
                    properties:
                      text:
                        type: string
                      media:
                        type: array
                        maxItems: 4
                        description: Images for this part (up to 4, or exactly 1 GIF). `object_key` from `POST /v1/media`.
                        items:
                          type: object
                          required: [object_key]
                          properties:
                            object_key:
                              type: string
                            alt_text:
                              type: string
                              maxLength: 1000
                              description: Accessibility description delivered to X with the image.
                scheduled_for:
                  description: >-
                    UTC ISO-8601 with explicit Z or offset: at least 60
                    seconds in the future, at most 18 months out. Omit to
                    create a draft. The literal string `"now"` publishes to X
                    immediately and requires an `Idempotency-Key` (see the
                    operation description).
                  oneOf:
                    - type: string
                      format: date-time
                    - type: string
                      enum: ["now"]
                title:
                  type: string
                  maxLength: 300
                  description: Draft title shown in the SuperX app. Organizational only, never posted.
                scratchpad:
                  type: string
                  maxLength: 30000
                  description: Private working notes attached to the post. Never posted.
                tags:
                  type: array
                  maxItems: 20
                  description: Tag ids to assign (from `GET /v1/tags`). Unknown ids fail the whole request with `400 unknown_tag` before anything is created.
                  items:
                    type: string
                auto_retweet:
                  type: [object, 'null']
                  description: Auto retweet. Omit to inherit your Default Post Settings; `null` turns it off for this post.
                  required: [after_hours]
                  properties:
                    after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Retweet the post this many hours after it goes live.
                    remove_after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Remove the retweet this many hours later. Omit to keep it.
                auto_delete:
                  type: [object, 'null']
                  description: Auto delete underperforming posts. Omit to inherit your defaults; `null` turns it off for this post.
                  required: [after_hours]
                  properties:
                    after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Delete the post this many hours after it goes live if it is under the views threshold.
                    threshold:
                      type: integer
                      minimum: 0
                      description: Views threshold (default 1000).
                auto_plug:
                  type: [object, 'null']
                  description: "Auto plug: reply with a template once the post hits a likes threshold. Omit to inherit your defaults; `null` turns it off for this post. Unknown template ids fail with `400 unknown_plug_template`."
                  required: [template_id, threshold]
                  properties:
                    template_id:
                      type: string
                      description: Plug template id (from `GET /v1/plug-templates`).
                    threshold:
                      type: integer
                      minimum: 1
                      description: Likes threshold that triggers the plug reply.
                auto_dm:
                  allOf:
                    - $ref: "#/components/schemas/AutoDm"
                  description: "Auto DM: message the people who reply to or repost this post once it is live. Omit to inherit your defaults; `null` turns it off for this post."
                super_followers_only:
                  type: boolean
                  description: Post to Super Followers only. Omit to inherit your defaults.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            examples:
              single:
                summary: One scheduled post
                value:
                  text: "Shipping day."
                  scheduled_for: "2026-07-08T15:00:00Z"
              thread:
                summary: A thread draft
                value:
                  parts:
                    - text: "Why most scheduling tools get threads wrong:"
                    - text: "They treat a thread as one blob of text instead of parts."
              organized:
                summary: A draft with title and tags
                value:
                  text: "Rough cut of the launch teaser."
                  title: "Launch teaser v1"
                  tags: ["V1StGXR8_Z5jdHi6B-myT"]
              with_image:
                summary: A scheduled post with an image
                value:
                  parts:
                    - text: "Chart of the week."
                      media:
                        - object_key: "u123/api_1751980800000_9f3a1c2b_chart.png"
                          alt_text: "Line chart of weekly revenue trending up"
                  scheduled_for: "2026-07-08T15:00:00Z"
              advanced:
                summary: Explicit advanced settings
                value:
                  text: "Shipping day."
                  scheduled_for: "2026-07-08T15:00:00Z"
                  auto_retweet: { after_hours: 6, remove_after_hours: 4 }
                  auto_plug: { template_id: "tpl_abc123", threshold: 50 }
                  auto_delete: null
              publish_now:
                summary: Publish immediately (Idempotency-Key required)
                value:
                  text: "Shipping now."
                  scheduled_for: "now"
      responses:
        "201":
          description: >-
            The created post (echo of the accepted request, not the stored
            row). Replayed idempotent requests also return this body with the
            "Idempotency-Replayed" header set to "true". Applied advanced
            settings, inherited or explicit, are NOT echoed here; read them
            back via GET /v1/scheduled-posts, adding `?status=sent` for a post
            published with `scheduled_for: "now"`.
          headers:
            Idempotency-Replayed:
              description: Present and "true" when this response was replayed from a previous request with the same Idempotency-Key.
              schema:
                type: string
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum: [draft, scheduled, sent]
                        description: '`sent` only for `scheduled_for: "now"`.'
                      scheduled_for:
                        type: [string, 'null']
                        format: date-time
                        description: 'Null for a draft and for a post published with `scheduled_for: "now"`.'
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            media:
                              type: array
                              description: Present only when the part carries media.
                              items:
                                type: object
                                properties:
                                  object_key:
                                    type: string
                                  url:
                                    type: string
                                  file_type:
                                    type: string
                                  size:
                                    type: [integer, 'null']
                                  alt_text:
                                    type: [string, 'null']
                      title:
                        type: [string, 'null']
                      scratchpad:
                        type: [string, 'null']
                      tags:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            color:
                              type: string
                      created_at:
                        type: string
                        format: date-time
                      posted_at:
                        type: [string, 'null']
                        format: date-time
                        description: 'When the post went out. Present only for `scheduled_for: "now"`.'
                      x_post_id:
                        type: [string, 'null']
                        description: 'The X post id. Present only for `scheduled_for: "now"`.'
                      url:
                        type: [string, 'null']
                        description: 'Permalink to the post on X. Present only for `scheduled_for: "now"`.'
                      auto_dm_skipped:
                        type: boolean
                        description: >-
                          Present (and true) only when a plan limit stripped
                          the inherited Auto DM from this post. Absent
                          otherwise, and always absent from a result the API
                          recovered after an interrupted publish (the flag is
                          not stored on the post), so treat its absence as
                          "unknown" on a retried request.
              example:
                data:
                  id: "V1StGXR8_Z5jdHi6B-myT"
                  status: "scheduled"
                  scheduled_for: "2026-07-08T15:00:00.000Z"
                  parts:
                    - text: "Shipping day."
                  title: null
                  scratchpad: null
                  tags: []
                  created_at: "2026-07-06T10:00:00.000Z"
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: >-
            Invalid parameter, invalid request, unknown tag id (`unknown_tag`),
            unknown plug template id (`unknown_plug_template`),
            or a media problem: unknown or foreign `object_key`
            (`invalid_media`), bytes never uploaded (`media_not_uploaded`),
            not a supported image (`unsupported_media_type`), or over the size
            cap (`media_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: invalid_media
                  message: "Unknown object_key: u123/api_..._chart.png. Upload media first via POST /v1/media."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: |
            Read-only key (`insufficient_scope`), an account shared with you
            (`writes_main_account_only`; shared accounts are read-only through
            the API, your own linked accounts are not), onboarding not finished
            (`onboarding_required`), post quota used up
            (`post_quota_exceeded`), the connected X account needing to be
            re-authorized in the SuperX app (`reauth_required`, publishing
            only), or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: writes_main_account_only
                  message: "Accounts shared with you are read-only through the API. Writes work on your own main and linked accounts."
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "409":
          description: >-
            The Idempotency-Key was already used with a different request body
            (`idempotency_key_reuse`); or, when publishing now, an earlier
            request with the same key is still publishing
            (`idempotency_in_flight`, with a `Retry-After` header: wait, then
            retry the SAME key) or the post has already been published
            (`post_already_published`).
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Retry-After:
              description: Seconds to wait before retrying, on `idempotency_in_flight`.
              schema:
                type: integer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: idempotency_key_reuse
                  message: "This Idempotency-Key was already used with a different request body."
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/scheduled-posts/bulk/retime:
    post:
      tags: [Scheduling]
      operationId: bulkRetimeScheduledPosts
      summary: Retime queued posts in bulk
      description: |
        Moves up to 500 queued posts to new times in ONE transaction: either
        every move lands or none do.

        Only posts in the queue move. Drafts, sent posts and error rows are
        counted in `skipped` and are never retimed. Each `scheduled_for`
        follows the same window as a single create: at least 60 seconds in the
        future, at most 18 months out.

        Costs one write. `Idempotency-Key` is not supported and not needed:
        re-running the same moves converges on the same result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moves]
              properties:
                moves:
                  type: array
                  minItems: 1
                  maxItems: 500
                  description: The moves to apply. Post ids must be unique within one call.
                  items:
                    type: object
                    required: [id, scheduled_for]
                    properties:
                      id:
                        type: string
                        description: Post id (from `GET /v1/scheduled-posts`).
                      scheduled_for:
                        type: string
                        format: date-time
                        description: New time, UTC ISO-8601 with explicit Z or offset.
                account_id:
                  type: string
                  description: Any account you own. An account shared with you returns `403 writes_main_account_only`.
            example:
              moves:
                - id: "V1StGXR8_Z5jdHi6B-myT"
                  scheduled_for: "2026-09-08T15:00:00Z"
                - id: "Fq2xWnA0kLpR7sVtYu3zc"
                  scheduled_for: "2026-09-08T18:30:00Z"
      responses:
        "200":
          description: How many posts moved and how many were skipped.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                      skipped:
                        type: integer
              example:
                data: { updated: 2, skipped: 0 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/scheduled-posts/bulk/auto-retweet:
    post:
      tags: [Scheduling]
      operationId: bulkEnableAutoRetweet
      summary: Enable auto retweet on queued posts in bulk
      description: |
        Turns Auto Retweet on for up to 100 queued posts at once.

        A post that already carries its own auto retweet is counted in
        `skipped` and left untouched: this never overwrites a per-post
        setting. Only posts in the queue are changed, so drafts, sent posts
        and error rows are counted in `skipped` too. `failed` counts posts
        whose stored settings could not be read.

        Worth knowing: posts created through the API inherit the account's
        Default Post Settings, so if Auto Retweet is on there, every API post
        already carries one and this endpoint reports them all as `skipped`.
        To bulk-apply a different auto retweet, create the posts with
        `auto_retweet: null` (or clear each one with
        `PATCH /v1/scheduled-posts/{id}`) first.

        Costs one write. `Idempotency-Key` is not supported and not needed:
        a second run skips everything the first one set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, auto_retweet]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Post ids (from `GET /v1/scheduled-posts`). Repeated ids are deduplicated.
                  items:
                    type: string
                auto_retweet:
                  type: object
                  required: [after_hours]
                  description: The auto retweet to apply to every listed post.
                  properties:
                    after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Retweet each post this many hours after it goes live.
                    remove_after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                      description: Remove the retweet this many hours later. Omit to keep it.
                account_id:
                  type: string
                  description: Any account you own. An account shared with you returns `403 writes_main_account_only`.
            example:
              ids: ["V1StGXR8_Z5jdHi6B-myT", "Fq2xWnA0kLpR7sVtYu3zc"]
              auto_retweet: { after_hours: 6, remove_after_hours: 4 }
      responses:
        "200":
          description: How many posts were changed, skipped and failed.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                      skipped:
                        type: integer
                      failed:
                        type: integer
              example:
                data: { updated: 1, skipped: 1, failed: 0 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/scheduled-posts/bulk/delete:
    post:
      tags: [Scheduling]
      operationId: bulkDeleteScheduledPosts
      summary: Delete queued posts in bulk
      description: |
        Deletes up to 100 QUEUED posts at once and refunds their post quota.
        `POST`, not `DELETE`, because the ids travel in a body.

        Only posts in the queue are deleted: a leaked id for a sent post
        cannot wipe history, and drafts are left alone (delete those with
        `DELETE /v1/scheduled-posts/{id}`). `deleted` can therefore be lower
        than the number of ids you sent.

        Costs one write. `Idempotency-Key` is not supported and not needed:
        deleting an already-deleted id is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Post ids (from `GET /v1/scheduled-posts`). Repeated ids are deduplicated.
                  items:
                    type: string
                account_id:
                  type: string
                  description: Any account you own. An account shared with you returns `403 writes_main_account_only`.
            example:
              ids: ["V1StGXR8_Z5jdHi6B-myT", "Fq2xWnA0kLpR7sVtYu3zc"]
      responses:
        "200":
          description: How many posts were deleted.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
              example:
                data: { deleted: 2 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/scheduled-posts/{id}:
    patch:
      tags: [Scheduling]
      operationId: updateScheduledPost
      summary: Edit a draft or scheduled post
      description: |
        Partial update: only the fields you send change; everything else on
        the post (including fields the API does not expose) is preserved.
        Works for your main account or any account linked to it
        (`account_id`); accounts shared with you are read-only.

        Status transitions are explicit: sending `scheduled_for` alone never
        schedules a draft. Set `status` to `"scheduled"` to promote (needs a
        future time, provided or already stored: at least 60 seconds ahead,
        at most 18 months) or `"draft"` to pull a post back out of the queue.
        Both directions ride the normal post-quota deduct/refund.

        `parts` is a FULL replace, media included: a part sent without
        `media` drops any media it carried. Re-include the current
        `object_key`s (visible on GET responses) to keep them, add new ones
        from `POST /v1/media`, or omit `parts` entirely to edit only
        title/scratchpad/time/status without touching text or media.
        No `Idempotency-Key` handling: PATCH is naturally idempotent.
        Concurrent edits are last-write-wins.

        Advanced settings (`auto_retweet`, `auto_delete`, `auto_plug`,
        `auto_dm`, `super_followers_only`) use the same shapes as create but
        never inherit defaults on update: provided = override, omitted = keep
        the post's current setting, `null` = remove it. `auto_dm: null` also
        gives back the month's posts-with-auto-DM slot; setting one consumes
        a slot.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Replacement text (single post). Provide either `text` or `parts`, not both.
                parts:
                  type: array
                  description: Replacement parts (full replace, media included), 1 to 25 items, 25,000 characters total. A part without `media` drops the media it carried.
                  items:
                    type: object
                    required: [text]
                    properties:
                      text:
                        type: string
                      media:
                        type: array
                        maxItems: 4
                        description: Images for this part (up to 4, or exactly 1 GIF). Re-list existing `object_key`s to keep them; new ones come from `POST /v1/media`.
                        items:
                          type: object
                          required: [object_key]
                          properties:
                            object_key:
                              type: string
                            alt_text:
                              type: string
                              maxLength: 1000
                scheduled_for:
                  type: string
                  format: date-time
                  description: New time, UTC ISO-8601 with explicit Z or offset. On its own it never promotes a draft.
                status:
                  type: string
                  enum: [draft, scheduled]
                  description: Explicit transition. `scheduled` requires a future time (via `scheduled_for` or already stored).
                title:
                  type: [string, 'null']
                  maxLength: 300
                  description: New title; `null` clears it.
                scratchpad:
                  type: [string, 'null']
                  maxLength: 30000
                  description: New notes; `null` clears them.
                tags:
                  type: array
                  maxItems: 20
                  description: Full replacement tag id set. `[]` clears all tags. Unknown ids fail with `400 unknown_tag`.
                  items:
                    type: string
                auto_retweet:
                  type: [object, 'null']
                  description: Auto retweet override; `null` removes it. Omit to keep the current setting.
                  required: [after_hours]
                  properties:
                    after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                    remove_after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                auto_delete:
                  type: [object, 'null']
                  description: Auto delete override; `null` removes it. Omit to keep the current setting.
                  required: [after_hours]
                  properties:
                    after_hours:
                      type: integer
                      minimum: 1
                      maximum: 12
                    threshold:
                      type: integer
                      minimum: 0
                      description: Views threshold (default 1000).
                auto_plug:
                  type: [object, 'null']
                  description: Auto plug override; `null` removes it. Omit to keep the current setting. Unknown template ids fail with `400 unknown_plug_template`.
                  required: [template_id, threshold]
                  properties:
                    template_id:
                      type: string
                      description: Plug template id (from `GET /v1/plug-templates`).
                    threshold:
                      type: integer
                      minimum: 1
                auto_dm:
                  allOf:
                    - $ref: "#/components/schemas/AutoDm"
                  description: "Auto DM override; `null` removes it and gives back the month's slot. Omit to keep the current setting. When a plan limit stops a new one from attaching, the edit still lands and the response carries `auto_dm_skipped: true`."
                super_followers_only:
                  type: boolean
                  description: Post to Super Followers only. Omit to keep the current setting.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            examples:
              retitle:
                summary: Change only the title
                value:
                  title: "Launch teaser v2"
              remove_auto_retweet:
                summary: Remove the post's auto retweet
                value:
                  auto_retweet: null
              promote:
                summary: Promote a draft to the queue
                value:
                  scheduled_for: "2026-08-01T15:00:00Z"
                  status: "scheduled"
              retag:
                summary: Replace the tag set
                value:
                  tags: ["V1StGXR8_Z5jdHi6B-myT"]
      responses:
        "200":
          description: The full updated post.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/ScheduledPost"
                      - type: object
                        properties:
                          auto_dm_skipped:
                            type: boolean
                            description: >-
                              Present (and true) only when a plan limit
                              stopped this edit from attaching an Auto DM.
                              The edit itself landed; the post simply carries
                              no Auto DM.
              example:
                data:
                  id: "Fq2xWnA0kLpR7sVtYu3zc"
                  status: "draft"
                  scheduled_for: null
                  parts:
                    - text: "Rough idea: why most scheduling tools get threads wrong."
                  title: "Launch teaser v2"
                  scratchpad: null
                  tags: []
                  created_at: "2026-07-05T20:11:00.000Z"
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: >-
            Invalid parameter, unknown tag id (`unknown_tag`), unknown plug
            template id (`unknown_plug_template`), a missing future
            time for `status:"scheduled"`, or a media problem: unknown or
            foreign `object_key` (`invalid_media`), bytes never uploaded
            (`media_not_uploaded`), not a supported image
            (`unsupported_media_type`), or over the size cap
            (`media_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: invalid_media
                  message: "Unknown object_key: u123/api_..._chart.png. Upload media first via POST /v1/media."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: No scheduled post with that id belongs to this account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: not_found
                  message: "No scheduled post with that id belongs to this account."
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The post is not editable (already sent or errored).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: post_not_editable
                  message: "Only drafts and scheduled posts can be edited."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [Scheduling]
      operationId: deleteScheduledPost
      summary: Delete a draft or scheduled post
      description: Deletes the post and refunds any quota it held. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Deleted.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
              example:
                data:
                  id: "V1StGXR8_Z5jdHi6B-myT"
                  deleted: true
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
