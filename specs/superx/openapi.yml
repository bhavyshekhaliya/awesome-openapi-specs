        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: >-
        The feed id is not one of your Engage feeds (`feed_not_found`), the
        feed points at a contact list that no longer exists
        (`list_not_found`), or account_id is not one of your accounts
        (`account_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: feed_not_found
              message: "No Engage feed with that id belongs to this account."

    FeedSourceNotFound:
      headers:
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
      description: >-
        The feed's source could not be resolved: the X list is private,
        deleted, or never existed (`x_list_not_found`), the `list_id` is not
