          description: The article is not scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: article_not_scheduled
                  message: "Only scheduled articles can be unscheduled."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/articles/{id}/cover:
    post:
      tags: [Articles]
      operationId: generateArticleCover
      summary: Generate an AI cover image
      description: |
        Generates a 2.5:1 cover image from the article's TITLE (a title is required) and, by default, attaches it as the article's cover. `attach: false` generates without touching the current cover; attach later via PATCH `cover_url`. Steer the artwork with `style_id` (one of the account's saved styles, from `GET /v1/cover-styles`) or `style_text` (a one-off description, max 8000 chars) - sending BOTH is a 400, so the request always says exactly which look was rendered. An unknown `style_id` returns 404 `cover_style_not_found`.

        Slow (60-100 seconds) and paid: a FLAT 25 AI credits per generation on this API, whatever the render actually costs, reported in `meta.credits_charged` and the `X-Credits-Charged` header. The account's daily and monthly cover caps apply on top and are enforced server-side; cap 429s carry `remaining_day` / `remaining_month` / `limit_day` / `limit_month`, and a credit 429 carries `credits_required` / `credits_remaining` / `reset_at`.

        A generation that fails outright is refunded in full. A `504` is different: the render may well have completed and landed in the article's cover history, so the 25 credits stay charged and you should read the article before retrying.

        Supports `Idempotency-Key`, recommended. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                style_id:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: A saved cover style id from `GET /v1/cover-styles`. Not accepted together with style_text.
                style_text:
                  type: string
                  maxLength: 8000
                  description: Optional one-off style description steering the artwork. Not accepted together with style_id.
                attach:
                  type: boolean
                  default: true
                account_id: { type: string }
            example:
              style_text: "dark, minimal, geometric"
      responses:
        "200":
          description: The generated cover.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Charged: { $ref: "#/components/headers/X-Credits-Charged" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cover:
                        type: object
                        properties:
                          url: { type: string }
                      attached:
                        type: boolean
                        description: Whether the cover was attached to the article.
                      remaining_day: { type: [integer, 'null'] }
                      remaining_month: { type: [integer, 'null'] }
                  meta:
                    type: object
                    properties:
                      credits_charged:
                        type: integer
                        description: Always 25. A generation is a flat price on this API.
              example:
                data:
                  cover: { url: "https://media.superx.so/covers/example.jpg" }
                  attached: true
                  remaining_day: 3
                  remaining_month: 11
                meta:
                  credits_charged: 25
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an account shared with you (`writes_main_account_only`; shared accounts are read-only through the API, your own linked accounts are not), cover generation disabled (`feature_disabled`), or a lapsed subscription.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "404": { $ref: "#/components/responses/ArticleOrCoverStyleNotFound" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: A cover is already being generated for this article (`cover_gen_in_progress`), or the Idempotency-Key was reused with a different body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: cover_gen_in_progress
                  message: "A cover is already being generated for this article. Try again once it finishes."
        "429":
          description: Rate limited, generation caps reached (`cover_gen_cap_daily` / `cover_gen_cap_monthly` with counters), or AI credits exhausted (`ai_credits_exhausted`, with the credit counters and `Retry-After`).
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CreditExhaustedError"
                  - $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                cap_reached:
                  summary: Daily generation cap
                  value:
                    error:
                      code: cover_gen_cap_daily
                      message: "The daily cover generation cap has been reached."
                      remaining_day: 0
                      remaining_month: 7
                      limit_day: 6
                      limit_month: 13
                credits_exhausted:
                  summary: Credit pool empty
                  value:
                    error:
                      code: ai_credits_exhausted
                      message: "Not enough AI credits for a cover generation."
                      credits_required: 25
                      credits_remaining: 4
                      reset_at: 1790812800
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: AMBIGUOUS timeout. The render may still have completed. GET the article to check its cover before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: upstream_timeout
                  message: "Cover generation did not respond in time and may still have completed. The 25 credits stay charged; GET the article to check its cover before retrying."

