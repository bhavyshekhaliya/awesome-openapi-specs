  /v1/contacts/{id}/notes:
    get:
      tags: [Audience]
      operationId: listContactNotes
      summary: List notes on a contact
      description: |
        The private notes this account has written about one person, newest
        first. Notes live inside SuperX and are never posted anywhere. Not
        paginated: notes are per-contact and few.

        Works for any X id the account already has a note on, whether or not
        that person is still one of its contacts; an id with no notes returns
        an empty array, not a 404. Only creating a note requires a known
        contact.
      parameters:
        - name: id
          in: path
          required: true
          description: The person's numeric X user id.
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The contact's notes.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactNote" }
              example:
                data:
                  - id: "n1a2b3c4d5e6f7g8h9i0j"
                    body: "Met at the SaaS meetup. Wants a demo in September."
                    created_at: "2026-08-14T16:20:00.000Z"
                    updated_at: "2026-08-14T16:20:00.000Z"
                    created_by:
                      x_user_id: "44196397"
                      username: "yourhandle"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Audience]
      operationId: createContactNote
      summary: Add a note to a contact
      description: |
        Write a private note about one person. The note is attributed to the
        account it was written as (`created_by`), which for an API write is the
        account named by `account_id` (your main account when omitted).

        Creating a note requires a KNOWN contact: the id must be one of the
        account's engagers, contact-list members or signal leads, so an id
        outside that set returns 404 `contact_not_found`. This is the only
        note operation with that restriction - reading, editing and deleting
        work on any id the account already has a note on.

        No `Idempotency-Key`: notes have no uniqueness constraint, so a replay
        creates a second note. Duplicates are visible in the list read and
        deletable. Works for your main account or any account linked to it;
        accounts shared with you are read-only. Needs the write scope.
      parameters:
        - name: id
          in: path
          required: true
          description: The person's numeric X user id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
