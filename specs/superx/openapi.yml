  /v1/signals/icp/expand-from-url:
    post:
      tags: [Signals]
      operationId: expandIcpFromUrl
      summary: Build an audience profile from a website
      description: |
        Reads a product or company website and infers who its ideal customers
        are on X: an audience description, the scoring rubric, and
        keyword-watch ideas, in one call. A bare domain is accepted.

        Free: no AI credits. The page read runs on the account's allowance of
        20 page reads a day, shared with the SuperX app, so an exhausted
        allowance returns `429 ai_action_limited` with `scope: "account"`.
        Unlike the two helpers above, this one goes through the SuperX app,
        so the app's short-term limiter binds it too: more than 10 calls in
        10 minutes returns `429 rate_limited`, which clears in about a
        minute. Takes up to a minute.

        Nothing is created, but the call needs a key with the `write` scope,
        as every non-GET route on this API does. Pass `icp_description` to
        `POST /v1/signals/agents` as the agent's ICP, and the suggestions as
        its keywords.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2000
                  description: The website to read. A bare domain is accepted.
                account_id: { type: string }
            example:
              url: "superx.so"
      responses:
        "200":
          description: The inferred audience description, rubric and keyword ideas.
