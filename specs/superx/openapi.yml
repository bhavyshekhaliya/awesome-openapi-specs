        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/context/style-guide/regenerate:
    post:
      tags: [Context]
      operationId: regenerateStyleGuide
      summary: Rebuild the generated style guide
      description: |
        Rewrites the account's GENERATED style guide from its recent posts,
        the same way the Style Guide button on the SuperX app's Context page
        does. The result is exactly the `style_guide.generated` block
        `GET /v1/context` returns.

        Your manual overrides (`style_guide.audience_override` and
        `vocabulary_override`) are untouched and keep outranking the
        generated guide everywhere.

        Free: no AI credits are charged, so no `X-Credits-Charged` header is
        sent. `X-Credits-Remaining` and `X-Credits-Reset` still are.

        Three ceilings apply, all reported as `429 ai_action_limited`.
        Regeneration is limited to once an hour per account
        (`scope: "account"`; the hour runs from the last SUCCESSFUL run). An
        account with fewer than 5 recent posts stored in SuperX has them read
        live instead: that live read is limited to 3 attempts per account per
        day (`scope: "account"`, resets at midnight UTC) and also draws on the
        platform-wide fair-use ceiling shared by every account
        (`scope: "platform"`). An account with enough stored posts meets
        neither of the last two. Takes up to a minute.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: string }
      responses:
        "200":
          description: The rewritten style guide.
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generated: { $ref: "#/components/schemas/StyleGuideGenerated" }
                  meta:
                    type: object
                    properties:
                      account_id: { type: string }
              example:
                data:
                  generated:
                    audience: "Indie founders and solo builders shipping in public."
                    vocabulary: "Lowercase starts on ~70% of posts. Emojis on ~10%."
                    generated_at: "2026-09-10T12:00:00.000Z"
                meta:
                  account_id: "1178367350552305665"
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The account does not have enough recent posts to read a style from (`not_enough_posts`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: not_enough_posts
                  message: "This account needs at least 5 recent posts before a style guide can be written from them."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/context/products/{id}/scrape:
    post:
      tags: [Context]
      operationId: scrapeContextProduct
      summary: Refresh a product from its page
      description: |
        Re-reads a saved product's page and refreshes its stored name,
        description and details, the same way the SuperX app's Context page
        does. The url comes from the SAVED product, never from the request:
        change it with `PATCH /v1/context/products/{id}` first if it moved.

        Free: no AI credits are charged, so no `X-Credits-Charged` header is
        sent. The read runs on the account's allowance of 20 page reads a
        day, shared with the SuperX app, so an exhausted allowance returns
        `429 ai_action_limited` with `scope: "account"`. Takes up to a minute.

        Returns the refreshed product, with a new `last_scraped_at`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Numeric product id, from GET /v1/context.
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: string }
      responses:
        "200":
          description: The refreshed product.
          headers:
            X-Credits-Remaining: { $ref: "#/components/headers/X-Credits-Remaining" }
            X-Credits-Reset: { $ref: "#/components/headers/X-Credits-Reset" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ContextProduct" }
                  meta:
                    type: object
                    properties:
                      account_id: { type: string }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ContextWriteForbidden" }
        "404":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: No product with that id belongs to this account (`product_not_found`), or account_id is not one of your accounts (`account_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: product_not_found
                  message: "No product with that id belongs to this account."
        "422":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The product page could not be read (`scrape_failed`). The product is unchanged apart from the attempt being recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: scrape_failed
                  message: "This page could not be read. Check the product url and try again."
        "429": { $ref: "#/components/responses/AiActionLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/dm/campaigns:
    post:
      tags: [DMs]
      operationId: queueDmCampaign
      summary: Queue a DM campaign
      description: |
        Queues direct messages to up to 100 X users.

        NOTHING IS SENT BY THIS CALL. The messages go into the account's own
        DM queue, the same one the SuperX app fills, and the app's scheduler
        sends them within the account's daily and monthly DM limits. The 201
        is therefore COUNTS, not deliveries: read
        `GET /v1/dm/campaigns/{id}` to see what has actually gone out.

        `[name]`, `[first]` and `[handle]` in the message are filled in per
        recipient. A recipient may carry its own `message`, which wins over
        the shared one; when every recipient has one, the top-level `message`
        may be omitted.

        People this account already messaged in the last 24 hours are skipped
        and counted in `duplicates`, and the sending account is never
        messaged. `spread: false` (the default) queues only what today's
        remaining daily allowance holds and skips the rest; `spread: true`
        places the rest over the coming days, up to 30 days ahead.

        When EVERY recipient is skipped, nothing is queued: the answer is
        `200` with `data.id: null` and a note saying so, rather than a `201`
        carrying an id that would resolve to nothing.

        Costs no AI credits. It counts against the writes rate-limit bucket
        and against the account's own DM allowances
        (`GET /v1/dm/limits`). Takes up to 30 seconds.

        With an `Idempotency-Key`, the campaign id IS the reservation id, so a
        retry after a timeout converges on the same campaign instead of
        orphaning the rows the first attempt queued.

        You are responsible for these messages under X's rules on automation
        and unsolicited contact.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [x_user_id]
                    properties:
                      x_user_id:
                        type: string
                        pattern: "^[0-9]{1,25}$"
                        description: The recipient's X user id (digits).
                      handle:
                        type: string
                        maxLength: 15
                        description: The recipient's @handle, used to fill `[handle]`.
                      name:
                        type: string
                        maxLength: 100
                        description: The recipient's display name, used to fill `[name]` and `[first]`.
                      message:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        description: This recipient's own message, instead of the shared one.
                      source_post_id:
                        type: string
                        pattern: "^[0-9]{1,25}$"
                        description: The post this person was found on, so later imports of it can skip them.
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: The shared message. Required unless every recipient carries its own.
                spread:
                  type: boolean
                  default: false
                  description: "Spread what today's daily allowance cannot hold over the coming days instead of skipping it. Ignored when `GET /v1/dm/limits` reports `scheduling_enabled: false`; the overflow is then counted in `skipped`."
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              recipients:
                - x_user_id: "44196397"
                  handle: "levelsio"
                  name: "Pieter Levels"
              message: "Hey [first], loved your thread on shipping fast."
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Nothing was queued because every recipient was skipped. `data.id` is null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DmCampaign" }
                  note: { type: string }
              example:
                data:
                  id: null
                  queued: 0
                  queued_now: 0
                  scheduled: []
                  scheduled_total: 0
                  skipped: 2
                  duplicates: 2
                  remaining_this_month: 450
                note: "Every recipient was skipped (already queued in the last 24 hours, over quota, or the sender); nothing was queued."
        "201":
          description: The campaign was queued. Nothing has been sent.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
            Idempotency-Replayed:
              description: Present and "true" when this response was replayed from a previous request with the same Idempotency-Key.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DmCampaign" }
                  note:
                    type: string
                    description: A reminder that nothing was sent by this call.
              example:
                data:
                  id: "V1StGXR8_Z5jdHi6B-myT"
                  queued: 2
                  queued_now: 2
                  scheduled: []
                  scheduled_total: 0
                  skipped: 0
                  duplicates: 0
                  remaining_this_month: 448
                note: "Queued into your DM pipeline. Nothing is sent by this call; the scheduler sends within your daily and monthly limits. You are responsible for these messages under X's automation rules."
        "400":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: A parameter is invalid (`invalid_parameter`), or the account has no X account connected (`account_not_linked`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: account_not_linked
                  message: "This account has no X account connected, so it cannot send DMs."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The key is read-only (`insufficient_scope`), the account is shared with you (`writes_main_account_only`), the plan has no DM allowance (`dm_not_in_plan`), or the X account must be reconnected in the app (`reauth_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: dm_not_in_plan
                  message: "This account's plan does not include DM sending."
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: idempotency_key_reuse
                  message: "This Idempotency-Key was already used with a different request body."
        "429": { $ref: "#/components/responses/DmLimitReached" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/dm/campaigns/{id}:
    get:
      tags: [DMs]
      operationId: getDmCampaign
      summary: Read one DM campaign
      description: |
        The messages this campaign queued, with a count per status.
        `pending` has not gone out yet and can still be cancelled;
        `sending` is in flight and cannot be stopped.

        The rows ARE the campaign, so a campaign whose messages have all been
        cancelled returns `404 campaign_not_found`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The campaign.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      counts:
                        type: object
                        properties:
                          pending: { type: integer }
                          sending: { type: integer }
                          sent: { type: integer }
                          failed: { type: integer }
                          skipped: { type: integer }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DmQueueItem" }
              example:
                data:
                  id: "V1StGXR8_Z5jdHi6B-myT"
                  counts: { pending: 2, sending: 0, sent: 0, failed: 0, skipped: 0 }
                  items:
                    - id: "aZ7q2kR0pLmX"
                      campaign_id: "V1StGXR8_Z5jdHi6B-myT"
                      recipient:
                        x_user_id: "44196397"
                        handle: "levelsio"
                        name: "Pieter Levels"
                        avatar_url: null
                      message: "Hey Pieter, loved your thread on shipping fast."
                      template: "Hey [first], loved your thread on shipping fast."
                      status: "pending"
                      error: null
                      created_at: "2026-09-11T09:00:00.000Z"
                      scheduled_at: null
                      sent_at: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/CampaignNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    delete:
      tags: [DMs]
      operationId: cancelDmCampaign
      summary: Cancel a campaign's unsent messages
      description: |
        Deletes every message of this campaign still waiting to go out,
        queued-for-now and scheduled-for-a-later-day alike, and releases the
        monthly allowance they were holding.

        Messages already sent are untouched and cannot be recalled, and one
        the scheduler has already picked up (`sending`) cannot be stopped. A
        campaign that exists but has nothing left to cancel (everything
        already sent, failed or cancelled) answers `cancelled: 0`; an id that
        never queued anything on this account answers
        `404 campaign_not_found`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: How many unsent messages were cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      cancelled: { type: integer }
              example:
                data: { cancelled: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "404": { $ref: "#/components/responses/CampaignNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/dm/queue:
    get:
      tags: [DMs]
      operationId: listDmQueue
      summary: List the DM queue
      description: |
        The account's bulk DM rows, newest first: what is waiting, what went
        out and what failed. Rows queued in the SuperX app appear here too,
        with `campaign_id: null`.

        `meta.total` counts the rows matching your filters; `meta.pending` is
        the account's whole unsent count, the figure the app shows.
      parameters:
        - name: limit
          in: query
          required: false
          description: Rows per page, 1 to 200 (default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, sending, sent, failed, skipped]
        - name: campaign_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: A page of the DM queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DmQueueItem" }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      pending: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/dm/limits:
    get:
      tags: [DMs]
      operationId: getDmLimits
      summary: DM allowances and usage
      description: |
        The account's DM caps and how much of each is used. These are PLAN
        limits, not AI credits, and nothing here is charged.

        `monthly.committed` is the messages already queued and not yet sent:
        they are held against the monthly allowance until they go out or are
        cancelled. `posts_with_auto_dm` is the separate cap on how many
        scheduled posts a month may carry an `auto_dm`.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: The account's DM limits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/DmLimits" }
                  meta:
                    type: object
                    properties:
                      account_id: { type: string }
              example:
                data:
                  tier: "ultra"
                  monthly:
                    max: 500
                    used: 50
                    committed: 2
                    remaining: 448
                    reset_at: "2026-10-01T00:00:00.000Z"
                  daily_bulk: { max: 500, used: 2, remaining: 498 }
                  per_post_max: 100
                  posts_with_auto_dm: { max: 30, used: 1, remaining: 29 }
                  scheduled_ahead: 0
                  scheduling_enabled: true
                meta:
                  account_id: "1178367350552305665"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/queue-settings:
    get:
      tags: [Queue]
      operationId: getQueueSettings
      summary: Get queue settings
      description: >-
        The account's posting schedule: the predefined time slots the queue
        fills and the timezone they run in (the Edit Queue modal in the
        SuperX app). `slots` are `{ time, days }` entries with 0 = Sunday,
        sorted by time; `slot_count` is the total number of time and day
        pairs. `timezone_is_default` and `slots_are_default` are true when
        the account has never set that value and SuperX is using its own
        default. Works for your main account, a linked account, or an account
        shared with you.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The queue settings.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueSettings" }
              example:
                data:
                  timezone: "Europe/London"
                  timezone_is_default: false
                  slots:
                    - time: "09:00"
                      days: [1, 2, 3, 4, 5]
                    - time: "17:30"
                      days: [1, 3, 5]
                  slots_are_default: false
                  slot_count: 8
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    patch:
      tags: [Queue]
      operationId: updateQueueSettings
      summary: Update queue settings
      description: >-
        Changes the account's posting schedule. Send `slots`, `timezone`, or
        both; only what you send changes. `slots` is a FULL REPLACE (max 50
        entries, one per unique time, each with at least one weekday, 0 =
        Sunday); `[]` clears every predefined slot and leaves the queue
        all-custom.


        Changing `slots` also RE-FLOWS the queue the way the app does: a
        queued post sitting exactly on an occurrence of an old slot moves to
        the matching new occurrence (Nth old to Nth new), so deliberate gaps
        are preserved and hand-picked custom times stay put. Scheduled X
        Articles and chained quote posts never move. Changing only `timezone`
        never moves posts.


        `reflow.bailed: true` means the settings were saved but the queue was
        deliberately left untouched (a post had nowhere to land, or the move
        set was too large); the response then carries a `note`. Retrying the
        same request is safe and idempotent.


        Changing the timezone and the slots in one call usually moves nothing,
        because the existing posts were placed under the old timezone; to
        re-flow them, change the timezone first, then send the slots in a
        second call.


        This is a per-account write: pass `account_id` for any linked or
        shared account. Editor-permission shares CAN change queue settings.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slots:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/QueueSlot" }
                  description: Full replace of the predefined posting slots. `[]` clears them all.
                timezone:
                  type: string
                  maxLength: 64
                  description: IANA timezone name the slot times run in, for example `Europe/London`.
                account_id: { type: string }
            example:
              slots:
                - time: "09:00"
                  days: [1, 2, 3, 4, 5]
                - time: "17:30"
                  days: [1, 3, 5]
              timezone: "Europe/London"
      responses:
        "200":
          description: The updated settings plus what the reflow did.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/QueueSettings" }
                  reflow: { $ref: "#/components/schemas/ReflowSummary" }
                  note:
                    type: string
                    description: Present only when `reflow.bailed` is true.
              example:
                data:
                  timezone: "Europe/London"
                  timezone_is_default: false
                  slots:
                    - time: "09:00"
                      days: [1, 2, 3, 4, 5]
                    - time: "17:30"
                      days: [1, 3, 5]
                  slots_are_default: false
                  slot_count: 8
                reflow:
                  moved: 3
                  skipped: 0
                  bailed: false
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/QueueWriteForbidden" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags
      description: Tags organize drafts and scheduled posts. They are scoped to the workspace owner and shared across linked accounts. Sorted by name A-Z.
      responses:
        "200":
          description: All tags.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
              example:
                data:
                  - id: "aB3xWnA0kLpR7sVtYu3zc"
                    name: "Launch week"
                    color: "amber"
                    created_at: "2026-07-01T09:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      description: Names are unique per workspace. `color` is a palette name the SuperX app renders (rose, amber, lime, emerald, teal, cyan, blue, indigo, violet, fuchsia, slate, stone); it defaults to `blue`. Tags are workspace-wide, so this is a main-account write and any other `account_id` returns `403 writes_main_account_only`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                color:
                  type: string
                  minLength: 1
                  maxLength: 32
                  default: blue
                account_id:
                  type: string
                  description: Only your main account (the default when omitted). Tags are workspace-wide, so any other account you own returns `403 writes_main_account_only`.
            example:
              name: "Launch week"
              color: "amber"
      responses:
        "201":
          description: The created tag.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Tag" }
              example:
                data:
                  id: "aB3xWnA0kLpR7sVtYu3zc"
                  name: "Launch week"
                  color: "amber"
                  created_at: "2026-07-07T09:00:00.000Z"
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Read-only key (`insufficient_scope`), an `account_id` other than your main account (`writes_main_account_only`; tags are workspace-wide), or a lapsed subscription (legacy string envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorEnvelope"
                  - $ref: "#/components/schemas/LegacyErrorEnvelope"
              example:
                error:
                  code: insufficient_scope
                  message: "This API key is read-only. Create a key with the write scope to use this endpoint."
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: A tag with that name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: duplicate_name
                  message: "A tag with that name already exists."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/tags/{id}:
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: Rename or recolor a tag
      description: Provide `name` and/or `color`. Tags are workspace-wide, so this is a main-account write and any other `account_id` returns `403 writes_main_account_only`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                color:
                  type: string
                  minLength: 1
                  maxLength: 32
                account_id:
                  type: string
                  description: Only your main account (the default when omitted). Tags are workspace-wide, so any other account you own returns `403 writes_main_account_only`.
            example:
              name: "Launch"
              color: "violet"
      responses:
        "200":
