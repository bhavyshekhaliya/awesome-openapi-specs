              example:
                data:
                  rubric:
                    who: "Solo founders shipping a SaaS product in public"
                    needs: ["growing an audience while building", "launch distribution"]
                    disqualifiers: ["agency owners", "accounts that only repost"]
                    example_match: "building my SaaS in public, $2k MRR, shipping weekly"
                    example_non_match: "growth agency for SaaS brands, DM for rates"
        "400": { $ref: "#/components/responses/InvalidParameter" }
