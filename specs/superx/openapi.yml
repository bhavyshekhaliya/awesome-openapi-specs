  /v1/articles:
    get:
      tags: [Articles]
      operationId: listArticles
      summary: List articles
      description: Long-form X Articles for the selected account, newest-updated first. Article bodies do NOT appear in lists; fetch one article for its markdown body.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: status
          in: query
          description: "Comma list of statuses to include: draft, scheduled, publishing, published, failed. Omit for all."
          schema:
            type: string
            example: "draft,scheduled"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Articles plus pagination.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Article" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
              example:
                data:
                  - id: "k9GdPzR4wq2xVbY0nT1sc"
                    title: "How we grew to 10k followers"
                    status: "draft"
                    cover: { url: "https://media.superx.so/covers/example.jpg" }
                    scheduled_for: null
                    published_at: null
                    x_post_id: null
                    created_at: null
                    updated_at: "2026-07-07T10:00:00.000Z"
                pagination: { page: 1, limit: 20, has_more: false, total: 1 }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SubscriptionRequired" }
        "404": { $ref: "#/components/responses/AccountNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }
    post:
      tags: [Articles]
      operationId: createArticle
      summary: Create an article draft
      description: |
        Creates a draft. `content_markdown` (max 400KB) converts to the article's stored rich-text form: headings (h1-h3), bullet and numbered lists (one nesting level), blockquotes, bold/italic/strikethrough, links, images by http(s) URL, and bare X post URLs alone on a line as embeds. Constructs the format cannot express (code blocks, horizontal rules) degrade to plain text and are reported in a `warnings` array. Non-http(s) image or link URLs are rejected with 400.

        Supports `Idempotency-Key` (max 64 chars): retries with the same key and body replay the original response with `Idempotency-Replayed: true`. Works for your main account or any account linked to it (`account_id`); accounts shared with you are read-only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 300
                content_markdown:
                  type: string
                  description: Article body as markdown. Omit for an empty draft.
                account_id:
                  type: string
                  description: Any account you own, meaning your main account (the default when omitted) or one linked to it. An account shared with you returns `403 writes_main_account_only`.
            example:
              title: "How we grew to 10k followers"
              content_markdown: "# The system\n\nConsistency beats intensity.\n\n- Post daily\n- Reply to your top contacts"
      responses:
        "201":
          description: The created article (body echoed as markdown).
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Article" }
                  warnings:
                    type: array
                    items: { type: string }
                    description: Markdown degradations applied during conversion (absent when none).
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/WriteForbidden" }
        "409":
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          description: Idempotency-Key reused with a different request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: idempotency_key_reuse
                  message: "This Idempotency-Key was already used with a different request body."
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/UpstreamUnavailable" }

  /v1/articles/{id}:
