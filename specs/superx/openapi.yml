        Free. Nothing is created and no AI credits are charged. Pass a
        suggestion you like as a `keywords` entry on
        `POST /v1/signals/agents`, or as a `keyword_watch` signal on
        `POST /v1/signals/agents/{id}/signals`, to start watching it.

        This helper runs in SuperX's own process rather than through the
        app, so the app's short-term limiter does not apply and your plan's
        request rate limit is the only bound. It is still a model call each
