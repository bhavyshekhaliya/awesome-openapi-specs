components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ForbiddenError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          const: This account is restricted.
        data:
          type: 'null'
        meta:
          type: 'null'
        errors:
          type: 'null'
      required:
      - success
      - message
      - data
      - errors
      - meta
      title: ForbiddenError
    PoptinRefreshResource:
      type: object
      properties:
        refresh_status:
          type: string
        last_updated_at:
          type:
          - string
          - 'null'
      required:
      - refresh_status
      - last_updated_at
      title: PoptinRefreshResource
    PoptinStatsRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: Request completed successfully.
        data:
          type: object
          properties:
            refresh:
              $ref: '#/components/schemas/PoptinRefreshResource'
          required:
          - refresh
        errors:
          type: 'null'
        meta:
          type:
          - object
          - 'null'
      required:
      - success
      - message
      - data
      - errors
      - meta
      title: PoptinStatsRefreshResponse
    TooManyRequestsError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          const: Too Many Requests
        data:
          type: 'null'
        meta:
          type: 'null'
        errors:
          type: 'null'
      required:
      - success
      - message
      - data
      - errors
      - meta
      title: TooManyRequestsError
    PoptinListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          const: Request completed successfully.
        data:
          type: object
          properties:
            poptins:
              type: array
              items:
                $ref: '#/components/schemas/PoptinResource'
          required:
          - poptins
        errors:
          type: 'null'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
          required:
          - current_page
          - last_page
          - per_page
          - total
      required:
      - success
      - message
      - data
      - errors
      - meta
      title: PoptinListResponse
    PoptinResource:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          type: string
        domain:
          type: string
        status:
          type: string
        ab_test:
          type: boolean
        ab_test_parent_uid:
          type:
          - string
          - 'null'
        ab_test_parent:
          type:
          - object
          - 'null'
          additionalProperties: {}
        variants:
          type: array
          items:
            type: object
            additionalProperties: {}
        stats:
          type: object
          properties:
            visitors:
              type: integer
            views:
              type: integer
            conversions:
              type: integer
            conversion_rate:
              type: number
            conversion_breakdown:
              type: string
          required:
          - visitors
          - views
          - conversions
          - conversion_rate
          - conversion_breakdown
        created_at:
          type:
          - string
          - 'null'
        timeseries:
          type: string
        last_updated_at:
          type: string
        refresh_status:
          type: string
      required:
      - uid
      - name
      - type
      - domain
      - status
      - ab_test
      - ab_test_parent_uid
      - ab_test_parent
      - variants
      - stats
      - created_at
      - timeseries
      - last_updated_at
      - refresh_status
      title: PoptinResource
    PoptinActionResource:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        type:
          anyOf:
          - type: string
          - type: string
            enum:
            - popup
            - form
        status:
          type: string
          enum:
          - active
          - inactive
          - draft
      required:
