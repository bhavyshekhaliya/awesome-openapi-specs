      operationId: listCustomFields
      summary: List a list's custom fields
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomFieldDefinition'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/segments.json:
    get:
      tags:
      - Lists
      operationId: listSegments
      summary: List segments
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentSummary'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/webhooks.json:
    get:
      tags:
      - Lists
      operationId: listWebhooks
      summary: List subscriber-list webhooks
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListWebhook'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      tags:
      - Lists
      operationId: createListWebhook
      summary: Create a subscriber-list webhook
      parameters:
      - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListWebhookCreate'
      responses:
        '201':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: string
                description: The new webhook ID.
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/webhooks/{webhookid}.json:
    delete:
      tags:
      - Lists
      operationId: deleteListWebhook
      summary: Delete a list webhook
      parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/webhooks/{webhookid}/activate.json:
    put:
      tags:
      - Lists
      operationId: activateListWebhook
      summary: Activate a list webhook
      parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/webhooks/{webhookid}/deactivate.json:
    put:
      tags:
      - Lists
      operationId: deactivateListWebhook
      summary: Deactivate a list webhook
      parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /subscribers/{listid}.json:
    get:
      tags:
      - Subscribers
      operationId: getSubscriber
      summary: Find a subscriber in a list
      parameters:
      - $ref: '#/components/parameters/ListId'
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      - name: includetrackingpreference
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      tags:
      - Subscribers
      operationId: addSubscriber
      summary: Add a subscriber to a list
      description: Adds a subscriber or updates an existing subscriber with the same email address.
      parameters:
      - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberWrite'
      responses:
        '201':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: string
                format: email
                description: Email address added to the list.
        default:
          $ref: '#/components/responses/ApiError'
    put:
      tags:
      - Subscribers
      operationId: updateSubscriber
      summary: Update a subscriber
      description: Use EmailAddress in the body to change the subscriber email address.
      parameters:
      - $ref: '#/components/parameters/ListId'
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
        description: Current email address identifying the existing subscriber.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberWrite'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      tags:
      - Subscribers
      operationId: deleteSubscriber
      summary: Delete a subscriber from a list
      parameters:
      - $ref: '#/components/parameters/ListId'
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /subscribers/{listid}/unsubscribe.json:
    post:
      tags:
      - Subscribers
      operationId: unsubscribeSubscriber
      summary: Unsubscribe an email address
      parameters:
      - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeRequest'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /subscribers/{listid}/import.json:
    post:
      tags:
      - Subscribers
      operationId: importSubscribers
      summary: Import subscribers in bulk
      parameters:
      - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberImport'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ApiError'
  /subscribers/{listid}/history.json:
    get:
      tags:
      - Subscribers
      operationId: getSubscriberHistory
      summary: Get subscriber campaign history
      parameters:
      - $ref: '#/components/parameters/ListId'
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{clientid}.json:
    post:
      tags:
      - Campaigns
      operationId: createDraftCampaign
      summary: Create a draft campaign
      description: Creates a draft; the campaign is not sent.
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: string
                description: The new campaign ID.
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/send.json:
    post:
      tags:
      - Campaigns
      operationId: sendDraftCampaign
      summary: Schedule a draft campaign for sending
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignSend'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/sendpreview.json:
    post:
      tags:
      - Campaigns
      operationId: sendCampaignPreview
      summary: Send a draft campaign preview
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignPreview'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}.json:
    delete:
      tags:
      - Campaigns
      operationId: deleteCampaign
      summary: Delete a campaign
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/unschedule.json:
    post:
      tags:
      - Campaigns
      operationId: unscheduleCampaign
      summary: Return a scheduled campaign to drafts
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/recipients.json:
    get:
      tags:
      - Campaigns
      operationId: listCampaignRecipients
      summary: List campaign recipients
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - *id001
      - *id002
      - name: orderfield
        in: query
        required: false
        schema:
          type: string
          enum:
          - email
          - list
      - name: orderdirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/bounces.json:
    get:
      tags:
      - Campaigns
      operationId: listCampaignBounces
      summary: List campaign bounces
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - &id008
        name: date
        in: query
        required: false
        schema:
          type: string
        description: Only events from this date forward; use YYYY-MM-DD HH:MM.
      - *id001
      - *id002
      - &id009
        name: orderfield
        in: query
        required: false
        schema:
          type: string
          enum:
          - email
          - list
          - date
      - &id010
        name: orderdirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/opens.json:
    get:
      tags:
      - Campaigns
      operationId: listCampaignOpens
      summary: List campaign opens
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - *id008
      - *id001
      - *id002
      - *id009
      - *id010
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
        default:
