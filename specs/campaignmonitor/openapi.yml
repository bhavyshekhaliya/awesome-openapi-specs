  /campaigns/{campaignid}/clicks.json:
    get:
      tags:
      - Campaigns
      operationId: listCampaignClicks
      summary: List campaign clicks
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - *id008
      - *id001
      - *id002
      - *id009
      - *id010
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult'
        default:
          $ref: '#/components/responses/ApiError'
  /campaigns/{campaignid}/summary.json:
    get:
      tags:
      - Campaigns
      operationId: getCampaignSummary
      summary: Get sent campaign results
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSummary'
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/smartEmail:
    get:
      tags:
      - Transactional Email
      operationId: listSmartEmails
      summary: List smart transactional emails
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - draft
          - active
          default: all
      - name: clientID
        in: query
        required: false
        schema:
          type: string
        description: Required with account-level credentials when selecting a client.
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SmartEmailSummary'
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/smartEmail/{smartEmailID}:
    get:
      tags:
      - Transactional Email
      operationId: getSmartEmail
      summary: Get a smart transactional email
      parameters:
      - $ref: '#/components/parameters/SmartEmailId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/smartEmail/{smartEmailID}/send:
    post:
      tags:
      - Transactional Email
      operationId: sendSmartEmail
      summary: Send a smart transactional email
      parameters:
      - $ref: '#/components/parameters/SmartEmailId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmartEmailSend'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/messages:
    get:
      tags:
      - Transactional Email
      operationId: listTransactionalMessages
      summary: List transactional messages
      description: Use status=bounced to retrieve bounced transactional messages.
      parameters:
      - name: group
        in: query
        required: false
        schema:
          type: string
      - name: sentBeforeID
        in: query
        required: false
        schema:
          type: string
      - name: sentAfterID
        in: query
        required: false
        schema:
          type: string
      - name: count
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - delivered
          - bounced
          - spam
          - all
          default: all
      - name: smartEmailID
        in: query
        required: false
        schema:
          type: string
      - name: clientID
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionalMessage'
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/messages/{messageID}:
    get:
      tags:
      - Transactional Email
      operationId: getTransactionalMessage
      summary: Get a transactional message
      parameters:
      - $ref: '#/components/parameters/MessageId'
      - name: statistics
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: excludeMessageBody
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionalMessageDetail'
        default:
          $ref: '#/components/responses/ApiError'
  /transactional/messages/{messageID}/resend:
    post:
      tags:
      - Transactional Email
      operationId: resendTransactionalMessage
      summary: Resend a transactional message
      parameters:
      - $ref: '#/components/parameters/MessageId'
      responses:
        '202':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendMessageResponse'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
    basicAuth:
      type: http
      scheme: basic
      description: Use the API key as username; the password is unused.
  parameters:
    ClientId:
      name: clientid
      in: path
      required: true
      schema:
        type: string
    ListId:
      name: listid
      in: path
      required: true
      schema:
        type: string
    CampaignId:
      name: campaignid
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhookid
      in: path
      required: true
      schema:
        type: string
    SmartEmailId:
      name: smartEmailID
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageID
      in: path
      required: true
      schema:
        type: string
  responses:
    ApiError:
      description: Campaign Monitor API error; error codes vary by endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  schemas:
    ClientSummary:
      type: object
      required:
      - ClientID
      - Name
      properties:
        ClientID:
          type: string
        Name:
          type: string
    ClientCreate:
      type: object
      required:
      - CompanyName
      - Country
      - TimeZone
      properties:
        CompanyName:
          type: string
        Country:
          type: string
        TimeZone:
          type: string
    Client:
      type: object
      description: Client profile and account settings; optional properties depend on the account.
      properties:
        ClientID:
          type: string
        Name:
          type: string
        CompanyName:
          type: string
        Country:
          type: string
        TimeZone:
          type: string
      additionalProperties: true
    ClientList:
      type: object
      required:
      - ListID
      - Name
      properties:
        ListID:
          type: string
        Name:
          type: string
    CampaignRecord:
      type: object
      properties:
        CampaignID:
          type: string
        Name:
          type: string
        Subject:
          type: string
        SentDate:
          type: string
        CreatedAt:
          type: string
          format: date-time
        ScheduledDate:
          type: string
        FromName:
          type: string
        FromEmail:
          type: string
          format: email
        ReplyTo:
          type: string
          format: email
        WebVersionURL:
          type: string
          format: uri
        Tags:
          type: array
          items:
            type: string
      additionalProperties: true
    PagedCampaigns:
      allOf:
      - $ref: '#/components/schemas/PagedResult'
      - type: object
        properties:
          Results:
            type: array
            items:
              $ref: '#/components/schemas/CampaignRecord'
    SubscriberList:
      type: object
      properties:
        ListID:
          type: string
        Title:
          type: string
        ConfirmedOptIn:
          type: boolean
        UnsubscribePage:
          type: string
          format: uri
        UnsubscribeSetting:
          type: string
          enum:
          - AllClientLists
          - OnlyThisList
        ConfirmationSuccessPage:
          type: string
          format: uri
      additionalProperties: true
    ListCreate:
      type: object
      required:
      - Title
      - UnsubscribeSetting
      properties:
        Title:
          type: string
        UnsubscribePage:
          type: string
          format: uri
        UnsubscribeSetting:
          type: string
          enum:
          - AllClientLists
          - OnlyThisList
        ConfirmedOptIn:
          type: boolean
        ConfirmationSuccessPage:
          type: string
          format: uri
    ListUpdate:
      allOf:
      - $ref: '#/components/schemas/ListCreate'
      - type: object
        properties:
          AddUnsubscribesToSuppList:
            type: boolean
          ScrubActiveWithSuppList:
            type: boolean
    ListStats:
      type: object
      properties:
        TotalActiveSubscribers:
          type: integer
        NewActiveSubscribersToday:
          type: integer
        NewActiveSubscribersYesterday:
          type: integer
        NewActiveSubscribersThisWeek:
          type: integer
        NewActiveSubscribersThisMonth:
          type: integer
        NewActiveSubscribersThisYear:
          type: integer
        TotalUnsubscribes:
          type: integer
        TotalDeleted:
          type: integer
        TotalBounces:
          type: integer
      additionalProperties: true
    CustomField:
      type: object
      properties:
        Key:
          type: string
        Value:
          type: string
        Clear:
          type: boolean
    Subscriber:
      type: object
      properties:
        EmailAddress:
          type: string
          format: email
        Name:
          type: string
        MobileNumber:
          type: string
        State:
          type: string
          enum:
          - Active
          - Unconfirmed
          - Unsubscribed
          - Bounced
          - Deleted
        Date:
          type: string
        ListJoinedDate:
          type: string
        ConsentToTrack:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unchanged
        ConsentToSendSms:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unchanged
        CustomFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
      additionalProperties: true
    SubscriberWrite:
      type: object
      required:
      - EmailAddress
      properties:
        EmailAddress:
          type: string
          format: email
        Name:
          type: string
        MobileNumber:
          type: string
        CustomFields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
        Resubscribe:
          type: boolean
        RestartSubscriptionBasedAutoresponders:
          type: boolean
        ConsentToTrack:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unchanged
        ConsentToSendSms:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unchanged
      additionalProperties: true
    UnsubscribeRequest:
      type: object
      required:
      - EmailAddress
      properties:
        EmailAddress:
          type: string
          format: email
    SubscriberImport:
      type: object
      required:
      - Subscribers
      properties:
        Subscribers:
          type: array
          items:
            $ref: '#/components/schemas/SubscriberWrite'
        Resubscribe:
          type: boolean
        QueueSubscriptionBasedAutoresponders:
          type: boolean
        RestartSubscriptionBasedAutoresponders:
          type: boolean
    PagedResult:
      type: object
      required:
      - Results
      properties:
        Results:
          type: array
          items:
            type: object
            additionalProperties: true
        ResultsOrderedBy:
          type: string
        OrderDirection:
          type: string
        PageNumber:
          type: integer
        PageSize:
          type: integer
        RecordsOnThisPage:
          type: integer
        TotalNumberOfRecords:
          type: integer
        NumberOfPages:
          type: integer
    PagedSubscribers:
      allOf:
      - $ref: '#/components/schemas/PagedResult'
      - type: object
        properties:
          Results:
            type: array
            items:
              $ref: '#/components/schemas/Subscriber'
    CustomFieldDefinition:
      type: object
      properties:
        Key:
          type: string
        DataType:
          type: string
        FieldOptions:
          type: array
          items:
            type: string
        VisibleInPreferenceCenter:
          type: boolean
      additionalProperties: true
    SegmentSummary:
      type: object
      properties:
        ListID:
          type: string
        SegmentID:
          type: string
        Title:
          type: string
    ListWebhook:
      type: object
      properties:
        WebhookID:
          type: string
        Events:
          type: array
          items:
            type: string
            enum:
            - Subscribe
            - Deactivate
            - Update
        Url:
          type: string
          format: uri
        Status:
          type: string
        PayloadFormat:
          type: string
          enum:
          - Json
          - Xml
          - json
          - xml
    ListWebhookCreate:
      type: object
      required:
      - Events
      - Url
      - PayloadFormat
      properties:
        Events:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - Subscribe
            - Deactivate
            - Update
        Url:
          type: string
          format: uri
        PayloadFormat:
          type: string
          enum:
          - json
          - xml
    CampaignCreate:
      type: object
      required:
      - Name
      - Subject
      - FromName
      - FromEmail
      - ReplyTo
      - HtmlUrl
      description: Set ListIDs or SegmentIDs to choose recipients; the provider documents using one collection
        or the other.
      properties:
        Name:
          type: string
        Subject:
          type: string
        FromName:
          type: string
        FromEmail:
          type: string
          format: email
        ReplyTo:
          type: string
          format: email
        HtmlUrl:
          type: string
          format: uri
        TextUrl:
          type: string
          format: uri
        ListIDs:
          type: array
          items:
            type: string
        SegmentIDs:
          type: array
          items:
            type: string
        InlineCss:
          type: boolean
          default: true
      additionalProperties: true
    CampaignSend:
      type: object
      required:
      - SendDate
      properties:
        ConfirmationEmail:
          type: string
          description: One address or up to five comma-separated addresses.
        SendDate:
          type: string
          description: Use Immediately or a client-time-zone timestamp in YYYY-MM-DD HH:MM format.
    CampaignPreview:
      type: object
      properties:
        PreviewRecipients:
          type: array
          items:
            type: string
            format: email
        Personalize:
          type: boolean
          deprecated: true
          description: Deprecated; values are ignored and personalization uses fallback values.
      additionalProperties: true
    CampaignSummary:
      type: object
      properties:
        Name:
          type: string
        Recipients:
          type: integer
        TotalOpened:
          type: integer
        Clicks:
          type: integer
        Unsubscribed:
          type: integer
        Bounced:
          type: integer
        UniqueOpened:
          type: integer
        SpamComplaints:
          type: integer
        WebVersionURL:
          type: string
          format: uri
        WebVersionTextURL:
          type: string
          format: uri
        WorldviewURL:
          type: string
          format: uri
        Forwards:
          type: integer
        Likes:
          type: integer
        Mentions:
          type: integer
      additionalProperties: true
    SmartEmailSummary:
      type: object
      properties:
        ID:
          type: string
        Name:
          type: string
        CreatedAt:
          type: string
          format: date-time
        Status:
          type: string
          enum:
          - Active
          - Draft
    SmartEmailSend:
      type: object
      required:
      - To
      properties:
        To:
          type: array
          items:
            type: string
        CC:
          type:
          - array
          - 'null'
          items:
            type: string
        BCC:
          type:
          - array
          - 'null'
          items:
            type: string
        Attachments:
          type: array
          items:
            type: object
            required:
            - Content
            - Name
            - Type
            properties:
              Content:
                type: string
                description: Base64-encoded file data.
              Name:
                type: string
              Type:
                type: string
        Data:
          type: object
          additionalProperties: true
        AddRecipientsToList:
          type: boolean
          default: false
        ConsentToTrack:
          type: string
          enum:
          - 'Yes'
          - 'No'
          - Unchanged
      additionalProperties: true
    TransactionalMessage:
      type: object
      properties:
        MessageID:
          type: string
        Status:
          type: string
        SentAt:
          type: string
          format: date-time
        Recipient:
          type: string
        From:
          type: string
        Subject:
          type: string
        TotalOpens:
          type: integer
        TotalClicks:
          type: integer
        CanBeResent:
          type: boolean
        BounceType:
          type: string
        BounceCategory:
          type: string
        SmartEmailID:
          type: string
        Group:
          type: string
      additionalProperties: true
    TransactionalMessageDetail:
      allOf:
      - $ref: '#/components/schemas/TransactionalMessage'
      - type: object
        properties:
          Message:
            type: object
            additionalProperties: true
          Opens:
            type: array
            items:
              type: object
              additionalProperties: true
          Clicks:
            type: array
            items:
              type: object
              additionalProperties: true
    ResendMessageResponse:
      type: object
      required:
      - Status
      - Recipient
      - MessageID
      properties:
        Status:
          type: string
        Recipient:
          type: string
        MessageID:
          type: string
