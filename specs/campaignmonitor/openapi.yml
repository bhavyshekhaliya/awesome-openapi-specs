openapi: 3.1.0
info:
  title: Campaign Monitor API
  version: '3.3'
  summary: Manage clients, email lists, subscribers, campaigns, and transactional messages.
  description: Community-maintained JSON OpenAPI description based on Campaign Monitor public v3.3 REST
    documentation. Marketing API routes use the documented .json suffix; transactional routes are JSON-only.
    Authentication supports OAuth 2.0 bearer access tokens or HTTP Basic authentication with the API key
    as username and an unused password. List custom fields vary per list and are represented as key/value
    pairs. The public docs do not enumerate every optional response property.
externalDocs:
  description: Campaign Monitor API documentation
  url: https://www.campaignmonitor.com/api/
servers:
- url: https://api.createsend.com/api/v3.3
  description: Campaign Monitor production API
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Clients
- name: Lists
- name: Subscribers
- name: Campaigns
- name: Transactional Email
paths:
  /clients.json:
    get:
      tags:
      - Clients
      operationId: listClients
      summary: List clients
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSummary'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      tags:
      - Clients
      operationId: createClient
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: string
                description: The new client ID.
        default:
          $ref: '#/components/responses/ApiError'
  /clients/{clientid}.json:
    get:
      tags:
      - Clients
      operationId: getClient
      summary: Get client details
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        default:
          $ref: '#/components/responses/ApiError'
  /clients/{clientid}/lists.json:
    get:
      tags:
      - Lists
      operationId: listClientLists
      summary: List a client's subscriber lists
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientList'
        default:
          $ref: '#/components/responses/ApiError'
  /clients/{clientid}/campaigns.json:
    get:
      tags:
      - Campaigns
      operationId: listSentCampaigns
      summary: List sent campaigns
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - name: sentFromDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: sentToDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: tags
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated tags; campaigns must match all supplied tags.
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: One-based page number.
      - &id002
        name: pagesize
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          minimum: 1
          maximum: 1000
        description: Number of results per page; usually capped at 1000.
      - name: orderdirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCampaigns'
        default:
          $ref: '#/components/responses/ApiError'
  /clients/{clientid}/scheduled.json:
    get:
      tags:
      - Campaigns
      operationId: listScheduledCampaigns
      summary: List scheduled campaigns
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignRecord'
        default:
          $ref: '#/components/responses/ApiError'
  /clients/{clientid}/drafts.json:
    get:
      tags:
      - Campaigns
      operationId: listDraftCampaigns
      summary: List draft campaigns
      parameters:
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignRecord'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{clientid}.json:
    post:
      tags:
      - Lists
      operationId: createList
      summary: Create a subscriber list
      parameters:
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreate'
      responses:
        '201':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                type: string
                description: The new list ID.
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}.json:
    get:
      tags:
      - Lists
      operationId: getList
      summary: Get list settings
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberList'
        default:
          $ref: '#/components/responses/ApiError'
    put:
      tags:
      - Lists
      operationId: updateList
      summary: Update list settings
      parameters:
      - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListUpdate'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
    delete:
      tags:
      - Lists
      operationId: deleteList
      summary: Delete a subscriber list
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/stats.json:
    get:
      tags:
      - Lists
      operationId: getListStats
      summary: Get list statistics
      parameters:
      - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStats'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/active.json:
    get:
      tags:
      - Lists
      operationId: listActiveSubscribers
      summary: List active subscribers
      parameters:
      - $ref: '#/components/parameters/ListId'
      - &id003
        name: date
        in: query
        required: false
        schema:
          type: string
        description: Only records from this date forward; use YYYY-MM-DD.
      - *id001
      - *id002
      - &id004
        name: orderfield
        in: query
        required: false
        schema:
          type: string
          enum:
          - email
          - name
          - date
      - &id005
        name: orderdirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - &id006
        name: includetrackingpreference
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - &id007
        name: includesmspreference
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSubscribers'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/unconfirmed.json:
    get:
      tags:
      - Lists
      operationId: listUnconfirmedSubscribers
      summary: List unconfirmed subscribers
      parameters:
      - $ref: '#/components/parameters/ListId'
      - *id003
      - *id001
      - *id002
      - *id004
      - *id005
      - *id006
      - *id007
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSubscribers'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/unsubscribed.json:
    get:
      tags:
      - Lists
      operationId: listUnsubscribedSubscribers
      summary: List unsubscribed subscribers
      parameters:
      - $ref: '#/components/parameters/ListId'
      - *id003
      - *id001
      - *id002
      - *id004
      - *id005
      - *id006
      - *id007
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSubscribers'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/bounced.json:
    get:
      tags:
      - Lists
      operationId: listBouncedSubscribers
      summary: List bounced subscribers
      parameters:
      - $ref: '#/components/parameters/ListId'
      - *id003
      - *id001
      - *id002
      - *id004
      - *id005
      - *id006
      - *id007
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSubscribers'
        default:
          $ref: '#/components/responses/ApiError'
  /lists/{listid}/deleted.json:
    get:
      tags:
      - Lists
      operationId: listDeletedSubscribers
      summary: List deleted subscribers
      parameters:
      - $ref: '#/components/parameters/ListId'
      - *id003
      - *id001
      - *id002
      - *id004
      - *id005
      - *id006
      - *id007
      responses:
        '200':
