                                format: float
                              - type: boolean
                          $nin:
                            type: array
                            items:
                              anyOf:
                              - type: string
                              - type: number
                                format: float
                              - type: boolean
                          $gt:
                            type: number
                            format: float
                          $gte:
                            type: number
                            format: float
                          $lt:
                            type: number
                            format: float
                          $lte:
                            type: number
                            format: float
                          $exists:
                            type: boolean
                        additionalProperties: false
                      - anyOf:
                        - type: string
                        - type: number
                          format: float
                        - type: boolean
                        description: Shorthand equivalent to $eq for non array values
                      - type: array
                        items:
                          anyOf:
                          - type: string
                          - type: number
                            format: float
                          - type: boolean
                          description: Shorthand equivalent to $eq for array values
                    example:
                      key1:
                        $eq: value
                        $in:
                        - value1
                        - value2
                        - 100
                        - true
                        $nin:
                        - value1
                        - value2
                        - 500
                        - false
                        $gt: 1
                        $gte: 2
                        $lt: 3
                        $lte: 4
                        $exists: true
                      key2: value
                      key3:
                      - 123
                      - 456
                additionalProperties: false
            additionalProperties: false
  securitySchemes:
    bearerAuth:
      name: Authorization
      type: apiKey
      in: header
      description: Bearer Authorization with jwt token
