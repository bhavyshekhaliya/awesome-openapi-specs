    AttendeeBasicInformation:
      description: The basic information of an attendee
      type: object
      properties:
        id:
          description: The id of the attendee
          type: string
          example: 605dd3704f7330b836ef2e01
        firstName:
          description: The first name of the attendee
          type: string
          example: John
        lastName:
          description: The last name of the attendee
          type: string
          example: Doe
        emailAddress:
          description: The email address of the attendee
          type: string
          example: john.doe@example.com
    AttendeeContinuingEducationProfile:
      allOf:
        - $ref: '#/components/schemas/Attendee'
        - type: object
          properties:
            continuingEducation:
              type: object
              properties:
                answeredPolls:
                  description: The number of answered polls of the attendee
                  type: integer
                  example: 2
                passedQuizzes:
                  description: The number of passed quizzes of the attendee
                  type: integer
                  example: 10
                failedQuizzes:
                  description: The number of failed quizzes of the attendee
                  type: integer
                  example: 1
                completedSurveys:
                  description: The number of completed surveys of the attendee
                  type: integer
                  example: 1
                liveWatchedTime:
                  description: The live watched time of the attendee
                  type: string
                  example: '00:54:23'
                onDemandWatchedTime:
                  description: The on-demand watched time of the attendee
                  type: string
                  example: '00:40:23'
                totalWatchedTime:
                  description: The total watched time of the attendee
                  type: string
                  example: '01:24:46'
                status:
                  description: The status of the Continuing Education
                  type: string
                  example: completed
                  enum:
                    - completed
                    - in-progress
                    - failed
                certificateIssued:
                  description: Whether the certificate has been issued
                  type: boolean
                  example: true
                creditsEarned:
                  description: The total credits this attendee earned
                  type: number
                  example: '3.5'
                completionDate:
                  description: >-
                    The date/time the attendee completed the Continuing
                    Education. Only available when `status` is `completed`.
                  type: string
                  example: '2022-03-10T13:16:04.454Z'
                certificateDownloadUrl:
                  description: >-
                    The URL to download the certificate. Only available when the
                    certificate is issued.
                  type: string
                  example: >-
                    https://app.webinar.net/PEAqGLEzjrb/certificate?retrieveCode=zLvp1Bgndx03wQ4LB8YlXKjAqyZPWEDe
                eventExternalId:
                  description: >-
                    The id of related external event. Only available when the
                    Legacy Education Integration is enabled.
                  type: string
                  example: '190203'
    ChatParticipant:
      description: A participant of the chat
      type: object
      properties:
        id:
          description: The id of the chat participant
          type: string
          example: 605dd3704f7330b836ef2e01
        type:
          description: The type of the chat participant
          type: string
          example: attendee
          enum:
            - attendee
            - presenter
        firstName:
          description: The first name of the chat participant
          type: string
          example: John
        lastName:
          description: The last name of the chat participant
          type: string
          example: Doe
        emailAddress:
          description: The email address of the chat participant
          type: string
          example: john.doe@example.com
    ECDNVendor:
      description: >-
        The vendor of the eCDN. <b>Only available when eCDN related feature is
        enabled.</b>
      type: string
      example: hive-streaming
      enum:
        - peer5
        - kollective
        - hive-streaming
    ExternalProperty:
      description: The webinar's external properties. (Optional)
      type: object
      properties:
        name:
          description: The name of this external property.
          type: string
          example: My Test External Property
        key:
          description: >-
            The unique key of the external property within the current webinar.
            The key will be used as the webinar's property name in Get
            Webinar(s) response.
          type: string
          example: myTestExternalProperty
        type:
          description: The type of the external property.
          type: string
          example: text
          enum:
            - text
            - text-list
        value:
          description: >-
            The value of this external property. For both `text` and
            `text-list`, the `value` needs to be an array of strings. When it is
            a `text`, `value` will only contain one string.
          type: array
          items:
            type: string
          example:
            - Property Value
    FormField:
      description: The field of a form
      type: object
      properties:
        key:
          description: The `apiKey` of this field
          type: string
          example: firstName
        label:
          description: The label of the field
          type: string
          example: First Name
        order:
          description: The order of this field displayed in the form
          type: integer
          example: 1
        type:
          description: The type of this field
          type: string
          example: text-field
          enum:
            - checkbox
            - drop-down
            - text-area
            - text-field
            - radio-button
        required:
          description: Whether this field is required
          type: boolean
          example: true
    InitialSchedule:
      description: The initial schedule of this webinar.
      type: object
      properties:
        type:
          description: The type of this schedule
          type: string
          example: live
          enum:
            - live
            - simu-live
            - on-demand
        start:
          description: >-
            The start date time of the schedule. The value must be in ISO 861
            format with complete date plus hours, minutes and seconds.
          type: string
          example: '2022-03-10T13:15:00Z'
        end:
          description: >-
            The end date time of the schedule. The value must be in ISO 861
            format with complete date plus hours, minutes and seconds.
          type: string
          example: '2022-03-10T14:15:00Z'
        timeZone:
          description: >-
            The time zone of the schedule that will be used to display to the
            audience.
          type: string
          example: America/Los_Angeles
        anonymousMode:
          description: >-
            Whether the webinar will be in anonymous mode within this schedule's duration. This is optional. By default
            it is false. Anonymous Mode feature must be turned on at the account level.
          type: boolean
          example: false
      required:
        - type
        - start
        - end
        - timeZone
    Language:
      description: The language of this webinar
      type: string
      example: en_US
      enum:
        - de_DE
        - en_US
        - es_NS
        - fr_FR
        - it_IT
        - pt_BR
        - zh_CN
        - zh_TW
        - ja_JP
        - ko_KR
    PagedResult:
      properties:
        totalCount:
          $ref: '#/components/schemas/TotalCount'
        pageIndex:
          description: The page index
          type: integer
          example: 1
        pageSize:
          description: The page size
          type: integer
          example: 50
        hasMore:
          description: Whether there are more results in the next page
          type: boolean
          example: true
    PhonePresenter:
      description: A presenter who connected by phone
      type: object
      properties:
        id:
          description: The id of a phone presenter
          type: string
          example: 6061bdeb37ea2e68c0f21676
        phoneNumber:
          description: The phone number of a phone presenter
          type: string
          example: +001202-918-2132
        creationDate:
          description: The date/time the phone presenter created
          type: string
          example: '2022-03-10T13:16:04.454Z'
        lastConnectedDate:
          description: The date/time the phone connected
          type: string
          example: '2022-03-10T13:16:04.454Z'
    PresentationSource:
      description: The source of the presentation.
      type: string
      example: webcam-and-audio
      enum:
        - audio-only
        - webcam-and-audio
        - media-file
        - rtmp-stream
    Presenter:
      description: A presenter
      type: object
      properties:
        id:
          description: The id of a presenter
          type: string
          example: 6061bdeb37ea2e68c0f21676
        firstName:
          description: The first name of a presenter
          type: string
          example: John
        lastName:
          description: The last name of a presenter
          type: string
          example: Doe
        emailAddress:
          description: The email address of a presenter
          type: string
          example: john.doe@example.com
        role:
          description: The role of a presenter
          type: string
          example: presenter
          enum:
            - presenter
            - producer
        creationDate:
          description: The date/time the presenter created
          type: string
          example: '2022-03-10T13:16:04.454Z'
        lastLoginDate:
          description: The last login date of a presenter
          type: string
          example: '2022-03-10T13:16:04.454Z'
        lastLoginIpAddress:
          description: The last login IP address of a presenter
          type: string
          example: 1.2.3.4
    Registrant:
      description: A registrant of a webinar
      type: object
      properties:
        id:
          description: The id of a registrant
          type: string
          example: 605dd3704f7330b836ef2e01
        firstName:
          description: The first name of a registrant
          type: string
          example: John
        lastName:
          description: The last name of a registrant
          type: string
          example: Doe
        emailAddress:
          description: The email address of a registrant
          type: string
          example: john.doe@example.com
        company:
          description: >-
            The company information of a registrant. Available when the
            Registration Form contains the `company` field.
          type: string
          example: Example, Inc.
        jobTitle:
          description: >-
            The job title of a registrant. Available when the Registration Form
            contains the `jobTitle` field.
          type: string
          example: Sales Manager
        favoriteColor:
          description: >-
            The favorite color of a registrant. Available when the Registration
            Form contains the `favoriteColor` field.
          type: string
          example: Blue
        watchedMovies:
          description: >-
            The watched movie information of a registrant. . Available when the
            Registration Form contains the `watchedMovies` field.
          type: array
          items:
            type: string
          example:
            - Fight Club
            - The Matrix
        campaignCode:
          description: The campaign code this attendee used
          type: string
          example: 2022spring
        registrationSource:
          description: The source of the registration
          type: string
          example: webinar.net
          enum:
            - webinar.net
            - api
            - open-api
            - eloqua
            - marketo
            - hubspot
            - saml-sso
            - simple-data-pass
        registrationDate:
          description: The date/time the attendee registered to the webinar
          type: string
          example: '2022-03-10T13:16:04.454Z'
        ipAddress:
          description: The IP address of the registrant
          type: string
          example: 1.2.3.4
    RegistrantPayload:
      description: The detail to add/update a registrant
      type: object
      properties:
        fields:
          description: The fields matches those in the registration form.
          type: array
          items:
            type: object
            properties:
              key:
                description: The API Key of a registration field.
                type: string
              value:
                description: "The value of the field. \r\n - For input fields, such as text fields, text areas, the value must be a string. \r\n - For drop downs, radio buttons, the value should match one of the field’s option labels. \r\n - For checkbox lists, the value should match the field’s option labels. Multiple labels can be concatenated by comma into a single string, as shown in the example watchedMovies above. Or, they can be put inside an array of strings. For example, [\"Fight Club\", \"The Matrix\"]."
                type: string
            required:
              - key
              - value
          example:
            - key: firstName
              value: John
            - key: lastName
              value: Doe
            - key: emailAddress
              value: john.doe@example.com
            - key: company
              value: Example, Inc.
            - key: jobTitle
              value: Sales Manager
            - key: favoriteColor
              value: Blue
            - key: watchedMovies
              value: Fight Club, The Matrix
        mcc:
          description: The Marketing Campaign Code.
          type: string
          example: 2022spring
    Schedule:
      description: A schedule of the webinar
      type: object
      properties:
        id:
          description: The id of the webinar schedule
          type: string
          example: 6061bdeb37ea2e68c0f21677
        type:
          $ref: '#/components/schemas/ScheduleType'
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        start:
          $ref: '#/components/schemas/ScheduleStart'
        end:
          $ref: '#/components/schemas/ScheduleEnd'
        timeZone:
          $ref: '#/components/schemas/ScheduleTimeZone'
        anonymousMode:
          $ref: '#/components/schemas/ScheduleAnonymousMode'
    SchedulePayload:
      description: The details information to add/update a webinar schedule
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ScheduleType'
        start:
          $ref: '#/components/schemas/ScheduleStart'
        end:
          $ref: '#/components/schemas/ScheduleEnd'
        timeZone:
          $ref: '#/components/schemas/ScheduleTimeZone'
        anonymousMode:
          $ref: '#/components/schemas/ScheduleAnonymousMode'
    ScheduleStart:
      description: >-
        The start date time of a schedule. The value must be in ISO 861 format
        with complete date plus hours, minutes and seconds.
      type: string
      example: '2022-03-10T13:15:00Z'
    ScheduleEnd:
      description: >-
        The end date time of a schedule. The value must be in ISO 861 format
        with complete date plus hours, minutes and seconds.
      type: string
      example: '2022-03-10T14:15:00Z'
    ScheduleTimeZone:
      description: The time zone of a schedule.
      type: string
      example: America/Los_Angeles
    ScheduleType:
      description: The type of a schedule
      type: string
      example: live
      enum:
        - live
        - simu-live
        - on-demand
    ScheduleStatus:
      description: The status of a schedule
      type: string
      example: not-started
      enum:
        - not-started
        - started
        - ended
    ScheduleAnonymousMode:
      description: >-
        Whether the webinar will be in anonymous mode within this schedule's duration. This is optional. By default
        it is false. Anonymous Mode feature must be turned on at the account level.
      type: boolean
      example: false
    TeamChatParticipant:
      description: A participant of the team chat
      type: object
      properties:
        firstName:
          description: The first name of the chat participant
          type: string
          example: John
        lastName:
          description: The last name of the chat participant
          type: string
          example: Doe
        emailAddress:
          description: The email address of the chat participant
          type: string
          example: john.doe@example.com
    TotalCount:
      description: The total number of list items
      type: integer
      example: 200
    Webinar:
      description: >-
        The webinar model. The `myTestExternalProperty` and
        `myTestExternalPropertyList` are *External Properties* passed through
        Create/Update Webinar API.
      type: object
      properties:
        id:
          description: The id of the webinar
          type: string
          example: 6061bdeb37ea2e68c0f21676
        title:
          description: The title of the webinar
          type: string
          example: Demo Webinar
        webinarKey:
          description: The unique key of the webinar
          type: string
          example: '943731392'
        language:
          description: The language of the webinar
          type: string
          example: en_US
        source:
          description: The source of the presentation.
          type: string
          example: webcam-and-audio
          enum:
            - audio-only
            - webcam-and-audio
            - media-file
            - rtmp-stream
        latestSchedule:
          $ref: '#/components/schemas/Schedule'
        urls:
          $ref: '#/components/schemas/WebinarUrls'
        ecdnVendor:
