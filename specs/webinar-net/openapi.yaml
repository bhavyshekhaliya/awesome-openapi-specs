openapi: 3.0.1
info:
  title: webinar.net Open API
  description: >-
    # Overview

    The Open API of webinar.net is RESTful and uses JSON as the exchanging
    format. It allows third party applications to manage a user’s webinars and
    their schedules. It also provides the ability to create registrants, update
    registrant’s profile, and retrieve registrant’s profile.
  termsOfService: https://www.webinar.net/terms-of-service/
  version: 2.1.3
servers:
  - url: https://api.webinar.net/v2
  - url: https://eu-api.webinar.net/v2
  - url: https://ap-api.webinar.net/v2
tags:
  - name: Webinars
    description: Webinar APIs
  - name: Schedules
    description: Webinar Schedule APIs.
  - name: Registrants
    description: Webinar Registrants APIs
  - name: Attendees
    description: Webinar Attendees APIs
  - name: Registration Form
    description: Registration Form APIs
  - name: Presenters
    description: Webinar Presenters APIs
  - name: Campaigns
    description: Webinar Campaigns APIs
  - name: Webhooks
    description: >-
      With webhooks, third party applications can receive notification of
      subscribed events in real time.
paths:
  /webinars:
    post:
      tags:
        - Webinars
      summary: Create webinar
      description: ''
      operationId: createWebinar
      requestBody:
        description: >-
          Webinar object that needs to create a webinar. The
          `externalProperties` is optional.
        content:
          application/json:
            schema:
              properties:
                title:
                  description: The title of this webinar
                  type: string
                  example: Example Webinar
                language:
                  $ref: '#/components/schemas/Language'
                schedule:
                  $ref: '#/components/schemas/InitialSchedule'
                source:
                  $ref: '#/components/schemas/PresentationSource'
                screenSharingEnabled:
                  description: >-
                    Whether the screen sharing is available to presenters. The
                    value of the `source` need to be `audio-only` or
                    `webcam-and-audio`.
                  type: boolean
                  example: false
                ecdnVendor:
                  $ref: '#/components/schemas/ECDNVendor'
                audienceSamlEnabled:
                  description: >-
                    Whether this webinar supports SAML SSO for the audience or
                    not. Only available when SAML SSO for Audience is enabled.
                  type: boolean
                  example: false
                greenRoomEnabled:
                  description: >-
                    Whether this webinar has Greem Room enabled. By default, its
                    value is `false`. This field will only work when the Green Room feature is turned on.
                  type: boolean
                  example: false
                secureContentEnabled:
                  description: >-
                    Whether this webinar has Secure Content enabled. By default, its
                    value is `false`. This field will only work when the Secure Content feature is turned on.
                  type: boolean
                  example: false
                externalProperties:
                  description: >-
                    The external properties of this webinar. This is optional.
                    Old external properties not found in the list will be
                    removed. Empty list will remove all existing external
                    properties.
                  type: array
                  items:
                    $ref: '#/components/schemas/ExternalProperty'
              required:
                - title
                - language
                - schedule
                - source
        required: true
      responses:
        '201':
          description: Webinar created successfully
          content:
            application/json:
              schema:
                properties:
                  webinar:
                    $ref: '#/components/schemas/Webinar'
    get:
      tags:
        - Webinars
      summary: Get webinars
      description: ''
      parameters:
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: List of webinars returned.
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      webinars:
                        description: The current page of the webinars
                        type: array
                        items:
                          $ref: '#/components/schemas/Webinar'
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}:
    put:
      tags:
        - Webinars
      summary: Update webinar
      description: >-
        Update a webinar's general settings. The `externalProperties` is
        optional.
      operationId: updateWebinar
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                title:
                  description: Updated title of the webinar
                  type: string
                  example: Example Webinar 2
                language:
                  $ref: '#/components/schemas/Language'
                source:
                  $ref: '#/components/schemas/PresentationSource'
                externalProperties:
                  description: The external properties of this webinar. This is optional.
                  type: array
                  items:
                    $ref: '#/components/schemas/ExternalProperty'
      responses:
        '200':
          description: Webinar updated successfully
          content:
            application/json:
              schema:
                properties:
                  webinar:
                    $ref: '#/components/schemas/Webinar'
    get:
      tags:
        - Webinars
      summary: Get webinar
      description: Get the general settings of a webinar
      operationId: getWebinar
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: The general settings of the webinar
          content:
            application/json:
              schema:
                properties:
                  webinar:
                    $ref: '#/components/schemas/Webinar'
    delete:
      tags:
        - Webinars
      summary: Delete webinar
      description: Delete a webinar
      operationId: deleteWebinar
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '204':
          description: Webinar deleted successful
  /webinars/{webinarId}/copy:
    post:
      tags:
        - Webinars
      summary: Copy webinar
      description: Create a new webinar by copying an existing webinar
      operationId: copyWebinar
      parameters:
        - name: webinarId
          in: path
          description: The id of the source webinar
          required: true
          schema:
            type: string
            example: 6061bdeb37ea2e68c0f21676
      requestBody:
        content:
          application/json:
            schema:
              properties:
                title:
                  description: The title of the new webinar
                  type: string
                  example: New Example Webinar
                language:
                  $ref: '#/components/schemas/Language'
                schedule:
                  $ref: '#/components/schemas/InitialSchedule'
                copyMedia:
                  description: Whether copy the presentation media of the source webinar
                  type: boolean
                  example: false
                externalProperties:
                  description: The external properties of this webinar (Optional)
                  type: array
                  items:
                    $ref: '#/components/schemas/ExternalProperty'
              required:
                - title
                - language
                - schedule
                - copyMedia
      responses:
        '200':
          description: Webinar copied successfully
          content:
            application/json:
              schema:
                properties:
                  webinar:
                    $ref: '#/components/schemas/Webinar'
  /webinars/{webinarId}/schedules:
    post:
      tags:
        - Schedules
      summary: Add webinar schedule
      description: Add a new schedule to the webinar
      operationId: addWebinarSchedule
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '200':
          description: Newly created schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    get:
      tags:
        - Schedules
      summary: Get webinar schedules
      description: Get all the schedules of a webinar
      operationId: getWebinarSchedules
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: All the schedules of the webinar
          content:
            application/json:
              schema:
                properties:
                  schedules:
                    description: A list of webinar schedules
                    type: array
                    items:
                      $ref: '#/components/schemas/Schedule'
  /webinars/{webinarId}/schedules/{scheduleId}:
    get:
      tags:
        - Schedules
      summary: Get webinar schedule
      description: Get a webinar schedule
      operationId: getWebinarSchedule
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: The webinar schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    put:
      tags:
        - Schedules
      summary: Update webinar schedule
      description: Update a webinar schedule
      operationId: updateWebinarSchedule
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePayload'
      responses:
        '200':
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      tags:
        - Schedules
      summary: Delete webinar schedule
      description: Delete a webinar schedule
      operationId: deleteWebinarSchedule
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '204':
          description: Webinar schedule deleted successful
  /webinars/{webinarId}/registrants:
    post:
      tags:
        - Registrants
      summary: Create registrant
      description: Create a registrant of a webinar
      operationId: createRegistrant
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        description: Registrant information for creating a registrant
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrantPayload'
      responses:
        '200':
          description: The newly created registrant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
    get:
      tags:
        - Registrants
      summary: Get registrants
      description: Get registrants
      operationId: getRegistrants
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The registrants of a webinar
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      registrants:
                        description: The registrants of current page
                        type: array
                        items:
                          $ref: '#/components/schemas/Registrant'
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}/registrants/{registrantId}:
    put:
      tags:
        - Registrants
      summary: Update registrant
      description: Update a webinar registrant
      operationId: updateRegistrant
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/RegistrantId'
      requestBody:
        description: Registrant information for updating a registrant
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrantPayload'
      responses:
        '200':
          description: The detail of a updated registrant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
    get:
      tags:
        - Registrants
      summary: Get registrant
      description: Get a webinar registrant
      operationId: getRegistrant
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/RegistrantId'
      responses:
        '200':
          description: The detail of a registrant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
    delete:
      tags:
        - Registrants
      summary: Delete registrant
      description: Delete a webinar registrant by wiping out personal information
      operationId: deleteRegistrant
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/RegistrantId'
      responses:
        '201':
          description: No content
  /webinars/{webinarId}/registration-form/fields:
    get:
      tags:
        - Registration Form
      summary: Get registration form fields
      description: >-
        Get the fields in the webinar's registration form. Only those fields
        with `apiKey` will show up in the result.
      operationId: getRegistrationFormFields
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: The fields with `apiKey` in the registration form
          content:
            application/json:
              schema:
                properties:
                  fields:
                    description: The list of fields returned
                    type: array
                    items:
                      $ref: '#/components/schemas/FormField'
                    example:
                      - key: firstName
                        label: First Name
                        order: 1
                        type: text-field
                        required: true
                      - key: lastName
                        label: Last Name
                        order: 2
                        type: text-field
                        required: true
                      - key: emailAddress
                        label: Email Address
                        order: 3
                        type: text-field
                        required: true
                      - key: company
                        label: Company
                        order: 4
                        type: text-field
                        required: false
                      - key: jobTitle
                        label: Title
                        order: 5
                        type: text-field
                        required: false
                      - key: favoriteColor
                        label: What is your favorite color?
                        order: 6
                        type: radio-button
                        required: true
                      - key: watchedMovies
                        label: Which movies have you watched already?
                        order: 7
                        type: checkbox
                        required: false
  /webinars/{webinarId}/webhooks:
    post:
      tags:
        - Webhooks
      summary: Create webhook
      description: Create webhook
      operationId: createWebhook
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      requestBody:
        description: The information required to create a webhook
        content:
          application/json:
            schema:
              properties:
                hookUrl:
                  description: >-
                    The third party application’s URL that will be invoked once
                    the event occurs on webinar.net side.
                  type: string
                eventType:
                  description: >-
                    The type of the event this webhook is watching. Current
                    supported webhook is `new-registrant`.
                  type: string
                  example: new-registrant
                  enum:
                    - new-registrant
              required:
                - hookUrl
                - eventType
      responses:
        '200':
          description: The newly created webhook
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: The id of the webhook
                    type: string
                    example: 60609eb0aa5032231899ae31
                  hookUrl:
                    description: The third party application URL
                    type: string
                  eventType:
                    description: The type of the event this webhook listens to
  /webinars/{webinarId}/webhooks/{webhookId}:
    delete:
      tags:
        - Webhooks
      summary: Delete webhook
      description: Delete webhook
      operationId: deleteWebhook
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: The webhook deleted successfully
  /webinars/{webinarId}/summary:
    get:
      tags:
        - Webinars
      summary: Get webinar summary
      description: Get a webinar's summary
      operationId: getWebinarSummary
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: The summary of a webinar
          content:
            application/json:
              schema:
                properties:
                  title:
                    description: The title of the webinar
                    type: string
                    example: Example Webinar
                  folders:
                    description: The folders this webinar is added into
                    type: array
                    items:
                      type: string
                      example: 2022 Spring Folder
                  startDate:
                    description: >-
                      The date/time this webinar started. When a webinar has not
                      started, this is the scheduled start date.
                    type: string
                    example: '2022-03-10T13:00:00Z'
                  duration:
                    description: The duration (minutes) of this webinar.
                    type: integer
                    example: 60
                  numberOfRegistrants:
                    description: The total number of registrants of this webinar
                    type: integer
                    example: 1000
                  numberOfLiveAttendees:
                    description: The total number of live attendees of this webinar
                    type: integer
                    example: 900
                  numberOfOnDemandAttendees:
                    description: The total number of on-demand attendees of this webinar
                    type: integer
                    example: 900
                  numberOfNoShows:
                    description: The total number of no shows of this webinar
                    type: integer
                    example: 100
                  averageLiveDuration:
                    description: >-
                      The average duration (minutes) of the attendees stayed
                      during live
                    type: integer
                    example: 50
                  averageOnDemandDuration:
                    description: >-
                      The average duration (minutes) of the attendees stayed
                      during on-demand
                    type: integer
                    example: 55
  /webinars/{webinarId}/attendees:
    get:
      tags:
        - Attendees
      summary: Get webinar attendees
      description: Get attendees of a webinar
      operationId: getAttendees
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
        - description: Whether to include attendee activities in the result
          in: query
          name: includeActivities
          required: false
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: Webinar attendees
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      attendees:
                        type: array
                        items:
                          $ref: '#/components/schemas/AttendeeWithActivities'
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}/attendees/activities:
    get:
      tags:
        - Attendees
      summary: Get attendee activities
      description: Get attendee activities of a webinar
      operationId: getAttendeesActivities
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Webinar attendees' activities
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      activities:
                        description: The attendees' activities
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                attendee:
                                  $ref: >-
                                    #/components/schemas/AttendeeBasicInformation
                            - $ref: '#/components/schemas/AttendeeActivity'
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}/attendees/activities/export-tasks:
    post:
      tags:
        - Attendees
        - Activities
      summary: Create attendee activities export task
      description: >-
        Create an attendee activities export task of a webinar. Exported
        activities are in a zipped .json file.
      operationId: createAttendeesActivitiesExportTask
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/RangeStart'
        - $ref: '#/components/parameters/RangeEnd'
      responses:
        '200':
          description: The export task response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesExportTask'
  /webinars/{webinarId}/attendees/activities/export-tasks/{exportTaskId}:
    get:
      tags:
        - Attendees
        - Activities
      summary: Get attendee activities export task
      description: Get an attendee activities export task of a webinar
      operationId: getAttendeesActivitiesExportTask
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/ExportTaskId'
      responses:
        '200':
          description: The export task response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesExportTask'
  /webinars/{webinarId}/attendees/activities/export-tasks/{exportTaskId}/download-url:
    get:
      tags:
        - Attendees
        - Activities
      summary: Get attendee activities export result download URL
      description: Get the download URL of the exported attendee activities
      operationId: getAttendeesActivitiesExportTaskDownloadUrl
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/ExportTaskId'
      responses:
        '200':
          description: The export task response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesExportTaskDownloadUrl'
  /webinars/{webinarId}/attendees/sessions:
    get:
      tags:
        - Attendees
      summary: Get attendees viewing sessions
      description: Get attendees viewing sessions of a webinar
      operationId: getAttendeesSessions
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Webinar attendees' viewing sessions
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: The id of the session
                              type: string
                              example: 62cc1633a2d1266d876acf90
                            sessionStartDate:
                              description: The start date/time of this session
                              type: string
                              example: '2022-03-10T13:16:04.454Z'
                            sessionEndDate:
                              description: The end date/time of this session
                              type: string
                              example: '2022-03-10T14:10:04.012Z'
                            durationSeconds:
                              description: The duration of this session in seconds.
                              type: integer
                              example: 3240
                            attendee:
                              $ref: '#/components/schemas/Attendee'
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}/qa-questions:
    get:
      tags:
        - Q&A
      summary: Get Q&A questions
      description: Get Q&A questions
      operationId: getQaQuestions
      parameters:
        - $ref: '#/components/parameters/WebinarId'
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The questions the audience asked
          content:
            application/json:
              schema:
                allOf:
                  - properties:
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              description: The id of the question
                              type: string
                              example: 62cc1633a2d1266d876acf90
                            title:
                              description: The title of this question
                              type: string
                              example: >-
                                What is the release date of your flagship
                                product?
                            number:
                              description: The auto-generated number of this question.
                              type: integer
                              example: 1
                            questioner:
                              description: The person who asked the question
                              type: object
                              properties:
                                firstName:
                                  description: >-
                                    The first name of the person who asked this
                                    question
                                  type: string
                                  example: John
                                lastName:
                                  description: >-
                                    The last name of the person who asked this
                                    question
                                  type: string
                                  example: Doe
                                emailAddress:
                                  description: >-
                                    The email address of the person who asked
                                    this question, or the presenter who seeded
                                    this question.
                                  type: string
                                  example: john.doe@example.com
                                company:
                                  description: >-
                                    The company of the person who asked this
                                    question
                                  type: string
                                  example: Example, Inc.
                            askedDate:
                              description: The date/time this question was asked
                              type: string
                              example: '2022-03-10T13:16:04.454Z'
                            answer:
                              description: The answer to this question
                              type: string
                              example: Later this autumn.
                            answeredDate:
                              description: The date/time this question was answered
                              type: string
                              example: '2022-03-10T13:16:04.454Z'
                            answeredBy:
                              description: The presenter who answered the question
                              type: object
                              properties:
                                firstName:
                                  description: >-
                                    The first name of the presenter who answered
                                    this question
                                  type: string
                                  example: John
                                lastName:
                                  description: >-
                                    The last name of the presenter who answered
                                    this question
                                  type: string
                                  example: Doe
                                emailAddress:
                                  description: >-
                                    The email address of the presenter who
                                    answered this question
                                  type: string
                                  example: john.doe@example.com
                            seeded:
                              description: Whether this is a seed question
                              type: boolean
                              example: false
                            visibleToAll:
                              description: >-
                                Whether this question is visible to everyone.
                                False when only visible to the person who asked
                                this question.
                              type: boolean
                              example: true
                  - $ref: '#/components/schemas/PagedResult'
  /webinars/{webinarId}/group-chats:
    get:
      tags:
        - Group Chats
      summary: Get group chats
      description: Get the group chats of a webinar
      operationId: getGroupChats
      parameters:
        - $ref: '#/components/parameters/WebinarId'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  groupChats:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: The id of the group chat
