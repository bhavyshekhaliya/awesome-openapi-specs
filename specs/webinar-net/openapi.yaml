components:
  parameters:
    ExportTaskId:
      name: exportTaskId
      in: path
      description: The id of an export task
      required: true
      schema:
        type: string
        example: 605dd3704f7330b836ef2e01
    Fields:
      name: fields
      in: query
      description: The additional fields to included in the result. (Optional)
      required: false
      schema:
        type: string
        example: schedules
    GroupChatId:
      name: groupChatId
      in: path
      description: The id of a group chat
      required: true
      schema:
        type: string
        example: 605dd3704f7330b836ef2e01
    PageIndex:
      description: The index of the page. Page Index starts from 1.
      in: query
      name: pageIndex
      required: false
      schema:
        type: integer
        example: 1
    PageSize:
      description: The size of each page. Supported value 1 to 100. Default to 50.
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        example: 50
    RangeStart:
      description: The start of a date range. In ISO Date format, yyyy-MM-dd'T'HH:mm:ssZZ
      in: query
      name: start
      required: false
      schema:
        type: string
        example: '2022-03-10T13:00:00Z'
    RangeEnd:
      description: >-
        The end of a date range. In ISO Date format, yyyy-MM-dd'T'HH:mm:ssZZ. If
        not provided, default to now.
      in: query
      name: end
      required: false
      schema:
        type: string
        example: '2022-03-11T13:00:00Z'
    StartDate:
      description: The start date of a query. In ISO Date format, yyyy-MM-dd'T'HH:mm:ssZZ
      in: query
      name: start
      required: false
      schema:
        type: string
        example: '2022-03-10T13:00:00Z'
    EndDate:
      description: >-
        The end date of a query. In ISO Date format, yyyy-MM-dd'T'HH:mm:ssZZ. If
        not provided, default to now.
      in: query
      name: end
      required: false
      schema:
        type: string
        example: '2022-03-11T13:00:00Z'
    PollId:
      name: pollId
      in: path
      description: The id of a poll
      required: true
      schema:
        type: string
        example: 605dd3704f7330b836ef2e01
    RegistrantId:
      name: registrantId
      in: path
      description: The id of a webinar registrant
      required: true
      schema:
        type: string
        example: 605dd3704f7330b836ef2e01
    ScheduleId:
      name: scheduleId
      in: path
      description: The id of a webinar schedule
      required: true
      schema:
        type: string
        example: 6061bdeb37ea2e68c0f21678
    SurveyId:
      name: surveyId
      in: path
      description: The id of a survey
      required: true
      schema:
        type: string
        example: 6061bdeb37ea2e68c0f21678
    WebhookId:
      name: webhookId
      in: path
      description: The id of a webhook
      required: true
      schema:
        type: string
        example: 60546f283f78c2590f4d7764
    WebinarId:
      name: webinarId
      in: path
      description: The id of a webinar
      required: true
      schema:
        type: string
        example: 6061bdeb37ea2e68c0f21676
    PageId:
      name: pageId
      in: path
      description: The id of a multi-registration page
      required: true
      schema:
        type: string
        example: 6061bdeb37ea2e68c0f21676
  schemas:
    Attendee:
      allOf:
        - $ref: '#/components/schemas/Registrant'
        - description: The basic information of an attendee
          type: object
          properties:
            attendedLive:
              description: Whether this attendee attended the webinar during live schedule
              type: boolean
              example: true
            attendedLiveDate:
              description: The date/time the attendee attended the live presentation
              type: string
              example: '2022-03-10T13:16:04.454Z'
            attendedOnDemand:
              description: >-
                Whether this attendee attended the webinar during on-demand
                schedule
              type: boolean
              example: true
            attendedOnDemandDate:
              description: The date/time the attendee attended the on-demand presentation
              type: string
              example: '2022-03-10T13:16:04.454Z'
            blocked:
              description: Whether this attendee was blocked or not
              type: boolean
              default: false
            lastOnlineDate:
              description: The date/time this attendee was last seen online
              type: string
              example: '2022-03-10T13:16:04.454Z'
            liveDuration:
              description: The live duration of this attendee
              type: string
              example: '00:50:00'
            onDemandDuration:
              description: The on-demand duration of this attendee
              type: string
              example: '00:34:00'
    AttendeeWithActivities:
      allOf:
        - $ref: '#/components/schemas/Attendee'
        - properties:
            activities:
              description: >-
                Attendee's activities. Only available when
                `includeActivities=true`.
              type: array
              items:
                $ref: '#/components/schemas/AttendeeActivity'
    AttendeeActivity:
      description: An activity of an attendee
      type: object
      properties:
        id:
          description: The id of the attendee's activity
          type: string
          example: 62cc1633a2d1266d876acf90
        action:
          description: The action this attendee performed
          type: string
          example: login
          enum:
            - attended-live
            - attended-on-demand
            - ask-question
            - chat
            - join-group-chat
            - login
            - open-facebook
            - open-html
            - open-link
            - open-linked-in
            - open-twitter
            - refer-colleague
            - register
            - send-contact-us-message
            - share-email
            - share-facebook
            - share-linked-in
            - share-twitter
            - submit-poll-response
            - submit-quiz-response
            - submit-survey-response
            - view-resource
            - view-speaker-bio
        target:
          description: The target of this action.
          type: object
          properties:
            id:
              description: The id of this target
              type: string
              example: 62cc1633a2d1266d876acf90
            type:
              description: The type of this target
              type: string
              example: poll
              enum:
                - poll
                - qa-question
                - quiz
                - resource
                - survey
            label:
              description: The label of this target
              type: string
              example: Example Poll 1
        actionDate:
          description: The date/time of this this action
          type: string
          example: '2022-03-10T13:16:04.454Z'
    ActivitiesExportTask:
      description: The activities export task
      type: object
      properties:
        id:
          description: The id of the export task
          type: string
          example: 605dd3704f7330b836ef2e01
        status:
          description: The status of the export task
          type: string
          example: completed
          enum:
            - not-started
            - in-progress
            - completed
            - failed
            - cancelled
        parameters:
          description: The parameters used to create the export task
          type: array
          items:
            description: The export task parameter
            type: object
            properties:
              name:
                description: The parameter name
                type: string
                example: webinarId|start|end
              value:
                description: The parameter value
                type: string
                example: 605dd3704f7330b836ef2e01|2022-03-10T13:16:04.454Z
        duration:
          description: The seconds for this task to complete.
          type: number
          example: 120
        error:
          description: >-
            The error message of a failed export task. It will be empty for not
            failed tasks.
          type: string
          example: Example error message.
    ActivitiesExportTaskDownloadUrl:
      description: The download URL response of an activities export task
