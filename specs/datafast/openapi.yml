openapi: 3.2.1
info:
  title: DataFast API
  version: 1.0.0
  description: 'OpenAPI description of the documented DataFast REST API v1. Website endpoints use the
    /api/v1 base path; account administration endpoints are under /api/v1/admin. All requests use a Bearer
    token: df_ website API keys are scoped to one website, while dft_ account tokens require the relevant
    permission and websiteId on website-scoped routes. Keep tokens secret.'
externalDocs:
  description: Official DataFast API documentation
  url: https://datafa.st/docs/api
servers:
- url: https://datafa.st/api/v1
  description: DataFast API v1
security:
- DataFastBearer: []
tags:
- name: Analytics
  description: Website analytics and realtime reporting.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/analytics
- name: Breakdowns
  description: Analytics grouped by page, source, location, device, campaign, and related dimensions.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/breakdowns
- name: Visitors
  description: Search visitors and inspect their recorded journeys.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/visitors
- name: Social mentions
  description: Search stored X and Reddit mentions.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/mentions
- name: Identity
  description: Link anonymous visitors to known product users.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/identity
- name: Goals
  description: Analyze custom goals, write goal events, and manage display customizations.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/goals
- name: Payments
  description: Send and delete payment events.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/payments
- name: Bot traffic
  description: Read and manage Bot traffic analytics and settings.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/website/bot-traffic
- name: Account
  description: Read and update the authenticated account profile.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account/account
- name: Websites
  description: Create and manage websites and website settings.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account/websites
- name: API keys
  description: Manage account tokens and website API keys.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account/access-tokens
- name: Funnels
  description: Manage funnels and retrieve funnel analytics.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account
- name: Notes
  description: List, create, update, and delete manual chart notes.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account/notes
- name: Alerts
  description: Manage alerts and alert history.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account
- name: Team
  description: List team members and manage invitations.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account/team
- name: Integrations
  description: Read integration status and connect or disconnect providers.
  externalDocs:
    description: Official DataFast documentation
    url: https://datafa.st/docs/api/account
