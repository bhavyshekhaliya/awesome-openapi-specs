components:
  securitySchemes:
    DataFastBearer:
      type: http
      scheme: bearer
      bearerFormat: df_ website key or dft_ account token
      description: 'Send Authorization: Bearer <token>. Never expose tokens in browser code or public
        repositories.'
  parameters:
    WebsiteId:
      name: websiteId
      in: query
      description: Website ObjectId. Required with dft_ account tokens; inferred from df_ website keys.
      schema:
        type: string
    StartAt:
      name: startAt
      in: query
      description: Inclusive start bound, as YYYY-MM-DD or an ISO 8601 timestamp. Supply with endAt.
      schema:
        type: string
    EndAt:
      name: endAt
      in: query
      description: Inclusive end bound, as YYYY-MM-DD or an ISO 8601 timestamp. Supply with startAt.
      schema:
        type: string
    Start:
      name: start
      in: query
      description: Start bound for event deletion. Deprecated for payments; use startAt.
      schema:
        type: string
    End:
      name: end
      in: query
      description: End bound for event deletion. Deprecated for payments; use endAt.
      schema:
        type: string
    Timezone:
      name: timezone
      in: query
      description: IANA timezone. Defaults to the website timezone.
      schema:
        type: string
        example: America/New_York
    Fields:
      name: fields
      in: query
      description: Comma-separated response fields. Omit to return all supported fields.
      schema:
        type: string
    FieldsRequired:
      name: fields
      in: query
      description: Comma-separated metrics to return. Required for time series.
      schema:
        type: string
      required: true
    MetadataFields:
      name: fields
      in: query
      description: 'Metadata fields: domain, timezone, name, logo, kpiColorScheme, kpi, currency.'
      schema:
        type: string
    Interval:
      name: interval
      in: query
      description: Time-series bucket interval.
      schema:
        type: string
        enum:
        - hour
        - day
        - week
        - month
      required: true
    BotInterval:
      name: interval
      in: query
      description: Bot traffic time-series bucket interval.
      schema:
        type: string
        enum:
        - hour
        - day
        - week
        - month
    Limit:
      name: limit
      in: query
      description: Maximum number of results to return.
      schema:
        type: integer
        minimum: 1
    AnalyticsLimit:
      name: limit
      in: query
      description: Maximum number of analytics rows (1–1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    VisitorLimit:
      name: limit
      in: query
      description: Maximum number of visitor rows (1–250).
      schema:
        type: integer
        minimum: 1
        maximum: 250
    Limit1000:
      name: limit
      in: query
      description: Page size (1–1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    BotPageLimit:
      name: limit
      in: query
      description: Requested-page page size (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      description: Number of results to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    Order:
      name: order
      in: query
      description: Sort order.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    Platform:
      name: platform
      in: query
      description: Filter mentions by platform.
      schema:
        type: string
        enum:
        - x
        - reddit
    Query:
      name: q
      in: query
      description: Case-insensitive text search, up to 200 characters.
      schema:
        type: string
        maxLength: 200
    EventName:
      name: eventName
      in: query
      description: Exact custom goal name. Required to query custom goal properties.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      required: true
    PropertyName:
      name: propertyName
      in: query
      description: Exact case-sensitive custom goal property name.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    AlertId:
      name: alertId
      in: query
      description: Filter history to one alert.
      schema:
        type: string
    VisitorId:
      name: datafast_visitor_id
      in: query
      description: DataFast visitor UUID.
      schema:
        type: string
    GoalName:
      name: goalName
      in: query
      description: Normalized custom goal name.
      schema:
        type: string
        maxLength: 64
    TransactionId:
      name: transaction_id
      in: query
      description: Unique transaction ID from the payment provider.
      schema:
        type: string
    BotCategory:
      name: category
      in: query
      description: Bot traffic category.
      schema:
        type: string
        enum:
        - all
        - answer_fetch
        - search_index
        - training
        - ai_crawler
    Verification:
      name: verification
      in: query
      description: Bot request verification status.
      schema:
        type: string
        enum:
        - all
        - ip_verified
        - user_agent_only
    Company:
      name: company
      in: query
      description: Exact company name returned by the API.
      schema:
        type: string
    CrawlerId:
      name: crawlerId
      in: query
      description: Exact crawler ID returned by the API.
      schema:
        type: string
    PageSearch:
      name: pageSearch
      in: query
      description: Filter requested pages by page path.
      schema:
        type: string
    VisitedPage:
      name: visitedPage
      in: query
      description: Filter visitors by exact page path.
      schema:
        type: string
    VisitedPageContains:
      name: visitedPageContains
      in: query
      description: Filter visitors by a page path substring.
      schema:
        type: string
    CompletedGoal:
      name: completedGoal
      in: query
      description: Filter visitors who completed this goal.
      schema:
        type: string
    Country:
      name: country
      in: query
      description: Filter visitors by country.
      schema:
        type: string
    Device:
      name: device
      in: query
      description: Filter visitors by device.
      schema:
        type: string
    Browser:
      name: browser
      in: query
      description: Filter visitors by browser.
      schema:
        type: string
    UtmCampaign:
      name: utm_campaign
      in: query
      description: Filter visitors by UTM campaign.
      schema:
        type: string
    IsCustomer:
      name: isCustomer
      in: query
      description: Filter visitors by customer status.
      schema:
        type: boolean
    FilterCountry:
      name: filter_country
      in: query
      description: 'Country filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    FilterRegion:
      name: filter_region
      in: query
      description: 'Region or state filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    FilterCity:
