      - $ref: '#/components/parameters/FilterCountry'
      - $ref: '#/components/parameters/FilterRegion'
      - $ref: '#/components/parameters/FilterCity'
      - $ref: '#/components/parameters/FilterDevice'
      - $ref: '#/components/parameters/FilterBrowser'
      - $ref: '#/components/parameters/FilterOs'
      - $ref: '#/components/parameters/FilterPage'
      - $ref: '#/components/parameters/FilterEntryPage'
      - $ref: '#/components/parameters/FilterHostname'
