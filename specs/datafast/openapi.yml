      - $ref: '#/components/parameters/FilterUtmTerm'
      - $ref: '#/components/parameters/FilterUtmContent'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/ApiError'
