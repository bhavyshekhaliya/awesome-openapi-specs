        type: string
    FilterUtmMedium:
      name: filter_utm_medium
      in: query
      description: 'UTM medium filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    FilterUtmCampaign:
      name: filter_utm_campaign
      in: query
      description: 'UTM campaign filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    FilterUtmTerm:
      name: filter_utm_term
      in: query
      description: 'UTM term filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    FilterUtmContent:
      name: filter_utm_content
      in: query
      description: 'UTM content filter. Prefix values with is: or is_not: where supported.'
      schema:
        type: string
    GoalNameRequired:
      name: goalName
      in: query
      description: Goal name whose display customization will be reset.
      schema:
        type: string
        maxLength: 64
      required: true
  responses:
    Success:
      description: Successful DataFast response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    ApiError:
      description: API error. Common status codes include 400, 401, 403, 404, 409, 429, 500, and 504.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ErrorEnvelope'
            - $ref: '#/components/schemas/PlainError'
            - $ref: '#/components/schemas/RateLimitError'
    PaymentCreated:
      description: Payment recorded. This endpoint does not use the standard success envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentCreated'
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          const: success
        data:
          description: Endpoint-specific data. DataFast returns an object or array depending on the endpoint.
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          type: object
          additionalProperties: true
      additionalProperties: true
    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: string
          const: error
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
            message:
              type: string
          additionalProperties: true
      additionalProperties: true
    PlainError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    RateLimitError:
      type: object
      required:
      - error
      - message
      - limit
      - remaining
      - reset
      properties:
        error:
          type: string
        message:
          type: string
        limit:
          type: integer
        remaining:
          type: integer
        reset:
          type: integer
          description: Unix timestamp when the limit resets.
      additionalProperties: true
    UpdateAccountRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    CreateAccessTokenRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Dashboard label.
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - analytics:read
            - goals:read
            - goals:write
            - payments:read
            - payments:write
            - identify:write
            - websites:read
            - websites:write
            - settings:read
            - settings:write
            - api-keys:read
            - api-keys:write
            - funnels:read
            - funnels:write
            - alerts:read
            - alerts:write
            - team:read
            - team:write
            - notes:read
            - notes:write
            - '*'
        websiteIds:
          type: array
          items:
            type: string
          description: An empty array means all websites available to the caller.
      additionalProperties: false
    CreateWebsiteRequest:
      type: object
      required:
      - domain
      - timezone
      properties:
        domain:
          type: string
          description: Tracked domain without a URL scheme.
        timezone:
          type: string
          description: IANA timezone.
        name:
          type: string
      additionalProperties: true
    UpdateWebsiteRequest:
      type: object
      minProperties: 1
      properties:
        domain:
          type: string
        name:
          type:
          - string
          - 'null'
        timezone:
          type: string
        currency:
          type: string
        kpi:
          type:
          - string
          - 'null'
        kpiColorScheme:
          type: string
        revenueMetric:
          type: string
        isCookieless:
          type: boolean
        includeRenewalRevenue:
          type: boolean
        allowedHostnames:
          type: array
          items:
            type: string
        excludedIps:
          type: array
          items:
            type: string
        excludedPaths:
          type: array
          items:
            type: string
        excludedCountries:
          type: array
          items:
            type: string
        excludedHostnames:
          type: array
          items:
            type: string
      additionalProperties: true
    NamedResourceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    UpdateGoalCustomizationRequest:
      type: object
      minProperties: 1
      properties:
        goalName:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string
      additionalProperties: true
    PageviewFunnelStep:
      type: object
      required:
      - name
      - type
      - url
      properties:
        name:
          type: string
        type:
          type: string
          const: pageview
        url:
          type: string
      additionalProperties: true
    GoalFunnelStep:
      type: object
      required:
      - name
      - type
      - goalName
      properties:
        name:
          type: string
        type:
          type: string
          const: goal
        goalName:
          type: string
      additionalProperties: true
    FunnelStep:
      oneOf:
      - $ref: '#/components/schemas/PageviewFunnelStep'
      - $ref: '#/components/schemas/GoalFunnelStep'
    CreateFunnelRequest:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
          minLength: 1
        steps:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/FunnelStep'
      additionalProperties: true
    UpdateFunnelRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        steps:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/FunnelStep'
      additionalProperties: true
    CreateNoteRequest:
      type: object
      required:
      - text
      - timestamp
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        timestamp:
          type: string
          description: ISO 8601 timestamp or YYYY-MM-DD in website timezone.
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
      additionalProperties: false
    UpdateNoteRequest:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        timestamp:
          type: string
          description: ISO 8601 timestamp or YYYY-MM-DD in website timezone.
      additionalProperties: false
    AlertRequest:
      type: object
      properties:
        name:
          type: string
        trigger:
          type: object
          additionalProperties: true
        template:
          type: object
          additionalProperties: true
        isEnabled:
          type: boolean
      additionalProperties: true
    InviteTeamMemberRequest:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - viewer
          - member
      additionalProperties: false
    RemoveTeamMemberRequest:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
      additionalProperties: false
    ConnectStripeRequest:
      type: object
      required:
      - stripeRak
      properties:
        stripeRak:
          type: string
          writeOnly: true
      additionalProperties: true
    ConnectLemonSqueezyRequest:
      type: object
      required:
      - lemonsqueezyApiKey
      - lemonsqueezyStoreId
      properties:
        lemonsqueezyApiKey:
          type: string
          writeOnly: true
        lemonsqueezyStoreId:
          type: string
      additionalProperties: true
    ConnectPolarRequest:
      type: object
      required:
      - polarAccessToken
      - polarOrgId
      properties:
        polarAccessToken:
          type: string
          writeOnly: true
        polarOrgId:
          type: string
      additionalProperties: true
    ConnectPaddleRequest:
      type: object
      required:
      - paddleApiKey
      properties:
        paddleApiKey:
          type: string
          writeOnly: true
      additionalProperties: true
    UpdateBotTrafficSettingsRequest:
      type: object
      minProperties: 1
      properties:
        disableCompanies:
          type: array
          items:
            type: string
        enableCompanies:
          type: array
          items:
            type: string
        disableCrawlerIds:
          type: array
          items:
            type: string
        enableCrawlerIds:
          type: array
          items:
            type: string
        excludedCrawlerIds:
          type: array
          items:
            type: string
        verifiedOnly:
          type: boolean
        requireAuthToken:
          type: boolean
        hiddenCrawlers:
          type: array
          items:
            type: string
        hideDashboardCard:
          type: boolean
        groupBy:
          type: string
        pageFilterIds:
          type: array
          items:
            type: string
      additionalProperties: true
    IdentifyRequest:
      type: object
      required:
      - user_id
      - datafast_visitor_id
      properties:
        user_id:
          type: string
          maxLength: 255
        datafast_visitor_id:
          type: string
          format: uuid
      additionalProperties: true
      description: Additional top-level fields are shallow-merged into profile metadata. Do not send secrets.
    CreateGoalRequest:
      type: object
      required:
      - datafast_visitor_id
      - name
      properties:
        datafast_visitor_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Names are normalized to lowercase; identify is reserved.
        description:
          type: string
        metadata:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 255
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      required:
      - amount
      - currency
      - transaction_id
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        transaction_id:
          type: string
          minLength: 1
        datafast_visitor_id:
          type: string
        email:
          type: string
          format: email
        customer_email:
          type: string
          format: email
        name:
          type: string
        customer_name:
          type: string
        customer_id:
          type: string
        renewal:
          type: boolean
        refunded:
          type: boolean
        is_free_trial:
          type: boolean
        timestamp:
          type: string
          format: date-time
      additionalProperties: true
    PaymentCreated:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        transaction_id:
          type: string
      additionalProperties: true
      description: Payment create responses use plain JSON, without the status/data envelope.
