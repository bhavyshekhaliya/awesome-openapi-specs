openapi: 3.1.0
info:
  title: Hyros API
  version: '1.43'
  description: |
    ## Status Codes

    | Code | Meaning |
    |------|---------|
    | `200 OK` | Response to a successful GET, PUT, POST or DELETE |
    | `400 Bad Request` | Malformed request; form validation errors |
    | `401 Unauthorized` | Wrong Api-Key or not provided |
    | `403 Forbidden` | Api-Key is valid but lacks a role the endpoint requires (`Missing role <ROLE>`), or the Accessible-Account-Id header targets an account that is not one of the caller's connected client accounts, or one whose state does not grant access |
    | `429 Too Many Requests` | The per-second or per-minute request limit for that endpoint was exceeded |

    ## Unrecognized parameters and fields

    On the endpoints listed below, requests must contain only documented query parameters and body fields. An unknown query parameter, an unknown top-level body field, or a query parameter repeated more than once, is rejected with `400 Bad Request` naming the offender instead of being ignored. The error body lists the offenders as `Unknown parameter: <name>`, `Duplicate parameter: <name>` or `Unknown field: <name>`. For example, `GET /api/v1.0/products?bogus=1` returns `400` with `Unknown parameter: bogus`.

    Endpoints that enforce this:

    - `GET /api/v1.0/products`, `PUT /api/v1.0/products/{id}`, `DELETE /api/v1.0/products/{id}`
    - `GET /api/v1.0/carts`
    - `GET /api/v1.0/custom-costs`, `PUT /api/v1.0/custom-costs/{id}`, `DELETE /api/v1.0/custom-costs/{id}`
    - `PUT /api/v1.0/sources/{tag}`, `DELETE /api/v1.0/sources/{tag}`
    - `GET /api/v1.0/url-rules`, `GET /api/v1.0/url-rules/{id}`, `POST /api/v1.0/url-rules`, `PUT /api/v1.0/url-rules/{id}`, `DELETE /api/v1.0/url-rules/{id}`
    - `GET /api/v1.0/leads/aggregation`
    - `GET /api/v1.0/tags/count`
    - `GET /api/v1.0/attribution/roas`, `GET /api/v1.0/attribution/marginal-cac-curve`
    - `GET /api/v1.0/conversion-paths`
    - `POST /api/v1.0/reports/generate`, `GET /api/v1.0/reports/poll/{externalId}`
    - `GET /api/v1.0/requests/{request_id}`

    On every other endpoint, unknown query parameters and unknown body fields are ignored, and a repeated query parameter takes its first value. The request succeeds and the unrecognized input has no effect, so a typo silently changes what you get back: `GET /api/v1.0/leads?email=someone@example.com` is not a filter on `emails`, it returns the unfiltered lead list. Keep your own input validation in place for those endpoints.

    ## Values a field accepts

    A parameter or body field that takes one of a fixed set of values rejects anything else with `400 Bad Request`, naming the field, echoing the value it refused and listing what it accepts:

    ```
    { "result": "ERROR", "message": ["Invalid frequency 'WEEKLY'. Accepted values: DAILY, ONE_TIME"] }
    ```

    The accepted list is what **that field on that operation** takes, which is not always every value the field can hold elsewhere. `POST /api/v1.0/custom-costs` accepts only `DAILY` and `ONE_TIME` even though a cost created in the Hyros UI can be `MONTHLY`, and neither `POST` nor `PUT /api/v1.0/subscriptions` accepts the `UNKNOWN` status that `GET /api/v1.0/subscriptions` can both return and filter on.

    A value outside the list is refused. It is never read as absent, so a write never reports success having quietly ignored the field.

    ## Date Formats

    Dates are represented as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) strings (e.g. `2026-08-05T05:45:35Z`) in both requests and responses.

    ### Always send an explicit time zone offset

    A date sent without a time zone offset is not interpreted the same way when you write it as when you filter on it:

    - **Writing** (`POST` and `PUT` bodies): a date without an offset is stored as **UTC**. A date with no time at all becomes `00:00:00` UTC.
    - **Filtering** (the date parameters of the retrieval endpoints): a date without an offset is read in **your account's configured time zone**. A date with no time becomes `00:00:00` on a `from` bound and `23:59:59` on a `to` bound.

    A record written without an offset can therefore be missing from the filter for its own day. For an account on `-05:00`, a lead stage sent as `2026-08-27T00:00:00` is stored at `2026-08-27T00:00:00Z`, which is `2026-08-26T19:00` in the account time zone, so `stageFromDate=2026-08-27` does not return it while `stageToDate=2026-08-26` does.

    Sending the offset removes the ambiguity on both sides: `2026-08-27T00:00:00-05:00` is stored and filtered as the same instant.

    To see how a date you sent was interpreted, poll `GET /api/v1.0/requests/{request_id}` once the write is `PROCESSED`: its `result` returns the resource in the same shape as its retrieval endpoint, so its dates come back in your account's time zone with an explicit offset, except for the fields that endpoint documents as legacy or offset-less.

    ### Accepted forms

    The form accepted by every date field is `yyyy-MM-ddTHH:mm:ss` followed by `Z` or `+HH:mm` / `-HH:mm`, for example `2026-08-27T14:00:00-05:00`. Use it and you never have to think about the rest of this section.

    Shorter forms are also accepted: a bare date `yyyy-MM-dd`, and a date-time without seconds `yyyy-MM-ddTHH:mm`.

    `tagsDate` and `leadStage.date` are stricter than the rest: when an offset is present they require seconds precision and nothing more. Both `2026-08-27T14:00:00.123Z` (fractional seconds) and `2026-08-27T14:00-05:00` (no seconds) answer `Invalid date format.` on those two fields. The first of those is what most client libraries produce by default, so send plain seconds-precision dates to those two fields. Fractional seconds are also rejected on the `startDate` and `endDate` of the attribution reports, with `Invalid start date` / `Invalid end date`. Everywhere else, three-digit fractional seconds are accepted and dropped.

    Offsets must be written with a colon: `-05:00`, not `-0500`.

    ### Exceptions

    - `startDate` and `endDate` on `/api/v1.0/custom-costs` keep the wall clock: the offset you send is discarded rather than converted, so `2026-08-27T10:00:00-05:00` and `2026-08-27T10:00:00Z` are both stored as `10:00`. The response returns these two fields the same way, as a local date-time with no offset. The `fromDate`/`toDate` filters of `GET /custom-costs` are not exempt: they are read in your account's time zone, so on an account west of UTC a cost can fall outside the window covering its own day. Widen the window by a day when filtering costs.
    - On the attribution reports, `startDate` and `endDate` must either both carry an offset or both omit it. Sending an offset on only one of the two bounds is rejected with `There was a problem processing the date in the request.`

    Some legacy fields use different date encodings for backward compatibility. These exceptions are documented in the corresponding field descriptions.

    ## Date ranges in a future month

    Retrieval data is stored in monthly partitions, and the partition for a future month does not exist yet. A request whose date range reaches into such a month is rejected with `400 Bad Request` naming the bound that does, instead of failing while the data is read. The bound is read as the calendar month you wrote, so a range that ends today is always accepted — including an end of day written in a timezone ahead of ours — and so is one that ends on the last day of the current month. The error body carries `'toDate' cannot be in a future month: 2026-11-01`.

    The rule applies to `fromDate` and `toDate` on:

    - `GET /api/v1.0/leads`, `GET /api/v1.0/leads/clicks`, `GET /api/v1.0/leads/aggregation`
    - `GET /api/v1.0/sales`, `GET /api/v1.0/calls`, `GET /api/v1.0/carts`, `GET /api/v1.0/subscriptions`
    - `GET /api/v1.0/products`, `GET /api/v1.0/sources`, `GET /api/v1.0/ads`, `GET /api/v1.0/ad-accounts`
    - `GET /api/v1.0/tags/count`, `GET /api/v1.0/stages`, `GET /api/v1.0/keywords`
    - `GET /api/v1.0/custom-costs`, `GET /api/v1.0/url-rules`, `GET /api/v1.0/conversion-paths`

    and to `startDate` and `endDate` of the `configuration` sent to `POST /api/v1.0/reports/generate`.

    The attribution reports — `GET /api/v1.0/attribution`, `/attribution/roas`, `/attribution/ad-account` and `/attribution/marginal-cac-curve` — are stricter: no bound of their window may be in the future at all, read in your account's timezone. They answer `startDate or endDate cannot be in the future.` instead.

    ## Rate Limiting

    Requests are rate limited **per Hyros account, not per API key**: every key of the same account draws from the same budget. The limit always applies to the key owner, including when `Accessible-Account-Id` targets a client account.

    Each endpoint and HTTP method has **its own budget**, so `GET /leads` and `POST /orders` are counted separately and a client can run at the full rate against several endpoints at the same time.

    The defaults are **30 requests per second** and **1000 requests per minute**, per endpoint. They can be raised or lowered per account, so treat the response headers rather than these numbers as the source of truth.

    | Header | Description | Example |
    |--------|-------------|---------|
    | `X-RateLimit-Limit` | The policy in effect, as `capacity;w=window_seconds` for each window | `30;w=1, 1000;w=60` |
    | `X-RateLimit-Remaining` | Requests left in the most restrictive window | `25` |
    | `X-RateLimit-Reset` | Unix timestamp (seconds) at which the tokens for the rejected request would be available | `1707235200` |

    Those three accompany authenticated responses, so a `401` carries none of them, and they can also be absent when the limit could not be evaluated — treat a missing header as no information rather than an error. A rejected request answers `429 Too Many Requests`, adds `Retry-After` with the seconds to wait, and returns the standard error envelope with the message `You have reached the limit of api requests, please wait before sending again.`

    ## Asynchronous Processing

    Write operations (creates, updates and deletes) are processed **asynchronously**. A `200` response means the request was received and validated; the change is applied afterwards and may not be visible on an immediate read-back. Creates are typically visible within ~10 seconds. Updates and deletes typically take ~5 minutes, and can take longer under heavy load. Read (`GET`) operations are synchronous and return current data. Asynchronous operations are flagged with an **Asynchronous** note.

    Every write returns a `request_id`. To check whether it has been applied, poll it on the [Retrieve Request Status](#tag/request-status) endpoint, which reports whether the write is `PENDING`, `PROCESSED` or `FAILED` and, once `PROCESSED`, returns the resource it produced. Even after a write is reported as `PROCESSED`, its changes can still take a few seconds to appear on the corresponding `GET` endpoints, so a read-back immediately after a success may briefly not reflect them.

    A write carrying a blacklisted email address is the exception: it is refused synchronously with a `400` and no `request_id` is issued, because the event would be discarded and there would be nothing to report on. See *Delete Lead*.

    ## Agency Access to Client Accounts

    Agencies can act on a connected client account, identified by its external id, on both API surfaces. The rule is the same everywhere: the caller must have an approved connected-account relation with the target account, the request then runs against that account instead of the caller's own, and any other target is rejected with an authorization error (`Not authorized: account <id> is not one of your connected client accounts.`). A connected account whose own state does not grant access is rejected the same way, naming that reason instead (`Not authorized: account <id> is not active.`). When no account id is sent, the request operates on the caller's own account. Rate limits always apply to the caller.

    * **REST API**: send the optional `Accessible-Account-Id` header on any `/api/v1.0` request. Unauthorized targets are rejected with `403 Forbidden` and the standard error body (`result: ERROR`).
    * **MCP tools**: pass the optional `accessible_account_id` tool argument. It is advertised in `tools/list` only to agency accounts but validated on every call; unauthorized targets produce a tool error. Tools that are not tied to an account's data (docs search, integration types) and admin tools (which take a `productId` argument instead) do not accept it.
servers:
  - url: https://api.hyros.com/v1
    description: Production
security:
  - ApiKeyAuth: []
tags:
  - name: Leads
  - name: Sales
  - name: Orders
  - name: Calls
  - name: Conversion Paths
  - name: Attribution
  - name: Ad Accounts
  - name: Products
  - name: Tags
  - name: Sources
  - name: URL Rules
  - name: Custom Costs
  - name: Clicks
  - name: Carts
  - name: User Info
  - name: Keywords
  - name: Subscriptions
  - name: Tracking Script
  - name: Domains
  - name: Stages
  - name: Webhook Subscriptions
  - name: Reports
  - name: Request Status
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-Key
  schemas:
    SuccessResponse:
      type: object
      properties:
        request_id:
          type: string
        result:
          type: string
          example: OK
    ErrorResponse:
      type: object
      properties:
        result:
          type: string
          example: ERROR
        message:
          type: array
          items:
            type: string
    RequestStatus:
      type: object
      properties:
        requestId:
          type: string
          description: The `request_id` of the polled write request.
          example: 251b9b0e20a441fba3d3c346579e7105
        status:
          type: string
          enum:
            - PENDING
            - PROCESSED
            - FAILED
          description: Processing status of the asynchronous write.
        eventType:
          type: string
          description: Type of the original operation.
          example: CREATE_LEAD
        errorMessage:
          type: string
          description: Reason for the failure. Present only when `status` is `FAILED`.
        createdAt:
          type: string
          description: Date the request was received (ISO-8601, UTC).
          example: '2026-07-21T21:17:03Z'
        processedAt:
          type: string
          description: Date the request finished processing (ISO-8601, UTC). Absent while `status` is
            `PENDING`.
          example: '2026-07-21T21:20:41Z'
        result:
          oneOf:
            - $ref: '#/components/schemas/LeadWithStage'
            - $ref: '#/components/schemas/Cart'
            - $ref: '#/components/schemas/Source'
            - $ref: '#/components/schemas/CustomCost'
            - $ref: '#/components/schemas/Product'
            - $ref: '#/components/schemas/Call'
            - $ref: '#/components/schemas/Subscription'
            - $ref: '#/components/schemas/Click'
            - type: array
              title: Sale[]
              items:
                $ref: '#/components/schemas/Sale'
            - type: array
              title: Call[]
              items:
                $ref: '#/components/schemas/Call'
            - type: array
              title: Subscription[]
              items:
                $ref: '#/components/schemas/Subscription'
          description: 'The resource produced by the write, embedded once the request is `PROCESSED`,
            using the same shape its own endpoint returns. It is a single object for lead create/update
            requests (`eventType` `CREATE_LEAD` or `UPDATE_LEAD`, shaped like an item of `GET /api/v1.0/leads`),
            cart create/update requests (`CREATE_CART` or `UPDATE_CART`, like `GET /api/v1.0/carts`),
            source create requests (`CREATE_SOURCE_LINK`, like `GET /api/v1.0/sources`), custom cost create
            requests (`CREATE_CUSTOM_COST`, like `GET /api/v1.0/custom-costs`), product create requests
            (`CREATE_PRODUCT`, like `GET /api/v1.0/products`), click create requests (`CREATE_CLICK`,
            like an item of `GET /api/v1.0/leads/clicks`, with `leadId` and `email` empty until the click
            is connected to a lead) and call/subscription create requests (`CREATE_CALL` and `CREATE_SUBSCRIPTION`,
            like `GET /api/v1.0/calls` and `GET /api/v1.0/subscriptions`). It is an array for order requests
            (`CREATE_ORDER`, `UPDATE_ORDER`, `REFUND_ORDER` or `UPDATE_SALE`) — the order''s sales as
            `GET /api/v1.0/sales` returns them, since an order is stored as one sale per item — and for
            call and subscription update requests (`UPDATE_CALL`, `UPDATE_SUBSCRIPTION`), which can target
            several ids at once. Omitted while `PENDING` or `FAILED`, and for delete requests other than
            an order refund, whose sales survive it and carry a `refundDate` and the refunded amount in
            `price.refunded`. It is a snapshot taken when the write completed, so enrichment that depends
            on other resources may be incomplete: a cart''s `lead` may be absent when the same request
            created it.'
    AggregationResult:
      type: object
      properties:
        groups:
          type: array
          description: One entry per value of the grouped attribute, largest first. Only as many as `groupsLimit`
            are returned.
          items:
            type: object
            properties:
              key:
                type: string
                description: The value of the attribute. Always a string, including when the attribute
                  is numeric.
                example: Opt In
              count:
                type: integer
                description: Records in this group.
                example: 12
        remainingCount:
          type: integer
          description: Records left out because their group ranked below the ones returned. Raising `groupsLimit`
            by this number always brings every remaining group.
        totalCount:
          type: integer
          description: How many records matched the filters, whether or not they hold a value for the
            attribute. The groups do not add up to it.
          example: 30
    WebhookSubscription:
      type: object
      properties:
        externalId:
          type: string
          description: Opaque identifier of the subscription.
          example: sub-2a475f6baf8f416bac9ff60e1a0fabb5
        name:
          type: string
          example: My CRM sync
        targetUrl:
          type: string
          description: Public `http`/`https` URL where the event payloads are sent via POST.
          example: https://example.com/hooks/hyros
        eventTypes:
          type: array
          items:
            type: string
            enum:
              - sale.attributed
              - sale.refunded
              - call.attributed
              - lead.opted.in
              - lead.opted.in.first.time
              - lead.origin.assigned
              - lead.stage.changed
              - lead.tag.added
              - lead.tag.removed
              - subscription.created
              - subscription.status.changed
          example:
            - sale.attributed
            - lead.opted.in
        state:
          type: string
          enum:
            - ACTIVE
            - DELETED
            - AUTOMATIC_PAUSED
            - MANUALLY_PAUSED
          example: ACTIVE
        secretKey:
          type: string
          description: Secret used to validate the HMAC signature of delivered events. Returned once,
            in the create (`POST`) response; it is not included in the list (`GET`) response. It can also
            be found in the Hyros app under Settings → Integrations → Hyros Webhook Subscription.
          example: ssk-244e8d359f67456cb9efac27913283fb
        creationDate:
          type: string
          description: Creation date, in UTC.
          example: '2026-07-09T14:28:15Z'
        lastDeliveryDate:
          type: string
          nullable: true
          description: Date of the last event delivery, in UTC. `null` if no event has been delivered
            yet.
          example: '2026-07-09T15:13:20Z'
    AdspendType:
      type: string
      enum:
        - FACEBOOK
        - GOOGLE
        - GOOGLE_V2
        - TIKTOK
        - SNAPCHAT
        - LINKEDIN
        - TWITTER
        - PINTEREST
        - BING
        - REDDIT
        - APPLOVIN
        - WHOP_ADS
    AdspendSubType:
      type: string
      enum:
        - DISPLAY
        - VIDEO
    SubscriptionStatus:
      type: string
      description: UNKNOWN is the status Hyros stores when the billing platform reports one it does not
        model. It is returned and it can be filtered on, but a write does not accept it.
      enum:
        - ACTIVE
        - TRIALING
        - CANCELED
        - PAST_DUE
        - INCOMPLETE
        - INCOMPLETE_EXPIRED
        - UNPAID
        - COMPLETED
        - PAUSED
        - UNKNOWN
    SubscriptionStatusWrite:
      type: string
      description: The statuses a write accepts, which is every status except the UNKNOWN sentinel Hyros
        stores for a status it does not model.
      enum:
        - ACTIVE
        - TRIALING
        - CANCELED
        - PAST_DUE
        - INCOMPLETE
        - INCOMPLETE_EXPIRED
        - UNPAID
        - COMPLETED
        - PAUSED
    CallState:
      type: string
      description: 'On a write, a value outside this list is rejected with `Invalid state ''<value>''.
        Accepted values: QUALIFIED, UNQUALIFIED, CANCELLED, NO_SHOW`. Omitting the field on create leaves
        the state unset rather than defaulting it.'
      enum:
        - QUALIFIED
        - UNQUALIFIED
        - CANCELLED
        - NO_SHOW
    AdOptimizationConsent:
      type: string
      enum:
        - GRANTED
        - DENIED
        - UNSPECIFIED
    Item:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          description: Name of the product.
        price:
          type: number
          description: Product price per unit (costOfGoods included).
        externalId:
          type: string
          description: Unique identifier from the external integration.
        quantity:
          type: number
          description: Number of copies purchased. Defaults to 1.
          default: 1
        sku:
          type: string
          description: Unique product reference code.
        costOfGoods:
          type: number
          description: Cost per unit of manufacture. Must be included in the price. Defaults to 0.
          default: 0
        taxes:
          type: number
          description: Taxes applied to the item per unit. Defaults to 0.
          default: 0
        itemDiscount:
          type: number
          description: Discount applied to this specific line item.
        packages:
          type: array
          items:
            type: string
          description: Product packages this item belongs to (used for recurring sales attribution).
        isRebill:
          type: boolean
          description: If true, the sale is marked as recurring even if it's the first one.
        tag:
          type: string
          description: Tag to create for the sale item.
        categoryName:
          type: string
          description: Links the sale to a product category.
    CartItem:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: number
        externalId:
          type: string
        quantity:
          type: number
          default: 1
        sku:
          type: string
          description: Unique product reference code.
        isRebill:
          type: boolean
          description: If true, the sale is marked as recurring even if it's the first one.
    Provider:
      type: object
      properties:
        id:
          type: string
          description: ID of lead in external platform.
        integration:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
            id:
              type: string
              description: Account ID of the integration.
    AdSource:
      type: object
      properties:
        adSourceId:
          type: string
        adAccountId:
          type: string
          description: |
            Id of the ad account the source belongs to, matching the ids returned by `GET /ad-accounts`. Absent when the source carries no ad platform: sources created by hand belong to no ad account, so there is nothing to report.
        platform:
          $ref: '#/components/schemas/AdspendType'
    TrafficSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Goal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    SourceLinkAd:
      type: object
      properties:
        name:
          type: string
        adSourceId:
          type: string
    AdHierarchyLevel:
      type: object
      description: |
        One level of the ad hierarchy a source click belongs to, named as Hyros knows it and identified by the id its ad platform issues.

        Those ids are the ones the reporting endpoints resolve from, so they can be fed straight back in:

        | Journey field | Endpoint | Value to send |
        |---------------|----------|---------------|
        | `ad` | `GET /attribution/roas`, `GET /attribution/marginal-cac-curve` | `id` with `level=ad` |
        | `adSet` | idem | `id` with `level=source_link` |
        | `campaign` | idem | `id` with `level=campaign` |
        | `adAccount` | idem | `id` with `level=account` |
        | `ad`, `adSet`, `campaign` | `GET /attribution` | `ids`, with the platform-specific `level` (e.g. `facebook_adset`) |
        | `adAccount` | `GET /ad-accounts`, `GET /attribution/ad-account` | `ids` |
        | `ad` | `GET /ads` | `adSourceIds` |
        | `adSet` | `GET /keywords` | `adgroupId` |
      properties:
        name:
          type: string
        adSourceId:
          type: string
          description: The id the ad platform issues for this entity.
    Attribution:
      type: object
      properties:
        sourceLinkId:
          type: string
        name:
          type: string
        tag:
          type: string
        disregarded:
          type: boolean
        organic:
          type: boolean
        clickDate:
          type: string
        clickId:
          type: string
        adSource:
          $ref: '#/components/schemas/AdSource'
        sourceLinkAd:
          $ref: '#/components/schemas/SourceLinkAd'
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        goal:
          $ref: '#/components/schemas/Goal'
        category:
          $ref: '#/components/schemas/Category'
        gclId:
          type: string
          description: Only for Google.
        gbraId:
          type: string
          description: Only for Google.
        wbraId:
          type: string
          description: Only for Google.
    Price:
      type: object
      properties:
        currency:
          type: string
        price:
          type: number
        discount:
          type: number
        hardCost:
          type: number
        refunded:
          type: number
    Lead:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
        creationDate:
          type: string
          description: ISO 8601 date. When the lead is embedded in `/sales`, `/calls`, or `/subscriptions`,
            it is returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format for backward compatibility.
          example: '2023-01-04T04:36:41-05:00'
        lastUpdatedDate:
          type: string
          example: '2023-06-10T09:12:00-05:00'
        tags:
          type: array
          items:
            type: string
        ips:
          type: array
          items:
            type: string
        phoneNumbers:
          type: array
          items:
            type: string
        firstName:
          type: string
        lastName:
          type: string
        provider:
          $ref: '#/components/schemas/Provider'
        firstSource:
          $ref: '#/components/schemas/Attribution'
          description: First attributed source of the lead. Omitted when unknown.
        lastSource:
          $ref: '#/components/schemas/Attribution'
          description: Last attributed source of the lead. Omitted when unknown.
        originLead:
          $ref: '#/components/schemas/Lead'
          description: The origin lead this lead was merged into, when applicable. Omitted otherwise.
        isOriginLead:
          type: boolean
          description: Present on the leads journey (`GET /leads/journey`) and on the nested `originLead`;
            indicates the lead is an origin lead.
    LeadStage:
      type: object
      description: Current (most recent) stage of the lead.
      properties:
        name:
          type: string
          description: Name of the stage.
        date:
          type: string
          description: Date the stage was applied (ISO-8601 with timezone offset). Omitted when unavailable.
    LeadWithConsent:
