  /api/v1.0/subscriptions:
    get:
      tags:
        - Subscriptions
      summary: Retrieve Subscriptions
      operationId: get_api_v1_0_subscriptions
      description: |
        > [!NOTE]
        > **Required role** — Get Subscriptions

        Search and retrieve subscriptions by start/end date, last-modified date, email, lead id, product tag, id, and states.
      parameters:
        - name: ids
          in: query
          description: Array of subscription ids. Maximum of 50 ids.
          schema:
            type: string
        - name: emails
          in: query
          description: Array of emails or prefixes. Maximum of 50 emails.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of leadIds. Maximum of 50 lead ids.
          schema:
            type: string
        - name: productTags
          in: query
          description: Array of product tags. Maximum of 20 product tags.
          schema:
            type: string
        - name: subscriptionStates
          in: query
          description: 'Filter by subscription status, comma separated. Defaults to all states. An unrecognized
            value is rejected with `Invalid subscriptionStates ''<value>''. Accepted values: ACTIVE, TRIALING,
            CANCELED, PAST_DUE, INCOMPLETE, INCOMPLETE_EXPIRED, UNPAID, COMPLETED, PAUSED, UNKNOWN`.'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SubscriptionStatus'
        - name: fromDate
          in: query
          description: ISO 8601 date. Only subscriptions whose join date is more recent than this will
            be retrieved. If the date does not include a timezone, the configured account timezone will
            be assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only subscriptions whose join date is older than this will be retrieved.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedFromDate
          in: query
          description: ISO 8601 date. Only subscriptions updated on or after this date will be retrieved.
            Use it to fetch just the subscriptions that changed since your last request. If the date does
            not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedToDate
          in: query
          description: ISO 8601 date. Only subscriptions updated on or before this date will be retrieved.
            If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it
            to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad
            Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Subscriptions
      summary: Create Subscription
      operationId: post_api_v1_0_subscriptions
      description: |
        > [!NOTE]
        > **Required role** — Create Subscriptions

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a subscription. Additionally, creates the lead if not already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - startDate
                - price
                - periodicity
              properties:
                email:
                  type: string
                  description: Required if no phone number is provided.
                parentEmail:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                stage:
                  type: string
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Required if no email is provided.
                subscriptionId:
                  type: string
                name:
                  type: string
                status:
                  $ref: '#/components/schemas/SubscriptionStatusWrite'
                startDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                  example: '2021-04-16T20:35:00'
                endDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                cancelAtDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                trialStartDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                trialEndDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                planId:
                  type: string
                price:
                  type: number
                periodicity:
                  type: string
                  enum:
                    - DAY
                    - WEEK
                    - MONTH
                    - QUARTER
                    - YEAR
            example:
              email: john@doe.com
              parentEmail: jane@doe.com
              firstName: John
              lastName: Doe
              leadIps:
                - 172.8.105.28
              stage: Customer
              phoneNumbers:
                - '1105385366'
              endDate: '2025-03-16T20:35:00'
              subscriptionId: '18294892740'
              startDate: '2025-01-16T20:35:00'
              trialStartDate: '2025-02-16T20:35:00'
              planId: IOJNF0293IRD9023JF0D
              price: 8.9
              periodicity: MONTH
              status: ACTIVE
              name: Monthly Subscription Active
      responses:
        '200':
          description: Subscription created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Subscriptions
      summary: Update Subscription
      operationId: put_api_v1_0_subscriptions
      description: |
        > [!NOTE]
        > **Required role** — Update Subscriptions

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update a subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Array of subscription ids. Maximum of 50 ids.
                  maxItems: 50
                name:
                  type: string
                status:
                  $ref: '#/components/schemas/SubscriptionStatusWrite'
                startDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                endDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                cancelAtDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                trialStartDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                trialEndDate:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                price:
                  type: number
            example:
              ids:
                - subscriptionId
              status: CANCELED
              name: Monthly Subscription Active
              startDate: '2025-01-16T20:35:00'
              endDate: '2025-03-16T20:35:00'
              trialStartDate: '2025-02-16T20:35:00'
              trialEndDate: '2025-03-16T20:35:00'
              cancelAtDate: '2025-03-16T20:35:00'
      responses:
        '200':
          description: Subscription updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
