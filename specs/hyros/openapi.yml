  /api/v1.0/clicks:
    post:
      tags:
        - Clicks
      summary: Create Click
      operationId: post_api_v1_0_clicks
      description: |
        > [!NOTE]
        > **Required role** — Create Clicks

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Creates a click with the URL the user clicked on and a session id representing the potential lead session.
        Optionally includes an email to create a lead, and ad data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - referrerUrl
              properties:
                referrerUrl:
                  type: string
                  description: The URL for the click.
                sessionId:
                  type: string
                  description: Unique string representing the lead session.
                previousUrl:
                  type: string
                userAgent:
                  type: string
                ip:
                  type: string
                sourceLinkTag:
                  type: string
                  description: A `@tag` representing the ad. Must start with `@`.
                isOrganic:
                  type: boolean
                integrationType:
                  type: string
                  enum:
                    - GOOGLE
                    - GOOGLE_V2
                    - FACEBOOK
                    - TIKTOK
                    - SNAPCHAT
                    - LINKEDIN
                    - TWITTER
                    - PINTEREST
                    - BING
                  description: Subset of `AdspendType` accepted when creating a click.
                adSourceId:
                  type: string
                  description: |
                    Id of the group of ads. Required if `integrationType` is present.
                    - Facebook: adset id · Google: campaign id · TikTok: ad group id · Snapchat: ad squad id · LinkedIn: campaign id
                adspendAdId:
                  type: string
                  description: Id of the ad. Only for Facebook and Google.
                adSourceClickId:
                  type: string
                  description: Click id in the ad platform. Used for offline conversions (Facebook, Google,
                    TikTok, Snapchat).
                email:
                  type: string
                phones:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                tag:
                  type: string
                  description: Tag to apply to the lead.
                date:
                  type: string
                  description: |
                    Date when the click was made. Allowed formats:
                    `yyyy-MM-ddTHH:mm:ssZ`, `yyyy-MM-ddTHH:mmZ`, `yyyy-MM-ddTHH:mm:ss+HH:mm`,
                    `yyyy-MM-ddTHH:mm+HH:mm`, `yyyy-MM-ddTHH:mm:ss`, `yyyy-MM-ddTHH:mm`, `yyyy-MM-dd`

                    Without a time zone offset the date is stored as UTC; see **Date Formats**.
            examples:
              organic:
                summary: Click for an organic ad
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  previousUrl: previous.url
                  userAgent: Mozilla/5.0 (X11; Linux x86_64)
                  ip: 0.0.0.0
                  sourceLinkTag: '@facebook-post'
                  isOrganic: true
              platform:
                summary: Click for a platform ad
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  ip: 0.0.0.0
                  integrationType: GOOGLE
                  adSourceId: '6500000028'
                  adspendAdId: '4800000004652'
                  adSourceClickId: Cj0KxxxxxxKQBhCNARIsACUEW_bnG48
              leadClick:
                summary: Click for a platform ad linked to a lead
                value:
                  sessionId: RWp7VmL3nlAi6zdG0KKQ
                  referrerUrl: landing.page.com
                  ip: 0.0.0.0
                  integrationType: GOOGLE
                  adSourceId: '6500000028'
                  adSourceClickId: Cj0KxxxxxxKQBhCNARIsACUEW_bnG48
                  email: new.lead@mail.com
                  phones:
                    - 202-555-0139
      responses:
        '200':
          description: Click created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/carts:
    get:
      tags:
        - Carts
      summary: Retrieve Carts
      operationId: get_api_v1_0_carts
      description: |
        > [!NOTE]
        > **Required role** — Get Carts

        Search and retrieve carts by creation date, purchased state (whether the cart has an
        associated order or not), email and lead id.

        A cart created through `POST /api/v1.0/carts` has no associated order yet, so it is returned
        by this endpoint with no filter and by `purchased=false`, but **not** by `purchased=true`.
        It starts being returned by `purchased=true` only once a sale is registered for it, which
        happens through a separate path after the cart write has already completed.
      parameters:
        - name: emails
          in: query
          description: Array of emails or prefixes. Maximum of 50 emails.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of leadIds. Maximum of 50 lead ids.
          schema:
            type: string
        - name: purchased
          in: query
          description: Filter by purchased state. `true` returns only purchased carts (with orderId);
            `false` returns carts without orderId.
          schema:
            type: boolean
        - name: fromDate
          in: query
          description: ISO 8601 date. Only carts whose creation date is more recent than this will be
            retrieved. If the date does not include a timezone, the configured account timezone will be
            assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2023-08-24T00:00:00-03:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only carts whose creation date is older than this will be retrieved.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2023-08-24T00:00:00-03:00'
        - name: pageSize
          in: query
          description: Maximum number of carts per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it
            to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad
            Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Carts
      summary: Create Cart
      operationId: post_api_v1_0_carts
      description: |
        > [!NOTE]
        > **Required role** — Create Carts

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a cart. Additionally, creates the lead if not already present.

        When the cart cannot be created, the request reaches `FAILED` with one of these
        `errorMessage` values: `The cart total exceeds the maximum allowed amount.`,
        `The provided email address is invalid.`, `The cart could not be processed for this
        account.`, or `An internal error occurred while processing the request.` for internal
        failures. Requests rejected by validation, such as a cart with no items, return `400`
        synchronously and never reach `FAILED`.

        A cart carrying a blacklisted email address is also refused synchronously with a `400`,
        and no `request_id` is issued for it.

        Re-sending the same `cartId` is not an error: the request reaches `PROCESSED` with the
        already-existing cart as its `result`, instead of a duplicate-resource error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                cartId:
                  type: string
                  description: ID of the cart. A default one will be created if not included.
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                  description: IPs of the customer that owns the cart for ad attribution. Maximum of 3
                    ips.
                  maxItems: 3
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                date:
                  type: string
                  description: ISO 8601 date. Timezone recommended. Without a time zone offset the date
                    is stored as UTC; see **Date Formats**.
                  example: '2021-04-16T20:35:00-06:00'
                priceFormat:
                  type: string
                  enum:
                    - DECIMAL
                    - INTEGER
                  default: DECIMAL
                currency:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                  minItems: 1
            example:
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              email: john@doe.com
              firstName: John
              lastName: Doe
              date: '2021-09-06T12:00:12Z'
              currency: USD
              items:
                - name: T-shirt-blue
                  price: 9.5
                  externalId: '23456798'
                  quantity: 3
                  sku: DEPOR-XYZ-BLN-41
                  isRebill: false
              priceFormat: DECIMAL
              phoneNumbers:
                - '2345678901'
              leadIps:
                - 70.107.190.180
      responses:
        '200':
          description: Cart created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: string
                  message:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Carts
      summary: Update Cart
      operationId: put_api_v1_0_carts
      description: |
        > [!NOTE]
        > **Required role** — Update Carts

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update a cart.

        An item already on the cart is updated in place rather than added again. Items are matched
        by `sku` when both the request and the stored item carry one, and by `name` otherwise.
        Items the request does not mention are left on the cart.

        When the update cannot be applied, the request reaches `FAILED` with one of these
        `errorMessage` values: `The cart total exceeds the maximum allowed amount.`,
        `The cart could not be processed for this account.`, or `An internal error occurred while
        processing the request.` for internal failures. Requests rejected by validation, such as a
        cart with no items, return `400` synchronously and never reach `FAILED`.

        Re-sending the same update is not an error: it reaches `PROCESSED` with the current cart as
        its `result`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
                - items
              properties:
                cartId:
                  type: string
                  description: ID of the cart to update.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CartItem'
                  minItems: 1
                date:
                  type: string
                  description: ISO 8601 date. Without a time zone offset the date is stored as UTC; see
                    **Date Formats**.
                priceFormat:
                  type: string
                  enum:
                    - DECIMAL
                    - INTEGER
                  default: DECIMAL
                currency:
                  type: string
            example:
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              date: '2021-09-06T12:00:12Z'
              currency: USD
              items:
                - name: T-shirt-red
                  price: 9.5
                  externalId: '23456333'
                  quantity: 1
                  sku: DEPOR-XYZ-RED-41
                  isRebill: false
              priceFormat: DECIMAL
      responses:
        '200':
          description: Cart updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
