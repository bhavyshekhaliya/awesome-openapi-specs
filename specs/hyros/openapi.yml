  /api/v1.0/requests/{request_id}:
    get:
      tags:
        - Request Status
      summary: Retrieve Request Status
      operationId: get_api_v1_0_requests_request_id
      description: |
        > [!NOTE]
        > **Required role** — Get Request Status

        Write operations are processed **asynchronously** (see *Asynchronous Processing*), so a read-back immediately after a `200` may not yet reflect the change. Instead of retrying the write — which can create duplicates — poll this endpoint with the `request_id` the write returned to learn whether it is still `PENDING`, has been `PROCESSED`, or `FAILED`. Statuses are retained for 2 hours.

        `PROCESSED` means the resource has been stored **and** indexed; it will appear on its own endpoint shortly, though a read-back within a few seconds of the `PROCESSED` status may not yet reflect it. `PENDING` means the write has not been confirmed yet; it is not a failure, and it is never a reason to resend the write. A request that stays `PENDING` until it expires should be reported to support rather than retried — the resource was most likely created, and sending it again would duplicate it.

        Once the status is `PROCESSED`, the response also carries a nested `result` holding the resource the write produced, in the same shape its own endpoint returns: for a lead, the `lead` object of `GET /leads`; for a bulk tag request (`POST /leads/tags`), the array of the tagged leads as `GET /leads` returns them; for an order, the array of its sales as `GET /sales` returns them; for a cart, the `cart` object of `GET /carts`; for a call, the `call` object of `GET /calls`, or the array of them when the write targeted several ids; for a source, the `source` object of `GET /sources`; for a custom cost, the `custom cost` object of `GET /custom-costs`; for a product, the `product` object of `GET /products`; for a subscription, the `subscription` object of `GET /subscriptions`, or the array of them when the write targeted several ids; for a click, the `click` object of `GET /leads/clicks`, with `leadId` and `email` empty until the click is connected to a lead. This body is a **snapshot taken at the moment the write completed**, not a live read: it reflects the state right after your operation and does not pick up later changes. Use it to confirm what your write produced; use the resource's own endpoint for its current state.

        A write that produces nothing readable — a deletion — is reported as `PROCESSED` with no `result` body. A `request_id` that does not belong to your account is reported as not found.
      parameters:
        - name: request_id
          in: path
          required: true
          description: The `request_id` returned when the original write request was accepted.
          schema:
            type: string
          example: 251b9b0e20a441fba3d3c346579e7105
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/RequestStatus'
                  request_id:
                    type: string
              examples:
                processed:
                  summary: A processed lead creation
                  value:
                    result:
                      requestId: 251b9b0e20a441fba3d3c346579e7105
                      status: PROCESSED
                      eventType: CREATE_LEAD
                      createdAt: '2026-07-21T21:17:03Z'
