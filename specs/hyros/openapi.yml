                  type: string
                  description: Name of the call.
                email:
                  type: string
                  description: Email associated with the lead.
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                stage:
                  type: string
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                externalId:
                  type: string
                  description: Unique identifier from the external integration. If a call with the same
                    externalId exists, it will be updated.
                id:
                  type: string
                  description: 'DEPRECATED: Use externalId instead.'
                date:
                  type: string
                  description: ISO 8601 date when the call was processed. Without a time zone offset the
                    date is stored as UTC; see **Date Formats**.
                  example: '2021-04-16T20:35:00'
                qualified:
                  type: boolean
                  description: 'DEPRECATED: Use state instead.'
                qualification:
                  type: string
                  description: Custom name of the qualification to apply to the call.
                state:
                  $ref: '#/components/schemas/CallState'
            example:
              name: Call 1
              email: john@doe.com
              firstName: John
              lastName: Doe
              leadIps: []
              stage: SQL
              phoneNumbers: []
              date: '2021-04-16T20:35:00'
              qualification: Qualified
              state: QUALIFIED
      responses:
        '200':
          description: Call created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Calls
      summary: Update Calls
      operationId: put_api_v1_0_calls
      description: |
        > [!NOTE]
        > **Required role** — Update Calls

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update calls by their ids.
      parameters:
        - name: ids
          in: query
          description: Array of call ids to update. Provide either `ids` or `externalIds`, not both. Maximum
            of 50 ids.
          schema:
            type: string
        - name: externalIds
          in: query
          description: Array of call externalIds to update. Provide either `ids` or `externalIds`, not
            both. Maximum of 50 external ids.
          schema:
            type: string
        - name: name
          in: query
          required: true
          description: Call name to assign.
          schema:
            type: string
        - name: qualification
          in: query
          description: Call qualification to assign.
          schema:
            type: string
        - name: state
          in: query
          description: Call state to assign.
          schema:
            $ref: '#/components/schemas/CallState'
        - name: qualified
          in: query
          description: 'DEPRECATED: Use state instead.'
          schema:
            type: boolean
      responses:
        '200':
          description: Calls updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
