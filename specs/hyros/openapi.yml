  /api/v1.0/url-rules:
    get:
      tags:
        - URL Rules
      summary: List URL Rules
      operationId: get_api_v1_0_url_rules
      description: |
        > [!NOTE]
        > **Required role** — Get URL Rules

        Retrieve the account's URL rules. Only simple rules are returned; built-in default rules are
        excluded. Use the returned opaque `id` (e.g. `ur-<id>`) to retrieve, update or delete a rule.
      parameters:
        - name: ids
          in: query
          description: 'Array of opaque URL rule ids (as returned in the `id` field, e.g. `ur-<id>`) to
            filter by. Maximum of 50 ids. An id not matching that format is rejected with `Invalid field
            format: ids`.'
          schema:
            type: string
        - name: tag
          in: query
          description: Return only the rule carrying this exact tag, including its prefix.
          schema:
            type: string
        - name: urlRuleActionType
          in: query
          description: 'Return only rules of this flavor. An unrecognized value is rejected with `Invalid
            urlRuleActionType ''<value>''. Accepted values: ACTION, SOURCE_LINK, SALE, SUBSCRIPTION, LEAD_STAGE,
            CALL_QUALIFICATION`.'
          schema:
            type: string
            enum:
              - ACTION
              - SOURCE_LINK
              - SALE
              - SUBSCRIPTION
              - LEAD_STAGE
              - CALL_QUALIFICATION
        - name: fromDate
          in: query
          description: ISO 8601 date. Only rules created on or after this date are retrieved. If the date
            does not include a timezone, the configured account timezone will be assumed. Cannot be in
            a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only rules created on or before this date are retrieved. If the
            date does not include a timezone, the configured account timezone will be assumed. Cannot
            be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of rules per page. Range 1-250. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, returned as `nextPageId` in each response. Changing any other
            parameter resets pagination. A cursor that is unknown or has expired is rejected with `The
            provided pageId is invalid or has expired` rather than silently returning the first page.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/UrlRule'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - URL Rules
      summary: Create URL Rule
      operationId: post_api_v1_0_url_rules
      description: |
        > [!NOTE]
        > **Required role** — Create URL Rules

        Create a URL rule. Each rule matches a tracked URL against `wordsToMatch` and, on a match,
        applies its `tag`. The tag prefix sets the rule flavor — `!` action, `@` source, `$` sale,
        `#` subscription — and an invalid prefix is rejected (see the `tag` field). Lead-stage rules
        are the exception: they take a prefix-less tag together with `createLeadStage: true`. A rule
        whose tag or matching words duplicate an existing rule is rejected with `A URL rule with this
        tag or matching words already exists`. Only simple rules can be created through the API.

        The operation is synchronous: on success the new rule's `id` is returned in `result`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlRuleCreate'
            examples:
              action:
                summary: Action-tag rule on webinar registration URLs
                value:
                  name: Webinar Registration
                  tag: '!webinar-registration'
                  wordsToMatch:
                    - webinar/register
                  sourceRuleTypes:
                    - PREVIOUS_URL
              sourceWithManualCategories:
                summary: Source-tag rule assigning fixed traffic source and source categories
                value:
                  name: Paid Facebook Traffic
                  tag: '@facebook-ads'
                  wordsToMatch:
                    - fbclid
                  sourceRuleTypes:
                    - REFERRER_URL
                  trafficSourceCategory: Facebook
                  sourceCategory: Paid
              leadStage:
                summary: Lead-stage rule — prefix-less tag becomes the stage name
                value:
                  name: Booked Call
                  tag: booked-call
                  wordsToMatch:
                    - calendar/booked
                  sourceRuleTypes:
                    - PREVIOUS_URL
                  createLeadStage: true
      responses:
        '200':
          description: URL rule created successfully. `result` carries the new rule's id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: string
                    description: Opaque id of the newly created rule (e.g. `ur-<id>`), for use with the
                      retrieve/update/delete endpoints.
                    example: ur-a3f5c9d2e1b8074f6c2d9a1e5b3f7c8d0e2a4b6c8d0f1a3b5c7d9e1f2a4b6c8d
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/url-rules/{id}:
    get:
      tags:
        - URL Rules
      summary: Retrieve URL Rule
      operationId: get_api_v1_0_url_rules_id
      description: |
        > [!NOTE]
        > **Required role** — Get URL Rules

        Retrieve a single URL rule by its id. Returns the standard list envelope with at most one
        element — an empty `result` array when no rule has that id.
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque id of the URL rule to retrieve (e.g. `ur-<id>`), as returned by `GET /api/v1.0/url-rules`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/UrlRule'
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - URL Rules
      summary: Update URL Rule
      operationId: put_api_v1_0_url_rules_id
      description: |
        > [!NOTE]
        > **Required role** — Update URL Rules

        Update a URL rule by its id. Every field is optional: only the fields included in the request are
        modified; any field left out is kept unchanged. Pausing a rule is therefore a one-field request —
        `{"isEnabled": false}` — with no need to read the rule and send it back whole.

        A field that *is* sent replaces its stored value, so an empty array clears a list
        (`"wordsNotToMatch": []`) and an empty string clears a manual category (`"trafficSourceCategory": ""`).
        `name`, `tag`, `wordsToMatch` and `sourceRuleTypes` can be replaced but not emptied: a rule without
        them can never fire, so sending one of them empty is rejected. A dynamic parameter and its manual
        category stay mutually exclusive — sending a non-empty value for one clears the other side of the
        stored rule, while clearing one (`[]` / `""`) leaves the other untouched.

        The same tag-prefix validation as on create applies, judged against the rule's flavor: a prefix-less
        `tag` is accepted on a lead-stage rule and rejected on any other, and a prefixed `tag` the other way
        round — unless the request sends `createLeadStage` to change the flavor. A new prefix-less tag points
        the rule at the stage with that name, creating it if the account has none; the stage it pointed at
        before keeps its name and its leads.

        An id that does not exist, or that belongs to a rule the API does not manage, is rejected with
        `The externalId <id> does not exist for this user`. The operation is synchronous.
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque id of the URL rule to update (e.g. `ur-<id>`), as returned by `GET /api/v1.0/url-rules`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlRuleUpdate'
            examples:
              pause:
                summary: Pause a rule — one field, nothing else touched
                value:
                  isEnabled: false
              matchingWords:
                summary: Replace the matching words and the URLs inspected
                value:
                  wordsToMatch:
                    - webinar/register
                    - webinar/signup
                  sourceRuleTypes:
                    - PREVIOUS_URL
                    - REFERRER_URL
              clearExclusions:
                summary: Clear a list — an empty array replaces the stored one
                value:
                  wordsNotToMatch: []
      responses:
        '200':
          description: URL rule updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - URL Rules
      summary: Delete URL Rule
      operationId: delete_api_v1_0_url_rules_id
      description: |
        > [!NOTE]
        > **Required role** — Delete URL Rules

        Delete a URL rule by its id, so it no longer tags matching traffic. The operation is synchronous.
      parameters:
        - name: id
          in: path
          required: true
          description: Opaque id of the URL rule to delete (e.g. `ur-<id>`), as returned by `GET /api/v1.0/url-rules`.
          schema:
            type: string
      responses:
        '200':
          description: URL rule deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/custom-costs:
    get:
      tags:
        - Custom Costs
      summary: Retrieve Custom Costs
      operationId: get_api_v1_0_custom_costs
      description: |
        > [!NOTE]
        > **Required role** — Get Custom Costs

        Retrieve custom costs. A cost matches the date window when its active range (from startDate to endDate, or
        open-ended when no endDate is set) overlaps the fromDate/toDate window. Use the returned id to update or delete a cost.
      parameters:
        - name: ids
          in: query
          description: Array of custom cost ids. Maximum of 50 ids.
          schema:
            type: string
        - name: fromDate
          in: query
          description: ISO 8601 date. Only costs active on or after this date will be retrieved. If the
            date does not include a timezone, the configured account timezone will be assumed. Cannot
            be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only costs active on or before this date will be retrieved. If the
            date does not include a timezone, the configured account timezone will be assumed. Cannot
            be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of custom costs per page. Range 1-250. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomCost'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Custom Costs
      summary: Create Custom Cost
      operationId: post_api_v1_0_custom_costs
      description: |
        > [!NOTE]
        > **Required role** — Create Custom Costs

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a custom cost with all necessary information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - frequency
                - cost
                - tags
              properties:
                name:
                  type: string
                  description: Descriptive label for the cost.
                startDate:
                  type: string
                  description: Start date in ISO 8601 format. If no time is provided, the start of the
                    day is used. The time zone offset is discarded rather than converted, so the date
                    is stored exactly as written; see **Date Formats**.
                endDate:
                  type: string
                  description: End date in ISO 8601 format. For ONE_TIME costs it is set to the start
                    date. The time zone offset is discarded rather than converted, so the date is stored
                    exactly as written; see **Date Formats**.
                frequency:
                  type: string
                  enum:
                    - DAILY
                    - ONE_TIME
                cost:
                  type: number
                  description: Must be greater than zero. Currency matches Hyros account settings.
                tags:
                  type: array
                  items:
                    type: string
                  description: Source tags to assign the costs to. Maximum of 10 tags.
                  maxItems: 10
            example:
              name: Monthly Agency Fee
              startDate: '2024-12-25T00:00:00.000Z'
              endDate: '2024-12-20T00:00:00.000Z'
              frequency: DAILY
              tags:
                - '@instagram'
                - '@facebook'
              cost: 999.5
      responses:
        '200':
          description: Custom cost created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/custom-costs/{id}:
    put:
      tags:
        - Custom Costs
      summary: Update Custom Cost
      operationId: put_api_v1_0_custom_costs_id
      description: |
        > [!NOTE]
        > **Required role** — Update Custom Costs

        Update a custom cost by its id. This is a full replacement: every field must be provided, and any omitted optional
        field is cleared. Costs created from the Hyros UI with a MONTHLY frequency are returned by the retrieve endpoint,
        but the API only accepts DAILY or ONE_TIME, so a MONTHLY cost cannot be edited through this endpoint without
        changing its frequency.
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the custom cost to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - frequency
                - cost
                - tags
              properties:
                name:
                  type: string
                  description: Descriptive label for the cost.
                startDate:
                  type: string
                  description: Start date in ISO 8601 format. If no time is provided, the start of the
                    day is used. The time zone offset is discarded rather than converted, so the date
                    is stored exactly as written; see **Date Formats**.
                endDate:
                  type: string
                  description: End date in ISO 8601 format. For ONE_TIME costs it is set to the start
                    date. The time zone offset is discarded rather than converted, so the date is stored
                    exactly as written; see **Date Formats**.
                frequency:
                  type: string
                  enum:
                    - DAILY
                    - ONE_TIME
                cost:
                  type: number
                  description: Must be greater than zero. Currency matches Hyros account settings.
                tags:
                  type: array
                  items:
                    type: string
                  description: Source tags to assign the costs to. Maximum of 10 tags.
                  maxItems: 10
            example:
              name: Monthly Agency Fee
              startDate: '2024-12-25T00:00:00.000Z'
              endDate: '2025-01-25T00:00:00.000Z'
              frequency: DAILY
              tags:
                - '@instagram'
                - '@facebook'
              cost: 1299.5
      responses:
        '200':
          description: Custom cost updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
