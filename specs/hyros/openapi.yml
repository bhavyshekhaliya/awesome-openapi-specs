                              name: email
                            goal:
                              id: cat-909ba403c207fbdfb6344b96f3294342
                              name: all
                            category:
                              id: cat-7d3c1b9a5e4f2d8c6b0a3f1e9d7c5b3a
                              name: august newsletter
                    nextPageId: ae910fcb3d22e2b89bd69dbc92ed2ad6836f6a611cf0a5e53082222fe1055eb6
