  /api/v1.0/conversion-paths:
    get:
      tags:
        - Conversion Paths
      summary: Retrieve Conversion Paths
      operationId: get_api_v1_0_conversion_paths
      description: |
        > [!NOTE]
        > **Required role** — Get Conversion Paths

        Retrieves the conversions of one type in a date range, each one with the ordered source touches it was attributed with.

        Use it to run your own attribution model over Hyros data, with your own weights, decay curve or exclusions. A page carries the paths of up to 250 conversions, so a month of sales takes a handful of calls instead of one `GET /api/v1.0/leads/journey` call per lead.

        `conversionType` decides both what a row is and which date the range filters on. For `SALE` and `CALL` the range applies to the sale date, and `path` is the touches the conversion was attributed with, up to that sale date. For `LEAD` the range applies to the join date, and `path` is the lead's full touch list. Repeat purchases are included: `firstSale` is what tells them apart from the lead's first sale (or first call).

        Every entry of `path` has the same shape as the `firstSource` and `lastSource` objects of `/sales`, `/calls` and `/leads`, and the entries are ordered by `clickDate` ascending. `path` can come back empty when the conversion has no touch on record. `SALE` and `CALL` rows carry `price`, `usdPrice` and `firstSale`; `LEAD` rows do not have those keys at all.

        The endpoint always pages over every conversion in the range, so there is no per-conversion selector: sending the shared `ids` parameter is rejected with a `400`.
      parameters:
        - name: conversionType
          in: query
          required: true
          description: |
            The kind of conversion to return. The date range applies to the sale date for `SALE` and `CALL`, and to the join date for `LEAD`.
          schema:
            type: string
            enum:
              - SALE
              - CALL
              - LEAD
        - name: fromDate
          in: query
          description: |
            ISO 8601 date, either `yyyy-MM-dd` or a full timestamp. Only conversions more recent than this will be retrieved. If the date does not include a timezone, the configured account timezone will be assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: |
            ISO 8601 date, either `yyyy-MM-dd` or a full timestamp. Only conversions older than this will be retrieved. If the date does not include a timezone, the configured account timezone will be assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: windowAttributionDaysRange
          in: query
          description: |
            Attribution window in days (0-365, default 0 = no window). A touch that happened more than this many days before the conversion is left out of `path`. The stored path already reflects the account's attribution timeframe at tracking time, so the window can only narrow it.
          schema:
            type: integer
            minimum: 0
            maximum: 365
            default: 0
        - name: pageSize
          in: query
          description: Maximum number of conversions per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it
            to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad
            Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversionPath'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
              examples:
                sales:
                  summary: Two sales of the same lead, the second one a repeat purchase
                  value:
                    result:
                      - id: sle-db882bfed1b5280735eb03ac5b9be0c6edf04d7a52204d41f0c6cf6c28ad5223
                        leadId: 6e7f85e73a49189f2cb30cc255304adb4d3b20a0bc26776a29bf2a861602078a
                        creationDate: '2026-08-14T12:33:30-05:00'
                        price:
                          price: 49.99
                          discount: 0
                          hardCost: 0
                          refunded: 0
                          currency: USD
                        usdPrice:
                          price: 49.99
                          discount: 0
                          hardCost: 0
                          refunded: 0
                          currency: USD
                        firstSale: true
                        path:
                          - sourceLinkId: slk-8e5c10ea09ed899f9e7a386501b8003e7fe8a0429633b0c1bf647ce92f51433a
                            name: testing
                            tag: '@testing'
                            disregarded: false
                            organic: false
                            clickDate: '2026-08-02T09:14:07-05:00'
                            trafficSource:
                              id: cat-cc4342fa4567fc3611afeb888e31eba2
                              name: facebook
                            goal:
