    Source:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
        disregarded:
          type: boolean
        organic:
          type: boolean
        adSource:
          $ref: '#/components/schemas/AdSource'
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        goal:
          $ref: '#/components/schemas/Goal'
        category:
          $ref: '#/components/schemas/Category'
        creationDate:
          type: integer
          description: Returned as epoch milliseconds (a number) instead of ISO 8601.
          example: 1677151375000
    UrlRuleWrite:
      type: object
      description: 'The URL rule fields shared by create (`POST`) and update (`PUT`). The two differ in
        what they require: create needs `name`, `tag`, `wordsToMatch` and `sourceRuleTypes` (see `UrlRuleCreate`),
        while update takes any subset of these fields and keeps every field it does not mention (see `UrlRuleUpdate`).'
      properties:
        name:
          type: string
          maxLength: 255
          description: 'A descriptive label for the rule. At most 255 characters. Cannot be blank: sending
            `""` is rejected with `Missing required field: name`, on `PUT` as well as on `POST`.'
        tag:
          type: string
          description: 'The tag applied when the rule matches. Its prefix sets the rule flavor and must
            be one of `!` (action tag), `@` (source tag), `$` (sale tag) or `#` (subscription tag). A
            tag with a missing or unrecognized prefix is rejected with `Invalid tag: it must start with
            ''!'' (action tag), ''$'' (sale tag), ''@'' (source tag) or ''#'' (subscription tag). To create
            a lead-stage rule, send a tag without a prefix and set createLeadStage=true`. The one exception
            is a lead-stage rule (`createLeadStage: true`): send a tag **without** a prefix — it becomes
            the lead stage name, and the backend creates the stage and stamps the rule as `LEAD_STAGE`.
            Sending a prefixed tag alongside `createLeadStage: true` is rejected with `Invalid tag: a
            lead-stage rule (createLeadStage=true) requires a tag without a prefix; the tag becomes the
            lead stage name`. On `PUT` the prefix is judged against the rule''s flavor, which `createLeadStage`
            inherits when omitted: a prefix-less tag is accepted on a lead-stage rule — which points it
            at the stage with that name, creating it if the account has none and leaving the previous
            stage in place — and rejected on any other, while a prefixed tag is accepted on any other
            rule and rejected on a lead-stage one, unless the same request sends `createLeadStage` to
            change the flavor. The tag cannot be blank either: `""` is rejected with `Missing required
            field: tag`.'
          example: '!webinar-registration'
        wordsToMatch:
          type: array
          minItems: 1
          items:
            type: string
          description: 'The rule matches when the URL contains any one of these words/substrings. Matching
            is case-insensitive. Must contain at least one non-empty value, otherwise the request is rejected
            with `Invalid field: wordsToMatch must contain at least one non-empty value`. A value cannot
            contain a comma: these are persisted comma-separated, so a comma would split one value into
            several. On `PUT` it replaces the stored list, which cannot be left empty.'
        wordsNotToMatch:
          type: array
          items:
            type: string
          description: If the URL contains any of these words/substrings, the rule does not match. Matching
            is case-insensitive. A value cannot contain a comma, for the same reason as `wordsToMatch`.
            On `PUT` it replaces the stored list; send `[]` to clear it.
        sourceRuleTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - PREVIOUS_URL
              - REFERRER_URL
          description: 'Which URL(s) to inspect. An unrecognized value is rejected with `Invalid sourceRuleTypes
            ''<value>''. Accepted values: PREVIOUS_URL, REFERRER_URL`. Must contain at least one value,
            otherwise the request is rejected with `Invalid field: sourceRuleTypes must contain at least
            one value`. On `PUT` it replaces the stored list, which cannot be left empty.'
        applyBaseDomain:
          type: boolean
          description: Match against the base domain only instead of the complete URL. Defaults to false
            on create.
        disregardSource:
          type: boolean
          description: Mark matched traffic as low priority so it does not override an existing source
            ("disregard source"). Defaults to false on create.
        trafficSourceToMatch:
          type: array
          maxItems: 1
          items:
            type: string
          description: 'URL parameter to read the traffic source from dynamically, e.g. `utm_source` ("Dynamic
            Source Traffic Parameter"). Maximum of 1 item; more than one is rejected with `Invalid field:
            trafficSourceToMatch accepts at most one value`. The value cannot contain a comma and is limited
            to 255 characters. Mutually exclusive with `trafficSourceCategory`: on `PUT`, sending a value
            here clears a traffic source category the rule already has; send `[]` to clear the parameter,
            which leaves the category alone.'
        trafficSourceCategory:
          type: string
          description: Assign a fixed traffic source category by name ("Set manual Traffic Source"). The
            category is created if it does not exist. Mutually exclusive with `trafficSourceToMatch`;
            sending both is rejected with `Provide either trafficSourceToMatch (dynamic URL parameter)
            or trafficSourceCategory (manual category), not both`. On `PUT`, a name clears any `trafficSourceToMatch`
            the rule has; send `""` to remove the category, which leaves that parameter alone.
        sourceCategoryToMatch:
          type: array
          maxItems: 1
          items:
            type: string
          description: 'URL parameter to read the source category from dynamically ("Dynamic Source Category
            Parameter"). Maximum of 1 item; more than one is rejected with `Invalid field: sourceCategoryToMatch
            accepts at most one value`. The value cannot contain a comma and is limited to 255 characters.
            Mutually exclusive with `sourceCategory`: on `PUT`, sending a value here clears a manual source
            category the rule already has; send `[]` to clear the parameter, which leaves the category
            alone.'
        sourceCategory:
          type: string
          description: Assign a fixed source category by name ("Set manual Source Category"). The category
            is created if it does not exist. Mutually exclusive with `sourceCategoryToMatch`; sending
            both is rejected with `Provide either sourceCategoryToMatch (dynamic URL parameter) or sourceCategory
            (manual category), not both`. On `PUT`, a name clears any `sourceCategoryToMatch` the rule
            has; send `""` to remove the category, which leaves that parameter alone.
        scores:
          type: array
          items:
            $ref: '#/components/schemas/UrlRuleScore'
          description: Keyword groups that score the sale attributed to a matched click; with the default
            score of 0 they mark it as unqualified ("Keywords to mark sale as unqualified" in the UI).
            On `PUT` they replace the stored groups; send `[]` to clear them.
        isEnabled:
          type: boolean
          description: Whether the rule is active. Defaults to `true` on create. On `PUT`, send `false`
            to pause the rule and `true` to resume it; omitting it leaves the current state untouched.
        createLeadStage:
          type: boolean
          description: 'Marks a lead-stage rule. When `true`, send a prefix-less `tag`: it becomes the
            lead stage name, the backend creates the stage, and the rule flavor is stamped as `LEAD_STAGE`.
            Defaults to false on create. On `PUT` it is not a stored flag but the rule''s flavor, so omitting
            it keeps the rule as it is — a lead-stage rule stays one, prefix-less tag included. Its stage
            is only touched when the binding is at stake: the rule becomes a lead-stage rule, the `tag`
            the stage takes its name from changes, or the rule is not bound to a stage yet. Changing the
            flavor takes this field and a matching `tag`: `true` with a prefix-less tag turns an ordinary
            rule into a lead-stage one, `false` with a prefixed tag turns a lead-stage rule back into
            an ordinary one (the rule stops pointing at the stage, which is itself left in place).'
    UrlRuleCreate:
      description: 'Request body of `POST /api/v1.0/url-rules`: the shared URL rule fields, with the four
        a rule cannot be created without.'
      allOf:
        - $ref: '#/components/schemas/UrlRuleWrite'
        - type: object
          required:
            - name
            - tag
            - wordsToMatch
            - sourceRuleTypes
    UrlRuleUpdate:
      description: 'Request body of `PUT /api/v1.0/url-rules/{id}`: the same fields, all optional. Only
        the fields included in the request are modified; any field left out keeps its stored value.'
      allOf:
        - $ref: '#/components/schemas/UrlRuleWrite'
    UrlRuleScore:
      type: object
      required:
        - keywords
      description: A group of keywords that score the sale attributed to a matched click; with the default
        score of 0 they mark it as unqualified ("Keywords to mark sale as unqualified" in the UI).
      properties:
        keywords:
          type: array
          minItems: 1
          items:
            type: string
          description: 'All of these keywords must be present in the matched URL for the entry to apply.
            Matching is case-insensitive. Every entry needs at least one non-empty keyword; an entry with
            none is rejected with `Invalid field: every entry in scores must contain at least one non-empty
            keyword`.'
        score:
          type: number
          description: Score assigned to the sale attributed to the matched click. Defaults to 0 (unqualified)
            when omitted, matching the UI. If several entries match, the highest score wins.
    UrlRule:
      type: object
      description: A URL rule as returned by the retrieval endpoints. Only simple rules are exposed through
        the API.
      properties:
        id:
          type: string
          description: Opaque id of the rule (never the raw database id). Use it to retrieve, update or
            delete the rule.
          example: ur-a3f5c9d2e1b8074f6c2d9a1e5b3f7c8d0e2a4b6c8d0f1a3b5c7d9e1f2a4b6c8d
        name:
          type: string
        tag:
          type: string
          description: The tag applied when the rule matches. Its prefix reflects the flavor — `!` action,
            `@` source, `$` sale, `#` subscription. A lead-stage rule has a prefix-less tag (the lead
            stage name).
          example: '!webinar-registration'
        wordsToMatch:
          type: array
          items:
            type: string
          description: The rule matches when the URL contains any one of these words/substrings. Matching
            is case-insensitive. Omitted when empty.
        wordsNotToMatch:
          type: array
          items:
            type: string
          description: If the URL contains any of these words/substrings, the rule does not match. Matching
            is case-insensitive. Omitted when empty.
        sourceRuleTypes:
          type: array
          items:
            type: string
            enum:
              - PREVIOUS_URL
              - REFERRER_URL
          description: Which URL(s) the rule inspects. Omitted when empty.
        applyBaseDomain:
          type: boolean
          description: Whether the rule matches against the base domain only instead of the complete URL.
        disregardSource:
          type: boolean
          description: Whether matched traffic is marked as low priority so it does not override an existing
            source ("disregard source").
        trafficSourceToMatch:
          type: array
          items:
            type: string
          description: The URL parameter the traffic source is read from, e.g. `utm_source` ("manual traffic
            source"). Omitted when empty.
        sourceCategoryToMatch:
          type: array
          items:
            type: string
          description: The URL parameter the source category is read from dynamically ("Dynamic Source
            Category Parameter"). Omitted when empty.
        trafficSourceCategory:
          type: string
          description: The name of the fixed traffic source category assigned to the rule ("Set manual
            Traffic Source"). Omitted when the rule has none.
        sourceCategory:
          type: string
          description: The name of the fixed source category assigned to the rule ("Set manual Source
            Category"). Omitted when the rule has none.
        scores:
          type: array
          items:
            $ref: '#/components/schemas/UrlRuleScore'
          description: Keyword groups that score the sale attributed to a matched click; with the default
            score of 0 they mark it as unqualified. Omitted when empty.
        urlRuleActionType:
          type: string
          enum:
            - ACTION
            - SOURCE_LINK
            - SALE
            - SUBSCRIPTION
            - LEAD_STAGE
          description: 'The rule flavor — `ACTION` (`!`), `SOURCE_LINK` (`@`), `SALE` (`$`) and `SUBSCRIPTION`
            (`#`) are derived from the tag prefix; `LEAD_STAGE` results from creating the rule with `createLeadStage:
            true`.'
        urlRuleType:
          type: string
          enum:
            - SIMPLE
          description: Only simple rules are exposed through the API, so this is always `SIMPLE`.
        isEnabled:
          type: boolean
          description: Whether the rule is currently active.
        createLeadStage:
          type: boolean
          description: 'Whether this is a lead-stage rule (`true` exactly when `urlRuleActionType` is
            `LEAD_STAGE`). Mirrors the write field, but `PUT` no longer needs it: an update that omits
            it inherits the rule''s flavor, so a lead-stage rule keeps its prefix-less `tag`.'
        creationDate:
          type: string
          description: Rule creation date, in UTC ISO 8601.
          example: '2025-10-20T14:00:00Z'
    Subscription:
      type: object
      properties:
        id:
          type: string
        startDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        endDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        cancelAtDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        trialStartDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        trialEndDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        lastUpdatedDate:
          type: string
          description: ISO 8601 date of the last change to the subscription.
          example: '2021-04-16T20:35:00-05:00'
        price:
          type: number
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        periodicity:
          type: string
        planId:
          type: string
        tag:
          type: string
        name:
          type: string
        lead:
          $ref: '#/components/schemas/Lead'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
        category:
          $ref: '#/components/schemas/Category'
          description: Category of the first paid sale item attributed to the subscription. Set once when
            the first payment is attributed and not updated if the plan changes later. Null when no paid
            sale has been attributed yet, for example a subscription still in its trial period.
        provider:
          $ref: '#/components/schemas/Provider'
    Cart:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
          description: Only present if cart was purchased.
        creationDate:
          type: string
          description: Cart creation date, in UTC.
          example: '2022-11-17T13:51:54Z'
        events:
          type: integer
        lead:
          $ref: '#/components/schemas/LeadWithConsent'
        provider:
          $ref: '#/components/schemas/Provider'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
    LeadJourney:
      type: object
      description: Every field but `lead` is omitted when the request's `fields` did not select it. A
        field that was selected but holds no data comes back empty.
      properties:
        lead:
          $ref: '#/components/schemas/LeadWithStage'
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        calls:
          type: array
          items:
            $ref: '#/components/schemas/Call'
        carts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              orderId:
                type: string
                description: Only present if cart was purchased.
              creationDate:
                type: string
                description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO
                  8601, unlike the `creationDate` of `/carts`.
                example: Thu Nov 17 10:51:54 ART 2022
              events:
                type: integer
              provider:
                $ref: '#/components/schemas/Provider'
              products:
                type: array
                items:
                  $ref: '#/components/schemas/SaleProduct'
              firstSource:
                $ref: '#/components/schemas/Attribution'
              lastSource:
                $ref: '#/components/schemas/Attribution'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        linkedLeads:
          type: array
          items:
            $ref: '#/components/schemas/LeadWithStage'
        journey:
          type: array
          description: Chronological journey events for the lead. Only present when `includeEvents=true`
            or when `journey` is requested in `fields`.
          items:
            $ref: '#/components/schemas/JourneyEvent'
    JourneyEvent:
      type: object
      description: |
        A single event in a lead's journey — a source-link click, a stage change, a sale, a call, a cart, a subscription, an action tag, an opt-in or an email. Which fields are present depends on the event `type` (enumerated below).

        Source click events also report the ad hierarchy they belong to — `trafficSource`, `category`, `adAccount`, `campaign`, `adSet` and `ad`. No other event
        type carries them, and each level is omitted when it does not exist for that source:

        - organic sources and email links have no ad hierarchy at all, only their Hyros groupings (`trafficSource`, `category`)
        - sources tracked at campaign level (Google, LinkedIn) report `campaign` with no `adSet` above it
        - platforms with no campaign level of their own (TikTok, Snapchat, Pinterest, Bing, X) report `adSet` and no `campaign`
        - `ad` is present only when the click was attributed to a specific ad
      properties:
        type:
          type: string
          description: |
            The kind of event. One of:
            - `sl` — a click on a source link (the tracked touch-points that build attribution); carries the ad hierarchy it belongs to
            - `lead-stage` — the lead reached a pipeline stage
            - `sale` — a purchase
            - `call` — a booked call
            - `cart` — a cart event
            - `subscription-started` — a subscription started
            - `subscription-ended` — a subscription ended
            - `action` — the lead achieved a `!` action tag
            - `opt-in` — the lead opted in
            - `email` — an email was sent to (or generated for) the lead
            - `email-open` — the lead opened an email
        id:
          type: string
          description: Identifier of the underlying record. Present only for events backed by an external
            entity (`sale`, `call`, `subscription-started`, `subscription-ended`, `email`, `email-open`).
        date:
          type: string
          description: ISO 8601 timestamp (in the account timezone) when the event occurred.
        extra:
          type: string
          description: Additional context for the event.
        tag:
          type: string
        name:
          type: string
        keyword:
          type: string
        integrationProvider:
          type: string
          description: Source integration/provider associated with the event, when applicable.
        currencySymbol:
          type: string
          description: Currency symbol for monetary events (e.g. sales).
        emailSource:
          type: boolean
          description: Whether the event originated from an email source.
        subNames:
          type: array
          items:
            type: string
          description: Sub-element names, e.g. the individual products of a grouped cart event.
        trafficSource:
          $ref: '#/components/schemas/TrafficSource'
        category:
          $ref: '#/components/schemas/Category'
        adAccount:
          $ref: '#/components/schemas/AdHierarchyLevel'
        campaign:
          $ref: '#/components/schemas/AdHierarchyLevel'
        adSet:
          $ref: '#/components/schemas/AdHierarchyLevel'
        ad:
          $ref: '#/components/schemas/AdHierarchyLevel'
paths:
  /api/v1.0/leads:
    get:
      tags:
        - Leads
      summary: Retrieve Leads
      operationId: get_api_v1_0_leads
      description: |
        > [!NOTE]
        > **Required role** — Get Leads

        Search and retrieve leads by their join date, last updated date, email, phone number, id, current stage, tags or the date a tag was applied. Every filter is optional.
      parameters:
        - name: ids
          in: query
          description: Array of lead ids. Maximum of 50 ids.
          schema:
            type: string
          example: '"id1","id2","id3"'
        - name: emails
          in: query
          description: Array of emails or email prefixes. Maximum of 50 emails.
          schema:
            type: string
          example: '"email1","email2"'
        - name: phones
          in: query
          description: Array of phone numbers. Maximum of 50 phones.
          schema:
            type: string
          example: '"+1 202-555-0184","2025550139"'
        - name: tags
          in: query
          description: Array of tag names. Leads matching any of the provided tags will be retrieved.
            Tags are matched exactly, including any prefix (e.g. `!Tag1`). Maximum of 50 tags.
          schema:
            type: string
          example: '"!Tag1","!Tag2"'
        - name: tagFromDate
          in: query
          description: |
            ISO 8601 date. Only leads that had a tag applied on or after this date will be retrieved. Combined with `tags` it returns the leads that received one of those tags inside the period, so a lead tagged before it is left out even if it still holds the tag; on its own it matches any tag applied in the period. Leads whose tag assignment has no recorded date are not retrieved. A `tagFromDate` later than `tagToDate` is rejected with `400 Bad Request`. If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: tagToDate
          in: query
          description: ISO 8601 date. Only leads that had a tag applied on or before this date will be
            retrieved. If the date does not include a timezone, the configured account timezone will be
            assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: stage
          in: query
          description: Array of stage names. Leads matching any of the provided stages will be retrieved.
            Stage names are matched case-insensitively. Maximum of 50 stages.
          schema:
            type: string
          example: '"stage1","stage2"'
        - name: fromDate
          in: query
          description: ISO 8601 date. Only leads whose join date is more recent than this will be retrieved.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only leads whose join date is older than this will be retrieved.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedFromDate
          in: query
          description: ISO 8601 date. Only leads updated on or after this date will be retrieved. Use
            it to fetch just the leads that changed since your last request. If the date does not include
            a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedToDate
          in: query
          description: ISO 8601 date. Only leads updated on or before this date will be retrieved. If
            the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of leads per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it
            to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad
            Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeadWithStage'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
              example:
                result:
                  - email: lead1@email.com
                    id: 40b5af5444756c2b5e666fcb658affd2a4b455bce3711c43f88763147381e368
                    creationDate: '2023-01-04T04:36:41-05:00'
                    lastUpdatedDate: '2023-06-10T09:12:00-05:00'
                    tags:
                      - $ettst
                    adOptimizationConsent: GRANTED
                    currentStage:
                      name: stage1
                      date: '2023-01-06T09:12:00-05:00'
                    firstSource:
                      sourceLinkId: 7bc217f372eab0efa188bb5b05be87460976e68e03b801d53c39bb4ed54c9750
                      name: Facebook Adset
                      tag: '@facebook-adset'
                      clickDate: '2023-01-03T22:14:07-05:00'
                    lastSource:
                      sourceLinkId: 12cc9f521ba37e33d624927ea7088d91a6b2e39bf1466c281120cde22a4bee84
                      name: Facebook Adset 2
                      tag: '@facebook-adset-2'
                      clickDate: '2023-01-04T01:02:59-05:00'
                    originLead:
                      email: originlead@email.com
                      id: 9c1e5b0a4f7d2c8e6b3a1f0d9e8c7b6a5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a
                      creationDate: '2022-12-30T09:12:00-05:00'
                      isOriginLead: true
                      tags:
                        - $origin
                  - email: lead2@email.com
                    id: b5981e8ce87d08773a4ggre985d2d9949153c6fb55cb5075291941d9f23f4282
                    creationDate: '2023-01-04T02:37:45-05:00'
                    ips:
                      - 1.2.3.4
                    phoneNumbers:
                      - 202-555-0184
                    adOptimizationConsent: UNSPECIFIED
                nextPageId: 568fd86587125f55117505312dc72bb8b71e9647a25e5b142d3f28bccd228360
                request_id: e47941e7104gtrgtrgtr24d0884c6df09407e76fd
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Leads
      summary: Create Lead
      operationId: post_api_v1_0_leads
      description: |
        > [!NOTE]
        > **Required role** — Create Leads

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create or Update leads and their tags. If the applied Tag matches with that of a Product,
        a sale will be generated for said lead, only if it didn't already have the tag.

        On an existing lead, `phoneNumbers` replaces the stored numbers, so omitting it deletes them all. Use `PUT /leads` to apply a tag without losing them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the lead. Required if no phone number is provided. If only a phone
                    number is provided, a placeholder email `<phone>@hyrosapi.com` is generated and returned
                    as the lead's email.
                firstName:
                  type: string
                lastName:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags to apply to the lead. Must be a JSON array; a single tag sent as a
                    bare string is rejected with `400 Bad Request`.
                tagsDate:
                  type: string
                  description: Optional ISO-8601 date (`2023-05-01T10:00:00-03:00`) applied as the assignment
                    date of **every** tag in `tags`, to backdate historical tags during imports, migrations
                    or CRM syncs. Defaults to the current time when omitted. Cannot be in the future.
                    To assign tags with different dates, send one request per date. If a tag generates
                    a sale or a source attribution, those are backdated too. Without a time zone offset
                    the date is stored as UTC; see **Date Formats**.
                leadIps:
                  type: array
                  items:
                    type: string
                  description: IPs of the lead for ad attribution.
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Phone numbers of the lead. Required if no email is provided. On an existing
                    lead this replaces the stored numbers.
                stage:
                  type: string
                  description: Stage to apply to the lead. On create the stage is a plain string; on update
                    (`PUT /leads`) it is set via the `leadStage` object (`{name, date}`) instead.
                adOptimizationConsent:
                  $ref: '#/components/schemas/AdOptimizationConsent'
                  description: Optional. Sent blank it reads as UNSPECIFIED. Omitted, a new lead starts
                    as UNSPECIFIED and an existing lead keeps the value it already had.
            example:
              email: John@doe.com
              firstName: John
              lastName: Doe
              tags:
                - '!Tag1'
              tagsDate: '2023-05-01T10:00:00-03:00'
              leadIps:
                - 172.8.105.28
              phoneNumbers:
                - '1105385366'
              stage: MQL
              adOptimizationConsent: GRANTED
      responses:
        '200':
          description: Lead created/updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Leads
      summary: Update Lead
      operationId: put_api_v1_0_leads
      description: |
        > [!NOTE]
        > **Required role** — Update Leads

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update leads, their tags and their stages. `phoneNumbers` is added to the lead; existing numbers are kept.

        Lead stages can be applied and removed using `leadStage` and `removeLeadStages`. A stage applied by mistake can therefore be removed without manual cleanup. Every stage name in `removeLeadStages` must exist in the account; otherwise, the whole request is rejected with a `400 Bad Request` and none of the changes are applied. Stages that the lead does not currently have are ignored. The same stage cannot be applied and removed in the same request. Once a stage is removed, the lead is no longer counted for that stage in reports.

        Tag assignments can be backdated with the optional `tagsDate` field (ISO-8601). It applies as the assignment date of **every** tag in `tags`, so historical tags keep an accurate timeline during imports, migrations or CRM syncs; it defaults to the current time when omitted and cannot be in the future. To assign tags with different dates, send one request per date. Tags the lead already has are ignored (their existing date is not changed). If a tag generates a sale or a source attribution, those are backdated too.
      parameters:
        - name: email
          in: query
          description: Email used to search for the lead to update.
          schema:
            type: string
        - name: id
          in: query
          description: ID used to search for the lead to update.
          schema:
            type: string
        - name: phone
          in: query
          description: Phone used to search for the lead to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: New email.
                firstName:
                  type: string
                lastName:
                  type: string
                tags:
                  type: array
                  description: Tags to add to the lead. Must be a JSON array; a single tag sent as a bare
                    string is rejected with `400 Bad Request`.
                  items:
                    type: string
                tagsDate:
                  type: string
                  description: Optional ISO-8601 date applied as the assignment date of every tag in `tags`
                    (defaults to now, cannot be in the future). Tags the lead already has are ignored,
                    not re-dated. For tags with different dates, send one request per date. Without a
                    time zone offset the date is stored as UTC; see **Date Formats**.
                removeTags:
                  type: array
                  description: Tags to remove from the lead. Must be a JSON array; a single tag sent as
                    a bare string is rejected with `400 Bad Request`.
                  items:
                    type: string
                leadIps:
                  type: array
                  items:
                    type: string
                phoneNumbers:
                  type: array
                  description: Phone numbers to add to the lead. Existing numbers are kept.
                  items:
                    type: string
                adOptimizationConsent:
                  $ref: '#/components/schemas/AdOptimizationConsent'
                  description: Optional. Blank reads as UNSPECIFIED; omitted leaves the lead's current
                    value unchanged.
                leadStage:
                  type: object
                  description: Stage to apply to the lead on update. Create (`POST /leads`) uses a plain
                    `stage` string instead.
                  properties:
                    name:
                      type: string
                    date:
                      type: string
                      description: ISO 8601 date. Without a time zone offset the date is stored as UTC;
                        see **Date Formats**.
                removeLeadStages:
                  type: array
                  description: Names of the stages to remove from the lead. Unknown names reject the request;
                    stages the lead does not hold are ignored.
                  items:
                    type: string
            example:
              email: John@doe.com
              firstName: John
              lastName: Doe
              tags:
                - '!Tag1'
              tagsDate: '2023-05-01T10:00:00-03:00'
              removeTags:
                - '!Tag2'
              leadIps:
                - 172.8.105.28
              phoneNumbers:
                - '1105385366'
              adOptimizationConsent: GRANTED
              leadStage:
                name: SQL
                date: '2025-11-13T14:00:00-03:00'
              removeLeadStages:
                - MQL
      responses:
        '200':
          description: Lead updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Leads
      summary: Delete Lead
      operationId: delete_api_v1_0_leads
      description: |
        > [!NOTE]
        > **Required role** — Delete Leads

        > [!NOTE]
        > **Asynchronous** — the erasure applies immediately, but the lead typically takes ~5 minutes to disappear from `GET /leads`.

        Permanently delete a lead and its personal data. Provide one of email or id to identify the lead. Personal data is redacted, and phone numbers, sales and tracking data are deleted while subscriptions are cancelled.

        The lead's email address and phone numbers are also **blacklisted**, so later events carrying them are discarded instead of re-creating the lead. Any later write carrying that email address — creating the lead again, updating it, or sending an order, cart, call, subscription or click for it — is rejected with a `400` explaining the discard, rather than accepted and silently dropped. This cannot be undone through the API: blacklist entries are only removable from the Hyros app, under **Settings → Tracking Configuration → Blacklist**.
      parameters:
        - name: email
          in: query
          description: Email used to search for the lead to delete.
          schema:
            type: string
        - name: id
          in: query
          description: ID used to search for the lead to delete.
          schema:
            type: string
      responses:
        '200':
          description: Lead deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/leads/tags:
    post:
      tags:
        - Leads
      summary: Add Tags to Leads
      operationId: post_api_v1_0_leads_tags
      description: |
        > [!NOTE]
        > **Required role** — Add Tags to Leads

        > [!NOTE]
        > **Asynchronous** — the change is typically visible within a few minutes, and can take longer for a large selection.

        Apply the same tags to every lead selected by `ids` and/or `emails` in one call, instead of sending one `PUT /leads` per lead. At least one of the two selectors is required. The two selectors are combined as a union, so a lead named by both is tagged once, and an email may match several leads, in which case all of them are tagged. Only leads of the account the API-Key belongs to are tagged. Ids and emails that match no lead are skipped; a request whose selectors match no lead at all is rejected with `Lead not found.`

        The tags are applied through the same call as `PUT /leads`, so the tag semantics are identical: a name prefixed with `$` is a sale tag, with `@` a source tag and with `!` an action tag, while a name with no prefix defaults to an action tag. A `$` tag matching a product's tag generates a sale for each selected lead that did not already carry that tag, so in bulk this multiplies across the selection.

        The response carries a `request_id`. Once `GET /api/v1.0/requests/{request_id}` reports it as `PROCESSED`, its `result` is the array of the tagged leads, in the shape `GET /leads` returns them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tags
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: |
                    Ids of the leads to tag, as `GET /leads` returns them. Must be a JSON array; a single value sent as a bare string is rejected with `400 Bad Request`. Maximum of 50 ids.
                  maxItems: 50
                emails:
                  type: array
                  items:
                    type: string
                  description: |
                    Emails of the leads to tag, matched exactly. Must be a JSON array; a single value sent as a bare string is rejected with `400 Bad Request`. Maximum of 50 emails.
                  maxItems: 50
                tags:
                  type: array
                  items:
                    type: string
                  description: |
                    Tags to apply to every selected lead. A name prefixed with `$` is a sale tag, with `@` a source tag and with `!` an action tag; a name with no prefix defaults to an action tag. Must be a JSON array; a single value sent as a bare string is rejected with `400 Bad Request`. Maximum of 50 tags.
                  maxItems: 50
                tagsDate:
                  type: string
                  description: |
                    Optional ISO-8601 date applied as the assignment date of every tag in this request, to backdate historical tags (defaults to now, cannot be in the future). Unlike `PUT /leads`, action tags (`!`) a lead already carries are re-dated to this date, so an existing assignment date is corrected; sale (`$`) and source (`@`) tags it already carries are left untouched. For tags with different dates, send one request per date. Without a time zone offset the date is stored as UTC; see **Date Formats**.
            example:
              ids:
                - 40b5af5444756c2b5e666fcb658affd2a4b455bce3711c43f88763147381e368
              emails:
                - lead1@email.com
                - lead2@email.com
              tags:
                - '!Tag1'
              tagsDate: '2023-05-01T10:00:00-03:00'
      responses:
        '200':
          description: |
            Request accepted; poll the returned `request_id` on `GET /api/v1.0/requests/{request_id}` for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Bad Request. Possible messages: `Either 'ids' or 'emails' must be provided.`, `Missing required field: tags`, `The maximum number of ids to be provided for update is 50`, `The maximum number of emails to be provided for update is 50`, `The maximum number of tags to be provided for update is 50`, `ids must be an array of strings`, `emails must be an array of strings`, `tags must be an array of strings`, `Invalid date format.`, `The tags date cannot be in the future.`, `Lead not found.` when the selectors match no lead of the account, and `There was a problem while processing the request` when nothing more specific applies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/leads/journey:
    get:
      tags:
        - Leads
      summary: Retrieve Leads Journey
      operationId: get_api_v1_0_leads_journey
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Journey

        Retrieve the details about leads journeys using lead ids and/or emails. At least one of `ids` or `emails`
        must be provided. Emails are matched exactly (case-insensitive); an email may resolve to more than one
        lead, in which case one journey is returned per matched lead. Each journey includes the lead's sales,
        calls, carts, subscriptions and linked leads. Set `includeEvents=true` to additionally return a
        chronological `journey` array with every event in the lead's timeline: source-link clicks, stage
        changes, sales, calls, carts, subscriptions, action (`!`) tags, opt-ins and emails (sends and opens).
        Pass `fields` to return only some of those fields; a field that is not requested is not retrieved
        either, so a narrower selection answers faster.
      parameters:
        - name: ids
          in: query
          description: Array of lead ids. Maximum of 50 ids.
          schema:
            type: string
          example: '"id1","id2","id3"'
        - name: emails
          in: query
          description: Array of lead emails, matched exactly (case-insensitive). Maximum of 50 emails.
          schema:
            type: string
          example: '"lead1@email.com","lead2@email.com"'
        - name: includeEvents
          in: query
          description: 'When `true`, each returned journey includes a `journey` array with every event
            in the lead''s timeline, in chronological order: source-link clicks, stage changes, sales,
            calls, carts, subscriptions, action (`!`) tags, opt-ins and emails (sends and opens). Source
            click events also carry the ad hierarchy they belong to. Defaults to `false`. Asking for `journey`
            in `fields` does the same.'
          schema:
            type: boolean
            default: false
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to include in each result. If omitted, every field except
            `journey` is returned. `lead` is always included, since it identifies whose journey the entry
            is. A field that is requested but holds no data is returned empty, and one that is not requested
            is not retrieved either, so a narrower selection answers faster.
          schema:
            type: string
            enum:
              - lead
              - sales
              - calls
              - carts
              - subscriptions
              - linkedLeads
              - journey
          example: lead,sales
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeadJourney'
                  request_id:
                    type: string
        '400':
          description: 'Bad Request. An unknown value in `fields` is rejected with `Invalid field: <field>`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/leads/aggregation:
    get:
      tags:
        - Leads
      summary: Count Leads By Attribute
      operationId: get_api_v1_0_leads_aggregation
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Aggregation

        Counts the leads from a search by grouping them according to an attribute, which can be a tag, the current
        stage, or the tag of the first or last source. It is used to determine how many leads there are rather than
        which leads they are; for example, to understand how leads are distributed across stages, which tags are most
        frequently used, or where leads from a given period came from. The response contains three numbers that answer
        different questions: `groups` shows how the leads that have a value for the selected attribute are
        distributed; `remainingCount` indicates how many leads were left out because their group did not fit
        within the `groupsLimit` request parameter, so increasing this limit by that number is enough to retrieve all
        remaining groups; and `totalCount` indicates how many leads matched the search. The groups should not be summed
        to obtain a total, since a lead without the attribute does not belong to any group, while a lead with
        multiple values can belong to more than one group.
      parameters:
        - name: attribute
          in: query
          required: true
          description: |
            The attribute to group the leads by.
            - `TAG` — groups by tag name; a lead is counted once per tag it holds.
            - `STAGE` — groups by the lead's current stage. The group key is the stage name; a stage deleted after the lead was indexed is reported by its id instead.
            - `FIRST_SOURCE_TAG` — groups by the tag of the first source link the lead was seen through.
            - `LAST_SOURCE_TAG` — groups by the tag of the last source link the lead was seen through.
          schema:
            type: string
            enum:
              - TAG
              - STAGE
              - FIRST_SOURCE_TAG
              - LAST_SOURCE_TAG
          example: STAGE
        - name: groupsLimit
          in: query
          description: The maximum number of groups to return, the ones with the most leads first. A group
            is one value of the attribute. Must be between 1 and 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 250
        - name: ids
          in: query
          description: Array of lead ids to filter by. At most 50 can be provided.
          schema:
            type: string
          example: '"id1","id2","id3"'
        - name: emails
          in: query
          description: Array of emails or email prefixes to filter leads by. At most 50 can be provided.
          schema:
            type: string
          example: '"email1","email2"'
        - name: phones
          in: query
          description: Array of phone numbers to filter leads by. Matching is done on the last digits,
            so formatting, spaces and country/area codes are tolerated. At most 50 can be provided.
          schema:
            type: string
          example: '"+1 202-555-0184","2025550139"'
        - name: tags
          in: query
          description: Comma-separated tag names. Leads holding ANY of them are counted. Names are matched
            exactly, including their prefix. This filter narrows which leads are counted, not which groups
            come back. At most 50 can be provided.
          schema:
            type: string
          example: '"!Tag1","!Tag2"'
        - name: tagFromDate
          in: query
          description: ISO 8601 date. Only leads that had a tag applied on or after this date are counted.
            If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: tagToDate
          in: query
          description: ISO 8601 date. Only leads that had a tag applied on or before this date are counted.
            If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: stage
          in: query
          description: Comma-separated stage names. Leads whose current stage matches ANY of them are
            counted. A name that matches no stage of the account is not an error, and the result comes
            back empty rather than unfiltered. At most 50 can be provided.
          schema:
            type: string
          example: '"Booked Call","Closed Won"'
        - name: fromDate
          in: query
          description: ISO 8601 date. Only leads whose join date is more recent than this are counted.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only leads whose join date is older than this are counted. If the
            date does not include a timezone, the configured account timezone will be assumed. Cannot
            be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedFromDate
          in: query
          description: ISO 8601 date. Only leads updated on or after this date are counted. If the date
            does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: updatedToDate
          in: query
          description: ISO 8601 date. Only leads updated on or before this date are counted. If the date
            does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/AggregationResult'
                  request_id:
                    type: string
              example:
                result:
                  groups:
                    - key: Opt In
                      count: 12
                    - key: Booked Call
                      count: 8
                    - key: Closed Won
                      count: 2
                  remainingCount: 0
                  totalCount: 30
                request_id: 43573923369e40bbafd46925a5c15ff5
        '400':
          description: Bad Request. `attribute` is missing or is not one of the accepted values, or `groupsLimit`
            is outside 1-1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/leads/clicks:
    get:
      tags:
        - Leads
      summary: Retrieve Lead Clicks
      operationId: get_api_v1_0_leads_clicks
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Clicks

        Retrieve clicks belonging to one or many leads. Exactly one of `leadId`, `leadIds` or `emails` must be provided; sending none, or more than one, returns a `400`.

        Date filters, page size and pagination apply over the clicks of every selected lead as a single result set, ordered from oldest to newest, and each click carries the `leadId` and `email` of the lead it belongs to.

        `leadId` and `email` fail the request when the lead does not exist, while `leadIds` and `emails` skip the ids and emails they cannot resolve and return an empty `result` when none of them match. With the plural parameters, a lead with no clicks and a lead that does not exist are therefore indistinguishable in the response.
      parameters:
        - name: leadId
          in: query
          description: A single lead id.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of lead ids. Maximum of 50 lead ids.
          schema:
            type: string
        - name: emails
          in: query
          description: Array of lead emails, matched exactly (case-insensitive). Maximum of 50 emails.
            An email may resolve to more than one lead, in which case the clicks of every matched lead
            are returned.
          schema:
            type: string
        - name: email
          in: query
          description: 'DEPRECATED: Use emails instead. The lead email, resolving to a single lead.'
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum number of clicks per page. Between 1 and 250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page.
          schema:
            type: string
        - name: fromDate
          in: query
          description: ISO 8601 date. Only clicks dated after this will be retrieved. When omitted, the
            search starts 90 days before the earliest join date among the selected leads, the age at which
            unassigned clicks are deleted, or has no lower bound when a selected lead has no join date.
            Providing it is recommended when selecting many leads, as it bounds the amount of data searched.
            If the date does not include a timezone, the configured account timezone will be assumed.
            Cannot be in a future month.
          schema:
            type: string
          example: '2025-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only clicks dated before this will be retrieved. If the date does
            not include a timezone, the configured account timezone will be assumed. Cannot be in a future
            month.
          schema:
            type: string
          example: '2025-04-16T20:35:00-05:00'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Click'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/sales:
    get:
      tags:
        - Sales
      summary: Retrieve Sales
      operationId: get_api_v1_0_sales
      description: |
        > [!NOTE]
        > **Required role** — Get Sales

        Search and retrieve sales by date, email, lead id, product tag, id, recurring status, and refund status.

        **`fromDate` and `toDate` always bound the date the sale was made, never the date it was refunded.** So `saleRefundedState=REFUNDED` over a range returns the sales *made* in it that are refunded today — not the refunds *issued* in it, which would also cover sales made earlier. Each sale carries its own `refundDate` to count by.

        Filtering by `orderId` is **not** supported — the supported filters are the query parameters listed below; `orderId` is present only in the response body. Response `creationDate`/`refundDate` are returned in `EEE MMM dd HH:mm:ss zzz yyyy` format, not ISO 8601.
      parameters:
        - name: ids
          in: query
          description: Array of sales ids. Maximum of 50 ids.
          schema:
            type: string
        - name: emails
          in: query
          description: Array of emails or prefixes. Maximum of 50 emails.
          schema:
            type: string
        - name: leadIds
          in: query
          description: Array of leadIds. Maximum of 50 lead ids.
          schema:
            type: string
        - name: productTags
          in: query
          description: Array of product tags. Maximum of 20 product tags.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Filter by recurring status.
          schema:
            type: string
            enum:
              - RECURRING
              - NON_RECURRING
              - ALL
            default: ALL
        - name: saleRefundedState
          in: query
          description: Filter by refund status.
          schema:
            type: string
            enum:
              - REFUNDED
              - NON_REFUNDED
              - ALL
            default: ALL
        - name: fromDate
          in: query
          description: ISO 8601 date. Only sales after this date will be retrieved. Bounds the date the
            sale was made, never the date of its refund. If the date does not include a timezone, the
            configured account timezone will be assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: toDate
          in: query
          description: ISO 8601 date. Only sales before this date will be retrieved. Bounds the date the
            sale was made, never the date of its refund. If the date does not include a timezone, the
            configured account timezone will be assumed. Cannot be in a future month.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Maximum number of sales per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          description: ID of the next page, taken from the `nextPageId` of a previous response. Omit it
            to fetch the first page. An invalid or expired pagination cursor is rejected with `400 Bad
            Request`.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Sales
      summary: Update Sales
      operationId: put_api_v1_0_sales
      description: |
        > [!NOTE]
        > **Required role** — Update Sales

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update sales by their ids.
      parameters:
        - name: ids
          in: query
          required: true
          description: Array of sales ids. Maximum of 50 ids.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Indicates if the sales will be recurring or not.
          schema:
            type: boolean
        - name: isRefunded
          in: query
          description: Indicates if the sales will be refunded or not.
          schema:
            type: boolean
        - name: refundedDate
          in: query
          description: ISO 8601 date. Optional even when `isRefunded` is true; if omitted, the refunded
            date is set to the present date. Without a time zone offset the date is stored as UTC; see
            **Date Formats**.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: refundedAmount
          in: query
          description: Amount to be refunded.
          schema:
            type: string
      responses:
        '200':
          description: Sales updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/sales/{id}:
    delete:
      tags:
        - Sales
      summary: Delete Sale
      operationId: delete_api_v1_0_sales_id
      description: |
        > [!NOTE]
        > **Required role** — Delete Sales

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Delete a sale by its id.
      parameters:
        - name: id
          in: path
          required: true
          description: Sale id to be deleted.
          schema:
            type: string
      responses:
        '200':
          description: Sale deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/orders:
    post:
      tags:
        - Orders
      summary: Create Order
      operationId: post_api_v1_0_orders
      description: |
        > [!NOTE]
        > **Required role** — Create Orders

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create an order with all necessary information. Additionally, creates the lead if not already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                email:
                  type: string
                  description: Email associated with the lead. Required if no phone number is provided.
                parentEmail:
                  type: string
                  description: Email of the origin lead. If present, the sale will be attributed to the
                    origin lead.
                firstName:
                  type: string
                lastName:
                  type: string
                leadIps:
                  type: array
                  items:
                    type: string
                  description: IPs of the customer that made the purchase for ad attribution. Maximum
                    of 3 ips.
                  maxItems: 3
                stage:
                  type: string
                phoneNumbers:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Required if no email is provided.
                orderId:
                  type: string
                  description: Identifier by which sales will be grouped. Only letters, numbers, underscores,
                    hyphens, periods, and colons. No spaces.
                externalSubscriptionId:
                  type: string
                cartId:
                  type: string
                date:
                  type: string
                  description: ISO 8601 date when the transaction was processed. Defaults to current date.
                    Without a time zone offset the date is stored as UTC; see **Date Formats**.
                  example: '2021-04-16T20:35:00'
                shippingCost:
                  type: number
                  description: Shipping cost distributed across items. Default is 0.
                taxes:
                  type: number
                  description: Order taxes distributed across items. Default is 0.
                orderDiscount:
                  type: number
                  description: Discount applied to the complete order, distributed evenly across all line
                    items.
                hardCost:
                  type: number
                  description: A cost the merchant pays out of the order total, typically payment-processor
                    fees (e.g. Stripe). Distributed evenly across the line items and reported as part
                    of the sale hard cost, lowering net profit. Unlike `taxes` and `shippingCost` it is
                    **not** added to the order revenue, because the buyer did not pay it. Must not be
                    negative. Default is 0.
                priceFormat:
                  type: string
                  enum:
                    - DECIMAL
                    - INTEGER
                  default: DECIMAL
                currency:
                  type: string
                  description: Currency code (e.g. EUR). Defaults to Hyros account setup.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Item'
                  minItems: 1
            example:
              email: john@doe.com
              parentEmail: jane@doe.com
              firstName: John
              lastName: Doe
              leadIps:
                - 172.8.105.28
              stage: Customer
              phoneNumbers:
                - '1105385366'
              orderId: '56354354588'
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              date: '2021-04-16T20:35:00'
              priceFormat: DECIMAL
              currency: USD
              taxes: 98.6
              shippingCost: 10
              orderDiscount: 3.5
              hardCost: 3.15
              items:
                - name: T-Shirt - Blue
                  price: 15.5
                  costOfGoods: 2.25
                  externalId: '18294892740'
                  quantity: 2
                  sku: DEPOR-XYZ-BLN-41
                  taxes: 2.5
                  itemDiscount: 2.5
                  packages:
                    - Package 1
                    - Package 2
                  isRebill: false
                  tag: $premiun-t-shirt-blue
                  categoryName: premium store
      responses:
        '200':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request. Also returned when the request carries a blacklisted email address,
            with the message `The event was discarded because an email or phone number it carries is blacklisted
            for this account. This is set when a lead is permanently deleted.` No `request_id` is issued
            in that case, so there is nothing to poll. See *Delete Lead*.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/orders/{id}:
    put:
      tags:
        - Orders
      summary: Update Order
      operationId: put_api_v1_0_orders_id
      description: |
        > [!NOTE]
        > **Required role** — Update Orders

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Update an order by replacing its items list and optionally updating order-level fields.
        The existing sales of the order are soft-deleted and recreated according to the provided items.
      parameters:
        - name: id
          in: path
          required: true
          description: |
            Identifier of the order to update. By default this is the order id used during creation.
            When `integrationType` is provided in the body, this value is matched against the `externalId`
            of any item belonging to the order; the whole order is then resolved through that item.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                integrationType:
                  type: string
                  description: External integration the order belongs to (e.g. STRIPE, SHOPIFY, KONNEKTIVE,
                    API). When present, the path id is matched against an item externalId for that integration.
                  example: STRIPE
                stage:
                  type: string
                  description: Stage to apply to the customer's lead.
                externalSubscriptionId:
                  type: string
                cartId:
                  type: string
                shippingCost:
                  type: number
                  description: Shipping cost distributed across items. Default is 0.
                  example: 10.5
                taxes:
                  type: number
                  description: Order taxes distributed across items. Default is 0.
                  example: 9.8
                orderDiscount:
                  type: number
                  description: Discount applied to the complete order, distributed evenly across all line
                    items.
                  example: 1.2
                hardCost:
                  type: number
                  description: A cost the merchant pays out of the order total, typically payment-processor
                    fees (e.g. Stripe). Distributed evenly across the line items and reported as part
                    of the sale hard cost, lowering net profit; it is **not** added to the order revenue.
                    If omitted, the value already stored on the order's sales is kept, so a later call
                    can attach the fee without resending it. Send `0` to clear it. Must not be negative.
                  example: 3.15
                priceFormat:
                  type: string
                  enum:
                    - DECIMAL
                    - INTEGER
                  default: DECIMAL
                currency:
                  type: string
                  description: Currency code (e.g. EUR). Defaults to Hyros account setup.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Item'
                  minItems: 1
                  description: New items list. The existing items of the order will be replaced by this
                    list.
            example:
              stage: Repeat Customer
              cartId: d49b708b3df50505869ca54f026e7c97a4959b587605f14f91c7e289de9f80bd
              priceFormat: DECIMAL
              currency: USD
              taxes: 98.6
              shippingCost: 10
              orderDiscount: 3.5
              hardCost: 3.15
              items:
                - name: T-Shirt - Blue
                  price: 15.5
                  costOfGoods: 2.25
                  externalId: '18294892740'
                  quantity: 2
                  sku: DEPOR-XYZ-BLN-41
                  taxes: 2.5
                  itemDiscount: 2.5
                  isRebill: false
                  tag: $premiun-t-shirt-blue
                  categoryName: premium store
      responses:
        '200':
          description: Order updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Orders
      summary: Refund Order
      operationId: delete_api_v1_0_orders_id
      description: |
        > [!NOTE]
        > **Required role** — Delete Orders

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~5 minutes.

        Refund an order by order id and update the income of the lead.

        A refund records the refunded amount on the order's sales; it does not recalculate their costs.
        `shippingCost`, `taxes` and `hardCost` are left untouched, which matches how payment processors behave
        (e.g. Stripe keeps part of its fee on a refund). To adjust them, send a `PUT /api/v1.0/orders/{id}` with the
        corrected values.
      parameters:
        - name: id
          in: path
          required: true
          description: Order id to be refunded.
          schema:
            type: string
        - name: refundedAmount
          in: query
          description: Amount to be refunded.
          schema:
            type: string
      responses:
        '200':
          description: Order refunded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/calls:
    get:
      tags:
