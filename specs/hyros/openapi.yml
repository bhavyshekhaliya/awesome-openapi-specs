            currentStage:
              $ref: '#/components/schemas/LeadStage'
              description: Present only when the lead has a stage applied.
    SaleProduct:
      type: object
      description: Product information as it appears attached to a sale or call.
      properties:
        id:
          type: string
        name:
          type: string
        tag:
