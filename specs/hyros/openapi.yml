          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        state:
          $ref: '#/components/schemas/CallState'
        qualification:
          type: object
