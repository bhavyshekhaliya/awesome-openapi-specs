      properties:
        id:
          type: string
          description: Product id (its tracking pixel).
        name:
          type: string
        tag:
          type: string
        sku:
          type: string
        price:
          type: number
        customCost:
          type: number
          description: Cost of goods of the product, used in profit and ROAS reporting.
        recurring:
          type: boolean
        callProduct:
          type: boolean
        category:
          type: string
          description: Category name.
    Click:
      type: object
      properties:
        id:
          type: string
        leadId:
          type: string
          description: Id of the lead this click is attributed to. Empty until the click is connected
            to a lead.
        email:
          type: string
          description: Email of that lead. Empty until the click is connected to a lead.
        date:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Nov 17 10:51:54 ART 2022
        trackedUrl:
          type: string
        page:
          type: string
        previousUrl:
          type: string
        adspendType:
          $ref: '#/components/schemas/AdspendType'
        sourceLinkName:
          type: string
        ip:
          type: string
        agent:
          type: string
        cartId:
          type: string
        deduplicationParams:
          type: object
          additionalProperties: true
        adSpendId:
          type: integer
        parsedParameters:
          type: object
          additionalProperties: true
    Sale:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        creationDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
          example: Thu Jul 02 01:10:33 UTC 2026
        refundDate:
          type: string
          description: Returned in the legacy `EEE MMM dd HH:mm:ss zzz yyyy` format instead of ISO 8601.
            Present only when the sale was refunded.
          example: Thu Jul 02 01:10:33 UTC 2026
        qualified:
          type: boolean
        score:
          type: number
        recurring:
          type: boolean
        quantity:
          type: number
        lead:
          $ref: '#/components/schemas/Lead'
        firstSource:
          $ref: '#/components/schemas/Attribution'
        lastSource:
          $ref: '#/components/schemas/Attribution'
        price:
          $ref: '#/components/schemas/Price'
        product:
          $ref: '#/components/schemas/SaleProduct'
        provider:
          $ref: '#/components/schemas/Provider'
    ConversionPath:
      type: object
      description: |
        One conversion with the ordered source touches it was attributed with. `price`, `usdPrice` and `firstSale` are present on `SALE` and `CALL` rows only; a `LEAD` row does not carry those keys at all. `usdPrice` holds the same amounts as `price`, converted to USD.
      properties:
        id:
          type: string
          description: |
            The sale id for `SALE` (`sle-` prefixed), the call id for `CALL` (`cll-` prefixed), and the lead id for `LEAD`.
        leadId:
          type: string
          description: Id of the lead the conversion belongs to.
        creationDate:
          type: string
          description: |
            ISO 8601 date in the account timezone. It is the sale date for `SALE` and `CALL`, and the join date for `LEAD`.
          example: '2026-08-14T12:33:30-05:00'
        price:
          $ref: '#/components/schemas/Price'
        usdPrice:
          $ref: '#/components/schemas/Price'
        firstSale:
          type: boolean
          description: |
            Whether this is the lead's first sale, or first call. Repeat purchases are returned like any other conversion, so this is what tells them apart.
        path:
          type: array
          description: |
            The touches the conversion was attributed with, ordered by `clickDate` ascending. Each entry has the same shape as the `firstSource` and `lastSource` of `/sales`, `/calls` and `/leads`. For `SALE` and `CALL` it is the touches the conversion was attributed with up to the sale date; for `LEAD` it is the lead's full touch list. It can be empty when the conversion has no touch on record.
          items:
            $ref: '#/components/schemas/Attribution'
    CustomCost:
      type: object
