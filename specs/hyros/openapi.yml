              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Calls
      summary: Create Call
      operationId: post_api_v1_0_calls
      description: |
        > [!NOTE]
        > **Required role** — Create Calls

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a call with all necessary information. Additionally, creates the lead if not already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
