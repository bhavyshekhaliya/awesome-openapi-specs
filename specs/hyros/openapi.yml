            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/tracking-script:
    get:
      tags:
        - Tracking Script
      summary: Get Tracking Script
      operationId: get_api_v1_0_tracking_script
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Clicks

        Retrieves the tracking script for a given domain. If no domain is provided, returns the default tracking script.
        The script can be customized with optional parameters to enable SPA tracking, ignore previous URLs, embed on iframes, or hide tracking parameters.
      parameters:
        - name: domain
          in: query
          description: Domain for which to retrieve the tracking script.
          schema:
            type: string
        - name: spa
          in: query
          description: Enables tracking of clicks and emails on URL change for Single Page Applications
            (SPA). Defaults to false.
          schema:
            type: boolean
            default: false
        - name: ignorePrevUrl
          in: query
          description: When true, ignores sources from the previous URL during attribution. Defaults to
            false.
          schema:
            type: boolean
            default: false
        - name: embed
          in: query
          description: When true, embeds the Universal script on iframes. Defaults to false.
          schema:
            type: boolean
            default: false
        - name: deleteTrackingScriptParams
          in: query
          description: When true, the Universal Script will automatically hide the tracking parameters
            in the URL after use. This setting is persisted as user metadata.
          schema:
            type: boolean
      responses:
        '200':
          description: Tracking script HTML.
          content:
            text/plain:
              schema:
                type: string
              example: |
                <script>
                    var head = document.head;
                    var script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.src = "https://api.hyros.com/v1/lst/universal-script?ph=a48210e63e83136228b90e18c16461c07ba3c7bee05ba64615ecae4edcf9d130&tag=!clicked&ref_url=" + encodeURIComponent(document.URL);
                    head.appendChild(script);
                </script>
        '400':
          description: Invalid domain.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/domains:
    get:
      tags:
        - Domains
      summary: Get Domains
      operationId: get_api_v1_domains
      description: |
        > [!NOTE]
        > **Required role** — Get Lead Clicks

        Retrieves a list of verified domains associated with the product. This endpoint is served under `/api/v1/` (not `/api/v1.0/` like the other endpoints).
      responses:
        '200':
          description: List of verified domains.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - domain1.example.com
                - domain2.example.com
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/stages:
    get:
      tags:
        - Stages
      summary: Retrieve Lead Stages
      operationId: get_api_v1_0_stages
      description: |
        > [!NOTE]
        > **Required role** — Get Leads

        Retrieves all lead stages for the account, along with a count of leads for each one. By default that count is the leads whose *current* stage it is. `stageFromDate` and `stageToDate` scope it instead to the leads the stage was applied to inside a period, which is how you answer "how many leads entered this stage this week".

        The two counts are not comparable. Stage applications accumulate: a lead that moved from one stage to another inside the period is counted under *both*, while the default count attributes it only to the stage it ended in. So the sum of the counts in a period can exceed your number of leads, and a wide period generally reports more leads per stage than the unfiltered call does. Deleted leads are left out of both counts.

        The generic `fromDate` and `toDate` parameters are not honoured on this endpoint; use `stageFromDate` and `stageToDate`.
      parameters:
        - name: name
          in: query
          description: Name to search stages by.
          schema:
            type: string
        - name: stageFromDate
          in: query
          description: |
            An ISO 8601 formatted date. Only the leads the stage was applied to on or after this date are counted. The stages returned are unaffected, so a stage nobody entered inside the period is still listed, with an `amount` of `0`. A lead whose stage was later removed is not counted, even if it was applied inside the period. Counts above roughly 40,000 leads in a period are close estimates rather than exact totals; the default count is always exact. If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: stageToDate
          in: query
          description: |
            An ISO 8601 formatted date. Only the leads the stage was applied to on or before this date are counted. If the date does not include a timezone, the configured account timezone will be assumed.
          schema:
            type: string
          example: '2021-04-16T20:35:00-05:00'
        - name: pageSize
          in: query
          description: Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: integer
                  nextPageId:
                    type: string
                  request_id:
                    type: string
              example:
                result:
                  - name: SQL
                    amount: 1
                  - name: MQL
                    amount: 5
                nextPageId: 1073e129b360b78db3508bea584d1f295c7851c3d9b290308ac57528b6e38a21
                request_id: 5696f9a3524e42318f3cdf40176e70e3
        '400':
          description: Bad Request. `stageFromDate` later than `stageToDate`, an invalid date format,
            or an invalid `pageSize`/`pageId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ERROR
                message:
                  - stageFromDate cannot be later than stageToDate
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/webhook-subscriptions:
    post:
      tags:
        - Webhook Subscriptions
      summary: Create Webhook Subscription
      operationId: post_api_v1_0_webhook_subscriptions
      description: |
        > [!NOTE]
        > **Required role** — Create Webhook Subscriptions

        Create a webhook subscription. The subscription tells Hyros which event types to send,
        via **POST**, to the provided `targetUrl`. The response includes the generated
        `externalId` and the `secretKey` used to validate the HMAC signature of delivered events.
        The `secretKey` is returned only in this create response — store it, as it is not
        returned by the list endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - targetUrl
                - eventTypes
              properties:
                name:
                  type: string
                  description: Name of the subscription.
                targetUrl:
                  type: string
                  description: |
                    URL where the event payloads are sent. Must be a public `http`/`https` URL and cannot contain template placeholders like `{{placeholder}}`.
                    Non-HTTP schemes and internal/private hosts (loopback, link-local, private RFC-1918 ranges, wildcard, multicast, and cloud-metadata addresses) are rejected.
                eventTypes:
                  type: array
                  description: Event types to subscribe to. Must contain at least one known event type.
                  items:
                    type: string
                    enum:
                      - sale.attributed
                      - sale.refunded
                      - call.attributed
                      - lead.opted.in
                      - lead.opted.in.first.time
                      - lead.origin.assigned
                      - lead.stage.changed
                      - lead.tag.added
                      - lead.tag.removed
                      - subscription.created
                      - subscription.status.changed
            example:
              name: My CRM sync
              targetUrl: https://example.com/hooks/hyros
              eventTypes:
                - sale.attributed
                - lead.opted.in
      responses:
        '200':
          description: Subscription created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/WebhookSubscription'
                  request_id:
                    type: string
              example:
                result:
                  externalId: sub-2a475f6baf8f416bac9ff60e1a0fabb5
                  name: My CRM sync
                  targetUrl: https://example.com/hooks/hyros
                  eventTypes:
                    - sale.attributed
                    - lead.opted.in
                  state: ACTIVE
                  secretKey: ssk-244e8d359f67456cb9efac27913283fb
                  creationDate: '2026-07-09T14:28:15Z'
                  lastDeliveryDate: null
                request_id: 143d65f8d2654e16a9dab64b20176f9c
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Webhook Subscriptions
      summary: Retrieve Webhook Subscriptions
      operationId: get_api_v1_0_webhook_subscriptions
      description: |
        > [!NOTE]
        > **Required role** — Get Webhook Subscriptions

        Retrieve all non-deleted webhook subscriptions for the account.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                  request_id:
                    type: string
              example:
                result:
                  - externalId: sub-2a475f6baf8f416bac9ff60e1a0fabb5
                    name: My CRM sync
                    targetUrl: https://example.com/hooks/hyros
                    eventTypes:
                      - sale.attributed
                      - lead.opted.in
                    state: ACTIVE
                    creationDate: '2026-07-09T14:28:15Z'
                    lastDeliveryDate: '2026-07-09T15:13:20Z'
                request_id: c9e86849464545d9b6b24d8039fa38d8
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/webhook-subscriptions/{externalId}:
    delete:
      tags:
        - Webhook Subscriptions
      summary: Delete Webhook Subscription
      operationId: delete_api_v1_0_webhook_subscriptions_externalid
      description: |
        > [!NOTE]
        > **Required role** — Delete Webhook Subscriptions

        Delete a webhook subscription by its `externalId`.
      parameters:
