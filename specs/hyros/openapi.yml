          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/reports/generate:
    post:
      tags:
        - Reports
      summary: Generate Report
      operationId: post_api_v1_0_reports_generate
      description: |
        > [!NOTE]
        > **Required role** — Generate Reports

        > [!NOTE]
        > **Asynchronous** — the report is computed in the background. This call answers a report id; read the report with `GET /api/v1.0/reports/poll/{externalId}`.

        Start a report over the account's attribution and revenue data, grouped by source, ad, creative, keyword, geography,
        referrer, cohort, lead journey or sale item, over a date range.

        `groupBy` names the report family: it decides what a row is and which options apply. `JOURNEY` reports the paths leads
        took before converting, one row per journey, each carrying the steps it went through in `journeySteps` and the id of
        that path in `journeyId`. A journey report is read at the level of the narrowest source filter the request names — ads,
        then source links, then source categories — and at the traffic source level when it names none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - configuration
              properties:
                configuration:
                  type: object
                  required:
                    - groupBy
                    - startDate
                    - endDate
                  properties:
                    groupBy:
                      type: string
                      description: Report family. Determines what a row is and which options apply.
                      enum:
                        - SOURCE
                        - SOURCE_CATEGORY
                        - TRAFFIC_SOURCE
                        - AD_ACCOUNT
                        - GOAL
                        - AD
                        - CREATIVE
                        - KEYWORD
                        - SALE_ITEM_LTV
                        - SALE_ITEM_TOTAL
                        - COUNTRY
                        - REGION
                        - CITY
                        - DEVICE_TYPE
                        - DEVICE_PLATFORM
                        - REFERRER_DOMAIN
                        - REFERRER_URL
                        - JOURNEY
                        - COHORT
                    startDate:
                      type: string
                      description: Start date, inclusive, as ISO 8601 `yyyy-MM-dd`. Cannot be in a future
                        month.
                      example: '2026-09-01'
                    endDate:
                      type: string
                      description: End date, inclusive, as ISO 8601 `yyyy-MM-dd`. Cannot be before startDate,
                        nor in a future month.
                      example: '2026-09-07'
                    timeZone:
                      type: string
                      description: Requester's UTC offset as `+HH:mm` / `-HH:mm`. Start and end dates
                        resolve against it; when omitted the account's own time zone is used.
                      example: -03:00
                    options:
                      type: object
                      description: Options that apply to particular report families.
                      properties:
                        journeyKeyMetric:
                          type: string
                          description: What a lead journey report measures. Defaults to TOTAL_REVENUE.
                          enum:
                            - TOTAL_REVENUE
                            - SALES
                            - CALLS
                            - CUSTOMERS
                        ltvDays:
                          type: integer
                          description: LTV window in days.
                        creativeGroupType:
                          type: string
                          description: Attribute creatives are grouped by.
                        creativeViewType:
                          type: string
                          description: Layout creatives are returned in.
                        excludeLeadsWithoutSales:
                          type: boolean
                          description: Leave out leads that produced no sale.
                        onlyIncludeSourcelinksOfProducts:
                          type: boolean
                          description: Only include source links tied to the filtered products.
                    pagination:
                      type: object
                      description: Lead journey report state carried over from previous pages.
                      properties:
                        alreadyProcessedJourneyIds:
                          type: array
                          items:
                            type: string
                          description: Journey ids returned by previous pages, excluded from this one.
                            A journey report answers 30 journeys at a time.
                    reportAttribution:
                      type: object
                      description: Attribution model and its options; required for attribution-based groupings.
                        The same models the `/attribution` endpoints take.
                    filters:
                      type: object
                      description: Filters on sources, products and leads. The same filters the retrieval
                        endpoints take.
                    fields:
                      type: array
                      items:
                        type: string
                      description: |
                        Metrics to include as columns; omit to get every metric. A metric asked for is always present and reads null where the report found no value for it. `CAC` is null when the row has spend but no unique customers. A `0` means the customers came without ad spend.
                    customMetricIds:
                      type: array
                      items:
                        type: integer
                      description: Custom metric ids to include as columns.
                    settings:
                      type: object
                      description: Calculation settings — recurring sales, refunds, hard costs.
                    sorting:
                      type: object
                      description: Field and order to sort rows by. Traffic, cohort, journey and sale-item
                        reports keep the engine's own order and ignore it.
                    timeSegmentation:
                      type: object
                      description: Splits metrics into time buckets, by interval or window. Only the source
                        family supports it.
            example:
              configuration:
                groupBy: JOURNEY
                startDate: '2026-09-01'
                endDate: '2026-09-07'
                timeZone: -03:00
                options:
                  journeyKeyMetric: TOTAL_REVENUE
                filters:
                  sourceFilters:
                    includeSourceFilters:
                      sourceCategoryIds:
                        - 4412
                        - 4413
      responses:
        '200':
          description: Report accepted for generation. `result` is the report id to poll with.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: string
                    description: Report id.
              example:
                request_id: 0f8c1a1e3f1e4a0e9d1a6b0a2f6b0d21
                result: c81c6061f1f74ba4e338f7c1010493ba23da23440c00a896edddd51e5815ae21
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/reports/poll/{externalId}:
    get:
      tags:
        - Reports
      summary: Poll Report Result
      operationId: get_api_v1_0_reports_poll_externalid
      description: |
        > [!NOTE]
        > **Required role** — Get Reports

        Read a report started with `POST /api/v1.0/reports/generate`. Poll again while the status is `IN_PROGRESS`. A report
        generated too long ago comes back `EXPIRED` and has to be generated again.

        `totalRows` is the size of the whole report, not of the page returned, so it is what tells you whether there are more
        pages to read.
      parameters:
        - name: externalId
          in: path
          required: true
          description: Report id answered by the generate call.
          schema:
            type: string
        - name: pageSize
          in: query
          description: Rows per page. Range 1-250. Omit to get every row of the report.
          schema:
            type: integer
        - name: pageOffset
          in: query
          description: Zero-based index of the page to read. There are more pages while `(pageOffset +
            1) * pageSize` is below `totalRows`.
          schema:
            type: integer
      responses:
        '200':
          description: Report status, and the report itself once the status is SUCCESSFUL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - IN_PROGRESS
                          - SUCCESSFUL
                          - FAILED
                          - EXPIRED
                      report:
                        type: object
                        description: Absent until the status is SUCCESSFUL.
                        properties:
                          rows:
                            type: array
                            items:
                              type: object
                          totals:
                            type: object
                            description: A row carrying the totals of the report, on the families that
                              publish one.
                          totalRows:
                            type: integer
                            description: Size of the whole report, not of the page returned.
              example:
                request_id: 0f8c1a1e3f1e4a0e9d1a6b0a2f6b0d21
                result:
                  status: SUCCESSFUL
                  report:
                    rows:
                      - journeyId: 8a1f0c9d21
                        totalRevenue: 600.0
                        journeySteps:
                          - name: facebook
                            adSourceLevelId: 4412
                            adspendType: FACEBOOK
                    totalRows: 5
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
