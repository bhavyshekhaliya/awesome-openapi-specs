                              name: all
                            category:
                              id: cat-b83d72b83a742f9bd8d93a2403ba3809
                              name: hyros test campaign 2
                            adSource:
                              platform: FACEBOOK
                              adSourceId: '23843648148170123'
                              adAccountId: '887874684917514'
                    nextPageId: 568fd86587125f55117505312dc72bb8b71e9647a25e5b142d3f28bccd228360
                    request_id: 5696f9a3524e42318f3cdf40176e70e3
        '400':
          description: |
            Bad Request. A missing or invalid `conversionType`, an `ids` parameter, a `windowAttributionDaysRange` outside 0-365, an invalid date format, or an invalid `pageSize`/`pageId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingConversionType:
                  summary: conversionType was not sent
                  value:
                    result: ERROR
                    message:
                      - 'Missing required parameter: conversionType'
                invalidConversionType:
                  summary: conversionType is not one of the allowed values
                  value:
                    result: ERROR
                    message:
                      - 'Invalid value for parameter conversionType. Allowed values: SALE, CALL, LEAD'
                idsNotSupported:
                  summary: The shared ids parameter was sent
                  value:
                    result: ERROR
                    message:
                      - The ids parameter is not supported by this endpoint
                invalidWindow:
                  summary: windowAttributionDaysRange is outside 0-365
                  value:
                    result: ERROR
                    message:
                      - 'Invalid days range for window of attribution: 400'
                invalidPageId:
                  summary: The pagination cursor is invalid or expired
                  value:
                    result: ERROR
                    message:
                      - Invalid pageId
        '403':
          description: |
            The Api-Key does not carry the `Get Conversion Paths` role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ERROR
                message:
                  - Forbidden, missing api key roles
                  - Get Conversion Paths
  /api/v1.0/attribution:
    get:
      tags:
        - Attribution
      summary: Get Ads Attribution Report
      operationId: get_api_v1_0_attribution
      description: |
        > [!NOTE]
        > **Required role** — Get Attribution

        Retrieves Facebook AdSet or Google Campaign attribution information.

        **Notes:**
        - When `isAdAccountId` is `true` and `timeGroupingOption` is `day`, `week`, `month`, or `year`, the request will fail.
        - When `status` is `active` or `paused` and `timeGroupingOption` is not `source_link`, the request will fail.
        - `keywordsIds` is required at the `google_keyword` and `google_v2_keyword` levels, both of which report at the keyword level. Either of them without it fails the request.
        - `isAdAccountId` is not supported at the keyword level, and sending it there fails the request: the ids reported on are derived from `keywordsIds`, so the ad account id is discarded. Pass `keywordsIds` without `isAdAccountId`.
        - When `isAdAccountId` is `true`, the response rows follow the order the account's sources were paginated in, which `newestFirst` controls.
        - Ids that do not exist at the requested `level` are skipped rather than failing the request: the ids that do resolve are still reported on, and the ones that do not are named in `message`. An id that exists but has no data for the range is not named there, so an empty `result` with no such `message` means every id exists and none of them reported anything for the range.
      parameters:
        - name: attributionModel
          in: query
          required: true
          description: Attribution model.
          schema:
            type: string
            enum:
              - last_click
              - scientific
              - first_click
        - name: startDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2020-05-12T10:00:00'
        - name: endDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2021-04-13T10:00:00'
        - name: level
          in: query
          required: true
          description: |
            Attribution level for the report.

            `google_adgroup`, `google_v2_adgroup`, `google_keyword` and `google_v2_keyword` are only available on accounts with the Google v2 integration.
          schema:
            type: string
            enum:
              - google_campaign
              - google_v2_campaign
              - google_adgroup
              - google_v2_adgroup
              - google_ad
              - google_v2_ad
              - google_keyword
              - google_v2_keyword
              - facebook_adset
              - facebook_campaign
              - tiktok_adgroup
              - snapchat_adsquad
              - pinterest_adgroup
              - twitter_adgroup
              - bing_adgroup
              - linkedin_campaign
              - facebook_ad
              - tiktok_ad
              - snapchat_ad
              - pinterest_ad
              - twitter_ad
              - bing_ad
              - linkedin_ad
        - name: fields
          in: query
          required: true
          description: |
            Comma-separated fields to include in the report. Available values:
            `sales`, `revenue`, `calls`, `total_revenue`, `recurring_revenue`, `refund`, `unique_sales`,
            `leads`, `new_leads`, `cost`, `profit`, `roi`, `roas`, `refund_count`, `refund_sales_percentage`,
            `refund_revenue_percentage`, `cost_per_call`, `cost_per_lead`, `cost_per_sale`, `cost_per_new_lead`,
            `cost_per_unique_sale`, `unique_customers`, `unique_customers_revenue`, `cost_per_unique_customer`,
            `net_profit`, `hard_costs`, `qualified_calls`, `unqualified_calls`, `cost_per_qualified_call`,
            `time_of_sale_attribution`, `time_of_call_attribution`, `clicks`, `new_visits`, `cost_per_new_visit`,
            `cost_per_click`, `reported`, `reported_result`, `shop_reported_result`, `reported_vs_revenue`,
            `new_customers_percentage`, `recurring_customers`, `total_customers`, `customers`, `ctr`, `cpm`,
            `cvr`, `impressions`, `gross_margins`, `partial_video_views`, `unique_calls`, `canceled_calls`,
            `cost_per_unique_call`, `net_profit_percentage`, `taxes`, `cost_of_goods`, `shipping_value`,
            `30_days_ltv`, `60_days_ltv`, `90_days_ltv`, `6_months_ltv`, `1_year_ltv`,
            `30_days_ltv_forecast`, `60_days_ltv_forecast`, `90_days_ltv_forecast`, `6_months_ltv_forecast`,
            `1_year_ltv_forecast`, `churn_rate`, `one_time_sales`, `subscription_30_days_forecast`,
            `subscription_60_days_forecast`, `subscription_90_days_forecast`, `subscription_6_months_forecast`,
            `subscription_1_year_forecast`, `cac`, `aov`, `new_subscriptions`, `canceled_subscriptions`,
            `direct_subscriptions`, `new_mrr`, `new_trials`, `converted_trials`, `canceled_trials`,
            `cost_per_new_subscriptions`, `cost_per_new_trials`, `carts`, `atc_events`, `purchased_carts`,
            `atc_cvr`, `atc_rate`, `cost_per_atc`, `name`, `parent_name`, `contribution_profit`,
            `contribution_margin`, `leads_optins`, `no_show_calls`, `new_customers_roas`, `new_customers_aov`,
            `new_customers_orders`, `recurring_customers_percentage`, `returning_customers`,
            `returning_customers_rate`, `returning_customers_revenue`, `returning_customers_revenue_rate`,
            `mrr`, `arr`, `cost_per_unique_sales`, `refunded_sales_percentage`, `refunded_revenue_percentage`

            `unique_customers` counts the distinct leads whose purchase in the row is their first ever, the metric
            the account's report screens call New Customers. A repeat buyer, a subscription rebill and a lead
            imported as an existing customer all bring revenue without raising it, while `revenue` carries no
            first-purchase condition, so a row can report revenue with `unique_customers` at `0`. `revenue` covers
            one-time sales only: rebills land in `recurring_revenue`, and `total_revenue` and `roas` are the ones
            that count both. `unique_customers_revenue` is the part of the revenue those first purchases brought,
            and `returning_customers` is `customers` minus `unique_customers` rather than a direct count of prior
            buyers.

            `cac` is null when the row has spend but no `unique_customers`. A `0` means the customers came without ad spend.
          schema:
            type: string
          example: sales,revenue,calls,cost,roi,roas
        - name: ids
          in: query
          required: true
          description: Comma-separated ids based on the `level`. They must exist at the given `level`;
            the ones that do not are skipped. Can be an ad account id when `isAdAccountId` is true (only
            one allowed). Maximum of 50 ids. Not required at the keyword level, where the ids reported
            on are derived from `keywordsIds`.
          schema:
            type: string
          example: 205044496234,205044496235
        - name: keywordsIds
          in: query
          description: Map of ad group ids and keywords. Required for the `google_keyword` and `google_v2_keyword`
            levels, and only used by them. At those levels the ids reported on are derived from it.
          schema:
            type: string
          example: 66457534290:[391764277422,10000010]
        - name: currency
          in: query
          schema:
            type: string
            enum:
              - usd
              - user_currency
            default: user_currency
        - name: dayOfAttribution
          in: query
          description: If true, filters by click date instead of sale date.
          schema:
            type: boolean
            default: false
        - name: scientificDaysRange
          in: query
          description: Day range (1-30) for first ad attribution. Used with scientific model.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 30
        - name: sourceConfiguration
          in: query
          description: |
            How organic and paid sources are handled. `prioritize_paid`, the default, discards organic clicks before attributing, so a sale closed by an organic click is credited to its previous paid click. `all_sources` credits the source that closed the sale, organic or paid.
          schema:
            type: string
            enum:
              - all_sources
              - only_organic
              - only_paid
              - prioritize_organic
              - prioritize_paid
            default: prioritize_paid
        - name: excludeHardCosts
          in: query
          description: |
            When `true`, hard costs (taxes, shipping and cost of goods) are subtracted from the reported revenue, the way the report screens in the app do when they exclude hard costs. When `false`, revenue is reported before hard costs.
          schema:
            type: boolean
            default: false
        - name: ignoreRecurringSales
          in: query
          schema:
            type: boolean
            default: false
        - name: isAdAccountId
          in: query
          description: If true, the id in `ids` is an ad account ID. All sources of that account will
            be paginated and reported on at the selected `level`. Not supported at the `google_keyword`
            and `google_v2_keyword` levels.
          schema:
            type: boolean
            default: false
        - name: forecastingOption
          in: query
          schema:
            type: string
            enum:
              - first_sale
              - total_sales
            default: first_sale
        - name: windowAttributionDaysRange
          in: query
          description: Days range for discard attribution (0-365).
          schema:
            type: integer
            minimum: 0
            maximum: 365
            default: 0
        - name: newCustomerConfiguration
          in: query
          description: |
            Filters the report's sales by whether the sale is the customer's first purchase.
            `only_unique_customers` keeps only those first purchases, `only_returning_customers` keeps
            everything else, and the default `all_customers` counts both. Sales, revenue and ROAS are narrowed
            by it, ad spend and leads are not, so under `only_unique_customers` ROAS divides filtered revenue by
            full spend. It keys on the first-purchase flag alone, so unlike the `unique_customers` metric it
            does not exclude leads marked as existing customers.
          schema:
            type: string
            enum:
              - all_customers
              - only_returning_customers
              - only_unique_customers
        - name: status
          in: query
          description: Filter ad spend by status. Only supported when `timeGroupingOption` is `source_link`.
          schema:
            type: string
            enum:
              - active
              - paused
        - name: timeGroupingOption
          in: query
          schema:
            type: string
            enum:
              - source_link
              - day
              - week
              - month
              - year
            default: source_link
        - name: lead_stage
          in: query
          description: Filters the report to the leads and sales whose lead's current stage is any of
            the given account lead stages, by stage name (case-insensitive), comma-separated (e.g. `mql,sql,customer`),
            so a lead that has since moved on no longer counts. Leads, sales, revenue and ROAS are all
            narrowed by it, ad spend is not, so cost per lead and cost per acquisition rise against the
            filtered counts. An unknown stage name returns a 400 listing the account's stage names, which
            `GET /stages` also lists.
          schema:
            type: string
        - name: newestFirst
          in: query
          description: Reads the ad account's sources newest first, ordering them by creation, so the
            first page holds the most recently created sources instead of the oldest ones. Only applies
            when `isAdAccountId` is `true`.
          schema:
            type: boolean
            default: false
        - name: pageSize
          in: query
          description: Maximum number of sources per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
        - name: pageId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              example:
                request_id: d3d80491c48140b89a23071d19c0f88f
                result:
                  - id: '205044496234'
                    revenue: 997.0
                    sales: 10
                    calls: 5
                    campaign_id: '23843648123456789'
                    reported_result: null
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAttributionModel:
                  summary: attributionModel is not one of the models this report serves
                  value:
                    result: ERROR
                    message:
                      - 'Invalid attributionModel: depreciation. Accepted values: last_click, first_click,
                        scientific'
  /api/v1.0/attribution/roas:
    get:
      tags:
        - Attribution
      summary: Get ROAS
      operationId: get_api_v1_0_attribution_roas
      description: |
        > [!NOTE]
        > **Required role** — Get ROAS

        Retrieves the cash actually collected by the entity a single `id` identifies at the given `level`, against its ad spend.

        A narrow preset over `GET /api/v1.0/attribution`: the reporting level is resolved from the id and the requested level, so the
        platform never has to be supplied and the caller does not need to know which reporting level each platform's ads, ad sets or
        campaigns report at. The metric set, attribution model and row grouping are fixed. Rebills are already counted inside
        `total_revenue`, and sales are credited to the click that drove them however long they took to land. `roas` is revenue over
        spend, so break-even is `1.0` rather than `0`.

        **Attribution model.** This endpoint always measures under `last_click`, and the model is not selectable. That matters for
        reading the number: under `last_click` a sale is credited to the entity whose click came *last* before the purchase, so the
        same entity over the same range would report a different `roas` under a first-click model.

        Use `GET /api/v1.0/attribution` instead to choose the attribution model, to pick reporting levels or metrics, to group results
        by date, or to report on several entities at once.

        **Notes:**
        - `id` and `level` are both required, and the id must belong to the level given.
        - Campaign-level reporting is available on Meta, Google and LinkedIn. The remaining platforms have no campaign level, so report those at the `ad` or `source_link` level.
        - An id that does not belong to the account returns a `400` rather than a report of zeros.
      parameters:
        - name: id
          in: query
          required: true
          description: Id of the entity to report on, as the ad platform issues it. It must belong to
            the given `level`.
          schema:
            type: string
          example: '23851234567890123'
        - name: level
          in: query
          required: true
          description: |
            Granularity the id refers to.
            - `ad`: a single ad.
            - `source_link`: an ad set on Meta, an ad group elsewhere. The level most tracked data sits at.
            - `campaign`: a campaign, whose contained ads are resolved and aggregated.
            - `account`: a whole ad account.
          schema:
            type: string
            enum:
              - ad
              - source_link
              - campaign
              - account
          example: source_link
        - name: startDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2020-05-12'
        - name: endDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2020-05-19'
        - name: basis
          in: query
          description: |
            Which date the range filters on.
            - `click_date`: credits the clicks made inside the range, however long their sales took to land afterwards. Since the
              endpoint measures under `last_click`, the click it dates a sale by is the *last* one before the purchase.
            - `sale_date`: counts only the revenue collected inside the range.
          schema:
            type: string
            enum:
              - click_date
              - sale_date
            default: click_date
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    description: The single entity reported on. Absent when it has no row for the range.
              example:
                request_id: cb0e1b0e5a7f4c0b9f0e1b0e5a7f4c0b
                result:
                  id: '23851234567890123'
                  roas: 3.42
                  new_customers_roas: 2.81
                  revenue: 8200.0
                  recurring_revenue: 1350.0
                  total_revenue: 9550.0
                  cost: 2792.4
                  unique_sales: 74
                  unique_customers: 61
                  reported_result: 88
                  reported_vs_revenue: 1120.0
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/attribution/marginal-cac-curve:
    get:
      tags:
        - Attribution
      summary: Get Marginal CAC Curve
      operationId: get_api_v1_0_attribution_marginal_cac_curve
      description: |
        Computes, from the account's own daily spend history, what happens to the cost of acquiring the next customer at every observed
        daily spend level for the entity a single `id` identifies at the given `level` — and past which spend level the next dollar is
        wasted.

        Days in the range are grouped into equal-count buckets by ascending daily spend; each bucket carries its average CAC and the
        marginal CAC versus the previous cheaper bucket (the incremental spend per incremental customer). The saturation point is the
        first spend level from which every remaining level is wasteful — its marginal CAC exceeds the ceiling, or the extra spend
        produced no extra customers. Degraded data returns a partial curve explained through `notes` rather than an error.

        **Attribution model.** This endpoint always measures on the click date and with rebills included, and defaults to `first_click`:
        a customer is credited to the first ad that touched them, so each daily point relates a spend level to the acquisitions it
        caused and recurring revenue rolls up to the acquiring ad — a cost-of-acquisition curve. Passing `attributionModel=last_click`
        credits the customer to the click that immediately preceded the purchase instead, turning the result into a
        cost-of-*closing* curve: what it costs the entity to close the next customer. Use it for retargeting and bottom-of-funnel
        entities, whose real contribution first-click hands over to whichever ad acquired the customer earlier. Read a prospecting
        entity that way and the curve distorts, since most of the customers it acquired were closed elsewhere.

        **The ceiling.** Defaults to the entity's realized LTV for the requested window — break-even, with no margin — and
        `ceilingBasis` states which rule produced it. Note the realized LTV groups customers by what they bought, not by how they
        retain, so two traffic sources whose customers buy the same products report the same LTV even if their rebill behavior differs.
        At the `account` level no LTV is available, so the ceiling is the caller's `cacCeiling` or none.

        **Notes:**
        - `id` and `level` are both required, and the id must belong to the level given.
        - Campaign-level reporting is available on Meta, Google and LinkedIn. The remaining platforms have no campaign level, so report those at the `ad` or `source_link` level.
        - An id that does not belong to the account returns a `400` rather than a curve of zeros.
        - Customers are attributed to their click date, so the most recent days may undercount customers whose conversions have not happened yet.
      parameters:
        - name: id
          in: query
          required: true
          description: Id of the entity to report on, as the ad platform issues it. It must belong to
            the given `level`.
          schema:
            type: string
          example: '23851234567890123'
        - name: level
          in: query
          required: true
          description: |
            Granularity the id refers to.
            - `ad`: a single ad.
            - `source_link`: an ad set on Meta, an ad group elsewhere. The level most tracked data sits at.
            - `campaign`: a campaign, whose contained ads are resolved and aggregated.
            - `account`: a whole ad account. Day-grouped ranges are capped at 90 days on this level.
          schema:
            type: string
            enum:
              - ad
              - source_link
              - campaign
              - account
          example: source_link
        - name: startDate
          in: query
          description: ISO 8601 starting date of the history. Defaults to 90 days before `endDate`. If
            the date does not include a timezone, the configured account timezone will be assumed. Both
            bounds must either carry an offset or both omit it. A defaulted bound never carries an offset,
            so send both bounds when you send one.
          schema:
            type: string
          example: '2020-05-12'
        - name: endDate
          in: query
          description: ISO 8601 ending date of the history. Defaults to today. If the date does not include
            a timezone, the configured account timezone will be assumed. Both bounds must either carry
            an offset or both omit it. A defaulted bound never carries an offset, so send both bounds
            when you send one.
          schema:
            type: string
          example: '2020-08-10'
        - name: ltvWindow
          in: query
          description: |
            Realized LTV window used as the break-even ceiling when `cacCeiling` is absent. Rejected at the `account` level, which
            carries no LTV — provide `cacCeiling` there instead.
          schema:
            type: string
            enum:
              - 30_days
              - 60_days
              - 90_days
              - 6_months
              - 1_year
            default: 90_days
        - name: cacCeiling
          in: query
          description: |
            Maximum acceptable cost to acquire one customer, chosen by the caller (e.g. a fraction of LTV that preserves margin).
            Overrides the LTV break-even ceiling. Must be zero or positive.
          schema:
            type: number
          example: 52
        - name: attributionModel
          in: query
          description: |
            Which model credits a customer to the entity.
            - `first_click`: the customer belongs to the first ad that touched them — a cost-of-acquisition curve, and the way to read prospecting entities.
            - `last_click`: the customer belongs to the click that immediately preceded the purchase — a cost-of-closing curve, and the way to read retargeting and bottom-of-funnel entities.
          schema:
            type: string
            enum:
              - first_click
              - last_click
            default: first_click
      responses:
        '200':
          description: |
            Successful response. `curve` is ordered by ascending daily spend level; `saturationPoint` is null when saturation was not
            reached in the observed range. `notes` explains a partial curve: `NO_SPEND_DATA`, `NO_CUSTOMERS`, `INSUFFICIENT_DATA`,
            `LTV_CEILING_UNAVAILABLE`.

            `ceilingBasis` is `CALLER_PROVIDED` or `LTV_BREAKEVEN`, and `ltvWindow` is null unless the ceiling came from the LTV
            break-even rule. `name` is null at the `account` level, whose rows are date ranges rather than a named entity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
                    description: The curve computed for the entity reported on.
              example:
                request_id: cb0e1b0e5a7f4c0b9f0e1b0e5a7f4c0b
                result:
                  id: '23851234567890123'
                  level: SOURCE_LINK
                  name: YT-LongForm-Founder
                  startDate: '2020-05-12'
                  endDate: '2020-08-10'
                  attributionModel: FIRST_CLICK
                  daysSampled: 84
                  cacCeiling: 52.0
                  ceilingBasis: CALLER_PROVIDED
                  ltvWindow: null
                  curve:
                    - spendPerDay: 812.4
                      days: 28
                      newCustomers: 594
                      avgCac: 38.29
                      marginalCac: null
                    - spendPerDay: 1490.1
                      days: 28
                      newCustomers: 941
                      avgCac: 44.33
                      marginalCac: 54.68
                    - spendPerDay: 2274.75
                      days: 28
                      newCustomers: 1088
                      avgCac: 58.54
                      marginalCac: 149.46
                  saturationPoint:
                    efficientSpendPerDay: 1490.1
                    saturatedSpendPerDay: 2274.75
                    reason: MARGINAL_CAC_ABOVE_CEILING
                  notes: []
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/attribution/ad-account:
    get:
      tags:
        - Attribution
      summary: Get Ad Accounts Attribution Report
      operationId: get_api_v1_0_attribution_ad_account
      description: |
        > [!NOTE]
        > **Required role** — Get Ad Account Attribution

        Retrieves Ad account attribution information.
      parameters:
        - name: attributionModel
          in: query
          required: true
          schema:
            type: string
            enum:
              - last_click
              - scientific
              - first_click
        - name: startDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2020-05-12T10:00:00'
        - name: endDate
          in: query
          required: true
          description: An [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) formatted date. If the date
            does not include a timezone, the configured account timezone will be assumed. Both bounds
            must either carry an offset or both omit it.
          schema:
            type: string
          example: '2021-04-13T10:00:00'
        - name: fields
          in: query
          required: true
          description: |
            Comma-separated fields to include in the report (same set as Ad Attribution endpoint).
            `unique_customers` counts the distinct leads whose purchase in the row is their first ever, the metric the account's report screens call New Customers. A repeat buyer, a subscription rebill and a lead imported as an existing customer all bring revenue without raising it, while `revenue` carries no first-purchase condition, so a row can report revenue with `unique_customers` at `0`. `revenue` covers one-time sales only: rebills land in `recurring_revenue`, and `total_revenue` and `roas` are the ones that count both. `unique_customers_revenue` is the part of the revenue those first purchases brought, and `returning_customers` is `customers` minus `unique_customers` rather than a direct count of prior buyers.
            `cac` is null when the row has spend but no `unique_customers`. A `0` means the customers came without ad spend.
          schema:
            type: string
        - name: ids
          in: query
          required: true
          description: The Ad Account id. Maximum of 1 id.
          schema:
            type: string
          example: '205044496234'
        - name: currency
          in: query
          schema:
            type: string
            enum:
              - usd
              - user_currency
            default: user_currency
        - name: dayOfAttribution
          in: query
          schema:
            type: boolean
            default: false
        - name: scientificDaysRange
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 30
        - name: sourceConfiguration
          in: query
          description: |
            How organic and paid sources are handled. `prioritize_paid`, the default, discards organic clicks before attributing, so a sale closed by an organic click is credited to its previous paid click. `all_sources` credits the source that closed the sale, organic or paid.
          schema:
            type: string
            enum:
              - all_sources
              - only_organic
              - only_paid
              - prioritize_organic
              - prioritize_paid
            default: prioritize_paid
        - name: adLevelDateGroupingOption
          in: query
          schema:
            type: string
            enum:
              - ad_account
              - day
              - week
              - month
              - year
            default: ad_account
        - name: excludeHardCosts
          in: query
          description: |
            When `true`, hard costs (taxes, shipping and cost of goods) are subtracted from the reported revenue, the way the report screens in the app do when they exclude hard costs. When `false`, revenue is reported before hard costs.
          schema:
            type: boolean
            default: false
        - name: reportSourceVisibility
          in: query
          description: |
            When `true`, the account's source links are resolved with the visibility rules the report screens in the app use: deleted source links are excluded and, under the `scientific` model, link activity is evaluated from `scientificDaysRange` days before `startDate`. When `false`, deleted links count and activity is evaluated over the raw date range.
          schema:
            type: boolean
            default: false
        - name: ignoreRecurringSales
          in: query
          schema:
            type: boolean
            default: false
        - name: forecastingOption
          in: query
          schema:
            type: string
            enum:
              - first_sale
              - total_sales
            default: first_sale
        - name: windowAttributionDaysRange
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 365
            default: 0
        - name: newCustomerConfiguration
          in: query
          description: |
            Filters the report's sales by whether the sale is the customer's first purchase.
            `only_unique_customers` keeps only those first purchases, `only_returning_customers` keeps
            everything else, and the default `all_customers` counts both. Sales, revenue and ROAS are narrowed
            by it, ad spend and leads are not, so under `only_unique_customers` ROAS divides filtered revenue by
            full spend. It keys on the first-purchase flag alone, so unlike the `unique_customers` metric it
            does not exclude leads marked as existing customers.
          schema:
            type: string
            enum:
              - all_customers
              - only_returning_customers
              - only_unique_customers
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  request_id:
                    type: string
              example:
                result:
                  - id: '205044496234'
                    sales: 64
                    leads: 0
                    total_revenue: 9283.41
                    cost: 9172.25
                    cost_per_sale: 143.32
                    start_date: '2020-05-12T10:00:00'
                    end_date: '2021-04-13T10:00:00'
                    reported_result: null
                request_id: d9031a3780c14ecdb8ca3af5cd26bc91
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAttributionModel:
                  summary: attributionModel is not one of the models this report serves
                  value:
                    result: ERROR
                    message:
                      - 'Invalid attributionModel: depreciation. Accepted values: last_click, first_click,
                        scientific'
  /api/v1.0/ad-accounts:
    get:
      tags:
        - Ad Accounts
      summary: List Ad Accounts
      operationId: get_api_v1_0_ad_accounts
      description: |
        > [!NOTE]
        > **Required role** — Get Ad Accounts

        List the ad accounts connected to your account. Use the returned `id`
        values as the ad account id for the Ad Attribution endpoint (with
        `isAdAccountId=true`) and the Ad Account Attribution endpoint.
        Results are paginated: each response includes a `nextPageId`; pass it
        back as `pageId` to retrieve the following page. The last page has a
        `null` `nextPageId`.
      parameters:
        - name: ids
          in: query
          required: false
          description: Comma-separated ad account ids to filter by. If omitted, all connected ad accounts
            are returned. Maximum of 50 ids.
          schema:
            type: string
          example: 205044496234,118822334455
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to include in each result. If omitted, all fields are returned.
          schema:
            type: string
            enum:
              - name
              - type
          example: name,type
        - name: pageSize
          in: query
          required: false
          description: The maximum number of ad accounts to return in a single page. Defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: pageId
          in: query
          required: false
          description: The id of the next page to retrieve, taken from the `nextPageId` of a previous
            response. Any change to the other parameters resets pagination.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  nextPageId:
                    type: string
                    nullable: true
                    description: Cursor for the next page, or null on the last page.
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
              example:
                request_id: 43573923369e40bbafd46925a5c15ff5
                nextPageId: b8f1c2d3e4a5
                result:
                  - id: '205044496234'
                    name: Acme - Meta Ads
                    type: FACEBOOK
                  - id: '118822334455'
                    name: Acme - Google Ads
                    type: GOOGLE
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/products:
    post:
      tags:
        - Products
      summary: Create Product
      operationId: post_api_v1_0_products
      description: |
        > [!NOTE]
        > **Required role** — Create Products

        > [!NOTE]
        > **Asynchronous** — effect is not immediate; changes typically appear within ~10 seconds.

        Create a product with name, price and category. The tag is created from the product's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  description: Name of the product. Must have at least 3 characters.
                price:
                  type: number
                  description: 'Plain number only: up to 8 digits before the decimal point and up to 2
                    after (max 99999999.99). Currency symbols and separators are not accepted.'
                category:
                  type: string
                packages:
                  type: array
                  items:
                    type: string
                  description: Product packages (used for recurring sales attribution).
            example:
              name: Product 1
              price: 5.66
              category: Category 1
              packages:
                - Package 1
                - Package 2
      responses:
        '200':
          description: Product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Products
      summary: Retrieve Products
      operationId: get_api_v1_0_products
      description: |
        > [!NOTE]
        > **Required role** — Get Products

        Search and retrieve products by name, tag, category and recurrence. Results are paginated.
      parameters:
        - name: name
          in: query
          description: Filter products whose name equals this value (exact match).
          schema:
            type: string
        - name: tag
          in: query
          description: Filter products whose tag equals this value (exact match). The sale prefix "$"
            is added automatically when omitted.
          schema:
            type: string
        - name: category
          in: query
          description: Filter products by the name of their category.
          schema:
            type: string
        - name: isRecurringSale
          in: query
          description: Filter by recurring status.
          schema:
            type: string
            enum:
              - RECURRING
              - NON_RECURRING
              - ALL
            default: ALL
        - name: pageSize
          in: query
          description: Maximum number of products per page. Range 1-250.
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
        - name: pageId
          in: query
          description: ID of the next page. Returned in `nextPageId` of each response.
          schema:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  nextPageId:
                    type: string
                  request_id:
                    type: string
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1.0/products/{id}:
    put:
      tags:
        - Products
      summary: Update Product
      operationId: put_api_v1_0_products_id
      description: |
        > [!NOTE]
        > **Required role** — Update Products

        Update a product's fields. Only the fields included in the request are modified; any field left out is kept unchanged.
      parameters:
        - name: id
          in: path
          required: true
          description: Product id (its tracking pixel, as returned by the products listing).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the product. Must have at least 3 characters.
                price:
                  type: number
                  description: 'Plain number only: up to 8 digits before the decimal point and up to 2
                    after (max 99999999.99). Currency symbols and separators are not accepted.'
                customCost:
                  type: number
                  description: Cost of goods of the product, used in profit and ROAS reporting.
                tag:
                  type: string
                sku:
                  type: string
                category:
                  type: string
                isRecurringSale:
                  type: boolean
                  description: Whether the product is a recurring sale. A product cannot be both a recurring
                    sale and a call product.
                callProduct:
                  type: boolean
                  description: Whether the product is a call product. A product cannot be both a recurring
                    sale and a call product.
                packages:
                  type: array
                  items:
                    type: string
                  description: Product packages (used for recurring sales attribution). Omit to keep the
                    current packages unchanged; send an empty array to remove the product from all packages.
                updateHistoricalSales:
                  type: boolean
                  description: When true, a cost change is propagated to the product's existing sales,
                    updating their profit and ROAS.
                  default: false
            example:
              price: 7.99
              customCost: 3.0
              updateHistoricalSales: true
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
