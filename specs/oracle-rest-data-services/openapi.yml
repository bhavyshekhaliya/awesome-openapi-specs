openapi: 3.1.0
info:
  title: Oracle REST Data Services Database API
  version: 1.0.0
  description: >-
    Focused community-maintained specification for three read operations in
    the Oracle REST Data Services Database API. The documented OpenAPI file is
    generated by a running ORDS instance, and its URL, available services, and
    returned fields depend on installation, database version, configuration,
    and caller privileges. This specification models the database/schema
    qualified URL form and omits other operations and the optional q filter.
  externalDocs:
    description: Oracle REST Data Services API reference
    url: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/26.1/orrst/rest-endpoints.html
servers:
  - url: https://{host}/{contextRoot}/{database}/{schema}/_/db-api/stable
    description: Database API base URL for an ORDS installation
    variables:
      host:
        default: localhost:8080
        description: Replace with the hostname and port of your ORDS server.
      contextRoot:
        default: ords
        description: Context root configured for ORDS.
      database:
        default: mydb
        description: Database name or alias in the ORDS URL.
      schema:
        default: myschema
        description: REST-enabled database schema in the ORDS URL.
security:
  - basicAuth: []
paths:
  /database/status:
    get:
      operationId: getDatabaseStatus
      summary: Get database status
      description: >-
        Returns status information from GV$INSTANCE and GV$DATABASE. The
        calling user must have the SQL Administrator role.
      externalDocs:
        description: Get database status documentation
        url: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/26.1/orrst/op-database-status-get.html
      responses:
        '200':
          description: Database status information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatus'
  /database/objects/:
    get:
      operationId: listDatabaseObjects
      summary: List database objects
      description: >-
        Returns records from DBA_OBJECTS or ALL_OBJECTS, depending on the
        caller's role. The caller requires the SQL Administrator or SQL
        Developer role.
      externalDocs:
        description: Get all database objects documentation
        url: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/26.1/orrst/op-database-objects-get.html
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of database object records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseObjectPage'
  /database/objects/tables/:
    get:
      operationId: listDatabaseTables
      summary: List database tables
      description: >-
        Describes tables from DBA_TABLES or ALL_TABLES, depending on the
        caller's role. The caller requires the SQL Administrator or SQL
        Developer role.
      externalDocs:
        description: Get all tables documentation
        url: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/26.1/orrst/op-database-objects-tables-get.html
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of database table records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTablePage'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Database username and password for ORDS authentication.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of records to return.
      schema:
        type: integer
        format: int32
  schemas:
    DatabaseStatus:
      type: object
      description: Status fields from GV$INSTANCE and GV$DATABASE.
      properties:
        active_state:
          type: string
        archiver:
          type: string
        blocked:
          type: string
        con_id:
          type: integer
        database_status:
          type: string
        database_type:
          type: string
        db_unique_name:
          type: string
        edition:
          type: string
        host_name:
          type: string
        inst_id:
          type: integer
        instance_mode:
          type: string
        instance_name:
          type: string
        instance_number:
          type: integer
        instance_role:
          type: string
        log_switch_wait:
          type: string
        logins:
          type: string
        name:
          type: string
        open_mode:
          type: string
        parallel:
          type: string
        shutdown_pending:
          type: string
        startup_time:
          type: string
        status:
          type: string
        thread#:
          type: integer
        version:
          type: string
        version_full:
          type: string
        version_legacy:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRelation'
      additionalProperties: true
    DatabaseObjectPage:
      type: object
      properties:
        count:
          type: integer
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseObject'
        limit:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRelation'
        offset:
          type: integer
      additionalProperties: true
    DatabaseObject:
      type: object
      description: Database object fields returned from DBA_OBJECTS or ALL_OBJECTS.
      properties:
        owner:
          type: string
        object_name:
          type: string
        object_id:
          type: integer
        data_object_id:
          type: integer
        object_type:
          type: string
        created:
          type: string
        last_ddl_time:
          type: string
        status:
          type: string
        temporary:
          type: string
        generated:
          type: string
      additionalProperties: true
    DatabaseTablePage:
      type: object
      properties:
        count:
          type: integer
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTable'
        limit:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/LinkRelation'
        offset:
          type: integer
      additionalProperties: true
    DatabaseTable:
      type: object
      description: Documented table metadata fields; additional fields may be returned.
      properties:
        owner:
          type: string
        table_name:
          type: string
        tablespace_name:
          type: string
        num_rows:
          type: integer
        blocks:
          type: integer
        last_analyzed:
          type: string
        partitioned:
          type: string
        status:
          type: string
      additionalProperties: true
    LinkRelation:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
        href:
          type: string
      additionalProperties: false
