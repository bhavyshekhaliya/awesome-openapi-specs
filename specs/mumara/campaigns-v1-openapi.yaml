  /update-user-account:
    post:
      summary: Update User Account
      description: Update user account details
      operationId: updateUserAccount
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated

  /update-user-status:
    post:
      summary: Update User Status
      description: |
        Set a user's status. The user is identified by `email`.

        - `suspended`, `closed` or `terminated`: every campaign of the user that is not finished (`complete`, `StoppedByPolicy`) or already paused is paused, and the user is logged out. Finished campaigns keep their status.
        - `active`: the user can log in again. Campaigns paused by an earlier status change stay paused until they are resumed.

        `terminated` only sets the status; it does not delete the account. To delete it, use the V2 API: `DELETE /v2/users/{idOrEmail}?type=hard`.
      operationId: updateUserStatus
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - status
              properties:
                api_token:
                  type: string
                email:
                  type: string
                  format: email
                  description: Email address of the user to update
                  example: john@example.com
                status:
                  type: string
                  enum: [active, suspended, closed, terminated]
      responses:
        '200':
          description: |
            `success` (plain text) when the status was updated. An unknown email or an invalid status returns `{"status": "error", "result": "..."}` instead, also with HTTP 200.

  /update-user-password:
    post:
      summary: Update User Password
      description: Update user password
      operationId: updateUserPassword
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
                user_id:
                  type: integer
                password:
                  type: string
                  format: password
      responses:
