openapi: 3.1.0
info:
  title: Mumara Campaigns API (V1 - Legacy)
  description: |
    Enterprise-grade Email Marketing Automation Platform API.

    ## Authentication
    All API requests require authentication using an API token. You can pass the token in one of three ways:

    **1. Query Parameter (Recommended for GET requests)**
    ```
    GET /api/getLists?api_token=YOUR_API_TOKEN
    ```

    **2. Request Body (Recommended for POST/PUT requests)**
    ```json
    {
      "api_token": "YOUR_API_TOKEN",
      "name": "My List"
    }
    ```

    **3. Bearer Token Header**
    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    ## Rate Limiting
    API requests are rate-limited based on your token configuration. Default: 60 requests/minute.

    Response headers include:
    - `X-RateLimit-Limit`: Maximum requests per minute
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when the rate limit resets
    - `Retry-After`: Seconds to wait (when rate limited, HTTP 429)

    ## Pagination
    List endpoints support pagination with the following parameters:
    - `limit_start`: Offset (number of records to skip). Default: 0
    - `limit_count`: Number of records to return. Default: 25

    ## Response Format
    All responses are in JSON format.

    **Success Response:**
    ```json
    {
      "status": "success",
      "result": "Operation completed successfully",
      "response": { /* optional data object */ }
    }
    ```

    **Error Response:**
    ```json
    {
      "status": "error",
      "result": "Error message or validation errors object"
    }
    ```

    
  version: 1.0.0
  contact:
    name: Mumara Support
    url: https://support.mumara.com
    email: support@mumara.com
  license:
    name: Proprietary
    url: https://mumara.com/terms

servers:
  - url: '{protocol}://{host}/api'
    description: Mumara Campaigns API V1
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
        description: HTTP protocol
      host:
        default: your-domain.com
        description: Your Mumara installation domain (e.g. campaigns.example.com)

tags:
  - name: Authentication
    description: API authentication and verification
  - name: Lists
    description: Manage contact lists and list groups
  - name: Contacts
    description: Manage subscribers/contacts
  - name: Broadcasts
    description: Email campaigns and broadcasts
  - name: Statistics
    description: Campaign statistics and analytics
  - name: Sending Nodes
    description: SMTP and ESP sending configurations
  - name: Sending Domains
    description: Domain management for email sending
  - name: Bounce Management
    description: Bounce addresses and rules
  - name: Suppression
    description: Email and domain suppression lists
  - name: Custom Fields
    description: Custom contact fields
  - name: Profile Fields
    description: User profile fields management
  - name: Spin Tags
    description: Dynamic content spin tags
  - name: Feedback Loop
    description: FBL (Feedback Loop) mailbox management
  - name: Segments
    description: Contact segmentation
  - name: Groups
    description: Groups for organizing lists, broadcasts, etc.
  - name: Automation
    description: Drips, triggers, and autoresponders
  - name: Web Forms
    description: Subscription forms
  - name: Users
    description: User management (Admin only)

security:
  - apiKeyQuery: []
  - apiKeyBody: []
  - bearerAuth: []

paths:
  # ============================================
  # AUTHENTICATION
  # ============================================
  /:
    get:
      summary: Verify Authentication
      description: Verify that your API credentials are valid
      operationId: verifyAuth
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/ApiToken'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Verify Authentication (POST)
      description: Verify that your API credentials are valid via POST
      operationId: verifyAuthPost
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
                  description: Your API token
              required:
                - api_token
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /routes:
    get:
      summary: List Available Routes
      description: Get a list of all available API endpoints
      operationId: getRoutes
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/ApiToken'
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  routes:
                    type: array
                    items:
                      type: string

  # ============================================
  # LISTS
  # ============================================
  /addList:
    post:
      summary: Create List
      description: |
        Create a new contact list. Requires:
        - A valid sending domain for the owner_email
        - A valid bounce email address (except for Commercial ESP package)
      operationId: addList
      tags:
        - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreate'
            example:
              api_token: "your_api_token"
              list_name: "My Newsletter"
              owner_name: "John Doe"
              owner_email: "john@yourdomain.com"
              bounce_email: "bounce@yourdomain.com"
              reply_email: "reply@yourdomain.com"
              group_name: "Marketing Lists"
              additional_fields: "first_name,last_name"
              response: "1"
      responses:
        '200':
          description: List created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
              example:
                status: success
                result: "List has been created."
                response:
                  id: 1
                  name: "My Newsletter"
                  owner_name: "John Doe"
                  owner_email: "john@yourdomain.com"
                  reply_email: "reply@yourdomain.com"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /getLists:
    get:
      summary: Get All Lists
      description: Retrieve all contact lists with optional filtering
      operationId: getLists
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: list_id
          in: query
          schema:
            type: integer
          description: Filter by specific list ID
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID (admin only)
        - name: group_id
          in: query
          schema:
            type: integer
          description: Filter by group ID
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Lists retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No lists found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /getList/{id}:
    get:
      summary: Get List
      description: Retrieve a specific list by ID
      operationId: getList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /updateList/{id}:
    put:
      summary: Update List
      description: Update an existing list
      operationId: updateList
      tags:
        - Lists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListUpdate'
      responses:
        '200':
          description: List updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /deleteList/{id}/{type}:
    delete:
      summary: Delete List
      description: |
        Delete a list. The list cannot be deleted if it's being used by triggers or segments.
        Currently only 'hard' delete is supported (deletes subscribers).
      operationId: deleteList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: false
          schema:
            type: string
            enum: [hard]
            default: hard
          description: Delete type (currently only 'hard' is supported)
      responses:
        '200':
          description: List deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: List is in use by triggers or segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /getListGroups:
    get:
      summary: Get List Groups
      description: Retrieve all list groups with the count of lists in each group
      operationId: getListGroups
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: query
          schema:
            type: integer
          description: Filter by specific group ID
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID (admin only)
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: List groups retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListGroup'

  /deleteListGroup/{id}/{delete_lists}:
    delete:
      summary: Delete List Group
      description: |
        Delete a list group. Options:
        - If `delete_lists=1`: Delete all lists in the group (fails if any list is used by triggers/segments)
        - If `delete_lists=0` or omitted: Move lists to "Unsorted" group
      operationId: deleteListGroup
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Group ID to delete
        - name: delete_lists
          in: path
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: Whether to delete lists (1) or move to Unsorted (0)
      responses:
        '200':
          description: Group deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================
  # CONTACTS/SUBSCRIBERS
  # ============================================
  /addContact:
    post:
      summary: Add Contact
      description: Add a new contact to a list
      operationId: addContact
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
      responses:
        '200':
          description: Contact added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /getContacts:
    get:
      summary: Get All Contacts
      description: Retrieve contacts with optional filtering
      operationId: getContacts
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: list_id
          in: query
          schema:
            type: integer
          description: Filter by list ID
        - name: status
          in: query
          schema:
            type: string
            enum: [subscribed, unsubscribed, bounced, complaint]
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Contacts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'

  /getContact/{ids}:
    get:
      summary: Get Contact(s)
      description: Retrieve one or more contacts by ID
      operationId: getContact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: ids
          in: path
          required: true
          schema:
            type: string
          description: Single ID or comma-separated IDs
      responses:
        '200':
          description: Contact(s) retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /searchContacts:
    get:
      summary: Search Contacts
      description: Search contacts by various criteria
      operationId: searchContacts
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (email, name, etc.)
        - name: list_id
          in: query
          schema:
            type: integer
        - name: field
          in: query
          schema:
            type: string
          description: Specific field to search
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'

  /updateContact/{id}:
    put:
      summary: Update Contact
      description: Update contact information by ID
      operationId: updateContact
      tags:
        - Contacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'

  /updateContactByEmail/{email}:
    put:
      summary: Update Contact by Email
      description: Update contact using email address
      operationId: updateContactByEmail
      tags:
        - Contacts
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Contact updated successfully

  /deleteContact/{ids}:
    delete:
      summary: Delete Contact(s)
      description: Delete one or more contacts by ID
      operationId: deleteContact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: ids
          in: path
          required: true
          schema:
            type: string
          description: Single ID or comma-separated IDs
      responses:
        '200':
          description: Contact(s) deleted successfully

  /deleteContactByEmail/{email}/{recursive}/{list_id}:
    delete:
      summary: Delete Contact by Email
      description: Delete contact using email address
      operationId: deleteContactByEmail
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
        - name: recursive
          in: path
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
          description: Delete from all lists (1) or specific list (0)
        - name: list_id
          in: path
          required: false
          schema:
            type: integer
          description: Specific list to delete from (when recursive=0)
      responses:
        '200':
          description: Contact deleted successfully

  /markAsBounced/{id}:
    put:
      summary: Mark as Bounced
      description: Mark a contact as bounced
      operationId: markAsBounced
      tags:
        - Contacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
      responses:
        '200':
          description: Contact marked as bounced

  /markAsUnsubscribed/{id}:
    put:
      summary: Mark as Unsubscribed
      description: Mark a contact as unsubscribed
      operationId: markAsUnsubscribed
      tags:
        - Contacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
      responses:
        '200':
          description: Contact marked as unsubscribed

  /markAsComplaint/{id}:
    put:
      summary: Mark as Complaint
      description: Mark a contact as complaint/spam report
      operationId: markAsComplaint
      tags:
        - Contacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_token:
                  type: string
      responses:
        '200':
          description: Contact marked as complaint

  /importContacts:
    post:
      summary: Import Contacts
      description: Bulk import contacts to a list
      operationId: importContacts
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactImport'
      responses:
        '200':
          description: Import started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  imported:
                    type: integer
                  failed:
                    type: integer
                  message:
                    type: string

  # ============================================
  # SEGMENTS
  # ============================================
  /createSegment:
    post:
      summary: Create Segment
      description: Create a new contact segment with conditions
      operationId: createSegment
      tags:
        - Segments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentCreate'
            example:
              api_token: "your_api_token"
              name: "Active Subscribers"
              list_ids: "1,2,3"
              conditions:
                - field: "status"
                  operator: "equals"
                  value: "subscribed"
      responses:
        '200':
          description: Segment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: string

  # ============================================
  # BROADCASTS/CAMPAIGNS
  # ============================================
  /addBroadcast:
    post:
      summary: Create Broadcast
      description: Create a new email broadcast/campaign
      operationId: addBroadcast
      tags:
        - Broadcasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastCreate'
      responses:
        '200':
          description: Broadcast created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'

  /getBroadcasts:
    get:
      summary: Get All Broadcasts
      description: Retrieve all broadcasts/campaigns
      operationId: getBroadcasts
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, sending, sent, paused]
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Broadcasts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastsResponse'

  /getBroadcast/{id}:
    get:
      summary: Get Broadcast
      description: Retrieve a specific broadcast by ID
      operationId: getBroadcast
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Broadcast retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /updateBroadcast/{id}:
    put:
      summary: Update Broadcast
      description: Update an existing broadcast
      operationId: updateBroadcast
      tags:
        - Broadcasts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastUpdate'
      responses:
        '200':
          description: Broadcast updated successfully

  /deleteBroadcasts/{id}:
    delete:
      summary: Delete Broadcast
      description: Delete a broadcast
      operationId: deleteBroadcast
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Broadcast deleted successfully

  /broadcastSchedule:
    post:
      summary: Schedule Broadcast
      description: Schedule a broadcast for sending
      operationId: scheduleBroadcast
      tags:
        - Broadcasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastSchedule'
      responses:
        '200':
          description: Broadcast scheduled successfully

  /getScheduledBroadcasts:
    get:
      summary: Get Scheduled Broadcasts
      description: Retrieve all scheduled broadcasts
      operationId: getScheduledBroadcasts
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Scheduled broadcasts retrieved

  /getBroadcastGroups:
    get:
      summary: Get Broadcast Groups
      description: Retrieve broadcast groups with campaign count
      operationId: getBroadcastGroups
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: id
          in: query
          schema:
            type: integer
          description: Filter by specific group ID
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID (admin only)
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Broadcast groups retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/BroadcastGroup'

  # ============================================
  # GROUPS (Generic)
  # ============================================
  /getGroups/{module}:
    get:
      summary: Get Groups by Module
      description: |
        Retrieve groups for a specific module type.

        Supported modules:
        - `list` - List groups
        - `broadcast` - Broadcast/campaign groups
        - `sendingNode` - Sending node groups
        - `customField` - Custom field groups
      operationId: getGroups
      tags:
        - Groups
      parameters:
        - $ref: '#/components/parameters/ApiToken'
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [list, broadcast, sendingNode, customField]
          description: Module type
        - name: id
          in: query
          schema:
            type: integer
          description: Filter by specific group ID
        - name: module_id
          in: query
          schema:
            type: integer
          description: Filter by specific module item ID
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID (admin only)
        - $ref: '#/components/parameters/LimitStart'
        - $ref: '#/components/parameters/LimitCount'
      responses:
        '200':
          description: Groups retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        module_name:
                          type: string
                          description: Comma-separated names of items in this group
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '400':
