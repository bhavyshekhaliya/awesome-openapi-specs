# COMPONENTS
# ============================================
components:
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_token
      description: API token passed as query parameter
    apiKeyBody:
      type: apiKey
      in: header
      name: X-API-Token
      description: API token in request body (use api_token field)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Bearer token authentication

  parameters:
    ApiToken:
      name: api_token
      in: query
      required: false
      schema:
        type: string
      description: API token (can also be passed in request body)
    LimitStart:
      name: limit_start
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset (number of records to skip)
    LimitCount:
      name: limit_count
      in: query
      schema:
        type: integer
        default: 25
      description: Number of records to return

  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            result: "Invalid API key"

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            result: "Resource not found"

  schemas:
    # ============================================
    # EXISTING API SCHEMAS
    # ============================================
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        result:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        result:
          oneOf:
            - type: string
            - type: object

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        result:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AuthResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Authentication successful
        user:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string

    # LIST SCHEMAS
    ListCreate:
      type: object
      required:
        - list_name
        - owner_name
        - owner_email
        - reply_email
      properties:
        api_token:
          type: string
        list_name:
          type: string
          example: "My Newsletter"
        owner_name:
          type: string
          example: "John Doe"
        owner_email:
          type: string
          format: email
          description: Must use a verified sending domain
        bounce_email:
          type: string
          format: email
          description: Required unless using Commercial ESP package
        reply_email:
          type: string
          format: email
        group_name:
          type: string
          description: Group name (will be created if doesn't exist)
        user_id:
          type: integer
          description: User ID to create list for (admin only)
        additional_fields:
          type: string
          description: Comma-separated custom field tags to assign
        additional_headers:
          type: string
          description: JSON object of additional email headers
        response:
          type: string
          enum: ["0", "1"]
          description: Set to "1" to include created list in response

    ListUpdate:
      type: object
      properties:
        api_token:
          type: string
        list_name:
          type: string
        owner_name:
          type: string
        owner_email:
          type: string
          format: email
        bounce_email:
          type: string
          format: email
        reply_email:
          type: string
          format: email
        group_name:
          type: string
        additional_fields:
          type: string
        additional_headers:
          type: string
        response:
          type: string
          enum: ["0", "1"]

    ListResponse:
      type: object
      properties:
        status:
          type: string
        result:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/List'
        response:
          $ref: '#/components/schemas/List'

    ListsResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/List'

    List:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        owner_name:
          type: string
        owner_email:
          type: string
        reply_email:
          type: string
        user_id:
          type: integer
        group_id:
          type: integer
        group_name:
          type: string
        total_subscribers:
          type: integer
        bounce_id:
          type: integer
        bounce_email:
          type: string
        custom_fields:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        number_of_lists_in_group:
          type: integer

    BroadcastGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        number_of_campaigns_in_group:
          type: integer

    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string

    # CONTACT SCHEMAS
    ContactCreate:
      type: object
      required:
        - email
        - list_id
      properties:
        api_token:
          type: string
        email:
          type: string
          format: email
        list_id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        custom_fields:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [subscribed, unsubscribed]
          default: subscribed

    ContactUpdate:
      type: object
      properties:
        api_token:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        custom_fields:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [subscribed, unsubscribed]

    ContactResponse:
      type: object
      properties:
        status:
          type: string
        result:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Contact'
            - type: array
              items:
                $ref: '#/components/schemas/Contact'

    ContactsResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/Contact'

    Contact:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        status:
          type: string
        list_id:
          type: integer
        custom_fields:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactImport:
      type: object
      required:
        - list_id
        - contacts
      properties:
        api_token:
          type: string
        list_id:
          type: integer
        contacts:
          type: array
          items:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
              first_name:
                type: string
              last_name:
                type: string
              custom_fields:
                type: object
        update_existing:
          type: boolean
          default: false
        skip_duplicates:
          type: boolean
          default: true

    # SEGMENT SCHEMAS
    SegmentCreate:
      type: object
      required:
        - name
        - list_ids
      properties:
        api_token:
          type: string
        name:
          type: string
        list_ids:
          type: string
          description: Comma-separated list IDs
        conditions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              operator:
                type: string
              value:
                type: string

    # BROADCAST SCHEMAS
    BroadcastCreate:
      type: object
      required:
        - name
        - subject
        - from_name
        - from_email
      properties:
        api_token:
          type: string
        name:
          type: string
        subject:
          type: string
        from_name:
          type: string
        from_email:
          type: string
          format: email
        reply_to:
          type: string
          format: email
        html_content:
          type: string
        text_content:
          type: string
        template_id:
          type: integer
        list_ids:
          type: array
          items:
            type: integer
        segment_ids:
          type: array
          items:
            type: integer
        sending_node_id:
          type: integer
        group_id:
          type: integer

    BroadcastUpdate:
      type: object
      properties:
        api_token:
          type: string
        name:
          type: string
        subject:
          type: string
        from_name:
          type: string
        from_email:
          type: string
          format: email
        reply_to:
          type: string
          format: email
        html_content:
          type: string
        text_content:
          type: string

    BroadcastResponse:
      type: object
      properties:
        status:
          type: string
        result:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Broadcast'

    BroadcastsResponse:
      type: object
      properties:
        status:
          type: string
        result:
          type: array
          items:
            $ref: '#/components/schemas/Broadcast'

    Broadcast:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        subject:
          type: string
        from_name:
          type: string
        from_email:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    BroadcastSchedule:
      type: object
      required:
        - broadcast_id
      properties:
        api_token:
          type: string
        broadcast_id:
          type: integer
        schedule_at:
          type: string
          format: date-time
          description: If not provided, sends immediately
        timezone:
          type: string
          example: America/New_York
        throttle:
          type: integer
          description: Emails per hour limit

    # SPIN TAG SCHEMAS
    SpinTag:
      type: object
      properties:
        id:
          type: integer
        place_holder:
          type: string
        tag:
          type: string
          description: Auto-generated tag for use in emails
        word_list:
          type: string
          description: Newline-separated list of words
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SpinTagCreate:
      type: object
      required:
        - place_holder
        - word_list
      properties:
        api_token:
          type: string
        place_holder:
          type: string
          description: Placeholder name (no special characters)
        word_list:
          type: string
          description: Comma-separated list of words to rotate
        user_id:
          type: integer
          description: User ID (admin only)
        response:
          type: string
          enum: ["0", "1"]

    SpinTagUpdate:
      type: object
      required:
        - word_list
      properties:
        api_token:
          type: string
        word_list:
          type: string
          description: Comma-separated list of words
        user_id:
          type: integer
          description: User ID (admin only)
        response:
          type: string
          enum: ["0", "1"]

    # FBL SCHEMAS
    FBLAccount:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Email address
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        processing_protocols:
          type: string
          enum: [IMAP, POP]
        fbl_encryption:
          type: string
          enum: [none, ssl, tls]
        folder:
          type: string
        status:
          type: string
          enum: [active, inactive]
        delete_emails:
          type: integer
          enum: [0, 1]
        validate_certificates:
          type: integer
          enum: [0, 1]
        user_id:
          type: integer

    FBLAccountCreate:
      type: object
      required:
        - email
        - host
        - port
        - username
        - method
      properties:
        api_token:
          type: string
        email:
          type: string
          format: email
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        method:
          type: string
          enum: [IMAP, POP, imap, pop]
        encryption:
          type: string
          enum: [none, ssl, tls, SSL, TLS]
        folder:
          type: string
          default: INBOX
        status:
          type: integer
          enum: [0, 1]
          description: 0=inactive, 1=active
        delete_emails:
          type: integer
          enum: [0, 1]
        validate_certificates:
          type: integer
          enum: [0, 1]
        response:
          type: string
          enum: ["0", "1"]

    FBLAccountUpdate:
      type: object
      properties:
        api_token:
          type: string
        email:
          type: string
          format: email
        host:
          type: string
        port:
          type: integer
