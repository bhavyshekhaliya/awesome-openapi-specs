          description: Bounce DNS verification is enabled on this installation
        enabled:
          type: boolean
        forced:
          type: boolean
        selector:
          type: string
          example: bounce
        host:
          type: string
          example: bounce.mail.example.com
        spf:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/RecordStatus'
            include_domain:
              type: string
              example: spf.mumara.net
        mx:
          type: object
          properties:
            status:
              $ref: '#/components/schemas/RecordStatus'
            target:
              type: string
              example: return.mumara.net
            priority:
              type: integer
              example: 10

    SendingDomainDmarc:
      type: object
      properties:
        enabled:
          type: boolean
        host:
          type: string
          description: Where to publish this domain's own DMARC policy
          example: _dmarc.mail.example.com
        organizational_host:
          type:
            - string
            - 'null'
          description: |
            The organizational domain's DMARC host, whose policy already covers this domain when it
            publishes none of its own (RFC 7489 §6.6.3). `null` when `domain` is itself the
            organizational domain and nothing can be inherited.
          example: _dmarc.example.com
        status:
          $ref: '#/components/schemas/RecordStatus'
        suggested_value:
          type: string
          example: "v=DMARC1; p=none;"

    SendingDomain:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        domain:
          type: string
          example: mail.example.com
        masking_type:
          type: string
          enum: [cname, htaccess, cloak]
          description: Tracking method (internal `index` is exposed as `cloak`)
        is_sandbox:
          type: boolean
          description: Platform-provisioned sandbox domain (read-only)
        status:
