    # ============================================
    # EMAIL SENDING SCHEMAS
    # ============================================
    EmailSendRequest:
      type: object
      required:
        - recipient
        - from_email
        - from_name
        - subject
        - body
        - node_id
      properties:
        recipient:
          type: string
          format: email
          maxLength: 255
          description: Recipient email address
          example: recipient@example.com
        from_email:
          type: string
          format: email
          maxLength: 255
          description: Sender email (must use a verified sending domain)
          example: noreply@yourdomain.com
        from_name:
          type: string
          maxLength: 255
          description: Sender display name
          example: Acme Corp
        subject:
          type: string
          maxLength: 1000
          description: Email subject line
          example: Welcome to Acme Corp
        body:
          type: string
          description: HTML email content
          example: "<html><body><h1>Welcome!</h1></body></html>"
        node_id:
          type: integer
          description: Sending node to use for delivery
          example: 1
        reply_to:
          type: string
          format: email
          maxLength: 255
          description: Reply-to email address
        bounce_email:
          type: string
          format: email
          maxLength: 255
          description: Bounce/return-path email address
        message_id:
          type: string
          maxLength: 255
          description: Custom Message-ID header value
        add_contact:
          type: boolean
          description: Automatically add the recipient as a contact
          example: false
        list_id:
          type: integer
          description: List ID (required when add_contact is true)

    EmailSendResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message_id:
              type: string
              description: The Message-ID header of the sent email
            recipient:
              type: string
              description: Recipient email address
            log_id:
              type: integer
              description: ID of the sending log entry
        message:
          type: string

    # ============================================
    # USER SCHEMAS
    # ============================================
    UserCreate:
      type: object
      required:
        - email
        - password
        - name
        - package_id
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Unique email address for the new user
          example: newuser@example.com
        password:
          type: string
          minLength: 6
          maxLength: 255
          description: Account password (min 6 characters)
          example: SecureP@ss123
        name:
          type: string
          maxLength: 255
          description: Display name
          example: John Doe
        package_id:
          type: integer
          description: Package/plan to assign
          example: 1
        timezone:
          type: string
          maxLength: 50
          description: Timezone offset (e.g., +05:00)
          example: "+00:00"
        login_ips:
          type: string
          maxLength: 1000
          description: Comma-separated allowed login IPs (empty = no restriction)
          example: "192.168.1.1,10.0.0.1"
        is_hashed:
          type: boolean
          description: Set to true if the password is already bcrypt-hashed
          example: false

    UserUpdate:
      type: object
      description: |
        Non-privileged profile fields only. To change status, package, or password, use the dedicated action endpoints.
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          maxLength: 255
          description: Must be unique across all users
          example: john@example.com
        timezone:
          type: string
          maxLength: 50
          example: "+05:00"
        login_ips:
          type: string
          maxLength: 1000
          description: Comma-separated allowed login IPs (empty = no restriction)
          example: "192.168.1.1,10.0.0.1"
        country:
          type: string
          maxLength: 10
          example: US
        countrycode:
          type: string
          maxLength: 10
          example: "+1"
        phone:
          type: string
          maxLength: 20
          example: "+1-555-123-4567"
        mobile:
          type: string
          maxLength: 20
          example: "+1-555-987-6543"
        address_line_1:
          type: string
          maxLength: 255
          example: 123 Main Street
        address_line_2:
          type: string
          maxLength: 255
          example: Suite 456
        city:
          type: string
          maxLength: 255
          example: New York
        state:
          type: string
          maxLength: 255
          example: NY
        post_code:
          type: string
          maxLength: 20
          example: "10001"

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        is_client:
          type: boolean
        status:
          type: string
          enum: [active, provisioning, suspended, terminated]
        package_id:
          type: integer
          nullable: true
        timezone:
          type: string
        country:
          type: string
        country_code:
          type: string
        address_line_1:
