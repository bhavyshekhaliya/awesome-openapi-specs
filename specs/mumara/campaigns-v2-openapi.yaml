openapi: 3.1.0
info:
  title: Mumara Campaigns API V2
  description: |
    The **Mumara Campaigns V2 API** is a modern, RESTful interface for programmatic access to the Mumara Campaigns email marketing platform. It enables you to manage contact lists, subscribers, broadcasts, sending infrastructure, and more—all through a consistent, well-structured API.

    ---

    ## Getting Started

    ### 1. Generate an API Token
    Navigate to **Settings > API Tokens** in the Mumara Campaigns dashboard to create a new token. Each token can be scoped with specific permissions and optional IP restrictions.

    ### 2. Authenticate Your Requests
    Include the token in the `Authorization` header of every request:

    ```
    Authorization: Bearer YOUR_API_TOKEN
    ```

    > **Important:** V2 endpoints accept tokens **only** via the `Authorization: Bearer` header. Query parameter (`?api_token=`) and request body authentication are **not supported** on V2 endpoints. This design prevents token leakage through URLs, server access logs, browser history, and `Referer` headers.

    ### 3. Set the Content-Type
    All request bodies must be sent as JSON:

    ```
    Content-Type: application/json
    ```

    ---

    ## Base URL

    All V2 endpoints are served under:

    ```
    https://your-domain.com/api/v2/
    ```

    Replace `your-domain.com` with your Mumara Campaigns installation hostname.

    ---

    ## Response Format

    Every V2 response follows a predictable JSON structure. This consistency simplifies client-side parsing—you always know where to find the data, errors, and pagination metadata.

    **Successful response:**
    ```json
    {
      "success": true,
      "data": { },
      "message": "Operation completed successfully"
    }
    ```

    **Paginated response:**
    ```json
    {
      "success": true,
      "data": [ ],
      "meta": {
        "current_page": 1,
        "per_page": 25,
        "total": 142,
        "last_page": 6,
        "from": 1,
        "to": 25
      }
    }
    ```

    **Error response:**
    ```json
    {
      "success": false,
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "The given data was invalid.",
        "details": {
          "email": ["The email field is required."]
        }
      }
    }
    ```

    ### Standard Error Codes

    | HTTP Status | Error Code | When It Occurs |
    |------------|------------|----------------|
    | `400` | `ERROR` | Malformed request or business logic error |
    | `401` | `UNAUTHORIZED` | Missing, invalid, or inactive API token |
    | `403` | `FORBIDDEN` | Token lacks permission for this action |
    | `404` | `NOT_FOUND` | Resource does not exist or is inaccessible |
    | `409` | `CONFLICT` | Resource already exists (e.g., duplicate email in list) |
    | `422` | `VALIDATION_ERROR` | Request body failed validation rules |
    | `429` | `RATE_LIMITED` | Too many requests—slow down |
    | `500` | `INTERNAL_ERROR` | Unexpected server error |

    ### Sending Domain Error Codes

    The Sending Domains endpoints return additional, self-explanatory codes (see the `SendingDomainErrorCode` schema for the full list). Every refusal names the Application Setting or package rule that caused it in `error.details`.

    | HTTP Status | Error Code | When It Occurs |
    |------------|------------|----------------|
    | `403` | `OWNERSHIP_REVOKED` | Ownership verification was reset by an administrator |
    | `403` | `SANDBOX_DOMAIN` | The platform-provisioned sandbox domain cannot be changed |
    | `403` | `DKIM_REGENERATE_DISABLED` | The administrator disabled DKIM key regeneration |
    | `409` | `DOMAIN_ALREADY_EXISTS` | The domain is already registered |
    | `409` | `DOMAIN_IN_USE` | Lists, nodes, triggers or web forms still use the domain |
    | `422` | `OWNERSHIP_VERIFICATION_REQUIRED` | Prove ownership before configuring the domain |
    | `422` | `OWNERSHIP_VERIFICATION_FAILED` | The ownership record/file could not be confirmed |
    | `422` | `FEATURE_FORCED_BY_PACKAGE` | Your package requires this feature; it cannot be disabled |
    | `422` | `FEATURE_UNAVAILABLE` | The feature is not enabled on this installation |
    | `422` | `DOMAIN_LIMIT_REACHED` | Package sending-domain quota reached |
    | `422` | `HOOK_ABORT` | An add-on blocked the action (`details.code` names the rule) |
    | `429` | `VERIFICATION_COOLDOWN` | Re-verification requested before the cooldown expired |

    ---

    ## Pagination

    All list endpoints support **page-based pagination** with two query parameters:

    | Parameter | Default | Range | Description |
    |-----------|---------|-------|-------------|
    | `page` | `1` | 1+ | The page number to retrieve |
    | `per_page` | `25` | 1–100 | Number of records per page |

    **Example:**
    ```
    GET /api/v2/contacts?list_id=5&page=2&per_page=50
    ```

    The response `meta` object tells you everything you need for building pagination UI:

    ```json
    "meta": {
      "current_page": 2,
      "per_page": 50,
      "total": 1423,
      "last_page": 29,
      "from": 51,
      "to": 100
    }
    ```

    ---

    ## Batch Operations

    Several resources support batch operations for efficient bulk processing:

    - **Batch Create:** `POST /v2/{resource}/batch` — Create up to **1,000 records** in a single request.
    - **Batch Delete:** `DELETE /v2/{resource}/batch` — Delete up to **100 records** by ID in a single request (contacts support up to 1,000).

    Batch endpoints return a summary of the operation:

    ```json
    {
      "success": true,
      "data": {
        "processed": 500,
        "created": 480,
        "updated": 15,
        "failed": 5,
        "errors": [
          { "email": "invalid@", "error": "Invalid email format" }
        ]
      }
    }
    ```

    ---

    ## Rate Limiting

    API requests are rate-limited to protect system stability. The default limit is **60 requests per minute** per token, but administrators can configure custom limits per token.

    **Rate limit headers** are included in every response:

    | Header | Description |
    |--------|-------------|
    | `X-RateLimit-Limit` | Maximum requests allowed per minute |
    | `X-RateLimit-Remaining` | Requests remaining in the current window |
    | `X-RateLimit-Reset` | Unix timestamp when the window resets |
    | `Retry-After` | Seconds to wait before retrying (only when rate limited) |

    When rate limited, you receive a `429 Too Many Requests` response. Wait for the duration specified in the `Retry-After` header before retrying.

    ---

    ## Webhooks

    Webhooks allow your application to receive real-time HTTP POST notifications when events occur in Mumara Campaigns. Instead of polling the API for changes, register a webhook URL and Mumara will push event data to you automatically.

    ### Supported Events

    | Event | Description |
    |-------|-------------|
    | `contact.subscribed` | A contact subscribed to a list |
    | `contact.unsubscribed` | A contact unsubscribed from a list |
    | `contact.bounced` | An email to a contact bounced |
    | `contact.complained` | A spam complaint was received |
    | `broadcast.sent` | A broadcast finished sending |
    | `broadcast.opened` | A recipient opened an email |
    | `broadcast.clicked` | A recipient clicked a link |

    ### Webhook Payload

    Each webhook delivery includes:

    ```json
    {
      "event": "contact.subscribed",
      "timestamp": "2025-03-15T10:30:00Z",
      "data": { }
    }
    ```

    ### Webhook Headers

    | Header | Description |
    |--------|-------------|
    | `Content-Type` | `application/json` |
    | `X-Mumara-Event` | The event type (e.g., `contact.subscribed`) |
    | `X-Mumara-Delivery-Id` | Unique delivery identifier |
    | `X-Mumara-Timestamp` | Unix timestamp of the delivery |
    | `X-Mumara-Signature` | HMAC-SHA256 signature (if a secret is configured) |

    ### Verifying Webhook Signatures

    If you set a `secret` when creating a webhook, every delivery is signed. To verify:

    ```python
    import hmac, hashlib

    expected = hmac.new(
        secret.encode(),
        request.body,
        hashlib.sha256
    ).hexdigest()

    is_valid = hmac.compare_digest(expected, request.headers['X-Mumara-Signature'])
    ```

    ### Automatic Deactivation

    Webhooks are automatically deactivated after **10 consecutive delivery failures**. Re-enable them via the API or dashboard after resolving the endpoint issue.

    ---

    ## User Isolation & Admin Access

    - **Regular users** can only access their own resources (lists, contacts, broadcasts, etc.).
    - **Admin tokens** can access all users' resources and have access to admin-only endpoints such as User Management, Profile Fields, and FBL Accounts.
    - Some admin endpoints accept a `user_id` query parameter to filter results for a specific user.

  version: 2.0.0
  contact:
    name: Mumara Support
    url: https://support.mumara.com
    email: support@mumara.com
  license:
    name: Proprietary
    url: https://mumara.com/terms

servers:
  - url: '{protocol}://{host}/api/v2'
    description: Your Mumara Campaigns installation
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
        description: HTTP protocol (HTTPS recommended for production)
      host:
        default: your-domain.com
        description: Your Mumara installation domain (e.g., campaigns.example.com)

tags:
  - name: Lists
    description: |
      Contact lists are the foundation of Mumara Campaigns. Every contact belongs to a list, and lists determine the sender identity (owner name/email), reply address, and bounce handling configuration used when sending emails.
  - name: Contacts
    description: |
      Manage individual subscribers/contacts within your lists. Contacts can be created one at a time or imported in bulk using batch operations (up to 1,000 per request). Each contact has a status (subscribed, unsubscribed, bounced, or complaint) and can store custom field data.
  - name: Broadcasts
    description: |
      Broadcasts are email campaigns. Create a broadcast with a subject, content, and configuration, then schedule it for delivery. Broadcasts can be in draft, scheduled, sending, or sent states.
  - name: Webhooks
    description: |
      Register HTTP endpoints to receive real-time notifications when events occur (e.g., contact subscribes, email bounces, link clicked). Webhooks support HMAC-SHA256 signatures for payload verification and are automatically disabled after 10 consecutive failures.
  - name: Sending Nodes
    description: |
      Sending nodes represent your email delivery infrastructure—SMTP servers or ESP API integrations (Amazon SES, Mailgun, SendGrid, SparkPost, etc.). Configure connection details, rate limits, and SSL options for each node.
  - name: Sending Domains
    description: |
      Sending domains are the domains you send from. The API mirrors the dashboard flow exactly and respects every Application Setting and package rule:

      1. **Add** the domain (`POST /sending-domains`). If the administrator enabled *ownership verification*, the response is `pending_ownership_verification` and carries the ownership TXT record (or verification file) to publish.
      2. **Prove ownership** (`POST /sending-domains/{id}/verify-ownership`). Mumara checks the record with the DNS lookup method configured by the administrator. On success the response already contains **all remaining DNS records** to add (DKIM TXT, tracking CNAME or tracking file, bounce SPF + MX, DMARC) according to which features are enabled.
      3. **Publish and confirm** the records (`POST /sending-domains/{id}/verify`). Each record is reported with its expected and found value; the domain becomes `active` once every enabled record passes.
      4. **Manage** features (`PATCH /sending-domains/{id}/features/{feature}`), selectors, DKIM keys and the domain itself. Features that your package forces cannot be turned off, and every refusal explains which setting caused it.

      Every response includes a composite `status` and a machine-readable `next_step`, so a client always knows what to do next. `GET /sending-domains/policy` describes up front what the account may do.

      **Access control.** These endpoints are governed by the *V2 Sending Domains* permissions on the API role (dashboard: **Settings → API → Roles**). Roles that already existed when the 7.1 update ran were granted them automatically, so existing integrations are unaffected; a role created after the update is refused with `403 FORBIDDEN` until the permissions are granted.

      > **Breaking change (V2 revision 2026-08):** the sending-domain object was redesigned. The former `is_verified` and `domain_status` booleans, `type`, `domain_hash`, `dkim.verified` and `tracking.verified` were replaced by `status`, `ownership`, `masking_type`, `domain_status_code`, `is_enabled` and per-feature `status` strings (`pending` / `verified` / `failed`).
  - name: Bounce Management
    description: |
      Configure bounce mailboxes (IMAP/POP accounts that receive bounced emails) and bounce rules (patterns that classify bounces as hard, soft, or no-process). Proper bounce handling protects your sender reputation.
  - name: Suppressions
    description: |
      Suppression lists prevent emails from being sent to specific addresses, domains, or IPs. Use suppressions to honor unsubscribe requests, block known-bad addresses, or comply with legal requirements. Three types are supported: email, domain, and IP.
  - name: Custom Fields
    description: |
      Custom fields extend the data you can store for each contact beyond the default email address. Define fields of various types (text, select, date, etc.) and associate them with lists. Use merge tags in your broadcasts to personalize content.
  - name: Profile Fields
    description: |
      Profile fields define the data collected for user accounts in multi-user installations. These are distinct from contact custom fields. **Admin-only** — requires an admin-level API token.
  - name: Spin Tags
    description: |
      Spin tags enable dynamic content rotation in your broadcasts. Define a placeholder name and a list of word/phrase variations; Mumara randomly selects one for each recipient, helping improve deliverability and engagement.
  - name: FBL
    description: |
      Feedback Loop (FBL) accounts are mailboxes that receive spam complaint notifications from ISPs. Configuring FBL processing helps you automatically handle complaints and maintain a healthy sender reputation. **Admin-only** — requires an admin-level API token.
  - name: Segments
    description: |
      Segments are dynamic filters that identify subsets of contacts across one or more lists based on conditions (field values, activity, dates, etc.). Use segments when scheduling broadcasts to target specific audiences without creating separate lists.
  - name: Drips
    description: |
      Drip campaigns (autoresponders) are automated email sequences triggered by events like subscription or date fields. The API provides read and delete access; creation and configuration are done through the web interface.
  - name: Triggers
    description: |
      Triggers are automation rules that execute actions when specific events occur (e.g., send an email when a contact subscribes). The API lets you view, enable/disable, and delete triggers. Complex trigger creation is done through the web interface.
  - name: Web Forms
    description: |
      Web forms are embeddable HTML subscription forms that can be placed on your website to capture new contacts. Retrieve form details, update settings, get embed codes, or delete forms via the API.
  - name: Groups
    description: |
      Groups provide hierarchical organization for resources (lists, sending nodes, broadcasts, custom fields). Each module type has its own group tree, helping you keep your workspace organized.
  - name: Statistics
    description: |
      Access detailed analytics for your broadcast campaigns, including delivery rates, opens, clicks, bounces, unsubscribes, and complaints. Statistics are tied to specific broadcast schedule IDs.
  - name: Email
    description: |
      Send single transactional emails through your configured sending infrastructure. Useful for password resets, order confirmations, notifications, and other one-to-one messages that don't belong in a broadcast campaign.
  - name: Users
    description: |
      Manage user accounts in multi-user installations. Create users with specific packages/plans, update account settings, or deactivate accounts. **Admin-only** — requires an admin-level API token. The `/me` endpoints are available to all authenticated users for managing their own profile.

security:
  - bearerAuth: []

paths:
  # ============================================
  # LISTS
  # ============================================
  /lists:
    get:
      summary: List All Lists
      description: |
        Retrieve all contact lists accessible to the authenticated user. Results are paginated and can be filtered by group.

        **Admin users** see all lists across all users. **Regular users** see only their own lists.
      operationId: v2GetLists
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: group_id
          in: query
          description: Filter lists belonging to a specific group
          schema:
            type: integer
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: Lists retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a List
      description: |
        Create a new contact list. The `owner_email` domain must match a verified sending domain in your account.

        **Required setup before creating a list:**
        1. Add and verify a sending domain via the Sending Domains API
        2. (Optional) Add a bounce mailbox via the Bounce Management API

        If no `group_id` is specified, the list is placed in the default group.
      operationId: v2CreateList
      tags:
        - Lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreate'
            example:
              name: Newsletter Subscribers
              owner_name: John Doe
              owner_email: john@yourdomain.com
              reply_email: reply@yourdomain.com
              bounce_email: bounce@yourdomain.com
              group_id: 1
      responses:
        '201':
          description: List created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '409':
          description: A list with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /lists/{id}:
    get:
      summary: Get a List
      description: |
        Retrieve a specific list by ID, including its group, associated custom fields, and bounce email configuration.
      operationId: v2GetList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a List
      description: |
        Update one or more fields of an existing list. Only include the fields you want to change—omitted fields remain unchanged.

        If updating `owner_email`, the new domain must be a verified sending domain in your account.
      operationId: v2UpdateList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListUpdate'
      responses:
        '200':
          description: List updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A list with this name already exists
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a List
      description: |
        Soft-delete a list and queue its contacts for background deletion. Lists that are currently used by triggers or segments cannot be deleted until those references are removed.
      operationId: v2DeleteList
      tags:
        - Lists
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: List is in use by triggers or segments

  # ============================================
  # CONTACTS
  # ============================================
  /contacts:
    get:
      summary: List All Contacts
      description: |
        Retrieve contacts with pagination. Filter by list, status, or email search.

        **Status values:** `subscribed`, `unsubscribed`, `bounced`, `complaint`

        If no `list_id` is specified, returns contacts from all lists accessible to the authenticated user.
      operationId: v2GetContacts
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: list_id
          in: query
          description: Filter contacts belonging to a specific list
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by subscription status
          schema:
            type: string
            enum: [subscribed, unsubscribed, bounced, complaint]
        - name: email
          in: query
          description: Search contacts by email (partial match supported)
          schema:
            type: string
      responses:
        '200':
          description: Contacts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a Contact
      description: |
        Add a new contact to a list. The email must be unique within the target list.

        **Custom fields** can be set using the top-level convenience fields (`first_name`, `last_name`, `phone`) or the `custom_fields` object for any field by its tag name.
      operationId: v2CreateContact
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreate'
            example:
              email: john.doe@example.com
              list_id: 1
              first_name: John
              last_name: Doe
              phone: "+1-555-123-4567"
              status: subscribed
              format: html
              custom_fields:
                company: Acme Corp
                city: New York
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          description: List not found
        '409':
          description: Contact already exists in this list
        '422':
          $ref: '#/components/responses/ValidationError'

  /contacts/{id}:
    get:
      summary: Get a Contact
      description: Retrieve a specific contact by ID, including their list info and all custom field values.
      operationId: v2GetContact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Contact retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Contact
      description: |
        Update a contact's email, status, or custom fields. Only include the fields you want to change.

        **Status transitions:** You can change a contact to any status: `subscribed`, `unsubscribed`, `bounced`, or `complaint`.
      operationId: v2UpdateContact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A contact with this email already exists in the list
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a Contact
      description: Permanently delete a contact and all their associated data (custom field values, activity history).
      operationId: v2DeleteContact
      tags:
        - Contacts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Contact deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /contacts/batch:
    post:
      summary: Batch Create/Update Contacts
      description: |
        Import up to **1,000 contacts** into a list in a single request. This is significantly more efficient than creating contacts individually.

        - Set `update_existing: true` to update custom fields for contacts that already exist in the list.
        - Set `update_existing: false` (default) to skip existing contacts and report them as errors.

        The response includes a detailed summary of the operation, including individual error details for failed records.
      operationId: v2BatchContacts
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBatch'
            example:
              list_id: 1
              update_existing: true
              contacts:
                - email: jane@example.com
                  first_name: Jane
                  last_name: Smith
                  custom_fields:
                    company: Acme Corp
                - email: bob@example.com
                  first_name: Bob
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '404':
          description: List not found
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Batch Delete Contacts
      description: |
        Delete multiple contacts by their IDs in a single request (up to 1,000). The list subscriber counts are automatically updated. Contacts that don't exist or aren't accessible are silently skipped.
      operationId: v2BatchDeleteContacts
      tags:
        - Contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 1000
                  description: Array of contact IDs to delete (max 1,000)
                  example: [101, 102, 103]
      responses:
        '200':
          description: Contacts deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteResponse'

  # ============================================
  # BROADCASTS
  # ============================================
  /broadcasts:
    get:
      summary: List All Broadcasts
      description: |
        Retrieve all broadcast campaigns accessible to the authenticated user with pagination.
      operationId: v2GetBroadcasts
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: Broadcasts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastsResponse'
    post:
      summary: Create a Broadcast
      description: |
        Create a new broadcast campaign in draft state. After creation, configure the broadcast through the web interface or use the update endpoint to set content and scheduling details.
      operationId: v2CreateBroadcast
      tags:
        - Broadcasts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastCreate'
            example:
              name: January Newsletter
              subject: "Your January Newsletter is Here!"
              content_html: "<html><body><h1>Newsletter</h1><p>Your monthly update.</p></body></html>"
              content_text: "Newsletter - Your monthly update."
              group_id: 1
      responses:
        '201':
          description: Broadcast created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /broadcasts/{id}:
    get:
      summary: Get a Broadcast
      description: Retrieve a specific broadcast campaign by ID, including its group and content.
      operationId: v2GetBroadcast
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Broadcast retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Broadcast
      description: |
        Update a broadcast campaign. A broadcast whose send is in flight, or holding mid-send and
        resumable, cannot be modified: the request is refused with `422 BROADCAST_LOCKED` and
        `error.details.schedule_status` names the state that blocked it. A broadcast scheduled
        for later stays editable, and so does one whose send has finished — nothing can change
        underneath it, and the dashboard allows the same edit.
      operationId: v2UpdateBroadcast
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastUpdate'
      responses:
        '200':
          description: Broadcast updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Broadcast is currently sending or already sent
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a Broadcast
      description: Delete a broadcast campaign. Broadcasts that are currently sending cannot be deleted.
      operationId: v2DeleteBroadcast
      tags:
        - Broadcasts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Broadcast deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # WEBHOOKS
  # ============================================
  /webhooks:
    get:
      summary: List All Webhooks
      description: |
        Retrieve all webhook subscriptions for the authenticated user. Optionally filter by active status.
      operationId: v2GetWebhooks
      tags:
        - Webhooks
      parameters:
        - name: is_active
          in: query
          description: Filter by active/inactive status
          schema:
            type: boolean
      responses:
        '200':
          description: Webhooks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
    post:
      summary: Create a Webhook
      description: |
        Register a new webhook endpoint to receive event notifications. You must specify at least one event to subscribe to.

        **Duplicate prevention:** You cannot register the same URL for overlapping events. If you need the same URL to receive additional events, update the existing webhook instead.

        **Signature verification:** Optionally provide a `secret` to enable HMAC-SHA256 payload signing. This allows your endpoint to verify that deliveries originate from Mumara.
      operationId: v2CreateWebhook
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
            example:
              name: My Integration Webhook
              url: https://api.example.com/webhooks/mumara
              events:
                - contact.subscribed
                - contact.unsubscribed
                - broadcast.opened
              secret: my-webhook-secret-key
              is_active: true
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '409':
          description: A webhook with this URL already exists for the selected events
        '422':
          $ref: '#/components/responses/ValidationError'

  /webhooks/events:
    get:
      summary: List Available Events
      description: |
        Retrieve the complete list of webhook events you can subscribe to, along with a description of when each event fires.
      operationId: v2GetWebhookEvents
      tags:
        - Webhooks
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: contact.subscribed
                        description:
                          type: string
                          example: Triggered when a contact subscribes to a list
              example:
                success: true
                data:
                  - name: contact.subscribed
                    description: Triggered when a contact subscribes to a list
                  - name: contact.unsubscribed
                    description: Triggered when a contact unsubscribes from a list
                  - name: contact.bounced
                    description: Triggered when an email bounces
                  - name: contact.complained
                    description: Triggered when a spam complaint is received
                  - name: broadcast.sent
                    description: Triggered when a broadcast finishes sending
                  - name: broadcast.opened
                    description: Triggered when an email is opened
                  - name: broadcast.clicked
                    description: Triggered when a link in an email is clicked

  /webhooks/{id}:
    get:
      summary: Get a Webhook
      description: Retrieve a specific webhook subscription by ID.
      operationId: v2GetWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Webhook retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Webhook
      description: |
        Update a webhook's name, URL, events, secret, or active status. Only include the fields you want to change.

        **Re-enabling:** When you set `is_active: true` on a previously disabled webhook, the failure counter is automatically reset to 0.
      operationId: v2UpdateWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdate'
      responses:
        '200':
          description: Webhook updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A webhook with this URL already exists for the selected events
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a Webhook
      description: Permanently delete a webhook subscription. No further events will be delivered to this endpoint.
      operationId: v2DeleteWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{id}/test:
    post:
      summary: Test a Webhook
      description: |
        Send a test event to a webhook endpoint to verify connectivity and signature validation. The test payload includes a `test` event type and the webhook's name and ID.

        This is useful during initial setup to confirm your endpoint is reachable and correctly processing deliveries before real events start flowing.
      operationId: v2TestWebhook
      tags:
        - Webhooks
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Test webhook sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status_code:
                        type: integer
                        description: HTTP status code returned by your endpoint
                      response_body:
                        type: string
                        description: Response body from your endpoint
                  message:
                    type: string
              example:
                success: true
                data:
                  status_code: 200
                  response_body: "OK"
                message: Test webhook sent successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Webhook endpoint returned an error or is unreachable

