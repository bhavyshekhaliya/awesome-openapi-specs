  # ============================================
  # SENDING DOMAINS
  # ============================================
  /sending-domains/policy:
    get:
      summary: Get Sending Domain Policy
      description: |
        Describe what the authenticated account may do with sending domains, resolved from Application Settings and the account's package: whether ownership verification is required, the domain quota, which features the package **forces** (and therefore cannot be disabled), whether DKIM keys may be regenerated, which selectors are editable, which masking types are offered, SSL availability, bounce/DMARC defaults and the DNS lookup provider used for verification.

        Call this before creating domains to avoid predictable `422` refusals. Installed add-ons may contribute extra, namespaced information under `addons`.
      operationId: v2GetSendingDomainPolicy
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: Policy resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainPolicyResponse'
              example:
                success: true
                data:
                  user_id: 7
                  license:
                    type: Commercial ESP
                    commercial_esp: true
                  ownership_verification_required: true
                  ownership_methods: [dns_txt, file_upload]
                  primary_domain_ready: true
                  domain_quota:
                    limit: 10
                    unlimited: false
                    used: 4
                    remaining: 6
                    can_add: true
                  duplicates_allowed: false
                  eligibility_checks:
                    enabled: true
                    domain_age:
                      enabled: true
                      min_days: 30
                    blacklist:
                      enabled: true
                  features:
                    dkim:
                      available: true
                      forced: true
                      forced_by: package
                      default_enabled: true
                      selector_editable: false
                      default_selector: key
                      key_size_default: 2048
                      key_sizes: [512, 1024, 2048, 4096]
                      regenerate_allowed: false
                    tracking:
                      available: true
                      forced: false
                      forced_by: null
                      default_enabled: true
                      selector_editable: true
                      default_selector: click
                      masking_types: [cname, htaccess]
                      default_masking_type: cname
                      cname_targets: [track.mumara-app.com]
                    bounce:
                      available: true
                      forced: false
                      forced_by: null
                      default_enabled: false
                      selector_editable: true
                      default_selector: bounce
                      spf_include: spf.mumara.net
                      mx_target: return.mumara.net
                    dmarc:
                      available: true
                      default_enabled: true
                      suggested_record: "v=DMARC1; p=none;"
                      policy: none
                    ssl:
                      available: true
                      forced: false
                      default_enabled: false
                  verification:
                    cooldown_minutes: 10
                    dns_lookup_provider: google_doh
                    current_value_lookup_provider: dig
                    unauthenticated_sending_allowed: true
                  addons: {}
        '403':
          description: A non-admin token passed `user_id` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Only administrators can manage sending domains on behalf of another user.
        '404':
          description: The requested user does not exist (admin `user_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: USER_NOT_FOUND
                  message: User #99 was not found.

  /sending-domains:
    get:
      summary: List All Sending Domains
      description: Retrieve all sending domains with their composite status, ownership state and per-feature verification state. Sandbox domains provisioned by the platform are included; pass `include_sandbox=false` to hide them.
      operationId: v2GetSendingDomains
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AdminUserId'
        - name: status
          in: query
          description: Filter by composite status code
          schema:
            $ref: '#/components/schemas/DomainStatusCode'
        - name: is_verified
          in: query
          description: Filter by ownership verification (`true` = ownership verified)
          schema:
            type: boolean
        - name: search
          in: query
          description: Case-insensitive substring match on the domain name
          schema:
            type: string
        - name: include_sandbox
          in: query
          description: Sandbox domains are included by default; pass `false` to hide them
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Sending domains retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainsResponse'
    post:
      summary: Create a Sending Domain
      description: |
        Add a new sending domain. DKIM keys are generated immediately (unless `enable_dkim` is `false`). The response tells you exactly what to do next:

        **Phase 1 — ownership (only when the administrator enabled ownership verification):**
        the domain is created as `pending_ownership_verification`; `data.ownership.methods` carries the TXT record (recommended) and the file-upload alternative. No feature records are issued until ownership is proven via `POST /sending-domains/{id}/verify-ownership`.

        **Phase 2 — authentication records:** once ownership is verified (or when verification is not required), `data.dns_records` lists **every** record to publish for the enabled features — DKIM TXT, tracking CNAME (or a tracking file for `htaccess`/`cloak` masking), bounce SPF + MX, DMARC — and `next_step` points at `POST /sending-domains/{id}/verify`.

        **Phase 3 — confirm:** call `verify`; when every enabled record passes the domain becomes `active`.

        Feature defaults come from Application Settings and your package: DKIM and tracking default to enabled, bounce is enabled when your package forces it, DMARC follows the administrator's default, SSL is on when the administrator forces secure tracking URLs. Explicitly disabling a feature your package forces is refused with `FEATURE_FORCED_BY_PACKAGE` (and `enable_ssl: false` with `SSL_FORCED` while secure URLs are enforced). Custom selectors are accepted only when the administrator allows editing them. Admin tokens may create a domain for another account with `user_id`.
      operationId: v2CreateSendingDomain
      tags:
        - Sending Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendingDomainCreate'
            example:
              domain: mail.example.com
              masking_type: cname
              enable_dkim: true
              enable_tracking: true
              enable_bounce: true
              enable_dmarc: true
              enable_ssl: false
              key_size: 2048
      responses:
        '201':
          description: Sending domain created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainResponse'
              examples:
                ownershipVerificationRequired:
                  summary: Ownership verification enabled by the administrator
                  value:
                    success: true
                    message: Sending domain added. Prove ownership of mail.example.com before authentication records are issued (see ownership.methods and next_step).
                    data:
                      id: 118
                      user_id: 7
                      domain: mail.example.com
                      masking_type: cname
                      is_sandbox: false
                      status:
                        code: pending_ownership_verification
                        label: Pending ownership verification
                        can_send: false
                        description: Publish the ownership TXT record (or upload the verification file), then call verify-ownership.
                      ownership:
                        required: true
                        verified: false
                        state: pending
                        methods:
                          - method: dns_txt
                            recommended: true
                            record:
                              type: TXT
                              host: 3f2b9c1a7e.mail.example.com
                              name: 3f2b9c1a7e.mail
                              value: 1724500000d41d8cd98f00b204e9800998ecf8427e
                              ttl: 3600
                              instructions: Create a TXT record for host 3f2b9c1a7e.mail.example.com with exactly this value.
                          - method: file_upload
                            recommended: false
                            file:
                              file_name: e4d909c290d0fb1ca068ffaddf22cbd0.html
                              content: e4d909c290d0fb1ca068ffaddf22cbd0
                              url: https://mail.example.com/e4d909c290d0fb1ca068ffaddf22cbd0.html
                              instructions: Upload the file so it is publicly readable at this URL; its body must be exactly the content.
                      domain_status_code: 0
                      is_enabled: false
                      configuration_confirmed: false
                      dkim:
                        enabled: true
                        forced: true
                        selector: key
                        host: key._domainkey.mail.example.com
                        status: pending
                        has_keys: true
                      tracking:
                        enabled: true
                        forced: false
                        selector: click
                        host: click.mail.example.com
                        masking_type: cname
                        target: track.mumara-app.com
                        status: pending
                        redirect_status: pending
                        ssl:
                          enabled: false
                          effective: false
                          forced: false
                          available: true
                      bounce:
                        available: true
                        enabled: false
                        forced: false
                        selector: bounce
                        host: bounce.mail.example.com
                        spf:
                          status: pending
                          include_domain: spf.mumara.net
                        mx:
                          status: pending
                          target: return.mumara.net
                          priority: 10
                      dmarc:
                        enabled: true
                        host: _dmarc.mail.example.com
                        organizational_host: _dmarc.example.com
                        status: pending
                        suggested_value: "v=DMARC1; p=none;"
                      last_verified_at: null
                      dns_records: []
                      files: []
                      next_step:
                        action: verify_ownership
                        method: POST
                        endpoint: https://app.example.com/api/v2/sending-domains/118/verify-ownership
                        body:
                          method: dns_txt
                        description: After the TXT record propagates (or the file is uploaded), call this endpoint. On success all remaining DNS records are returned.
                      warnings: []
                      created_at: '2026-08-24T10:00:00+00:00'
                      updated_at: '2026-08-24T10:00:00+00:00'
                ownershipVerificationNotRequired:
                  summary: Ownership verification disabled — records issued immediately
                  value:
                    success: true
                    message: Sending domain added. Publish the 5 DNS record(s) in dns_records, then call POST https://app.example.com/api/v2/sending-domains/119/verify.
                    data:
                      id: 119
                      user_id: 7
                      domain: news.example.com
                      masking_type: cname
                      is_sandbox: false
                      status:
                        code: pending_authentication
                        label: Pending authentication
                        can_send: true
                        description: Publish the DNS records below and call verify to authenticate the domain.
                      ownership:
                        required: false
                        verified: true
                        state: not_required
                      domain_status_code: 4
                      is_enabled: true
                      configuration_confirmed: false
                      dkim:
                        enabled: true
                        forced: false
                        selector: key
                        host: key._domainkey.news.example.com
                        status: pending
                        has_keys: true
                      tracking:
                        enabled: true
                        forced: false
                        selector: click
                        host: click.news.example.com
                        masking_type: cname
                        target: track.mumara-app.com
                        status: pending
                        redirect_status: pending
                        ssl:
                          enabled: false
                          effective: false
                          forced: false
                          available: true
                      bounce:
                        available: true
                        enabled: true
                        forced: false
                        selector: bounce
                        host: bounce.news.example.com
                        spf:
                          status: pending
                          include_domain: spf.mumara.net
                        mx:
                          status: pending
                          target: return.mumara.net
                          priority: 10
                      dmarc:
                        enabled: true
                        host: _dmarc.news.example.com
                        organizational_host: _dmarc.example.com
                        status: pending
                        suggested_value: "v=DMARC1; p=none;"
                      last_verified_at: null
                      dns_records:
                        - feature: dkim
                          type: TXT
                          host: key._domainkey.news.example.com
                          name: key._domainkey.news
                          value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                          ttl: 3600
                          status: pending
                          instructions: Publish this TXT record exactly. Long values may need to be split into 255-character strings by your DNS provider.
                        - feature: tracking
                          type: CNAME
                          host: click.news.example.com
                          name: click.news
                          value: track.mumara-app.com
                          ttl: 3600
                          status: pending
                          instructions: Point click.news.example.com to track.mumara-app.com via CNAME.
                        - feature: bounce_spf
                          type: TXT
                          host: bounce.news.example.com
                          name: bounce.news
                          value: "v=spf1 include:spf.mumara.net ~all"
                          ttl: 3600
                          status: pending
                          instructions: Publish this SPF record on the bounce host.
                        - feature: bounce_mx
                          type: MX
                          host: bounce.news.example.com
                          name: bounce.news
                          value: return.mumara.net
                          ttl: 3600
                          priority: 10
                          status: pending
                          instructions: Create an MX record with priority 10 pointing at return.mumara.net.
                        - feature: dmarc
                          type: TXT
                          host: _dmarc.news.example.com
                          name: _dmarc.news
                          value: "v=DMARC1; p=none;"
                          organizational_host: _dmarc.example.com
                          ttl: 3600
                          status: pending
                          instructions: Any valid record starting with v=DMARC1 passes; the suggested value reflects Application Settings defaults. A policy already published at _dmarc.example.com also covers this subdomain and satisfies verification on its own.
                      files: []
                      next_step:
                        action: verify_dns_records
                        method: POST
                        endpoint: https://app.example.com/api/v2/sending-domains/119/verify
                        description: Publish the 5 records in dns_records, then call verify. The domain becomes active when all enabled records pass.
                      warnings: []
                      created_at: '2026-08-24T10:00:00+00:00'
                      updated_at: '2026-08-24T10:00:00+00:00'
        '403':
          description: Non-admin token passed `user_id`, or the account may not add domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The domain is already registered (`DOMAIN_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: DOMAIN_ALREADY_EXISTS
                  message: mail.example.com already exists as a sending domain.
                  details:
                    field: domain
        '422':
          description: |
            Validation or policy refusal. Codes: `VALIDATION_ERROR`, `INVALID_DOMAIN`, `PRIMARY_DOMAIN_NOT_VERIFIED`, `DOMAIN_LIMIT_REACHED`, `DOMAIN_NOT_ALLOWED`, `DOMAIN_NOT_ELIGIBLE`, `FEATURE_FORCED_BY_PACKAGE`, `FEATURE_UNAVAILABLE`, `SSL_FORCED`, `MASKING_TYPE_UNAVAILABLE`, `SELECTOR_EDIT_DISABLED`, `INVALID_SELECTOR`, `HOOK_ABORT`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                limitReached:
                  summary: Package quota reached
                  value:
                    success: false
                    error:
                      code: DOMAIN_LIMIT_REACHED
                      message: The maximum number of sending domains allowed by the package (10) has been reached.
                      details:
                        limit: 10
                        used: 10
                featureForced:
                  summary: Package forces DKIM
                  value:
                    success: false
                    error:
                      code: FEATURE_FORCED_BY_PACKAGE
                      message: "DKIM signing cannot be disabled: your package requires it on every sending domain."
                      details:
                        feature: dkim
                        forced_by: package
                        package_id: 3
                        policy_endpoint: https://app.example.com/api/v2/sending-domains/policy
                sslForced:
                  summary: enable_ssl:false while secure tracking URLs are enforced
                  value:
                    success: false
                    error:
                      code: SSL_FORCED
                      message: Secure tracking URLs are enforced for every sending domain and cannot be disabled per domain.
                      details:
                        feature: ssl
                        field: enable_ssl
        '503':
          description: The domain eligibility service (age / blacklist pre-check) could not be reached; the domain was not added (`ELIGIBILITY_CHECK_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: ELIGIBILITY_CHECK_FAILED
                  message: The domain eligibility service could not be reached; the domain was not added. Try again later.
                  details:
                    check: blacklist
                    error: "Connection timed out"

  /sending-domains/{id}:
    get:
      summary: Get a Sending Domain
      description: Retrieve a sending domain with its composite status, ownership state, per-feature configuration and verification state, the DNS records still relevant to it and the recommended next step.
      operationId: v2GetSendingDomain
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Sending domain retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Sending Domain
      description: |
        Change the masking type, toggle features, or rename selectors in one call. Every change is validated against Application Settings and your package before anything is written. A single refused change is reported with its own code and `details.field`; when several changes are refused you receive one `422 UPDATE_REJECTED` whose `details.fields` is keyed by request field (each entry carrying `code` and `message`). Nothing is written in either case.

        - Disabling a feature your package forces → `FEATURE_FORCED_BY_PACKAGE`
        - Selector changes are only accepted when the administrator allows editing that selector (`SELECTOR_EDIT_DISABLED`); a changed selector resets that feature's verification and the domain returns to `pending_authentication`
        - A masking type hidden by the administrator → `MASKING_TYPE_UNAVAILABLE`
        - Turning SSL off while *Force secure tracking URLs* is on → `SSL_FORCED`

        Prefer `PATCH /sending-domains/{id}/features/{feature}` for a single toggle.
      operationId: v2UpdateSendingDomain
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendingDomainUpdate'
            example:
              masking_type: htaccess
              enable_dmarc: true
              tracking_selector: track
      responses:
        '200':
          description: Sending domain updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainResponse'
        '403':
          $ref: '#/components/responses/SendingDomainForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Codes: `VALIDATION_ERROR`, `FEATURE_FORCED_BY_PACKAGE`, `FEATURE_UNAVAILABLE`, `MASKING_TYPE_UNAVAILABLE`, `INVALID_SELECTOR`, `SELECTOR_EDIT_DISABLED`, `SSL_FORCED`, `DOMAIN_SUSPENDED`, `OWNERSHIP_VERIFICATION_REQUIRED`, `UPDATE_REJECTED` (several changes refused — `details.fields` keyed by request field), `HOOK_ABORT`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                singleChangeRefused:
                  summary: One change refused
                  value:
                    success: false
                    error:
                      code: SELECTOR_EDIT_DISABLED
                      message: Changing the tracking selector has been disabled by the administrator (Application Settings > Domains).
                      details:
                        field: tracking_selector
                        code: SELECTOR_EDIT_DISABLED
                        message: Changing the tracking selector has been disabled by the administrator (Application Settings > Domains).
                severalChangesRefused:
                  summary: Several changes refused at once
                  value:
                    success: false
                    error:
                      code: UPDATE_REJECTED
                      message: Some of the requested changes are not allowed; nothing was changed.
                      details:
                        fields:
                          tracking_selector:
                            code: INVALID_SELECTOR
                            message: "A selector must be a single DNS label: lower-case letters, digits and hyphens, 1-63 characters, not starting or ending with a hyphen."
                          bounce_selector:
                            code: SELECTOR_EDIT_DISABLED
                            message: Changing the bounce selector has been disabled by the administrator (Application Settings > Domains).
    delete:
      summary: Delete a Sending Domain
      description: |
        Delete a sending domain. If contact lists, sending nodes, triggers or web forms still reference the domain, the request is refused with `409 DOMAIN_IN_USE` and `error.details.connected_assets` lists them. Pass `reassign_to_domain_id` (another sending domain of the same account) to move those assets to it and complete the deletion in one call.
      operationId: v2DeleteSendingDomain
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendingDomainDeleteRequest'
            example:
              reassign_to_domain_id: 42
      responses:
        '200':
          description: Sending domain deleted successfully. `data` is `null` unless assets were moved with `reassign_to_domain_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainDeleteResponse'
              examples:
                plain:
                  summary: No connected assets
                  value:
                    success: true
                    message: Sending domain deleted successfully
                reassigned:
                  summary: Assets moved to another domain
                  value:
                    success: true
                    message: Sending domain deleted; its assets were moved to news.example.com.
                    data:
                      reassigned_to:
                        id: 42
                        domain: news.example.com
                      moved_assets:
                        lists:
                          - id: 12
                            name: Newsletter
                          - id: 15
                            name: Customers
                        sending_nodes:
                          - id: 3
                            name: Primary SMTP
        '403':
          $ref: '#/components/responses/SendingDomainForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DomainInUse'
        '422':
          description: Codes `REASSIGN_TARGET_INVALID`, `HOOK_ABORT`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: REASSIGN_TARGET_INVALID
                  message: reassign_to_domain_id must be another sending domain of the same account.
                  details:
                    field: reassign_to_domain_id

  /sending-domains/{id}/dns-records:
    get:
      summary: Get DNS Records
      description: |
        List every DNS record to publish for the features enabled on this domain — DKIM TXT, tracking CNAME (or, for `htaccess`/`cloak` masking, the tracking file in `files`), bounce SPF + MX (only when the installation routes bounces through DNS), DMARC — each with its verification `status`.

        **DMARC on a subdomain:** the suggested `host` is always the sending domain's own `_dmarc` host, but receivers fall back to the organizational domain when a subdomain publishes no policy (RFC 7489 §6.6.3), so a record at `organizational_host` satisfies verification on its own. Publishing there protects every address on the domain rather than this subdomain alone — but only one DMARC record is allowed per host, so extend an existing record instead of replacing it.

        Set `include_current_values=true` to also look up what is currently published at each host (uses the "current value" DNS lookup provider configured by the administrator; adds latency).

        Before ownership is verified this endpoint returns `records: []` together with the `ownership.methods` block and a `next_step` of `verify_ownership`.
      operationId: v2GetSendingDomainDnsRecords
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: include_current_values
          in: query
          description: Also return the value currently published in DNS for each record
          schema:
            type: boolean
            default: false
        - name: features
          in: query
          description: Comma-separated subset of features to return. Accepts `dkim`, `tracking`, `bounce` (both bounce records), `spf` / `bounce_spf`, `mx` / `bounce_mx`, `dmarc`
          schema:
            type: string
            example: dkim,bounce
      responses:
        '200':
          description: DNS records retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsRecordsResponse'
              example:
                success: true
                data:
                  domain: mail.example.com
                  status:
                    code: authentication_failed
                    label: Authentication failed
                    can_send: true
                    description: One or more records failed. Sending is still permitted because unauthenticated sending is allowed by the administrator.
                  ownership:
                    required: true
                    verified: true
                    state: verified
                  records:
                    - feature: dkim
                      type: TXT
                      host: key._domainkey.mail.example.com
                      name: key._domainkey.mail
                      value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                      ttl: 3600
                      status: verified
                      current_value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                      instructions: Publish this TXT record exactly. Long values may need to be split into 255-character strings by your DNS provider.
                    - feature: tracking
                      type: CNAME
                      host: click.mail.example.com
                      name: click.mail
                      value: track.mumara-app.com
                      ttl: 3600
                      status: failed
                      status_detail: redirect_mismatch
                      current_value: old-cdn.example.net.
                      instructions: Point click.mail.example.com to track.mumara-app.com via CNAME. Mumara confirms by fetching http://click.mail.example.com/version.
                    - feature: bounce_spf
                      type: TXT
                      host: bounce.mail.example.com
                      name: bounce.mail
                      value: "v=spf1 include:spf.mumara.net ~all"
                      ttl: 3600
                      status: pending
                      current_value: null
                      instructions: Publish this SPF record on the bounce host.
                    - feature: bounce_mx
                      type: MX
                      host: bounce.mail.example.com
                      name: bounce.mail
                      value: return.mumara.net
                      ttl: 3600
                      priority: 10
                      status: pending
                      current_value: null
                      instructions: Create an MX record with priority 10 pointing at return.mumara.net.
                    - feature: dmarc
                      type: TXT
                      host: _dmarc.mail.example.com
                      name: _dmarc.mail
                      value: "v=DMARC1; p=none;"
                      organizational_host: _dmarc.example.com
                      ttl: 3600
                      status: pending
                      current_value: "v=DMARC1; p=reject; rua=mailto:dmarc@example.com"
                      current_value_source: _dmarc.example.com
                      instructions: Any valid record starting with v=DMARC1 passes; the suggested value reflects Application Settings defaults. This domain is a subdomain, so the policy at _dmarc.example.com already covers it and satisfies verification on its own — publishing there protects the whole domain, but only one DMARC record is allowed per host, so extend the existing record rather than replacing it.
                  files: []
                  summary:
                    total: 5
                    verified: 1
                    pending: 3
                    failed: 1
                  dns_lookup_provider: google_doh
                  current_value_lookup_provider: dig
                  next_step:
                    action: fix_dns_records
                    method: GET
                    endpoint: https://app.example.com/api/v2/sending-domains/118/dns-records?include_current_values=1
                    description: "Fix the failed record(s): tracking. Then call POST https://app.example.com/api/v2/sending-domains/118/verify again."
        '403':
          $ref: '#/components/responses/SendingDomainForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sending-domains/{id}/verify-ownership:
    post:
      summary: Verify Domain Ownership
      description: |
        Prove that you control the domain. Mumara checks the ownership TXT record (`method: dns_txt`, default) or fetches the verification file (`method: file_upload`) using the DNS lookup method configured in Application Settings — exactly as the dashboard does.

        - **Success (200):** ownership is recorded, the domain moves to `pending_authentication`, and the response already contains **all** DNS records to publish next (`dns_records` / `files`).
        - **Failure (422 `OWNERSHIP_VERIFICATION_FAILED`):** `error.details` explains what was expected, what was found, and how to proceed.
        - Already verified, or verification not required on this installation → `200` with the current state (idempotent).
        - Ownership reset by an administrator (`403 OWNERSHIP_REVOKED`) cannot be re-verified by the account itself; the sandbox domain cannot be changed by clients (`403 SANDBOX_DOMAIN`).

        Admin tokens may pass `force: true` to mark ownership verified without a lookup (this also clears an administrator reset); a non-admin token passing `force` gets `403 FORBIDDEN`. On success `data` is the full sending domain (as returned by `GET /sending-domains/{id}`) with `ownership.method` / `ownership.checked` added and `dns_records` / `files` already populated.
      operationId: v2VerifySendingDomainOwnership
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOwnershipRequest'
            example:
              method: dns_txt
      responses:
        '200':
          description: Ownership verified (or already verified / not required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOwnershipResponse'
              example:
                success: true
                message: Domain ownership verified. Publish the 3 DNS record(s) in dns_records, then call POST https://app.example.com/api/v2/sending-domains/118/verify.
                data:
                  id: 118
                  domain: mail.example.com
                  ownership:
                    required: true
                    verified: true
                    state: verified
                    method: dns_txt
                    checked:
                      host: 3f2b9c1a7e.mail.example.com
                      url: null
                      expected: 1724500000d41d8cd98f00b204e9800998ecf8427e
                      found: 1724500000d41d8cd98f00b204e9800998ecf8427e
                  status:
                    code: pending_authentication
                    label: Pending authentication
                    can_send: true
                    description: The DNS records of the enabled features have not been verified yet. Sending is still permitted because the administrator allows unauthenticated sending domains.
                  dns_records:
                    - feature: dkim
                      type: TXT
                      host: key._domainkey.mail.example.com
                      name: key._domainkey.mail
                      value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                      ttl: 3600
                      status: pending
                      instructions: Publish this TXT record exactly.
                    - feature: tracking
                      type: CNAME
                      host: click.mail.example.com
                      name: click.mail
                      value: track.mumara-app.com
                      ttl: 3600
                      status: pending
                      instructions: Point click.mail.example.com to track.mumara-app.com via CNAME.
                    - feature: dmarc
                      type: TXT
                      host: _dmarc.mail.example.com
                      name: _dmarc.mail
                      value: "v=DMARC1; p=none;"
                      organizational_host: _dmarc.example.com
                      ttl: 3600
                      status: pending
                      instructions: Any valid record starting with v=DMARC1 passes. A policy already published at _dmarc.example.com also covers this subdomain and satisfies verification on its own.
                  files: []
                  next_step:
                    action: verify_dns_records
                    method: POST
                    endpoint: https://app.example.com/api/v2/sending-domains/118/verify
                    description: Publish the records listed in dns_records (GET https://app.example.com/api/v2/sending-domains/118/dns-records), then call verify. The domain becomes active once every enabled record passes.
        '403':
          description: |
            `OWNERSHIP_REVOKED` — an administrator reset the verification (only an admin `force` clears it); `SANDBOX_DOMAIN` — the platform sandbox domain cannot be changed by clients; `FORBIDDEN` — a non-admin token passed `force`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: OWNERSHIP_REVOKED
                  message: An administrator has reset the ownership verification of this domain; only an administrator can verify it again.
                  details:
                    next_step:
                      action: contact_administrator
                      method: null
                      endpoint: null
                      description: This state can only be changed by an administrator.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OwnershipVerificationFailed'

  /sending-domains/{id}/verify:
    post:
      summary: Verify DNS Records
      description: |
        Check every DNS record required by the enabled features (or only those listed in `records`) against live DNS using the lookup method configured by the administrator, and update the domain status. This is a **report**: it always returns `200` with the outcome of every record — expected value, value found, `status`, `status_detail` and a human-readable `message` — on top of the full sending domain object, plus `hooks_fired` (the add-on hooks queued by this run) and the `cooldown` that now applies.

        - Ownership must be verified first (`422 OWNERSHIP_VERIFICATION_REQUIRED`).
        - Re-checks are throttled by the administrator's cooldown (`429 VERIFICATION_COOLDOWN` with a `Retry-After` header). The first confirmation is never throttled; admin tokens are exempt.
        - Tracking verification also performs an HTTP request against the tracking host, so this call can take several seconds.
        - **DMARC follows the RFC 7489 §6.6.3 discovery chain**, exactly as receivers do: `_dmarc.<domain>` first and, only when that publishes no valid policy, `_dmarc.<organizational domain>`. A subdomain that inherits its parent's policy therefore verifies, with `status_detail` = `inherited` and `host` naming the record that satisfied the check. When neither host publishes a policy the `message` names both.
        - A DNS lookup no resolver can answer is reported as `pending`, never `failed`, and leaves the stored verdict untouched — an outage never reads as a removed record.
      operationId: v2VerifySendingDomain
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRecordsRequest'
            example:
              records: [dkim, tracking]
      responses:
        '200':
          description: Verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDomainResponse'
              example:
                success: true
                message: "Verification completed: 2 verified, 3 failed."
                data:
                  domain: mail.example.com
                  checked_at: '2026-08-24T10:15:00+00:00'
                  records:
                    - feature: dkim
                      type: TXT
                      host: key._domainkey.mail.example.com
                      expected: "v=DKIM1; k=rsa; p=MIIB..."
                      found: "v=DKIM1; k=rsa; p=MIIB..."
                      status: verified
                      status_detail: null
                      message: DKIM record matches.
                    - feature: tracking
                      type: CNAME
                      host: click.mail.example.com
                      expected: track.mumara-app.com
                      found: track.mumara-app.com.
                      status: failed
                      status_detail: ssl_broken
                      message: The host points at Mumara but https://click.mail.example.com does not present a valid certificate. Install a certificate or disable SSL for this domain.
                    - feature: bounce_spf
                      type: TXT
                      host: bounce.mail.example.com
                      expected: "v=spf1 include:spf.mumara.net ~all"
                      found: "v=spf1 include:_spf.google.com ~all"
                      status: failed
                      status_detail: missing_include
                      message: An SPF record exists but does not include spf.mumara.net.
                    - feature: bounce_mx
                      type: MX
                      host: bounce.mail.example.com
                      expected: return.mumara.net
                      found: return.mumara.net
                      status: verified
                      status_detail: null
                      message: MX record matches.
                    - feature: dmarc
                      type: TXT
                      host: _dmarc.mail.example.com
                      expected: "v=DMARC1; p=none;"
                      found: null
                      status: failed
                      status_detail: not_found
                      message: No DMARC record was found at _dmarc.mail.example.com or at _dmarc.example.com, which would otherwise cover this subdomain.
                  summary:
                    total: 5
                    verified: 2
                    failed: 3
                    pending: 0
                    skipped: []
                  status:
                    code: authentication_failed
                    label: Authentication failed
                    can_send: true
                    description: One or more DNS records failed verification. Sending is still permitted because the administrator allows unauthenticated sending domains.
                  dns_lookup_provider: google_doh
                  hooks_fired: [SendingDomainDKIMPassed, SendingDomainMXPassed, SendingDomainDnsFailed]
                  cooldown:
                    cooldown_minutes: 10
                    next_verification_allowed_at: '2026-08-24T10:25:00+00:00'
                    applies: true
                  next_step:
                    action: fix_dns_records
                    method: GET
                    endpoint: https://app.example.com/api/v2/sending-domains/118/dns-records?include_current_values=1
                    description: "Fix the failed record(s): tracking, bounce_spf, dmarc. Then call POST https://app.example.com/api/v2/sending-domains/118/verify again."
        '403':
          $ref: '#/components/responses/SendingDomainForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/OwnershipVerificationRequired'
        '429':
          $ref: '#/components/responses/VerificationCooldown'

  /sending-domains/{id}/features/{feature}:
    patch:
      summary: Enable or Disable a Feature
      description: |
        Toggle one feature of the domain: `dkim`, `tracking`, `bounce`, `dmarc`, `ssl`, or `status` (the domain's own on/off switch). The change is validated against Application Settings and your package **before** it is written, so a refusal never leaves the domain half-changed:

        | Feature | Refused when |
        |---------|--------------|
        | `dkim` / `tracking` / `bounce` | disabling a feature your package forces → `FEATURE_FORCED_BY_PACKAGE` |
        | `bounce` | bounce DNS verification is not enabled on this installation → `FEATURE_UNAVAILABLE` |
        | `ssl` | disabling while *Force secure tracking URLs* is on → `SSL_FORCED`; enabling when the per-domain SSL switch is not offered → `FEATURE_UNAVAILABLE` |
        | `status` | the domain was suspended by an administrator → `DOMAIN_SUSPENDED` |
        | any | ownership not yet verified → `OWNERSHIP_VERIFICATION_REQUIRED` |

        Enabling a feature that needs a DNS record returns that record in `data.dns_records`; enabling DKIM on a domain without keys generates them first. The response carries `data.changed` describing the transition; the call is idempotent — a feature already in the requested state returns `200` with `data.changed.changed: false` and no hooks fire. An unknown `{feature}` is a `404` (route constraint).
      operationId: v2SetSendingDomainFeature
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: feature
          in: path
          required: true
          description: Feature to toggle
          schema:
            type: string
            enum: [dkim, tracking, bounce, dmarc, ssl, status]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureToggleRequest'
            example:
              enabled: true
      responses:
        '200':
          description: Feature updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureToggleResponse'
        '403':
          $ref: '#/components/responses/SendingDomainForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/FeatureForcedByPackage'

  /sending-domains/{id}/dkim/regenerate:
    post:
      summary: Regenerate DKIM Keys
      description: |
        Generate a new DKIM key pair for the domain (optionally with a different `key_size`). The previous public key stops being valid immediately, so publish the new TXT record (returned in `data.dns_records`) and call `verify` again; until then the domain is `pending_authentication`.

        Refused with `403 DKIM_REGENERATE_DISABLED` when the administrator disabled key regeneration for users (admin tokens are exempt), and with `422 HOOK_ABORT` when an add-on blocks it (for example while the sending infrastructure is being rebuilt).
      operationId: v2RegenerateSendingDomainDkim
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DkimRegenerateRequest'
            example:
              key_size: 2048
      responses:
        '200':
          description: New keys generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingDomainResponse'
        '403':
          $ref: '#/components/responses/DkimRegenerateDisabled'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/SendingDomainHookAbort'
        '500':
          description: Key generation failed on the server (`DKIM_KEY_GENERATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: DKIM_KEY_GENERATION_FAILED
                  message: DKIM key generation failed. Contact your administrator.

  /sending-domains/{id}/dkim/keys:
    get:
      summary: Get DKIM Public Key
      description: |
        Return the domain's DKIM selector, the TXT record value to publish and the public key in PEM form. **The private key is never exposed through the API**; it stays on the server and is used for signing.
      operationId: v2GetSendingDomainDkimKeys
      tags:
        - Sending Domains
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: DKIM public material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DkimKeysResponse'
              example:
                success: true
                data:
                  domain: mail.example.com
                  selector: key
                  host: key._domainkey.mail.example.com
                  dns_value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                  public_key_pem: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...\n-----END PUBLIC KEY-----\n"
                  key_size_bits: 2048
                  status: verified
                  record:
                    feature: dkim
                    type: TXT
                    host: key._domainkey.mail.example.com
                    name: key._domainkey.mail
                    value: "v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
                    ttl: 3600
                    status: verified
                    status_detail: null
                    instructions: Publish this TXT record exactly as given. Values longer than 255 characters may need to be split into multiple quoted strings by your DNS provider; Mumara joins them before comparing.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No keys have been generated for this domain (`DKIM_KEYS_NOT_GENERATED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: DKIM_KEYS_NOT_GENERATED
                  message: This domain has no DKIM keys yet. Call POST https://app.example.com/api/v2/sending-domains/118/dkim/regenerate to generate them.

