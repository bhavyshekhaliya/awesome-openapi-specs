    SpinTagCreate:
      type: object
      required:
        - placeholder
        - words
      properties:
        placeholder:
          type: string
          maxLength: 255
          pattern: '^[a-zA-Z0-9_]+$'
          description: Unique placeholder name (alphanumeric and underscores only). Used in broadcasts as `{spin:placeholder_name}`.
          example: greeting
        words:
          type: array
          items:
