    DnsRecord:
      type: object
      properties:
        feature:
          type: string
          enum: [dkim, tracking, bounce_spf, bounce_mx, dmarc]
        type:
          type: string
          enum: [TXT, CNAME, MX]
        host:
          type: string
          description: Fully-qualified host to create the record at
          example: key._domainkey.mail.example.com
        name:
          type: string
          description: Host relative to the registrable domain (what most DNS panels ask for)
          example: key._domainkey.mail
        value:
          type: string
          description: Value to publish
        ttl:
          type: integer
          description: Suggested TTL in seconds
          example: 3600
        priority:
          type: integer
          description: MX priority (MX records only)
          example: 10
        status:
          $ref: '#/components/schemas/RecordStatus'
        status_detail:
          $ref: '#/components/schemas/RecordStatusDetail'
        organizational_host:
          type:
            - string
            - 'null'
          description: |
            DMARC only. The organizational domain's DMARC host, whose policy covers this domain when it
            publishes none of its own (RFC 7489 §6.6.3). `null` when the domain is itself the
            organizational domain.
          example: _dmarc.example.com
        current_value:
          type:
            - string
            - 'null'
          description: What is currently published in DNS (only with `include_current_values=true`; `null` when nothing is published)
        current_value_source:
          type: string
          description: |
            DMARC only, and only when `current_value` was read from a host other than `host` — the
            organizational record this subdomain inherits. Absent when the value came from `host` itself.
          example: _dmarc.example.com
        lookup_error:
          type: string
          description: Present only when the current-value lookup itself failed (`include_current_values=true`)
        instructions:
          type: string

    TrackingFile:
