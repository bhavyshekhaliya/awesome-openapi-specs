  /spin-tags/{id}:
    get:
      summary: Get a Spin Tag
      description: Retrieve a specific spin tag by ID.
      operationId: v2GetSpinTag
      tags:
        - Spin Tags
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
