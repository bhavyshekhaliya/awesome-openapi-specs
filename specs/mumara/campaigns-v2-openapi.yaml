    # ============================================
    # SENDING DOMAIN SCHEMAS
    # ============================================
    SendingDomainErrorCode:
      type: string
      description: |
        Error codes specific to the Sending Domains endpoints (in addition to the standard codes). The HTTP status is given in parentheses.

        - `INVALID_DOMAIN` (422) — not a valid hostname
        - `DOMAIN_ALREADY_EXISTS` (409) — already registered (unless the administrator allows duplicates)
        - `DOMAIN_LIMIT_REACHED` (422) — package quota reached; `details.limit`, `details.used`
        - `PRIMARY_DOMAIN_NOT_VERIFIED` (422) — the installation's primary tracking domain is not verified yet
        - `DOMAIN_NOT_ALLOWED` (422) — the application's own hostname cannot be used
        - `DOMAIN_NOT_ELIGIBLE` (422) — failed the domain age / blacklist pre-check
        - `ELIGIBILITY_CHECK_FAILED` (503) — the eligibility service could not be reached; the domain was not added
        - `FEATURE_FORCED_BY_PACKAGE` (422) — the package requires the feature; it cannot be disabled
        - `FEATURE_UNAVAILABLE` (422) — the feature is not enabled on this installation
        - `MASKING_TYPE_UNAVAILABLE` (422) — the masking type is hidden by the administrator
        - `INVALID_FEATURE` (422) — unknown feature name (not reachable through the documented routes: an unknown `{feature}` is a `404`)
        - `SSL_FORCED` (422) — secure tracking URLs are enforced globally
        - `SELECTOR_EDIT_DISABLED` (422) — the administrator does not allow changing that selector
        - `INVALID_SELECTOR` (422) — selector is not a valid DNS label
        - `UPDATE_REJECTED` (422) — several changes in one `PUT` were refused; `details.fields` is keyed by request field, each with `code` and `message`
        - `DKIM_REGENERATE_DISABLED` (403) — key regeneration disabled for users
        - `DKIM_KEY_GENERATION_FAILED` (500) — OpenSSL could not generate a key pair
        - `DKIM_KEYS_NOT_GENERATED` (422) — the domain has no DKIM keys yet
        - `OWNERSHIP_VERIFICATION_REQUIRED` (422) — prove ownership first
        - `OWNERSHIP_VERIFICATION_FAILED` (422) — the ownership record/file was not found or did not match
        - `OWNERSHIP_REVOKED` (403) — ownership verification reset by an administrator
        - `DOMAIN_SUSPENDED` (422) — the domain was suspended by an administrator
        - `SANDBOX_DOMAIN` (403) — the platform sandbox domain cannot be changed
        - `VERIFICATION_COOLDOWN` (429) — re-check requested too soon; see `Retry-After`
        - `DOMAIN_IN_USE` (409) — lists / nodes / triggers / web forms still use the domain
        - `REASSIGN_TARGET_INVALID` (422) — `reassign_to_domain_id` is not a usable domain of the same account
        - `USER_NOT_FOUND` (404) — admin `user_id` does not exist
        - `HOOK_ABORT` (422) — an add-on blocked the action; `details.code` carries the add-on's own code and `details.hook` the hook name
      enum:
        - INVALID_DOMAIN
        - DOMAIN_ALREADY_EXISTS
        - DOMAIN_LIMIT_REACHED
        - PRIMARY_DOMAIN_NOT_VERIFIED
        - DOMAIN_NOT_ALLOWED
        - DOMAIN_NOT_ELIGIBLE
        - ELIGIBILITY_CHECK_FAILED
        - FEATURE_FORCED_BY_PACKAGE
        - FEATURE_UNAVAILABLE
        - MASKING_TYPE_UNAVAILABLE
        - INVALID_FEATURE
        - SSL_FORCED
        - SELECTOR_EDIT_DISABLED
        - INVALID_SELECTOR
        - UPDATE_REJECTED
        - DKIM_REGENERATE_DISABLED
        - DKIM_KEY_GENERATION_FAILED
        - DKIM_KEYS_NOT_GENERATED
        - OWNERSHIP_VERIFICATION_REQUIRED
        - OWNERSHIP_VERIFICATION_FAILED
        - OWNERSHIP_REVOKED
        - DOMAIN_SUSPENDED
        - SANDBOX_DOMAIN
        - VERIFICATION_COOLDOWN
        - DOMAIN_IN_USE
        - REASSIGN_TARGET_INVALID
        - USER_NOT_FOUND
        - HOOK_ABORT

    DomainStatusCode:
      type: string
      description: |
        Composite status of a sending domain, derived from ownership verification and the authentication state of every enabled feature.

        - `pending_ownership_verification` — ownership verification is enabled and not yet proven; nothing else can be configured
        - `ownership_verification_revoked` — an administrator reset the ownership verification
        - `inactive` — switched off by the user (`PATCH …/features/status`)
        - `pending_authentication` — records issued but not all confirmed yet (or the configuration changed and must be re-confirmed)
        - `authentication_failed` — at least one enabled record failed verification
        - `suspended` — suspended by an administrator
        - `active` — every enabled record is verified; the domain is fully authenticated
      enum:
        - pending_ownership_verification
        - ownership_verification_revoked
        - inactive
        - pending_authentication
        - authentication_failed
        - suspended
        - active

    DomainStatus:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/DomainStatusCode'
        label:
          type: string
          example: Pending authentication
        can_send:
          type: boolean
          description: Whether emails may currently be sent from this domain. For `pending_authentication` / `authentication_failed` this follows the administrator's "block unauthenticated sending domains" setting.
        description:
          type: string
          description: Human-readable explanation of the current state and what resolves it

    NextStep:
      type: object
      description: Machine-readable recommendation of what to do next
      properties:
        action:
          type: string
          enum: [verify_ownership, contact_administrator, enable_domain, verify_dns_records, fix_dns_records, none]
        method:
          type:
            - string
            - 'null'
          description: HTTP method of the suggested call (`null` when `action` is `none` / `contact_administrator`)
          example: POST
        endpoint:
          type:
            - string
            - 'null'
          description: Absolute URL of the suggested call (`null` when `action` is `none` / `contact_administrator`)
          example: https://app.example.com/api/v2/sending-domains/118/verify
        body:
          type: object
          description: Suggested request body, when applicable
          additionalProperties: true
        description:
          type: string

    OwnershipRecord:
      type: object
      description: TXT record proving ownership
      properties:
        type:
          type: string
          enum: [TXT]
        host:
          type: string
          description: Fully-qualified host to create the record at
          example: 3f2b9c1a7e.mail.example.com
        name:
          type: string
          description: Host relative to the registrable domain (what most DNS panels ask for)
          example: 3f2b9c1a7e.mail
        value:
          type: string
          description: Exact TXT value to publish
        ttl:
          type: integer
          description: Suggested TTL in seconds
        current_value:
          type:
            - string
            - 'null'
          description: What is currently published at the host (only on `GET /sending-domains/{id}/dns-records?include_current_values=true` while ownership is pending; `null` when nothing is published)
        lookup_error:
          type: string
          description: Present only when the current-value lookup itself failed
          example: 3600
        instructions:
          type: string

    OwnershipFile:
      type: object
      description: Verification file alternative
      properties:
        file_name:
          type: string
          example: e4d909c290d0fb1ca068ffaddf22cbd0.html
        content:
          type: string
          description: Exact body the file must contain
        url:
          type: string
          format: uri
          description: Public URL Mumara will fetch
        instructions:
          type: string

    OwnershipMethod:
      type: object
      properties:
        method:
          type: string
          enum: [dns_txt, file_upload]
        recommended:
          type: boolean
        record:
          $ref: '#/components/schemas/OwnershipRecord'
        file:
          $ref: '#/components/schemas/OwnershipFile'

    OwnershipBlock:
      type: object
      properties:
        required:
          type: boolean
          description: Whether the administrator enabled ownership verification
        verified:
          type: boolean
        state:
          type: string
          enum: [not_required, pending, verified, revoked]
        methods:
          type: array
          description: Available verification methods — present only while ownership is pending
          items:
            $ref: '#/components/schemas/OwnershipMethod'

    RecordStatus:
      type: string
      description: Verification state of a single DNS record
      enum: [pending, verified, failed]

    RecordStatusDetail:
      type: string
      description: |
        Why a record is `failed` (per feature): DKIM `not_found`, `value_mismatch`, `lookup_error`; tracking `cname_mismatch`, `redirect_mismatch` (host does not resolve to this Mumara installation), `ssl_broken` (host reachable but HTTPS invalid); SPF `not_found`, `invalid`, `missing_include`, `missing_all`; MX `not_found`, `value_mismatch`; DMARC `not_found`, `invalid`.

        `inherited` is the one detail that accompanies a **verified** record: the subdomain publishes no
        DMARC policy of its own, so the organizational domain's applies (RFC 7489 §6.6.3).
      enum:
        - not_found
        - value_mismatch
        - lookup_error
        - cname_mismatch
        - redirect_mismatch
        - ssl_broken
        - invalid
        - missing_include
        - missing_all
        - inherited

    SendingDomainDkim:
      type: object
      properties:
        enabled:
          type: boolean
        forced:
          type: boolean
          description: The package requires DKIM; it cannot be disabled
        selector:
          type: string
          example: key
        host:
          type: string
          example: key._domainkey.mail.example.com
        status:
          $ref: '#/components/schemas/RecordStatus'
        has_keys:
          type: boolean

    SendingDomainTracking:
      type: object
      properties:
        enabled:
          type: boolean
        forced:
          type: boolean
        selector:
          type: string
          example: click
        host:
          type: string
          example: click.mail.example.com
        masking_type:
          type: string
          enum: [cname, htaccess, cloak]
        target:
          type: string
          description: CNAME target / redirect destination
          example: track.mumara-app.com
        status:
          $ref: '#/components/schemas/RecordStatus'
        redirect_status:
          type: string
          description: Result of the HTTP check against the tracking host
          enum: [pending, ok, mismatch, ssl_broken]
        ssl:
          type: object
          properties:
            enabled:
              type: boolean
              description: The domain's own SSL preference
            effective:
              type: boolean
              description: Whether HTTPS is actually used (true when forced by the administrator)
            forced:
              type: boolean
            available:
              type: boolean
              description: Whether the per-domain SSL switch is offered on this installation

    SendingDomainBounce:
      type: object
