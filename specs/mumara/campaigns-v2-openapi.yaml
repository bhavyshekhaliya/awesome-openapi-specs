            dns_lookup_provider:
              $ref: '#/components/schemas/DnsLookupProvider'
            current_value_lookup_provider:
              allOf:
                - $ref: '#/components/schemas/DnsLookupProvider'
              description: Provider used for `current_value` lookups (Application Settings > Domains); the verification provider is `dns_lookup_provider`
            next_step:
              $ref: '#/components/schemas/NextStep'

    VerifyOwnershipRequest:
      type: object
      properties:
        method:
          type: string
          enum: [dns_txt, file_upload]
          default: dns_txt
        force:
          type: boolean
          description: Admin only — mark ownership verified without performing a lookup

    VerifyOwnershipResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          description: The full sending domain (as `GET /sending-domains/{id}`), with `ownership.method` / `ownership.checked` added; `dns_records` and `files` are populated the moment ownership is verified
          allOf:
            - $ref: '#/components/schemas/SendingDomain'
            - type: object
              properties:
                ownership:
                  allOf:
                    - $ref: '#/components/schemas/OwnershipBlock'
                    - type: object
                      properties:
                        method:
                          type: string
                          description: How ownership was established (`forced` = admin override without a lookup)
                          enum: [dns_txt, file_upload, forced]
                        checked:
                          type: object
                          description: What was checked and what was found (absent for `forced`)
                          properties:
                            host:
                              type:
                                - string
                                - 'null'
                              description: TXT host checked (`dns_txt`)
                            url:
                              type:
                                - string
                                - 'null'
                              description: File URL fetched (`file_upload`)
                            expected:
                              type: string
                            found:
                              type:
                                - string
                                - 'null'
                dns_records:
                  type: array
                  description: All records to publish next — issued the moment ownership is verified
                  items:
                    $ref: '#/components/schemas/DnsRecord'
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/TrackingFile'

    VerifyRecordsRequest:
      type: object
      properties:
        records:
          type: array
          description: Only check these records (defaults to every record of every enabled feature). `bounce` expands to both bounce records; a record whose feature is disabled is reported under `summary.skipped`
          items:
            type: string
            enum: [dkim, tracking, bounce, spf, mx, dmarc]

    VerifyRecordResult:
      type: object
      properties:
        feature:
          type: string
          enum: [dkim, tracking, bounce_spf, bounce_mx, dmarc]
        type:
          type: string
          enum: [TXT, CNAME, MX]
        host:
          type: string
        expected:
          type: string
        found:
          type:
            - string
            - 'null'
          description: Value found in DNS (`null` when nothing was found)
        status:
          $ref: '#/components/schemas/RecordStatus'
        status_detail:
          $ref: '#/components/schemas/RecordStatusDetail'
        message:
          type: string
          description: Human-readable outcome, including how to fix a failure
        lookup_error:
          type: string
          description: "Present only when the DNS lookup itself failed (`status_detail` = `lookup_error`)"

    VerifyDomainResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Verification completed: 2 verified, 3 failed."
        data:
          description: The full sending domain after the check (as `GET /sending-domains/{id}`), plus the verification report
          allOf:
            - $ref: '#/components/schemas/SendingDomain'
            - type: object
              properties:
                checked_at:
                  type: string
                  format: date-time
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/VerifyRecordResult'
                summary:
                  type: object
                  properties:
                    total:
                      type: integer
                    verified:
                      type: integer
                    failed:
                      type: integer
                    pending:
                      type: integer
                    skipped:
                      type: array
                      description: Requested records that were not checked because their feature is disabled
                      items:
                        type: string
                dns_lookup_provider:
                  $ref: '#/components/schemas/DnsLookupProvider'
                hooks_fired:
                  type: array
                  description: Add-on hooks queued by this run (`SendingDomainDKIMPassed`, `SendingDomainTrackingPassed`, `SendingDomainSpfPassed`, `SendingDomainMXPassed` on a record's first pass; `SendingDomainDnsFailed` when the domain ends up `authentication_failed`)
                  items:
                    type: string
                cooldown:
                  type: object
                  description: The re-check cooldown that now applies to this domain
                  properties:
                    cooldown_minutes:
                      type: integer
                      description: "`0` when the administrator configured no cooldown"
                    next_verification_allowed_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: "`null` when there is no cooldown"
                    applies:
                      type: boolean
                      description: Whether the cooldown applies to the calling token (admin tokens are exempt)

    DkimRegenerateRequest:
      type: object
      properties:
        key_size:
          type: integer
          enum: [512, 1024, 2048, 4096]
          description: Key size in bits (defaults to the application setting)

    DkimKeysResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
