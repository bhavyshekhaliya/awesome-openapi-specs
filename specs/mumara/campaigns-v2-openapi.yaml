    # ============================================
    # SUPPRESSION SCHEMAS
    # ============================================
    SuppressionCreate:
      type: object
      required:
        - type
        - value
        - scope
        - reference
      properties:
        type:
          type: string
          enum: [email, domain, ip]
          description: Type of suppression entry
          example: email
        value:
          type: string
          maxLength: 255
          description: The email, domain, or IP to suppress
          example: bounced@example.com
        scope:
          type: string
          enum: [global, list]
          description: Whether this suppression applies globally or to a specific list
          example: global
        reference:
          type: string
          maxLength: 255
          description: Reference note (e.g., reason for suppression)
          example: hard-bounce
        list_id:
          type: integer
          description: Required when scope is 'list'

    SuppressionBatchCreate:
      type: object
      required:
        - type
        - values
        - scope
        - reference
      properties:
        type:
          type: string
          enum: [email, domain, ip]
          example: email
        values:
          type: array
          items:
            type: string
          maxItems: 1000
          description: List of values to suppress (max 1,000)
          example: ["bounced1@example.com", "bounced2@example.com"]
        scope:
          type: string
          enum: [global, list]
          example: global
        reference:
          type: string
          maxLength: 255
          example: bulk-import
        list_id:
          type: integer

    Suppression:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [email, domain, ip]
          description: Suppression entry type
        list_id:
          type: integer
          description: Associated list ID (0 = global)
        is_global:
          type: boolean
          description: True if this suppression applies globally (list_id = 0)
        value:
          type: string
          description: The suppressed email, domain, or IP range
        reference:
          type: string
          description: Reference label/note
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SuppressionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
