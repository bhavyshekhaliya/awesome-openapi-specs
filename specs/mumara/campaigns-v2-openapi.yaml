  # ============================================
  # GROUPS
  # ============================================
  /groups/{module}:
    get:
      summary: List Groups by Module
      description: |
        Retrieve all groups for a specific module type. Groups provide hierarchical organization for resources.

        **Available modules:** `list`, `sendingNode`, `broadcast`, `customField`
      operationId: v2GetGroups
      tags:
        - Groups
      parameters:
        - name: module
          in: path
          required: true
          description: The module type to retrieve groups for
          schema:
            type: string
            enum: [list, sendingNode, broadcast, customField]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'
        '422':
          description: Invalid module name
    post:
      summary: Create a Group
      description: |
        Create a new group within a module. Optionally nest it under an existing parent group.
      operationId: v2CreateGroup
      tags:
        - Groups
      parameters:
        - name: module
          in: path
          required: true
          description: The module type to create the group in
          schema:
            type: string
            enum: [list, sendingNode, broadcast, customField]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '409':
          description: A group with this name already exists in the module
        '422':
          $ref: '#/components/responses/ValidationError'

  /groups/{module}/{id}:
    get:
      summary: Get a Group
      description: Retrieve a specific group by ID within the given module.
      operationId: v2GetGroup
      tags:
        - Groups
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [list, sendingNode, broadcast, customField]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Group
      description: |
        Update a group's name. Groups the system manages (`is_movable: false`) are
        listed like any other but cannot be renamed or moved: they are refused with
        `403 GROUP_NOT_MOVABLE`.
      operationId: v2UpdateGroup
      tags:
        - Groups
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [list, sendingNode, broadcast, customField]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a Group
      description: |
        Delete a group. Items within the group are moved to the root/default group, not deleted.
        Groups the system manages (`is_movable: false`) cannot be deleted and are refused with `403 GROUP_NOT_MOVABLE`.
      operationId: v2DeleteGroup
      tags:
        - Groups
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [list, sendingNode, broadcast, customField]
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

