          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SendingDomain'
        meta:
          $ref: '#/components/schemas/Meta'

    SendingDomainCreate:
      type: object
      required:
        - domain
      properties:
        domain:
          type: string
          description: Domain name (e.g., example.com or mail.example.com)
          example: mail.example.com
        masking_type:
          type: string
          enum: [cname, htaccess, cloak]
          default: cname
          description: Tracking method. Must be one of the types offered by the administrator (see policy `features.tracking.masking_types`)
        enable_dkim:
          type: boolean
          default: true
          description: Enable DKIM signing (keys are generated immediately). Cannot be `false` when the package forces DKIM
        enable_tracking:
          type: boolean
          default: true
          description: Enable the branded tracking domain. Cannot be `false` when the package forces tracking
        enable_bounce:
          type: boolean
          description: Enable the branded bounce (return-path) domain. Defaults to `true` when the package forces it, else `false`; unavailable when the installation does not verify bounce DNS
        enable_dmarc:
          type: boolean
          description: Track a DMARC record for the domain. Defaults to the administrator's DMARC default
        enable_ssl:
          type: boolean
          description: Serve tracking links over HTTPS. Defaults to `true` when the administrator forces secure tracking URLs — passing `false` in that case is refused with `SSL_FORCED`; `true` is refused with `FEATURE_UNAVAILABLE` when the per-domain switch is not offered
        key_size:
          type: integer
          enum: [512, 1024, 2048, 4096]
          description: DKIM key size in bits (defaults to the application setting)
          example: 2048
        dkim_selector:
          type: string
          description: Custom DKIM selector (DNS label). Only accepted when the administrator allows editing it
          example: key
        tracking_selector:
          type: string
          description: Custom tracking subdomain label. Only accepted when the administrator allows editing it
          example: click
        bounce_selector:
          type: string
          description: Custom bounce subdomain label. Only accepted when the administrator allows editing it
          example: bounce
        user_id:
          type: integer
          description: Admin only — create the domain for this user account

    SendingDomainUpdate:
      type: object
      properties:
        masking_type:
          type: string
          enum: [cname, htaccess, cloak]
        enable_dkim:
          type: boolean
        enable_tracking:
          type: boolean
        enable_bounce:
          type: boolean
        enable_dmarc:
          type: boolean
        enable_ssl:
          type: boolean
        enabled:
          type: boolean
          description: Switch the whole domain on or off (same as `PATCH …/features/status`)
        dkim_selector:
          type: string
          description: Changing it resets DKIM verification
        tracking_selector:
          type: string
          description: Changing it resets tracking verification
        bounce_selector:
          type: string
          description: Changing it resets SPF/MX verification

    SendingDomainDeleteRequest:
