          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendingLogsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # EMAIL SENDING
  # ============================================
  /email/send:
    post:
      summary: Send a Single Email
      description: |
        Send a single transactional email through a configured sending node. This is designed for one-to-one messages such as password resets, order confirmations, or notifications.

        **Requirements:**
        - A verified sending domain matching the `from_email` domain
        - An active sending node specified by `node_id`

        Optionally set `add_contact: true` with a `list_id` to automatically add the recipient to a contact list.
      operationId: v2SendEmail
      tags:
        - Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendRequest'
            example:
              recipient: recipient@example.com
              from_email: noreply@yourdomain.com
              from_name: Acme Corp
              subject: Welcome to Acme Corp
              body: "<html><body><h1>Welcome!</h1><p>Thank you for signing up.</p></body></html>"
              node_id: 1
              reply_to: support@yourdomain.com
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ============================================
  # USERS (Admin Only) & PROFILE
  # ============================================
  /users:
    get:
      summary: List All Users
      description: Retrieve all user accounts. Requires admin-level API key.
      operationId: v2GetUsers
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          description: Filter by account status
          schema:
            type: string
            enum: [active, provisioning, suspended, terminated]
        - name: package_id
          in: query
          description: Filter by assigned package/plan ID
          schema:
            type: integer
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      summary: Create a User
      description: |
        Create a new user account with a specific package/plan. The system automatically creates default groups for the new user. Requires admin privileges.
      operationId: v2CreateUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '409':
          description: Email already in use
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{idOrEmail}:
    get:
      summary: Get a User
      description: Retrieve a user by ID or email address. Requires admin privileges.
      operationId: v2GetUser
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a User
      description: |
        Update a user's non-privileged profile fields. Requires admin privileges.

        > **Note:** Privileged fields (`status`, `package_id`, `password`) cannot be changed via this endpoint. Use the dedicated action endpoints instead:
        > - `POST /users/{id}/suspend` or `/unsuspend` for status changes
        > - `POST /users/{id}/change-package` for package changes
        > - `POST /users/{id}/change-password` for password changes
      operationId: v2UpdateUser
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error or attempted privileged field update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a User
      description: |
        Delete a user account. Supports soft delete (default) or hard delete. The system admin account cannot be deleted. Requires admin privileges.

        - **Soft delete** sets `deleted_at` timestamp — user data is preserved.
        - **Hard delete** sets status to `terminated` and queues a background task to permanently remove all user data.
      operationId: v2DeleteUser
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
        - name: type
          in: query
          description: Deletion type
          schema:
            type: string
            enum: [soft, hard]
            default: soft
      responses:
        '200':
          description: User deleted successfully
        '403':
          description: Admin access required or cannot delete system admin
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{idOrEmail}/suspend:
    post:
      summary: Suspend a User
      description: |
        Suspend a user account. This action:
        - Sets the user's status to `suspended`
        - Pauses every campaign of the user that is not finished (`complete`, `StoppedByPolicy`) or already paused. Scheduled campaigns and recurring (evergreen) parents are included, so nothing starts while the account is suspended. Finished campaigns keep their status.
        - Kills all active sessions and forces logout

        Only users with status `active` or `provisioning` can be suspended.
      operationId: v2SuspendUser
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for suspension (stored and visible to admins)
                  example: Violation of terms of service
      responses:
        '200':
          description: User suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: User is already suspended or has an invalid status for suspension

  /users/{idOrEmail}/unsuspend:
    post:
      summary: Unsuspend a User
      description: |
        Reactivate a suspended user account. Sets status back to `active` and clears the suspension reason.

        Campaigns paused by the suspension stay paused; the user resumes the ones they still want to send.

        Only users with status `suspended` can be unsuspended.
      operationId: v2UnsuspendUser
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      responses:
        '200':
          description: User unsuspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: User is not currently suspended

  /users/{idOrEmail}/change-package:
    post:
      summary: Change User Package
      description: |
        Change a user's assigned package/plan. Updates the user's package and associated role permissions.
      operationId: v2ChangeUserPackage
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - package_id
              properties:
                package_id:
                  type: integer
                  description: ID of the new package to assign (must exist in packages table)
                  example: 3
      responses:
        '200':
          description: Package changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{idOrEmail}/change-password:
    post:
      summary: Change User Password
      description: |
        Change a user's password. All active sessions are killed after the password is changed.
      operationId: v2ChangeUserPassword
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 6
                  maxLength: 255
                  description: New password
                  example: NewSecureP@ss456
                is_hashed:
                  type: boolean
                  description: Set to true if the password is already bcrypt-hashed
                  default: false
      responses:
        '200':
          description: Password changed successfully
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{idOrEmail}/login-link:
    post:
      summary: Create a One-Time Login Link
      description: |
        Create a signed link that logs in as this user, for a billing panel's "Log in as client" button. Requires admin privileges.

        The link:
        - works **once**; opening it again redirects to the login page
        - expires after `expires_in` seconds (default 60, at most 900)
        - is refused if, when it is opened, the account is suspended or no longer active, or the visitor's IP is outside the account's login IPs

        Open `url` directly, or put your own `https://` host in front of `path` when you reach the API through an internal address.

        > **Replaces** `/login-user/{email}?password={hash}&hashed=1`, which took the account's stored password hash as the credential, in the URL. That URL is now refused unless `ALLOW_HASHED_PASSWORD_LOGIN=true` is set in MC's `.env`.
      operationId: v2CreateUserLoginLink
      tags:
        - Users
      parameters:
        - name: idOrEmail
          in: path
          required: true
          description: User ID (integer) or email address
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in:
                  type: integer
                  minimum: 30
                  maximum: 900
                  default: 60
                  description: Seconds until the link expires
                  example: 60
      responses:
        '200':
          description: Login link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginLinkResponse'
        '403':
          description: Admin access required
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The user is not active (`INVALID_STATUS`), or `expires_in` is outside 30–900

  /me:
    get:
      summary: Get Current User Profile
      description: Retrieve the profile of the currently authenticated user. Available to all authenticated users (not admin-only).
      operationId: v2GetCurrentUser
      tags:
        - Users
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update Current User Profile
      description: Update the authenticated user's own profile information (name, password, timezone, address, etc.).
      operationId: v2UpdateCurrentUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully

# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        All V2 API requests require Bearer token authentication.
        Pass your API token in the `Authorization` header:
        ```
        Authorization: Bearer YOUR_API_TOKEN
        ```

  parameters:
    Page:
      name: page
      in: query
      description: Page number (starts at 1)
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Records per page (1–100)
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource ID
      schema:
        type: integer
    AdminUserId:
      name: user_id
      in: query
      description: Admin only — filter results for a specific user ID. Ignored for non-admin tokens.
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required. Provide a Bearer token in the Authorization header.

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: The given data was invalid.
              details:
                email:
                  - The email field is required.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Resource not found

    AdminRequired:
      description: Admin access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: This action requires admin privileges

    Conflict:
      description: Resource conflict (e.g., duplicate entry)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: Resource already exists

    # ---- Sending Domains ----
    SendingDomainForbidden:
      description: |
        The domain cannot be changed by this token: it is the platform sandbox domain (`SANDBOX_DOMAIN`), its ownership verification was reset by an administrator (`OWNERSHIP_REVOKED`), or a non-admin token tried to act on behalf of another user (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: OWNERSHIP_REVOKED
              message: Ownership verification for mail.example.com was reset by an administrator. Contact support to have it reviewed.
              details:
                next_step:
                  action: contact_administrator
                  description: An administrator must re-verify this domain.

    OwnershipRevoked:
      description: Ownership verification was reset by an administrator and cannot be re-verified through the API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: OWNERSHIP_REVOKED
              message: Ownership verification for mail.example.com was reset by an administrator. Contact support to have it reviewed.

    OwnershipVerificationRequired:
      description: Ownership must be proven before this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: OWNERSHIP_VERIFICATION_REQUIRED
              message: Prove ownership of mail.example.com before configuring it.
              details:
                next_step:
                  action: verify_ownership
                  method: POST
                  endpoint: https://app.example.com/api/v2/sending-domains/118/verify-ownership
                  body:
                    method: dns_txt

    OwnershipVerificationFailed:
      description: |
        The ownership record or file could not be confirmed. `details.detail` is one of `not_found`, `value_mismatch`, `lookup_error` (DNS method) or `file_unreachable`, `file_content_mismatch` (file method); `details.url` / `details.http_status` are present for the file method and `details.lookup_error` carries the resolver/HTTP error text when there was one. `details.ownership.methods` repeats both methods so the client can switch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: OWNERSHIP_VERIFICATION_FAILED
              message: Ownership of mail.example.com could not be verified using the DNS TXT method.
              details:
                method: dns_txt
                host: 3f2b9c1a7e.mail.example.com
                expected: 1724500000d41d8cd98f00b204e9800998ecf8427e
                found: null
                found_all: []
                detail: not_found
                dns_lookup_provider: google_doh
                hint: No TXT record was found at that host. If you published it recently, wait for DNS propagation and retry — or use method "file_upload".
                ownership:
                  required: true
                  verified: false
                  state: pending
                  methods:
                    - method: dns_txt
                      recommended: true
                      record:
                        type: TXT
                        host: 3f2b9c1a7e.mail.example.com
                        name: 3f2b9c1a7e.mail
                        value: 1724500000d41d8cd98f00b204e9800998ecf8427e
                        ttl: 3600
                        instructions: Create a TXT record for host 3f2b9c1a7e.mail.example.com with exactly this value.
                    - method: file_upload
                      recommended: false
                      file:
                        file_name: e4d909c290d0fb1ca068ffaddf22cbd0.html
                        content: e4d909c290d0fb1ca068ffaddf22cbd0
                        url: https://mail.example.com/e4d909c290d0fb1ca068ffaddf22cbd0.html
                        instructions: Upload the file so it is publicly readable at this URL; its body must be exactly the content.
                next_step:
                  action: verify_ownership
                  method: POST
                  endpoint: https://app.example.com/api/v2/sending-domains/118/verify-ownership
                  body:
                    method: dns_txt
                  description: Publish the ownership TXT record (or upload the verification file), then call this endpoint. On success every remaining DNS record is returned.

    FeatureForcedByPackage:
      description: |
        The change was refused by policy. Codes: `FEATURE_FORCED_BY_PACKAGE`, `FEATURE_UNAVAILABLE`, `SSL_FORCED`, `DOMAIN_SUSPENDED`, `OWNERSHIP_VERIFICATION_REQUIRED`, `HOOK_ABORT`. (An unknown feature name in the path is a `404`, not a `422`.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forcedByPackage:
              summary: Package forces the feature
              value:
                success: false
                error:
                  code: FEATURE_FORCED_BY_PACKAGE
                  message: "DKIM signing cannot be disabled: your package requires it on every sending domain."
                  details:
                    feature: dkim
                    forced_by: package
                    package_id: 3
                    current:
                      enabled: true
                      status: verified
                    policy_endpoint: https://app.example.com/api/v2/sending-domains/policy
            sslForced:
              summary: Secure tracking URLs are enforced globally
              value:
                success: false
                error:
                  code: SSL_FORCED
                  message: Secure tracking URLs are enforced for every sending domain (Application Settings > Domains > Force secure URLs) and cannot be disabled per domain.
                  details:
                    feature: ssl
                    setting: force_secure_tracking_urls
            hookAbort:
              summary: An add-on blocked the change
              value:
                success: false
                error:
                  code: HOOK_ABORT
                  message: "'mail.example.com' has been suspended by the administrator. Contact support to have it reviewed."
                  details:
                    code: DOMAIN_SUSPENDED
                    hook: beforeSendingDomainFeatureChange

    DkimRegenerateDisabled:
      description: The administrator disabled DKIM key regeneration for users
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DKIM_REGENERATE_DISABLED
              message: Regenerating DKIM keys has been disabled by the administrator (Application Settings > Domains > Disable regenerating the DKIM keys).
              details:
                setting: allow_users_to_regenerate_keys
                current_keys:
                  selector: key
                  host: key._domainkey.mail.example.com
                  status: verified
                  key_size: 2048
                policy_endpoint: https://app.example.com/api/v2/sending-domains/policy

    VerificationCooldown:
      description: Re-verification requested before the administrator's cooldown expired
      headers:
        Retry-After:
          description: Seconds to wait before verifying again
          schema:
            type: integer
            example: 540
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VERIFICATION_COOLDOWN
              message: This domain was checked recently. DNS verification can run again in 9 minutes.
              details:
                retry_after_seconds: 540
                cooldown_minutes: 10
                last_verified_at: '2026-08-24T10:15:00+00:00'
                next_allowed_at: '2026-08-24T10:25:00+00:00'

    DomainInUse:
      description: Other resources still reference the domain; pass `reassign_to_domain_id` to move them
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DOMAIN_IN_USE
              message: mail.example.com is still used by 2 lists, 1 sending nodes. Pass reassign_to_domain_id to move them to another sending domain, or detach them first.
              details:
                connected_assets:
                  lists:
                    - id: 12
                      name: Newsletter
                    - id: 15
                      name: Customers
                  sending_nodes:
                    - id: 3
                      name: Primary SMTP
                hint: 'DELETE the domain again with {"reassign_to_domain_id": <id>} to move these assets.'

    SendingDomainHookAbort:
      description: An add-on blocked the action; `details.code` names its rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: HOOK_ABORT
              message: SMTP server 'haraka-01' is being rebuilt; DKIM keys cannot be regenerated until it finishes (usually a few minutes). Try again shortly.
              details:
                code: SERVER_REBUILD_IN_PROGRESS
                hook: beforeSendingDomainDkimRegenerate

  schemas:
    # ============================================
    # COMMON RESPONSE SCHEMAS
    # ============================================
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object

    Meta:
      type: object
      description: Pagination metadata included with paginated responses
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          description: Total number of records across all pages
        last_page:
          type: integer
        from:
          type: integer
          description: First record number on this page
        to:
          type: integer
          description: Last record number on this page

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'

    BatchDeleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
          maxItems: 100
          description: Array of record IDs to delete (max 100)
          example: [1, 2, 3]

    BatchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            processed:
              type: integer
              description: Total records processed
            created:
              type: integer
              description: Records successfully created
            updated:
              type: integer
              description: Existing records updated
            failed:
              type: integer
              description: Records that failed
            errors:
              type: array
              description: Details for each failed record
              items:
                type: object
                properties:
                  email:
                    type: string
                  error:
                    type: string
        message:
          type: string

    BatchDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            processed:
              type: integer
            deleted:
              type: integer
            failed:
              type: integer
        message:
          type: string

    # ============================================
    # LIST SCHEMAS
    # ============================================
    ListCreate:
      type: object
      required:
        - name
        - owner_name
        - owner_email
        - reply_email
      properties:
        name:
          type: string
          maxLength: 255
