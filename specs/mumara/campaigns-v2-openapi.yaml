          description: The domain is not switched off (`domain_status_code != 0`)
        configuration_confirmed:
          type: boolean
          description: The current configuration has been confirmed via `verify` (a changed selector/feature resets this)
        dkim:
          $ref: '#/components/schemas/SendingDomainDkim'
        tracking:
          $ref: '#/components/schemas/SendingDomainTracking'
        bounce:
          $ref: '#/components/schemas/SendingDomainBounce'
        dmarc:
          $ref: '#/components/schemas/SendingDomainDmarc'
        last_verified_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Last time `verify` ran for this domain (UTC)
        dns_records:
          type: array
          description: Records to publish for the enabled features (empty until ownership is verified). Present on create, show and mutation responses.
          items:
            $ref: '#/components/schemas/DnsRecord'
        files:
          type: array
          description: Tracking files for `htaccess` / `cloak` masking
          items:
            $ref: '#/components/schemas/TrackingFile'
        next_step:
