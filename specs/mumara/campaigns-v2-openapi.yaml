  # ============================================
  # SUPPRESSIONS
  # ============================================
  /suppressions:
    get:
      summary: List All Suppressions
      description: |
        Retrieve suppression list entries. You **must** specify the `type` parameter to indicate which suppression list to query (email, domain, or IP).
      operationId: v2GetSuppressions
      tags:
        - Suppressions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: type
          in: query
          required: true
          description: Type of suppression list to query
          schema:
            type: string
            enum: [email, domain, ip]
        - name: list_id
          in: query
          description: Filter by list ID (for list-scoped suppressions)
          schema:
            type: integer
        - name: reference
          in: query
          description: Filter by reference/label value
          schema:
            type: string
      responses:
        '200':
          description: Suppressions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionsResponse'
    post:
      summary: Create a Suppression
      description: |
        Add a new entry to the suppression list. Suppressed addresses/domains/IPs will not receive any emails.
      operationId: v2CreateSuppression
      tags:
        - Suppressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionCreate'
      responses:
        '201':
          description: Suppression created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '409':
          description: Suppression entry already exists
        '422':
          $ref: '#/components/responses/ValidationError'

  /suppressions/{id}:
    get:
      summary: Get a Suppression
      description: Retrieve a specific suppression entry. The `type` query parameter is required.
      operationId: v2GetSuppression
      tags:
        - Suppressions
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [email, domain, ip]
      responses:
        '200':
          description: Suppression retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a Suppression
      description: Remove a suppression entry, allowing future emails to the address/domain/IP.
      operationId: v2DeleteSuppression
      tags:
        - Suppressions
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [email, domain, ip]
      responses:
        '200':
          description: Suppression deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /suppressions/batch:
    post:
      summary: Batch Create Suppressions
      description: Add multiple suppression entries in a single request (up to 1,000).
      operationId: v2BatchCreateSuppressions
      tags:
        - Suppressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressionBatchCreate'
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Batch Delete Suppressions
      description: Remove multiple suppression entries by ID (up to 1,000). The `type` field is required.
      operationId: v2BatchDeleteSuppressions
      tags:
        - Suppressions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - ids
              properties:
                type:
                  type: string
                  enum: [email, domain, ip]
                ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 1000
      responses:
        '200':
          description: Suppressions deleted successfully

  # ============================================
  # CUSTOM FIELDS
  # ============================================
  /custom-fields:
    get:
      summary: List All Custom Fields
      description: Retrieve all custom fields. Optionally filter by field type.
      operationId: v2GetCustomFields
      tags:
        - Custom Fields
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/AdminUserId'
        - name: list_id
          in: query
          description: Filter by associated list ID
          schema:
            type: integer
      responses:
        '200':
          description: Custom fields retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldsResponse'
    post:
      summary: Create a Custom Field
      description: |
        Create a new custom field and automatically associate it with the specified list. The field's merge tag is auto-generated from the name.

        For `select`, `checkbox`, and `radio` types, provide the `options` array.
      operationId: v2CreateCustomField
      tags:
        - Custom Fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldCreate'
      responses:
        '201':
          description: Custom field created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /custom-fields/{id}:
    get:
      summary: Get a Custom Field
      description: Retrieve a specific custom field by ID.
      operationId: v2GetCustomField
      tags:
        - Custom Fields
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Custom field retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a Custom Field
      description: |
        Update a custom field's options or settings. Field name and type cannot be changed
        after creation, and the default fields that ship with the product are refused with
        `403 FIELD_IS_DEFAULT`.
      operationId: v2UpdateCustomField
      tags:
        - Custom Fields
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldUpdate'
      responses:
        '200':
          description: Custom field updated successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a Custom Field
      description: |
        Delete a custom field. If the field has associated subscriber data, pass `force: true` to confirm deletion. Without `force`, the API returns an error if data exists.
        The default fields that ship with the product cannot be deleted and are refused with `403 FIELD_IS_DEFAULT`.
      operationId: v2DeleteCustomField
      tags:
        - Custom Fields
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: force
          in: query
          description: Force deletion even if subscriber data exists
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Custom field deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Field has associated data—use force=true to confirm

  /custom-fields/add-to-list:
    post:
      summary: Link Custom Field to a List
      description: |
        Associate an existing custom field with a list by providing both IDs in the request body. This is an alternative to `POST /lists/{listId}/custom-fields` for when you prefer to pass the list ID in the body rather than the URL.
      operationId: v2LinkCustomFieldToList
      tags:
        - Custom Fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - custom_field_id
                - list_id
              properties:
                custom_field_id:
                  type: integer
                  description: ID of the custom field to link
                  example: 5
                list_id:
                  type: integer
                  description: ID of the list to link the field to
                  example: 1
      responses:
        '200':
          description: Custom field linked to list successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Custom field or list not found
        '409':
          description: Custom field is already linked to this list
        '422':
          $ref: '#/components/responses/ValidationError'

  /lists/{listId}/custom-fields:
    get:
      summary: Get Custom Fields for a List
      description: Retrieve all custom fields associated with a specific list.
      operationId: v2GetListCustomFields
      tags:
        - Custom Fields
      parameters:
        - name: listId
          in: path
          required: true
          description: ID of the list
          schema:
            type: integer
      responses:
        '200':
          description: Custom fields retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldsResponse'
        '404':
          description: List not found
    post:
      summary: Add Custom Field to a List
      description: Associate an existing custom field with a list. This allows contacts in the list to have values for this field.
      operationId: v2AddCustomFieldToList
      tags:
        - Custom Fields
      parameters:
        - name: listId
          in: path
          required: true
          description: ID of the list
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - custom_field_id
              properties:
                custom_field_id:
                  type: integer
                  description: ID of the custom field to associate
      responses:
        '200':
          description: Custom field added to list successfully
        '404':
          description: List or custom field not found

