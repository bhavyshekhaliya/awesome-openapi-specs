              type: string
            status:
              type: string
              description: Broadcast delivery status
            total_scheduled:
              type: integer
              description: Total emails scheduled for delivery
            sent:
              type: integer
              description: Total emails sent
            delivered:
              type: object
              properties:
                count:
                  type: integer
                  description: Sent minus bounced
                rate:
                  type: number
                  format: float
                  description: Delivered rate as a percentage of sent
            opened:
              type: object
              properties:
                count:
                  type: integer
                  description: Unique opens
                rate:
                  type: number
                  format: float
                  description: Open rate as a percentage
            clicked:
              type: object
              properties:
                count:
                  type: integer
                  description: Unique clicks
                rate:
                  type: number
                  format: float
                  description: Click rate as a percentage
            ctr:
              type: number
              format: float
              description: Click-to-open rate (clicks / opens * 100)
            bounced:
              type: object
              properties:
                count:
                  type: integer
                  description: Total bounced emails
                rate:
                  type: number
                  format: float
                  description: Bounce rate as a percentage
            unsubscribed:
              type: object
              properties:
