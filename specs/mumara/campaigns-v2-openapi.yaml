                  type: integer
                  description: Recipients who unsubscribed
                rate:
                  type: number
                  format: float
                  description: Unsubscribe rate as a percentage
            tracking:
              type: object
              properties:
                opens_enabled:
                  type: boolean
                  description: Whether open tracking was enabled for this broadcast
                clicks_enabled:
                  type: boolean
                  description: Whether click tracking was enabled for this broadcast
            timing:
              type: object
              properties:
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When sending started
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When sending completed
            created_at:
              type: string
              format: date-time

