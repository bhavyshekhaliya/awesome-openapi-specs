      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                count_per_hour:
                - _id:
                    day: 5
                    month: 8
                    year: 2023
                    hour: 10
                  count: 1
                - _id:
                    day: 6
                    month: 8
                    year: 2023
                    hour: 10
                  count: 3
                - _id:
                    day: 7
                    month: 8
                    year: 2023
                    hour: 9
                  count: 1
