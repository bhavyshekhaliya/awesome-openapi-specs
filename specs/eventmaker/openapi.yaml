                    <updated-at type="dateTime">2023-08-08T08:08:00Z</updated-at>
                    <created-at type="dateTime">2023-08-08T08:08:00Z</created-at>
                    <access-status type="integer">1</access-status>
                  </access-control>
                </access-control>
        '422':
          description: error
          content:
            application/json:
              example:
                error: You need to submit an array to batch create.
        '200':
          description: empty array
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access_controls:
                  type: array
                  items:
                    "$ref": "#/components/schemas/AccessControl"
              example:
                access_controls:
                - access_stamp: '2015-02-27 13:13:20 +0000'
                  accesspoint_id: 64d1f7e07d1cfb25c8b49365
                  guest_uid: i98urvkvd9
                  uid: nhWVwgCJrY
                - access_stamp: '2015-02-27 13:13:20 +0000'
                  accesspoint_id: 64d1f7e07d1cfb25c8b49365
                  guest_uid: i98urvkvd9
                  uid: dvwatOMd1i
  "/api/v1/events/{event_id}/access_controls/count.{format}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: count access_control
      security:
      - auth_token: []
      parameters:
      - name: format
        in: path
        schema:
          type: string
          enum:
          - json
          - xml
        required: true
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2023-08-08T00:00:00+02:00'
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: 2023-08-07 08:08:00 UTC
      tags:
      - Access control
      responses:
        '200':
          description: with invalid dates
          content:
            application/json:
              example:
                count: 1
                error: 'Invalid date. Example date: 2023-08-08'
  "/api/v1/events/{event_id}/access_controls/count_per_hour.{format}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: count_per_hour access_control
      security:
      - auth_token: []
