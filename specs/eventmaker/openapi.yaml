                uid: CUMR0IW
                updated_at: '2023-08-08T08:08:00.000Z'
                created_at: '2023-08-08T08:08:00.000Z'
            application/xml:
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <access-control type="array">
                  <access-control>
                    <_id>64d1f7e07d1cfb25c8b49375nhWVwgCJrY</_id>
                    <access-type>physical</access-type>
                    <guest-data>
                    </guest-data>
                    <deleted-at nil="true"/>
                    <guest-uid>i98urvkvd9</guest-uid>
                    <accesspoint-id>64d1f7e07d1cfb25c8b4939e</accesspoint-id>
