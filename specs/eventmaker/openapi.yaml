        in: path
        schema:
          type: string
          enum:
          - json
          - xml
        required: true
      - name: page
        in: query
        required: false
        schema:
          type: integer
          example: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          example: 500
      - name: since
        in: query
        required: false
        schema:
          type: integer
          format: unix-timestamp
          example: 1675843680
      - name: before
        in: query
        required: false
        schema:
          type: integer
          format: unix-timestamp
          example: 1691482140
      - name: guest_uid
        in: query
        required: false
        schema:
          type: string
          example: UXVLTE
      - name: guests
        in: query
        required: false
        schema:
          type: boolean
          example: true
      - name: access_status[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - 0
      - name: accesspoint_ids[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - 64d1f7e07d1cfb25c8b49ac1
      - name: access_type
