                    <created-at type="dateTime">2023-08-08T08:08:00Z</created-at>
                    <access-status type="integer">1</access-status>
                  </access-control>
                  <access-control>
                    <_id>64d1f7e07d1cfb25c8b49375dvwatOMd1i</_id>
                    <access-type>physical</access-type>
                    <guest-data>
                    </guest-data>
                    <deleted-at nil="true"/>
                    <guest-uid>i98urvkvd9</guest-uid>
                    <accesspoint-id>64d1f7e07d1cfb25c8b4939e</accesspoint-id>
                    <access-stamp type="dateTime">2015-02-27T13:13:20Z</access-stamp>
