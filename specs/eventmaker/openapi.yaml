---
openapi: 3.0.3
info:
  title: Eventmaker
  version: API v1
  description: '`WARNING`: every request made by **"Try it out"** will affect production
    database.'
consumes:
- application/json
produces:
- application/json
- application/xml
paths:
  "/api/v1/events/{event_id}/access_controls/changes.{format}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: string
    - name: since
      in: query
      required: true
      schema:
        type: string
        format: date-time
    get:
      summary: changes access_control
      security:
      - auth_token: []
      parameters:
      - name: format
        in: path
        schema:
          type: string
          enum:
          - json
          - xml
        required: true
      tags:
      - Access control
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                since: 1691481960
                created:
                - _id: 64d1f7e07d1cfb25c8b49297ILJMZSY
                  access_type: physical
                  guest_data: {}
                  deleted_at: 
                  guest_uid: new
                  access_status: 1
                  sync_later: false
                  accesspoint_id: 64d1f7e07d1cfb25c8b492c0
                  event_id: 64d1f7e07d1cfb25c8b49297
                  created_at: '2023-08-08T08:07:00.000Z'
                  updated_at: '2023-08-08T08:08:00.000Z'
                  object_id: 64d1f7e07d1cfb25c8b492c8
                  uid: ILJMZSY
                  access_stamp: '2023-08-08T08:08:00.000Z'
                updated: []
                deleted: []
            application/xml:
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <changes>
                  <since type="integer">1691481960</since>
                  <created type="array">
                    <created>
                      <_id>64d1f7e07d1cfb25c8b491841DZZGDW</_id>
                      <access-type>physical</access-type>
                      <guest-data>
                      </guest-data>
                      <deleted-at nil="true"/>
                      <guest-uid>toto</guest-uid>
                      <access-status type="integer">1</access-status>
                      <sync-later type="boolean">false</sync-later>
                      <accesspoint-id>64d1f7e07d1cfb25c8b491ad</accesspoint-id>
                      <event-id>64d1f7e07d1cfb25c8b49184</event-id>
                      <created-at type="dateTime">2023-08-08T08:07:00Z</created-at>
                      <updated-at type="dateTime">2023-08-08T08:07:00Z</updated-at>
                      <object-id>64d1f7e07d1cfb25c8b491b5</object-id>
                      <uid>1DZZGDW</uid>
                      <access-stamp type="dateTime">2023-08-08T08:08:00Z</access-stamp>
                    </created>
                  </created>
                  <updated type="array"/>
                  <deleted type="array"/>
                </changes>
        '400':
          description: error
          content:
            application/json:
              example:
                error: You must pass either a strictly positive integer (Unix timestamp)
                  or an ISO 8601 string formatted as yyyy-MM-ddTHH:mm:ssZ for the
                  query string parameter 'since' and 'before'
  "/api/v1/events/{event_id}/access_controls/batch_create.{format}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: batch_create access_control
      security:
      - auth_token: []
      parameters:
