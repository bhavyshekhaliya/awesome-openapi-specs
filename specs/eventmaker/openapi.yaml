  "/api/v1/events/{event_id}/guests/statistics.{format}":
    parameters:
    - name: event_id
      in: path
      required: true
      schema:
        type: string
    - name: stat_types
      in: query
      schema:
        type: string
    - name: date
      in: query
      required: false
      schema:
        type: string
    - name: field
      in: query
      required: false
      schema:
        type: string
    get:
      summary: Statistics Guest
      tags:
      - Guest
      security:
      - auth_token: []
      parameters:
      - name: format
        in: path
        schema:
          type: string
          enum:
          - json
          - xml
        required: true
      - name: cumulative
        in: query
        required: false
        schema:
          type: boolean
          example: 'true'
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - _id: 67c51be77d1cfb25c8b4f39c
                count: 6
                new_visits: 2
                returning: 1
              - _id: 67c51be77d1cfb25c8b4f394
                count: 3
                new_visits: 1
                returning: 2
        '422':
          description: error
          content:
            application/json:
              example:
                error: Event has too many days for cumulative statistics
