  /message/send:
    post:
      tags:
        - Messages
      summary: Send a message
      operationId: post_message_send
      description: 'Documented in the official Ontraport API reference: Send a message.'
      requestBody:
        required: false
        description: Parameters should be sent in the request body as a JSON-encoded string.
        content:
          application/json:
            schema:
              type: object
              properties:
                objectID:
                  type: integer
                  description: The object type ID of the records to send to. Required . The default is
                    0 for contact objects.
                criteria:
                  type: object
                  additionalProperties: true
                  description: 'Determines which records receive the message. Use one targeting mode:
                    ids , or group_id with performAll .'
                criteria.ids:
                  type: array
                  items: {}
                  description: An array of the IDs of the records to send the message to. When ids are
                    provided, the send is scoped to exactly those records and performAll is not needed.
                criteria.group_id:
                  type: integer
                  description: The group id of records to send to, used in conjunction with performAll
                    set to 1 . A group_id of 0 sends to every record of the object type, so be sure group_id
                    has a non-zero value unless you deliberately want to message your entire collection.
                criteria.performAll:
                  type: integer
                  description: A binary integer flag to be used in conjunction with group_id . A value
                    of 1 indicates that the message should be sent to all members of the group.
                message:
                  type: object
                  additionalProperties: true
                  description: The message to send. Required . Either the ID of a saved message or ad
                    hoc message content.
                message.id:
                  type: integer
                  description: The ID of the saved message to send. message_id is also accepted as an
                    alias.
                message.type:
                  type: string
                  description: The message type, e.g. e-mail or sms .
                message.number:
                  type: integer
                  description: The ID of the SMS number in your account to send from. Required when message.type
                    is sms .
                message.*:
                  description: To send ad hoc content instead of a saved message, omit id and instead
                    include content fields. For email these are subject , from , send_from , send_out_name
                    , reply_to_email , message_body , and transactional_email . For SMS they are plaintext
                    and send_to . See the message object for field details.
              additionalProperties: true
      responses:
        '200':
          description: Successful JSON response. The `data` payload shape depends on the endpoint and
            Ontraport object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntraportResponse'
