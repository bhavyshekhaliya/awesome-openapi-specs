        required: true
        description: The endpoint section does not select a media type. Ontraport’s general API guide
          permits JSON and URL-encoded bodies for POST and PUT requests.
        content:
          application/json:
            schema: &id001
              type: object
              properties:
                objectID:
                  type: integer
                  description: The object type ID.
                section:
                  type: string
                  description: The name of the Section.
                field:
                  type: array
                  items: {}
                  description: The name of the field e.g. f1234
              additionalProperties: true
              required:
                - objectID
          application/x-www-form-urlencoded:
            schema: *id001
      responses:
        '200':
