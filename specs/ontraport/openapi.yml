                  type: integer
                  description: The ID of the contact for whom a transaction should be created.
                chargeNow:
                  type: string
                  description: Whether a transaction should be charged or simply logged. Should be set
                    to "chargeNow". Whether a transaction should be charged or simply logged. Should be
                    set to "chargeLog".
                external_order_id:
                  type: string
                  description: Optional external order id that you can save within the generated transaction
                trans_date:
                  type: integer
                  description: The time of the transaction represented in milliseconds since the Unix
                    Epoch.
                invoice_template:
                  type: integer
                  description: The ID of the invoice template to use for this transaction. The default
                    invoice ID is 1. The ID of the invoice template to use for this transaction. The default
                    invoice ID is 1. If you would like to suppress the sending of invoices for logged
                    transactions, this parameter should be set to -1.
                gateway_id:
                  type: integer
                  description: The ID of the gateway to use for this transaction. Note that this is the
                    ID of the gateway object itself and not the external_id of the gateway. A transaction
                    can't succeed without a valid gateway.
                cc_id:
                  type: integer
                  description: The ID of the credit card to charge for this transaction. Note that this
                    is only required if the request does not contain billing_address and payer and the
                    default credit card is not desired.
                create_open_order_on_decline:
                  type: string
                  description: For open orders, whether we create an open order if there's a today charge
                    which declines. Optional Defaults to true .
                offer:
                  type: object
                  additionalProperties: true
                  description: 'The product and pricing offer for the transaction. Required . Array keys
                    may include: products => array[Product] taxes => array[Tax] shipping => array[Shipping]
                    coupon => Coupon delay => integer subTotal => number grandTotal => number hasTaxes
                    => boolean hasShipping => boolean shipping_charge_recurring_orders => boolean ccExpirationDate
                    => string currency_code => string The product and pricing offer for the transaction.
                    Required . Array keys must include: products => array[Product]'
                billing_address:
                  type: object
                  additionalProperties: true
                  description: 'The complete billing address information for this transaction. Only required
                    if not already on file for this contact. Array keys may include: address => string
                    address2 => string city => string state => string zip => string country => string'
                payer:
                  type: object
                  additionalProperties: true
                  description: "The credit card information for this transaction. Only required if not\
                    \ already on file for this contact. Array keys may include: pci_card_token => string\
                    \ ( recommended â\x80\x94 from the tokenization flow ; carries number, code, and expiry)\
                    \ pci_cvc_token => string (fresh security code for a saved card) ccnumber => string\
                    \ cctoken => Token code => string expire_month => integer expire_year => integer"
                customer_note:
                  type: string
                  description: Customer facing note
                internal_note:
                  type: string
                  description: Internal facing note
              additionalProperties: true
              required:
                - contact_id
                - chargeNow
                - invoice_template
                - gateway_id
      responses:
        '200':
          description: Successful JSON response. The `data` payload shape depends on the endpoint and
            Ontraport object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntraportResponse'
