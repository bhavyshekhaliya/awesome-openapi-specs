components:
  securitySchemes:
    OntraportApiKey:
      type: apiKey
      in: header
      name: Api-Key
    OntraportAppId:
      type: apiKey
      in: header
      name: Api-Appid
  schemas:
    OntraportResponse:
      type: object
      description: Standard successful response described in the Ontraport API reference. The shape of
        `data` varies by operation.
      properties:
        code:
          type: integer
          description: Provider result code; 0 indicates a successful HTTP 200 call.
        data:
          description: Operation-specific result. The reference describes it as the object-specific returned
            data.
        account_id:
          type: integer
          description: ID of the account making the request.
      additionalProperties: true
