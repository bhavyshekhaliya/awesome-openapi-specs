  /objects/saveorupdate:
    post:
      tags:
        - Objects
      summary: Create or merge an object
      operationId: post_objects_saveorupdate
      description: 'Documented in the official Ontraport API reference: Create or merge an object.'
      requestBody:
        required: true
        description: Parameters should be sent in the request body as a URL-encoded string.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                objectID:
                  type: integer
                  description: The object type ID.
                ignore_blanks:
                  type: boolean
                  description: 'Whether or not blank strings should be ignored upon update. Defaults to
                    false: blank strings passed to this endpoint will overwrite existing value. This option
                    will not ignore 0''s or boolean false.'
                unique_id:
                  type: string
                  description: A unique identifier for the object (only ORM objects have a unique_id field).
                    This field is system generated and can't be updated. If a unique_id is sent that matches
                    an object in the account, that object's data will be updated. This field will take
                    precedence over other unique fields.
              additionalProperties: true
              required:
                - objectID
      responses:
        '200':
          description: Successful JSON response. The `data` payload shape depends on the endpoint and
            Ontraport object.
          content:
            application/json:
              schema:
