      tags:
        - Objects
      summary: Create an object
      operationId: post_objects
      description: 'Documented in the official Ontraport API reference: Create an object.'
      requestBody:
        required: true
        description: Parameters should be sent in the request body as a JSON-encoded string.
        content:
          application/json:
            schema:
              type: object
              properties:
                objectID:
                  type: integer
                  description: The object type ID.
              additionalProperties: true
              required:
                - objectID
      responses:
        '200':
          description: Successful JSON response. The `data` payload shape depends on the endpoint and
            Ontraport object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntraportResponse'
    get:
      tags:
        - Objects
      summary: Retrieve multiple objects
      operationId: get_objects
      description: 'Documented in the official Ontraport API reference: Retrieve multiple objects.'
      parameters:
        - name: objectID
          in: query
          required: true
          description: The object type ID.
          schema:
            type: integer
            description: The object type ID.
        - name: ids
          in: query
          required: false
          description: An integer array as a comma-delimited list of the IDs of the objects to retrieve.
            Entering a value of 0 will result in all objects of specified type being selected.
          schema:
            type: string
            description: An integer array as a comma-delimited list of the IDs of the objects to retrieve.
              Entering a value of 0 will result in all objects of specified type being selected.
        - name: start
          in: query
          required: false
          description: The offset to start your search from.
          schema:
            type: integer
            description: The offset to start your search from.
        - name: range
          in: query
          required: false
          description: The number of objects you want to retrieve. The maximum and default range is 50.
          schema:
            type: integer
            description: The number of objects you want to retrieve. The maximum and default range is
              50.
        - name: sort
          in: query
          required: false
          description: The field results should be sorted on.
          schema:
            type: string
            description: The field results should be sorted on.
        - name: sortDir
          in: query
          required: false
          description: The direction your results should be sorted. Your options are asc and desc . This
            field must be used in conjunction with the sort parameter.
          schema:
            type: string
            description: The direction your results should be sorted. Your options are asc and desc .
              This field must be used in conjunction with the sort parameter.
        - name: condition
          in: query
          required: false
          description: A JSON encoded string to more specifically set criteria for which objects to bring
            back. For example, to check that a field equals a certain value. See criteria examples for
            more details.
          schema:
            type: string
            description: A JSON encoded string to more specifically set criteria for which objects to
              bring back. For example, to check that a field equals a certain value. See criteria examples
              for more details.
        - name: search
          in: query
          required: false
          description: A string to search your objects for.
          schema:
            type: string
            description: A string to search your objects for.
        - name: searchNotes
          in: query
          required: false
          description: A boolean flag used in conjunction with the search parameter to indicate whether
            or not object notes should be searched for the specified string in addition to other object
            fields.
          schema:
            type: boolean
            description: A boolean flag used in conjunction with the search parameter to indicate whether
              or not object notes should be searched for the specified string in addition to other object
              fields.
        - name: group_id
          in: query
          required: false
          description: The group id of objects to act upon. If set to a non-zero value, performAll should
            be set to 1.
          schema:
            type: integer
            description: The group id of objects to act upon. If set to a non-zero value, performAll should
              be set to 1.
        - name: performAll
          in: query
          required: false
          description: A binary integer flag to be used in conjunction with group_id . A value of 1 indicates
            that specified action should be performed on all members of a group. Be sure that group_id
            has a non-zero value when using this parameter unless you want to affect all objects in a
            collection.
          schema:
            type: integer
            description: A binary integer flag to be used in conjunction with group_id . A value of 1
              indicates that specified action should be performed on all members of a group. Be sure that
              group_id has a non-zero value when using this parameter unless you want to affect all objects
              in a collection.
        - name: externs
          in: query
          required: false
          description: If you have a relationship between your object and another object, you may want
            to include the data from a related field in your results. Each external field is listed in
            the format {object}//{field} . Multiple fields are separated by commas.
          schema:
            type: string
            description: If you have a relationship between your object and another object, you may want
              to include the data from a related field in your results. Each external field is listed
              in the format {object}//{field} . Multiple fields are separated by commas.
        - name: listFields
          in: query
          required: false
          description: A string array as a comma-delimited list of the fields which should be returned
            in your results.
          schema:
            type: string
            description: A string array as a comma-delimited list of the fields which should be returned
              in your results.
        - name: user_readable
          in: query
          required: false
          description: A string that allows you to select between user readable info with 'CSV' and raw
            data with 'RAW'.
          schema:
            type: string
            description: A string that allows you to select between user readable info with 'CSV' and
              raw data with 'RAW'.
        - name: count
          in: query
          required: false
          description: A boolean flag indicating whether to retrieve collection count alongside collection
            data.
          schema:
            type: boolean
            description: A boolean flag indicating whether to retrieve collection count alongside collection
              data.
      responses:
        '200':
          description: Successful JSON response. The `data` payload shape depends on the endpoint and
            Ontraport object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntraportResponse'
