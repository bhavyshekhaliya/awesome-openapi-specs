  /CalendarEvents:
    post:
      tags:
        - Calendar
      summary: Create a calendar event object
      operationId: post_CalendarEvents
      description: 'Documented in the official Ontraport API reference: Create a calendar event object.'
      requestBody:
        required: false
        description: Parameters should be sent in the request body as a URL-encoded string.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                location:
                  type: string
                  description: The event location.
                title:
                  type: string
                  description: The event title.
                start_time:
                  oneOf:
                    - type: string
                    - type: integer
                  description: The UNIX timestamp of the event's start time. If the event is recurring,
                    this represents the start time of the first event in the series.
                end_time:
                  oneOf:
                    - type: string
                    - type: integer
                  description: The UNIX timestamp of the event's end time. If the event is recurring,
                    this represents the end time of the first event in the series.
                description:
                  type: string
                  description: A description of the event.
                duration:
                  type: integer
                  description: The length of the event, in seconds.
                repeat_every_count:
                  type: integer
                  description: For recurring events, given a frequency like weekly, the interval the event
                    should repeat. For example, 1 for every week, 3 for every third week.
                repeat_every_frequency:
                  type: integer
                  description: 'How often a recurring event should repeat. Integer codes are mapped as
                    follows: 0 => Yearly 1 => Monthly 2 => Weekly 3 => Daily . Ontraport does not support
                    finer granularity than daily.'
                repeat_monthly_modifier:
                  type: integer
                  description: 'For monthly recurring events, an indicator of what type of monthly repeat.
                    Repeats can be based on the ordinal day of the month (e.g. the 5th of every month)
                    or a specific day of the week (e.g. the 3rd Tuesday). Integer codes are mapped as
                    follows: 0 => Repeat on a specific ordinal day of the month 1 => Repeat on a specific
                    day of the week'
                repeat_on_days:
                  oneOf:
                    - type: integer
                    - type: string
                  description: For a recurring event, either a comma-separated list of the the day(s)
                    of the week (for weekly recurring events or monthly recurring events on a particular
                    day of the week) or the day number of the month (for monthly recurring events on a
                    particular day of the month).
                repeat_end_type:
                  type: integer
                  description: 'The indicator for when a recurring event should end. Integer codes are
                    mapped as follows: 0 => Never 1 => After a number of recurrences 2 => On a specific
                    date .'
                repeat_end_date:
                  oneOf:
                    - type: string
                    - type: integer
                  description: If the repeat_end_type is on a specific date, the UNIX timestamp for the
                    date the recurring event should end.
                repeat_end_modifier:
                  type: integer
                  description: If the repeat_end_type is after a certain number of recurrences, the number
                    of occurrences.
                is_recurring:
                  type: integer
                  description: A binary integer flag indicating whether or not the event is recurring.
                is_repeat_custom:
                  type: integer
                  description: A binary integer flag indicating whether or not this event contains custom
                    recurrence settings.
                is_all_day:
                  type: integer
                  description: A binary integer flag indicating whether or not this event lasts all day.
                staff_id:
                  type: integer
                  description: The user ID for the owner of this event.
                type_id:
                  type: integer
                  description: The event type ID for this event.
                event_template:
                  type: integer
                  description: The template ID for this event.
                calendar_id:
