openapi: 3.1.0
info:
  title: Ontraport API
  version: '1'
  description: Community-maintained OpenAPI specification derived from Ontraport's current public API
    reference. It covers the documented endpoints with a resolvable provider host. Custom object fields
    and available values are account-specific; use metadata endpoints to inspect them. The provider's
    general API reference describes JSON responses and the `Api-Key` and `Api-Appid` headers.
servers:
  - url: https://api.ontraport.com/1
    description: Production
security:
  - OntraportApiKey: []
    OntraportAppId: []
tags:
  - name: Calendar
  - name: CalendarEventTypes
  - name: CalendarTemplates
  - name: Channel
  - name: Channels
  - name: Commission
  - name: Commissions
  - name: Contacts
  - name: Conversations
  - name: Credit Cards
  - name: Forms
  - name: Groups
  - name: Inbox
  - name: Inboxes
  - name: Invoices
  - name: Landing Pages
  - name: Messages
  - name: Objects
  - name: Offers
  - name: Orders
  - name: Products
  - name: PurchaseHistoryLog
  - name: Purchases
  - name: Rules
  - name: SpamConversation
  - name: SpamConversations
  - name: Tags
  - name: Transactions
  - name: Webhooks
  - name: getBlocksByFormName
paths:
  /objects:
