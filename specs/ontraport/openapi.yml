            schema:
              type: object
              properties:
                objectID:
                  type: integer
                  description: The object type ID.
                name:
                  type: string
                  description: The name of the Section.
                fields:
                  type: array
                  items: {}
                  description: 'An array of columns containing fields containing arrays of field objects
                    . Required . Example of how these are nested: [[{field1}],[{field2}],[{field3}]]'
              additionalProperties: true
              required:
                - objectID
