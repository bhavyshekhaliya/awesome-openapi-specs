    put:
      tags:
        - Messages
      summary: Update a message
      operationId: put_message
      description: 'Documented in the official Ontraport API reference: Update a message.'
      requestBody:
        required: true
        description: Parameters should be sent in the request body as a URL-encoded string.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: The message ID.
                alias:
                  type: string
                  description: The message name.
                type:
                  type: string
                  description: 'The message type. Types names map as follows: e-mail => legacy email template
                    => ONTRAmail sms => text message task => task messages Postcard messages can be retrieved
                    but not created through the API.'
                transactional_email:
                  type: integer
                  description: "A binary integer flag indicating whether or not this message is transactional\
                    \ email. Values are mapped as follows: 0 => false 1 => true Transactional email is\
                    \ NOT marketing email. It is email that delivers a product, an invoice, a request\
                    \ for payment for a purchase already made, or other messaging having to do with an\
                    \ existing client relationship. It is not to promote new stuff to an existing client.\
                    \ When you set this flag to 1, the email will be sent even if a contact has already\
                    \ unsubscribed. Because of this, if you send it to someone who isnâ\x80\x99t a client\
                    \ and who has unsubscribed, you will be breaking CAN-SPAM and other anti-spam laws.\
                    \ This is your responsibility. In addition, Ontraport can and will suspend your account\
                    \ should we discover marketing messages in emails that you have marked as Transactional\
                    \ Emails."
                subject:
                  type: string
                  description: The email subject line.
                object_type_id:
                  type: integer
                  description: The ID of the object type associated with the message. The default is 0
                    for contact objects. This field should only be changed if you are using custom objects.
                from:
                  type: string
                  description: Who the message will be sent from. Options are owner , custom , or the
                    desired user ID.
                send_out_name:
                  type: string
                  description: If the from field is set to custom , the name the message should come from.
                reply_to_email:
                  type: string
                  description: The "reply to" email address.
                plaintext:
                  type: string
                  description: For email messages, the plain text version of your email. For SMS messages,
                    the content to be sent.
                send_from:
                  type: string
                  description: Emails are automatically sent from your default email address. If you would
                    like to send from another email address, this field can contain any validated email
                    address.
                send_to:
                  type: string
                  description: Used only with custom objects and SMS messages. In custom objects, you
                    can use this field to send to another email in a parent/child relationship. For example,
                    you could send to a related child object instead of the contact's default email address.
                    The field is stored in the format {related_field}//{child_field} , where related_field
                    is the parent field relating one object to another and child_field is the actual email
                    field in the related object you would like to send to. For SMS messages, this field
                    defaults to sms_number .
                message_body:
                  type: string
                  description: For legacy emails only; the HTML content of the message.
                resource:
                  type: string
                  description: For ONTRAmail messages only; the content of the message. Note that this
                    can be extremely complex, so you should start by inspecting the resource that is sent
                    when saving a message from inside the app. For SMS messages, use the plaintext field
                    for content.
                task_data:
                  type: string
                  description: For task messages only; the content of the message.
                due_date:
                  type: string
                  description: For task messages only; the number of days after assignment the task will
                    be due.
                task_owner:
                  type: integer
                  description: The ID of the staff user having ownership of the task.
                task_form:
                  type: integer
                  description: The ID of the form to be filled out upon task completion. The form must
                    already exist and cannot be created with this endpoint.
              additionalProperties: true
              required:
                - id
