            found.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
            - type: array
              items:
                type: string
                minLength: 1
                maxLength: 500
              minItems: 1
              maxItems: 10
          example:
            - travel photographer
            - landscape photography
        keywords:
          description: >-
            Full-text search within post captions (Instagram/TikTok caption
            text, YouTube title/description). Provide a single phrase, or up to
            10 phrases; a profile matches if any phrase is found.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 500
