        locations:
          description: >-
            Filter by locations (use <a target="_blank"
            href="/products/discovery_api/openapi_doc/discovery/instagram/instagramcontroller_locations">Locations
            dictionary endpoint</a> to get the location IDs)
          minItems: 1
          maxItems: 100
          type: array
          items:
            type: number
        gender:
          type: string
          description: Filter by gender; KNOWN -> male or female, UNKNOWN -> gender neutral
          enum:
            - MALE
            - FEMALE
            - KNOWN
            - UNKNOWN
        lastPostedInDays:
          type: number
          description: >-
            Filter by influencers with latest post date, in days. P.S. we update
            profiles every 4 weeks and this lag should be considered when using
            this field.
          example: 90
        accountType:
          type: string
          description: >-
            Filter by account type. 'creator' is a backwards-compatible alias
            for 'individual_creator' and 'group_creator'. 'individual_creator' -
            a single identifiable person is clearly the face and voice;
            'group_creator' - two or more identifiable individuals as co-equal
            faces; 'brand' - a business, organization, media entity, or
            professional service portfolio; 'anonymous_content' - no
            identifiable person or organization, curated/aggregated/themed
            content.
          enum:
            - creator
            - individual_creator
            - group_creator
            - brand
            - anonymous_content
        language:
          type: string
          description: >-
