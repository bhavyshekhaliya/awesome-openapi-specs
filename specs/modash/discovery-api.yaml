      type: object
      properties:
        page:
          type: number
          description: >-
            Page number (0-indexed). The offset is calculated as page *
            pageSize, so changing pageSize between pages will shift the window
            and may cause duplicate or missed results. The total number of
            results that can be accessed is limited to 1500 — that is, (page +
            1) * pageSize must not exceed 1500. Requests beyond this limit will
            receive a 400 error.
          default: 0
          minimum: 0
        pageSize:
          type: number
          description: >-
            Number of results per page. Each result costs 0.025 credits. The
            maximum total depth of results (page * pageSize + pageSize) is 1500.
            For example, with pageSize 50 you can paginate up to page 29.
          default: 6
          minimum: 1
          maximum: 50
        filters:
          description: Additional filters to refine the search results
          example:
            followersCount:
              min: 13000
            gender: FEMALE
            lastPostedInDays: 90
            accountType: creator
            language: en
            age:
              min: '18'
            engagementRate:
              min: 0.04
            postingFrequency:
              min: 4
              max: 20
            viewsCount:
              min: 10000
              calculationMethod: median
            followersGrowthRate:
              interval: i3months
              min: 0.05
            hasEmail: true
            maxPostAgeMonths: 3
          allOf:
            - $ref: '#/components/schemas/BaseAiSearchFilters'
        query:
          type: string
          description: >-
            Natural-language text describing the creator and/or the type of
            content. Use this for querying **content semantics** (what appears
            in photos and videos).


            **Negation is not supported** - do not rely on "no", "not",
            "without", or "exclude" to remove topics.


            Queries may be in any language, but different languages may yield
            different results; English usually yields the strongest matches.


            Limit: 8192 characters or 512 words. If omitted, results are sorted
            by follower count.
          example: >-
            Sporty stay at home mom sharing kids gut health tips and family
            wellness
          minLength: 1
          maxLength: 8192
        autoQueryOptimization:
          description: >-
            Optimize `query` before searching. Pass a boolean to turn every
            optimization on or off, or an object to turn single optimizations on
            or off.
          oneOf:
            - type: boolean
            - type: object
              properties:
                autoDetectFilters:
                  type: boolean
                  description: >-
                    Detect terms in the query that match a filter (e.g.
                    location, age), automatically apply them as filters and
                    remove them from the query text. The response includes
                    `detectedFilters` and `effectiveQuery` when this changes the
                    search. Filters you pass in `filters` always win over
                    detected ones.
              additionalProperties: false
          example:
            autoDetectFilters: true
