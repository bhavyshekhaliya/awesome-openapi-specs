        - result
    TextTagsDictionaryResult:
      type: object
      properties:
        value:
          type: string
          description: 'The hashtag or mention value (without # or @ prefix)'
        count:
          type: number
          description: Number of posts containing this value
      required:
        - value
        - count
    TextTagsDictionaryResponse:
      type: object
      properties:
        error:
          type: boolean
          description: If there is an error
          example: false
        result:
          description: Top results sorted by popularity
          type: array
          items:
            $ref: '#/components/schemas/TextTagsDictionaryResult'
      required:
        - result
    CreateAiSearchListRequest:
      type: object
      properties:
        name:
          type: string
          description: List name
          example: Partnered creators July 2026
          minLength: 1
          maxLength: 255
        platform:
          type: string
          description: Platform for list members. Immutable after create.
          enum:
            - instagram
            - tiktok
            - youtube
          example: instagram
      required:
        - name
        - platform
    AiSearchListSummary:
      type: object
      properties:
        listId:
          type: string
          example: a1b2c3d4e5f6789012345678abcdef01
        name:
          type: string
          example: Partnered creators July 2026
        platform:
          type: string
          enum:
            - instagram
            - tiktok
            - youtube
          example: instagram
        approximateMemberCount:
          type: number
          description: >-
            Fast approximate size of the list. Kept approximate so metadata
            requests stay cheap under concurrent writes. For an exact count,
            paginate through `GET /ai/lists/{listId}/members` and sum the
            returned IDs.
          example: 102
        createdAt:
          type: string
          example: '2026-07-23T08:00:00.000Z'
        updatedAt:
          type: string
          example: '2026-07-23T08:05:00.000Z'
      required:
        - listId
        - name
        - platform
        - approximateMemberCount
        - createdAt
        - updatedAt
    AiSearchListErrorResponse:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: List not found
        code:
          type: string
          description: >-
            Stable machine-readable code when present (`LIST_LIMIT_EXCEEDED`,
            `LIST_SIZE_LIMIT_EXCEEDED`). Prefer `code` over `message` for error
            handling.
          example: LIST_LIMIT_EXCEEDED
      required:
        - error
        - message
    GetAiSearchListsResponse:
      type: object
      properties:
        lists:
          type: array
          items:
            $ref: '#/components/schemas/AiSearchListSummary'
        nextCursor:
          type: string
          description: Pass as `cursor` on the next request when more lists remain
      required:
        - lists
    GetAiSearchListMembersResponse:
      type: object
      properties:
        listId:
          type: string
          example: a1b2c3d4e5f6789012345678abcdef01
        influencerIds:
          example:
            - '123'
            - '456'
          type: array
          items:
            type: string
        nextCursor:
          type: string
          description: Pass as `cursor` on the next request when more members remain
      required:
        - listId
        - influencerIds
    AiSearchListMembersRequest:
      type: object
      properties:
        influencerIds:
          description: >-
            Platform user IDs only (Instagram/TikTok digits, YouTube UC… channel
            IDs). Usernames, handles, and URLs are rejected. Max 10,000 unique
            IDs per request.
          minItems: 1
          maxItems: 10000
          example:
            - '123'
            - '456'
          type: array
          items:
            type: string
      required:
        - influencerIds
    AddAiSearchListMembersResponse:
      type: object
      properties:
        addedCount:
          type: number
          example: 2
        existingCount:
          type: number
          example: 0
        approximateMemberCount:
          type: number
          description: >-
            Fast approximate size after the write. For an exact count, paginate
            through `GET /ai/lists/{listId}/members`.
          example: 102
      required:
        - addedCount
        - existingCount
        - approximateMemberCount
    RemoveAiSearchListMembersResponse:
      type: object
      properties:
        removedCount:
          type: number
          example: 2
        missingCount:
          type: number
          example: 0
        approximateMemberCount:
          type: number
          description: >-
            Fast approximate size after the write. For an exact count, paginate
            through `GET /ai/lists/{listId}/members`.
          example: 100
      required:
        - removedCount
        - missingCount
        - approximateMemberCount
security:
  - accessToken: []
