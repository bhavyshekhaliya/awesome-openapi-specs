            equal to this value
        lte:
          type: number
          description: >-
            Filter posts by creation timestamp in milliseconds less than or
            equal to this value
    CollaborationsPostsRequest:
      type: object
      properties:
        id:
          type: string
          description: >-
            User ID / Username / Profile URL, User ID is preferred. For brand
            collaborations, you can also use the brand ID from <a
            target="_blank"
            href="/products/discovery_api/openapi_doc/discovery/ai-search/aisearchcontroller_brandsdictionary">Brand
            Dictionary endpoint</a>, in which case we will return collaborations
            for all accounts associated with the brand.
          example: cristiano
        platform:
          type: string
          enum:
            - instagram
            - tiktok
            - youtube
          example: instagram
        collaboratorId:
          type: string
          description: >-
            If provided, only returns the collaboration posts between the
            specified influencer and brand. You can also use the brand ID from
            <a target="_blank"
            href="/products/discovery_api/openapi_doc/discovery/ai-search/aisearchcontroller_brandsdictionary">Brand
            Dictionary endpoint</a>, if you want to get collaborations between
            influencer X (filtered by `id`) and all accounts associated with the
            brand Y (filtered by `collaboratorId`).
        postCreationTimestampMs:
          description: Filter the posts by creation timestamp in milliseconds
          example:
            gte: 1716835200000
          allOf:
            - $ref: '#/components/schemas/PostCreationTimestampMs'
        cursor:
          type: string
          description: Cursor for pagination (only valid for 2 days)
          example: ''
        limit:
          type: number
          description: Number of collaboration posts per page
          minimum: 1
          maximum: 30
          default: 30
          example: 10
        groupBrandCollaborations:
          type: boolean
          default: true
          description: >-
            If true, brand collaborations will be grouped across all platforms.
            This provides insights about the brand across all its social
            accounts.


            For example: if you request brand collaborations for @cocacola on
            Instagram, you will get posts sponsored by Coca Cola on all three
            platforms (Instagram, Tiktok and Youtube).


            In some cases, this may group regional or variant accounts (e.g.,
            @cocacola_uk, @cocacola_us) when they represent the same brand
            identity. Set this flag to false if social media account-specific
            insights are needed.


            For better grouping, retrieve the brand ID from <a target="_blank"
            href="/products/discovery_api/openapi_doc/discovery/ai-search/aisearchcontroller_brandsdictionary">Brand
            Dictionary endpoint</a> and use it instead of user ID of a specific
            social media account.
      required:
        - id
        - platform
    CollaborationsPostStats:
      type: object
      properties:
        likes:
          type: number
          description: Likes
          example: 123
        comments:
          type: number
          description: Comments
          example: 12
        likes_and_views_counts_enabled:
          type: boolean
          description: Likes and views counts enabled
          example: true
        likes_count_enabled:
          type: boolean
          description: Likes count enabled
          example: true
        plays:
          type: number
          description: Plays
          example: 123
        views:
