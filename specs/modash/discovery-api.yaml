    AiSearchFiltersFollowers:
      type: object
      properties:
        min:
          type: number
          description: >-
            Minimum followers count. Number will be approximated to the nearest
            range lower or equal to the given number. Ranges are: 1000, 3000,
            5000, 10000, 15000, 20000, 25000, 35000, 50000, 75000, 100000,
            125000, 150000, 175000, 200000, 250000, 300000, 350000, 500000,
            1000000, 2000000, 3000000.
        max:
          type: number
          description: >-
            Maximum followers count. Number will be approximated to the nearest
            range higher or equal to the given number. Ranges are: 1000, 3000,
            5000, 10000, 15000, 20000, 25000, 35000, 50000, 75000, 100000,
            125000, 150000, 175000, 200000, 250000, 300000, 350000, 500000,
            1000000, 2000000, 3000000.
    AiSearchFiltersAge:
      type: object
      properties:
        min:
          type: string
          description: Minimum age range
          enum:
            - '13'
            - '18'
            - '25'
            - '35'
            - '45'
            - '65'
        max:
          type: string
          description: Maximum age range
          enum:
            - '18'
            - '25'
            - '35'
            - '45'
            - '65'
    AiSearchFiltersEngagementRate:
      type: object
      properties:
        min:
          type: number
          description: Minimum engagement rate (in percentage, 0.01 = 1%)
          example: 0.01
    AiSearchFiltersPostingFrequency:
      type: object
      properties:
        min:
          type: number
          description: Minimum average posts per 30-day month
          example: 4
        max:
          type: number
          description: Maximum average posts per 30-day month
          example: 20
    AiSearchFiltersViews:
      type: object
      properties:
        min:
          type: number
          description: >-
            Minimum average per-post view count. Number will be approximated to
            the nearest range lower or equal to the given number. Ranges are:
            1000, 3000, 5000, 10000, 15000, 20000, 25000, 35000, 50000, 75000,
            100000, 125000, 150000, 175000, 200000, 250000, 300000, 350000,
            500000, 1000000, 2000000, 3000000.
        max:
          type: number
          description: >-
            Maximum average per-post view count. Number will be approximated to
            the nearest range higher or equal to the given number. Ranges are:
            1000, 3000, 5000, 10000, 15000, 20000, 25000, 35000, 50000, 75000,
            100000, 125000, 150000, 175000, 200000, 250000, 300000, 350000,
            500000, 1000000, 2000000, 3000000.
        calculationMethod:
          type: string
          description: >-
            Whether to filter on median or mean per-post view count (from
            in-house post_views_stats over the last 60 days).
          enum:
            - median
            - average
          default: median
    AiSearchFiltersFollowersGrowthRate:
      type: object
      properties:
        interval:
          type: string
          description: >-
            Growth window to filter and report on. Defaults to the trailing six
            months.
          enum:
            - i1month
            - i2months
            - i3months
            - i4months
            - i5months
            - i6months
          default: i6months
        min:
          type: number
          description: >-
            Minimum followers growth rate over the interval, as a decimal
            fraction (0.05 = 5% growth). Negative values match shrinking
            accounts.
          example: 0.05
        max:
          type: number
          description: >-
            Maximum followers growth rate over the interval, as a decimal
            fraction (0.05 = 5% growth). Negative values match shrinking
            accounts.
          example: 0.5
    AiSearchTextTag:
      type: object
      properties:
        type:
          type: string
          description: Type of text tag
          enum:
            - hashtag
            - mention
        value:
          type: string
          description: 'Value of the text tag (without # or @ prefix)'
          example: carsofinstagram
        mode:
          type: string
          description: >-
            Whether to include or exclude posts with this tag. Defaults to
            include.
          enum:
            - include
            - exclude
          default: include
      required:
        - type
        - value
    AiSearchListsFilter:
      type: object
      properties:
        listIds:
          description: >-
            AI Search list IDs (from POST /ai/lists). Currently exactly one list
            ID is supported for include/exclude; support for multiple lists is
            in the works.
          minItems: 1
          maxItems: 1
          example:
            - a1b2c3d4e5f6789012345678abcdef01
          type: array
          items:
            type: string
        mode:
          type: string
          description: 'include: profiles in the list; exclude: profiles not in the list'
