      description: >-
        Return metadata for the caller's AI Search lists.<br><br>Does not
        consume credits.
      parameters:
        - name: limit
          required: false
          in: query
          description: Page size
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: Pagination cursor from a previous response (`nextCursor`)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAiSearchListsResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
  /ai/lists/{listId}:
    get:
      operationId: AISearchListsController_getList
      summary: Get AI Search list metadata
      description: >-
        Return strongly consistent metadata for a list you own.<br><br>Does not
        consume credits.
      parameters:
        - name: listId
          required: true
          in: path
          description: List id (32-char hex)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListSummary'
        '404':
          description: List not found, already deleted, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
    delete:
      operationId: AISearchListsController_deleteList
      summary: Delete AI Search list
      description: Hard-delete a list and its members.<br><br>Does not consume credits.
      parameters:
        - name: listId
          required: true
          in: path
          description: List id (32-char hex)
          schema:
            type: string
      responses:
        '204':
          description: ''
        '404':
          description: List not found, already deleted, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
  /ai/lists/{listId}/members:
    get:
      operationId: AISearchListsController_getMembers
      summary: List AI Search list members
      description: >-
        Paginated platform user IDs in the list. Use this when you need an exact
        member set or exact count (sum pages); `approximateMemberCount` on
        metadata is only a fast estimate. Default page size 1000, max 5000.
        Eventually consistent: concurrent adds/removes while you paginate may
        cause missed members or resurfaced deletes.<br><br>Does not consume
        credits.
      parameters:
        - name: listId
          required: true
          in: path
          description: List id (32-char hex)
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Page size
          schema:
            minimum: 1
            maximum: 5000
            default: 1000
            type: number
        - name: cursor
          required: false
          in: query
          description: Pagination cursor from a previous response (`nextCursor`)
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAiSearchListMembersResponse'
        '404':
          description: List not found, already deleted, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
    post:
      operationId: AISearchListsController_addMembers
      summary: Add members to an AI Search list
      description: >-
        Add members by platform user ID only (no usernames). Existing members
        are no-ops. Max 10,000 unique IDs per request; max 70,000 members per
        list.<br><br>Does not consume credits.
      parameters:
        - name: listId
          required: true
          in: path
          description: List id (32-char hex)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchListMembersRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddAiSearchListMembersResponse'
        '404':
          description: List not found, already deleted, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
        '409':
          description: '`LIST_SIZE_LIMIT_EXCEEDED` — list would exceed 70,000 members'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
    delete:
      operationId: AISearchListsController_removeMembers
      summary: Remove members from an AI Search list
      description: >-
        Remove members by platform user ID only. Missing members are no-ops. Max
        10,000 unique IDs per request.<br><br>Does not consume credits.
      parameters:
        - name: listId
          required: true
          in: path
          description: List id (32-char hex)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSearchListMembersRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAiSearchListMembersResponse'
        '404':
          description: List not found, already deleted, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListErrorResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
info:
  title: Modash Discovery API
  description: "Discovery API provides powerful products for different use cases. Let us provide a brief overview:\n\nSearch allows you to build comprehensive search experience to find creators. Use filters, lookalikes and our dictionaries and lists to create stunning user interfaces.\n\nReports provide in depth analytics that include audience demographics, performance metrics, sponsored posts and much more.\n\nOur collaborations products enable you to create overviews of past brand partnerships between creators and brands.\n\nThere is more: Search by Email allows you to lookup which creator accounts are associated with an emails and audience overlap identifies the uniqueness of an audience with ease.\n\n# Testing the API\n\n## Search\n\nYou can test out the [Instagram Search API](#tag/Instagram/paths/~1instagram~1search/post) for free by leaving the filter object empty. Your request body should look similar to this.\n\n```\n> POST https://api.modash.io/v1/instagram/search\n{\n\t\"sort\": {\n\t\t\"field\": \"followers\",\n\t\t\"direction\": \"desc\"\n\t},\n\t\"filter\": {\n\t}\n}\n```\n\n## Reports\n\nTo test out the [Instagram Reports API](#tag/Instagram/paths/~1instagram~1profile~1{userId}~1report/get) for free you can set the `userId` as `instagram`.\nYour request should look like this.\n\n```\n> GET https://api.modash.io/v1/instagram/profile/instagram/report\n```\n\nWe recommend always using the report route and caching the result if necessary. Everything that is included in the overview is also in a report.\n\n# Pagination\n\nWhen using the Search API, each response has in total 15 influencers. If you wish to query more influencers for the same query you need to increment the `page` parameter in the request body.\n\nBy default the `page` parameter is set to `0`.\n\n# Dictionaries\n\n## Interests, Locations and brands\n\nWhen finding influencers by interests, locations or brands you need to search by their respective ID. To list all interests, locations or brands you need to call the `https://api.modash.io/v1/instagram/interests`, `https://api.modash.io/v1/instagram/locations`, `https://api.modash.io/v1/instagram/brands` route.\n\nYou can specify the list of interests, locations or brands returned by using the `query` parameter and limit the amount of list items returned by using the `limit` parameter.\n\nBy default the `limit` parameter is set to `20`. You can query all list items by setting the `limit` parameter to `1000000`.\n\n## Languages\n\nSimilar to interests, locations and brands, you first need to find the correct language code to search by. This can be done by calling the `https://api.modash.io/v1/instagram/languages` route.\n"
  version: "1"
  contact:
    name: API Support
    url: https://www.modash.io
    email: hello@modash.io
  termsOfService: https://www.modash.io/legal/terms-of-service
tags:
  - name: YouTube
    description: API for receiving data about YouTube influencers
  - name: TikTok
    description: API for receiving data about TikTok influencers
  - name: Instagram
    description: API for receiving data about Instagram influencers
  - name: AI Search
    description: >-
      AI Search allows you to discover creators using natural language or image
      queries. Under the hood, it uses vector similarity search to find profiles
      and content that most closely match the concepts in your prompt. You can
      also combine these AI queries seamlessly with standard filters.


      When to use it: This endpoint is ideal when your criteria go beyond basic
      metrics. Use it instead of regular Search when you require rich context
      about a creator's personal identity and niche, or when trying to match a
      specific visual style.

      Choose regular search endpoints when the workflow is mainly filter-based
      without needing semantic search over post content.


      AI Search is limited to creators with more than 10,000 followers.


      Available to Discovery API users.
  - name: Collaborations
    description: >-
      These endpoints return posts or summaries for the collaborations between
      influencers and brands. These APIs can help you monitor partnerships,
      analyze campaign performance, track competitor activity, and power
      influencer discovery or reporting tools at scale.
  - name: User Account
    description: API for Modash user account management
  - name: System
    description: System endpoints for service health and monitoring
servers:
  - url: https://api.modash.io/v1
components:
  securitySchemes:
    accessToken:
      scheme: bearer
      bearerFormat: token
      description: 'Please enter token in following format: Bearer \<APIToken\>'
      type: http
  schemas:
    HealthDetail:
      type: object
      properties:
        endpoint:
          type: string
          description: Endpoint path
        status:
          type: string
          description: Endpoint status
      required:
        - endpoint
        - status
    Health:
      type: object
      properties:
        status:
          type: string
          description: >-
            API health status:<br/><ul><li>`healthy` indicates that the system
            is operating normally.</li><li>`degraded` indicates a moderate level
            of failures or slow responses in one or more
            endpoints.</li><li>`unhealthy` indicates a high level of failures or
            significant performance issues in one or more endpoints.</li></ul>
          example: healthy
          enum:
            - healthy
            - degraded
            - unhealthy
        details:
          description: Health details by endpoint
          example:
            - endpoint: email-search
              status: healthy
          type: array
          items:
            $ref: '#/components/schemas/HealthDetail'
      required:
        - status
        - details
    InstagramSort:
      type: object
      properties:
        field:
          type: string
          example: followers
          default: followers
          description: "Note: The following sort options are available only when the corresponding filter is applied: `keywords` `audienceGeo` `audienceLang` `audienceGender` `audienceAge` `audienceInterest` `followersGrowth`. <br />\n\t\tSorting field in which order you want to get the results."
          enum:
            - engagements
            - followers
            - engagementRate
            - keywords
            - audienceGeo
            - audienceLang
            - audienceGender
            - audienceAge
            - audienceRelevance
            - relevance
            - followersGrowth
            - audienceInterest
            - reelsPlays
        value:
          type: number
          example: 123
          description: >-
            Only required for ```audienceGeo``` and ```audienceInterest```
            sorting.
        direction:
          type: string
          example: desc
          default: desc
          description: Sorting direction
          enum:
            - asc
            - desc
      required:
        - field
    FollowersCount:
      type: object
      properties:
        min:
          type: number
          example: 20000
          description: Minimum follower count.
        max:
          type: number
          example: 70000
          description: Maximum follower count.
    InfluencerAgeRange:
      type: object
      properties:
        min:
          type: number
          example: 18
          description: Minimum influencer age.
          enum:
            - 18
            - 25
            - 35
            - 45
            - 65
        max:
          type: number
          example: 25
          description: Maximum influencer age.
          enum:
            - 18
            - 25
            - 35
            - 45
            - 65
    GrowthFilter:
      type: object
      properties:
        interval:
          type: string
          description: Specifies the interval of time in which growth occurred.
          enum:
            - i1month
            - i2months
            - i3months
            - i4months
            - i5months
            - i6months
          example: i1month
        value:
          type: number
          description: Weight of growth rate.
          example: 0.4
        operator:
          type: string
          description: Operator used for comparison.
          example: gt
          enum:
            - gte
            - gt
            - lt
            - lte
      required:
        - interval
        - operator
    ContactFilter:
      type: object
      properties:
        contactType:
          type: string
          example: email
          enum:
            - bbm
            - email
            - facebook
            - instagram
            - itunes
            - kakao
            - kik
            - lineid
            - linktree
            - pinterest
            - sarahah
            - sayat
            - skype
            - snapchat
            - tiktok
            - tumblr
            - twitchtv
            - twitter
            - vk
            - wechat
            - youtube
          description: Specifies the contact channels of an influencer.
        filterAction:
          type: string
          example: must
          enum:
            - must
            - should
            - not
          default: must
          description: >-
            Defines condition enforced by the filter - "must" include, "should"
            include, or must "not" include.
      required:
        - contactType
    TextTag:
      type: object
      properties:
        type:
          type: string
          enum:
            - hashtag
            - mention
          description: The type of the tag.
        value:
          type: string
          description: The hashtag or mention without `@` or `#` in front of it.
      required:
        - type
        - value
    ReelsPlaysCount:
      type: object
      properties:
        min:
          type: number
          example: 20000
          description: Minimum reels plays count.
        max:
          type: number
          example: 50000000
          description: Maximum reels plays count.
    EngagementsCount:
      type: object
      properties:
        min:
          type: number
          example: 5000
          description: Minimum engagements count (this value will be rounded).
        max:
          type: number
          example: 10000
          description: Maximum engagements count (this value will be rounded).
    InstagramFilterOperations:
      type: object
      properties:
        operator:
          type: string
          description: >-
            Logical operations used to combine filters.<br><i>Note: To use the
            `or` operator, you must apply it to at least two filters.</i>
          enum:
            - and
            - or
            - not
        filter:
          type: string
          description: >-
            Filter to apply the operation on. If `keywords` or `relevance` are
            specified then you can not sort by these fields.
          enum:
            - followers
            - engagements
            - engagementRate
            - lastposted
            - bio
            - keywords
            - relevance
            - language
            - gender
            - age
            - location
            - isVerified
            - interests
            - brands
            - accountTypes
            - hasSponsoredPosts
            - textTags
      required:
        - operator
        - filter
    InstagramSearchInfluencerFilters:
      type: object
      properties:
        followers:
          example:
            min: 20000
            max: 70000
          description: >-
            We round followers value in the filter: whenever it's below 5k, we
            round it to the nearest thousand (4123 -> 4000; 4800-> 5000); when
            it's over 5k, we round it to the nearest 5,000 (27k -> 25k; 28k ->
            30k).
          allOf:
            - $ref: '#/components/schemas/FollowersCount'
        engagementRate:
          type: number
          description: Minimum engagement rate.
          maximum: 1
          minimum: 0
          example: 0.02
        location:
          example:
            - 148838
            - 62149
            - 80500
            - 1428125
            - 304716
          description: >-
            Filter by Influencer Location, You can get the locations with our
            locations api end point and send location ids in an array.
          maxItems: 20
          type: array
          items:
            type: number
        language:
          type: string
          example: en
          description: >-
            Filter by Influencer Language, You can get the languages code with
            our languages api end point.
          minLength: 1
          maxLength: 3
        lastposted:
          type: number
          example: 90
          description: >-
            Idenitfy influencers based on when they last posted. The number
            represents days and should be >= 30.
          minimum: 30
        relevance:
          example:
            - '#cars'
            - '@topgear'
          description: >-
            Filter by topic of influencers posts or by similarity of topic to
            other influencer. For example "#cars #audi @topgear" means "Writing
            about #cars and #audi, has similar topic as @topgear account."
            <strong>You can only enter 100 usernames.</strong>
          type: array
          items:
            type: string
        audienceRelevance:
          example:
            - '@topgear'
          description: >-
            Filter by similarity of influencer's audience to another
            influencer's audience. For example "@topgear" means "Has audience
            similar to @topgear account." Audience similarity means followers
            follow accounts with the same topics as those followed by @topgear's
            audience.
          type: array
          items:
            type: string
        gender:
          type: string
          example: MALE
          description: Filter by Influencer gender.
          enum:
            - MALE
            - FEMALE
            - KNOWN
            - UNKNOWN
        age:
          description: >-
            Filter by Influencer age, possible values are: 18, 25, 35, 45, 65.
            You have the option to utilize either the `min` field, the `max`
            field, or both concurrently. <strong>Any number that falls outside
            the accepted range will be disregarded.</strong>
          allOf:
            - $ref: '#/components/schemas/InfluencerAgeRange'
        followersGrowthRate:
          description: Growth rate by followers over a period of time.
          example:
            interval: i6months
            value: 0.01
            operator: gt
          allOf:
            - $ref: '#/components/schemas/GrowthFilter'
        bio:
          type: string
          example: photos videos
          description: Search influencer by their bio description and/or full name
        hasAudienceData:
          type: boolean
          description: >-
            Filter by whether the influencer has audience data available. If
            true, shows only accounts with audience data. If false, shows all
            accounts including those without audience data. If not specified,
            defaults to true.
        hasYouTube:
          type: boolean
          example: false
          description: If Influencer has a youtube channel.
        hasContactDetails:
          description: If Influencer has contact details.
          type: array
          items:
            $ref: '#/components/schemas/ContactFilter'
        accountTypes:
          example:
            - 2
          description: >-
            Identify influencers by their Instagram account type: Regular = 1,
            Business = 2, Creator = 3. E.g to find business accounts use: 2
          type: array
          items:
            type: number
        brands:
          example:
            - 1708
            - 13
          description: >-
            Filter by Influencer Brands, You can get the array of brands with
            our brands API endpoint and send brand ids in an array.
          type: array
          items:
            type: number
        interests:
          example:
            - 3
            - 21
            - 1
            - 13
            - 11
            - 1708
            - 7
            - 1826
          description: >-
            Filter by Influencer Interests, You can get the array of interests
            with our interests api end point and send interests ids in an array.
          type: array
          items:
            type: number
        keywords:
          type: string
          description: >-
            Identify influencers by a phrase they use within the caption of
            their post.
          example: supercars
        textTags:
          example:
            - type: hashtag
              value: carsofinstagram
            - type: mention
              value: topgear
          maxItems: 20
          description: >-
            Filter by influencers who have used the defined hashtags or mentions
            in their posts.
          type: array
          items:
            $ref: '#/components/schemas/TextTag'
        reelsPlays:
          description: >-
            We round reels plays value in the filter to the nearest thousand
            (1400 -> 1k; 1500-> 2k)
          allOf:
            - $ref: '#/components/schemas/ReelsPlaysCount'
        isVerified:
          type: boolean
          description: Set to `true` to filter by verified influencers.
        hasSponsoredPosts:
          type: boolean
          description: >-
            Set to `true` to filter by influencers who have sponsored posts. We
            identify sponsored posts by looking for commercial hashtags or the
            official paid partnership tag.
        engagements:
          description: >-
            Filter by engagements count. <i>Pro tip: set `max` to 0 if you want
            to see results with hidden likes.</i>
          allOf:
            - $ref: '#/components/schemas/EngagementsCount'
        filterOperations:
          description: >-
            Modify filter operation to use `and`, `or`, or `not`. Example:
            Search for <i>influencer using the keyword *cars* AND `not` from the
            London</i> or <i>Female `or` interested in Beauty &
            Cosmetics</i>.<br><i>If no operator is specified, the default
            operator applied is the `and` operator.</i>
          type: array
          items:
            $ref: '#/components/schemas/InstagramFilterOperations'
    LocationWeightedFilter:
      type: object
      properties:
        weight:
          type: number
          description: Weight of filter.
          maximum: 1
          minimum: 0
          example: 0.4
        id:
          type: number
