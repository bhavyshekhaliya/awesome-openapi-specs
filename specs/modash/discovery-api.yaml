          allOf:
            - $ref: '#/components/schemas/BaseAiSearchFilters'
        effectiveQuery:
          type: string
          description: >-
            Query text used for semantic matching after detected filter terms
            were removed. Empty when the query contained only filters.
      required:
        - total
        - profiles
