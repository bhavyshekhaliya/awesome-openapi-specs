  /ai/lists:
    post:
      operationId: AISearchListsController_createList
      summary: Create AI Search list
      description: >-
        Create an empty list for include/exclude filtering in AI Search.
        Platform is immutable after create. Each account can have up to 20,000
        active lists. If you have a reasonable need for a higher limit, reach
        out to our Success team.<br><br>Does not consume credits.
