      description: >-
        Get a list of brands that match the search query. Results from this
        endpoint are only valid for AI Search filters. Just like other
        dictionary endpoints, this endpoints costs nothing and there are no
        strict rate limits.
      parameters:
        - name: query
          required: false
          in: query
          description: Fuzzy search based on brand's name
          schema:
            minLength: 1
            maxLength: 255
            example: coca cola
            type: string
        - name: domain
          required: false
          in: query
          description: Exact match based on brand's domain
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: platform
          required: false
          in: query
          description: Platform (specify if you want to filter the results by platform)
          schema:
            example: instagram
            enum:
              - instagram
              - tiktok
              - youtube
            type: string
        - name: userId
          required: false
          in: query
          description: >-
            Exact match based on brand's user ID (Instagram,Tiktok,Youtube) or
            domain
          schema:
            minLength: 1
            maxLength: 255
            type: string
        - name: brandId
          required: false
          in: query
          description: Exact match based on brand ID (brand identity hash)
          schema:
            minLength: 1
            maxLength: 255
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandsDictionaryResponse'
      tags:
        - AI Search
      security:
        - accessToken: []
