        fullName:
          type: string
          description: Full name
          example: Instagram
        username:
          type: string
          description: Username
          example: instagram
        profilePicture:
          type: string
          description: Profile Picture
          example: >-
            https://imgigp.modash.io/22159423_1794482210565499_9190891265074397184_n.jpg
        followersCount:
          type: number
          description: Followers count
          example: 313560626
