        fullName:
          type: string
          description: Full name
          example: Instagram
        username:
          type: string
          description: Username
          example: instagram
        profilePicture:
          type: string
          description: Profile Picture
          example: >-
            https://imgigp.modash.io/22159423_1794482210565499_9190891265074397184_n.jpg
        followersCount:
          type: number
          description: Followers count
          example: 313560626
        engagementRate:
          type: number
          description: Engagement rate as a percentage (0.71 = 0.71%)
          example: 0.71
        postingFrequency:
          type: number
          description: Average posts per 30-day month
          example: 12
        viewsCountMedian:
          type: number
          description: Median per-post view count over the last 60 days
          example: 25000
        viewsCountMean:
          type: number
          description: Mean per-post view count over the last 60 days
          example: 32000
        followersGrowthRate:
          type: number
          description: >-
            Followers growth rate over the interval requested through the
            followersGrowthRate filter, as a decimal fraction (0.05 = 5%
            growth). Defaults to the trailing six months when the filter is not
            used, and is omitted when no growth rate is available for that
            interval.
          example: 0.05
        matchedPosts:
          description: Posts ordered by relevance to the search query
          type: array
          items:
            $ref: '#/components/schemas/TTAiSearchPost'
        recentPosts:
          description: >-
            Recent posts (not necessarily relevant to the search query). P.S. we
            update profiles every 4 weeks and this lag should be considered when
            using this field.
          type: array
          items:
            $ref: '#/components/schemas/TTAiSearchPost'
        accountCategory:
          type: string
          description: Account category
          example: Sportsperson / Digital creator etc.
      required:
        - username
        - profilePicture
        - followersCount
        - engagementRate
        - postingFrequency
        - matchedPosts
        - recentPosts
        - accountCategory
    TTAiSearchResponse:
      type: object
      properties:
        error:
          type: boolean
          description: If there is an error
          example: false
        total:
          type: number
          description: >-
            Approximate number of profiles matching the search query. This is
            estimated from similarity score distribution and can exceed how many
            profiles pagination can actually return.
        profiles:
          description: List of influencer profiles matching the search query and filters
          type: array
          items:
            $ref: '#/components/schemas/TTAiSearchProfile'
        detectedFilters:
          description: >-
            Filters detected from the query and applied to this search. Omitted
