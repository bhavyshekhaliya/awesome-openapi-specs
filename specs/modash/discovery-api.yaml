            - '64'
        weight:
          type: number
          description: Weight of audience age range.
          minimum: 0
          maximum: 1
          example: 0.3
    InterestsWeightedFilter:
      type: object
      properties:
        weight:
          type: number
          description: Weight of filter.
          maximum: 1
          minimum: 0
          example: 0.4
        id:
          type: number
          description: Filter value id for interests (e.g. 1708)
      required:
        - id
    InstagramSearchAudienceFilters:
      type: object
      properties:
        location:
          example:
            - id: 148838
              weight: 0.2
            - id: 62149
              weight: 0.2
            - id: 80500
              weight: 0.2
            - id: 1428125
              weight: 0.2
            - id: 304716
              weight: 0.2
          description: >-
            Filter by Audience Location, You can get the locations with our
            locations api end point and send location ids in an array together
            with their weight percentages. The default percentage is set to 20%
            (0.2)
          type: array
          items:
            $ref: '#/components/schemas/LocationWeightedFilter'
        language:
          example:
            id: en
            weight: 0.2
          description: >-
            Filter by Audience Language, You can get the languages code with our
            languages api end point and send the location id within an object,
            together with the weight percentage. The default percentage is set
            to 20% (0.2)
          allOf:
            - $ref: '#/components/schemas/LanguageWeightedFilter'
        gender:
          example:
            id: MALE
            weight: 0.5
          description: >-
            Filter by gender specific Audience, You can send the gender together
            with the weight percentage. The default percentage is set to 50%
            (0.5)
          allOf:
            - $ref: '#/components/schemas/GenderWeightedFilter'
        age:
          example:
            - id: 18-24
              weight: 0.3
            - id: 65-
              weight: 0.3
          description: >-
            Filter by Audience age. You can send the age together with the
            weight percentage. The default percentage is set to 30% (0.3)
          type: array
          items:
            $ref: '#/components/schemas/AgeWeightedFilter'
        ageRange:
          example:
            min: '18'
            max: '24'
            weight: 0.3
          description: >-
            Filter by audience age range. You can send the age range together
            with the weight percentage. The default percentage is set to 30%
            (0.3). You can't send both age and ageRange together.
          allOf:
            - $ref: '#/components/schemas/AudienceAgeRange'
        interests:
          example:
            - id: 1708
              weight: 0.2
            - id: 13
              weight: 0.2
            - id: 3
              weight: 0.2
            - id: 21
              weight: 0.2
            - id: 1
              weight: 0.2
            - id: 11
              weight: 0.2
            - id: 7
              weight: 0.2
            - id: 1826
              weight: 0.2
          description: >-
            Filter by Audience Interests, You can get the array of interests
            with our interests api end point and send interests ids in an array
            together with their weight percentages. The default percentage is
            set to 30% (0.3)
          type: array
          items:
            $ref: '#/components/schemas/InterestsWeightedFilter'
        credibility:
          type: number
          example: 0.75
          description: >-
            Filter by Audience Credibility. The value is the inverse of fake
            followers, meaning 25% fake followers would translate to 0.75 of
            audience credibility.
          minimum: 0
          maximum: 1
    InstagramSearchFilters:
