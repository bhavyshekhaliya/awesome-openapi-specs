          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSearchListSummary'
        '409':
          description: '`LIST_LIMIT_EXCEEDED` — account already has 20,000 active lists'
          content:
            application/json:
              schema:
