            - $ref: '#/components/schemas/AiSearchFiltersAge'
        engagementRate:
          description: Filter by engagement rate
          allOf:
            - $ref: '#/components/schemas/AiSearchFiltersEngagementRate'
        postingFrequency:
          description: Filter by average monthly posting frequency
          allOf:
            - $ref: '#/components/schemas/AiSearchFiltersPostingFrequency'
        viewsCount:
          description: Filter by average per-post view count (median or mean)
          allOf:
            - $ref: '#/components/schemas/AiSearchFiltersViews'
        followersGrowthRate:
          description: >-
            Filter by followers growth rate over the selected interval. At least
            one of min or max is required. Influencers without a growth rate for
            that interval are excluded.
          example:
            interval: i3months
            min: 0.05
          allOf:
            - $ref: '#/components/schemas/AiSearchFiltersFollowersGrowthRate'
        hasEmail:
          type: boolean
          description: Filter by whether the influencer has an email
        brands:
          description: >-
            Filter by brands (Use AI search's <a target="_blank"
            href="/products/discovery_api/openapi_doc/discovery/ai-search/aisearchcontroller_brandsdictionary">Brand
            Dictionary endpoint</a> to get the brand names. P.S. this is a
            different endpoint than existing Brand Dictionary endpoint).
          minItems: 1
          maxItems: 4
          type: array
          items:
            type: string
        username:
          type: string
          description: Username to search for
          minLength: 1
          maxLength: 100
        maxPostAgeMonths:
          type: number
          description: >-
            Filter by the maximum age of the posts in months. Used to request
            more recent posts.
          enum:
            - 3
            - 6
            - 9
            - 12
        contentType:
          type: string
          description: >-
            Filter by content type. Allowed values: video, image. If not
            provided, both video and image content will be returned.
          enum:
            - video
            - image
          example: video
        textTags:
          description: >-
            Filter by influencers who have used the defined hashtags or mentions
            in their posts. Values should be without # or @ prefix.
          example:
            - type: hashtag
