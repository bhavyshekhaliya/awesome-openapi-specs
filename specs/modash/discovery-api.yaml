    CollaborationsSummaryRequest:
      type: object
      properties:
        id:
          type: string
          description: >-
            User ID / Username / Profile URL, User ID is preferred. Note: We do
            not support brand ID in this endpoint yet.
          example: cristiano
        platform:
          type: string
          enum:
            - instagram
            - tiktok
            - youtube
          example: instagram
        collaboratorId:
          type: string
          description: >-
            If provided, only returns the collaboration summary between the
            specified influencer and brand. For Youtube, if you want to extract
            collaborations summary with a specific brand, use the brand's domain
            name instead of the user ID.
          example: ''
        cursor:
          type: string
          description: Cursor for pagination (only valid for 2 days)
        limit:
          type: number
          description: Number of collaboration summaries per page
          minimum: 1
          maximum: 10
          default: 10
        groupBrandCollaborations:
          type: boolean
          default: true
          description: >-
            If true, brand collaborations summaries will be grouped across all
            platforms. This provides insights about the brand across all its
            social accounts.


            For example: if you request brand collaborations summary for
            @cocacola on Instagram, you will get collaboration summary for posts
            sponsored by Coca Cola on all three platforms (Instagram, Tiktok and
            Youtube).


            Note: In some cases, this may group regional or variant accounts
            (e.g., @cocacola_uk, @cocacola_us) when they represent the same
            brand identity. Set this flag to false if social media
            account-specific insights are needed.
      required:
        - id
        - platform
