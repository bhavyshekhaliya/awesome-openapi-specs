          description: "Note: The following sort options are available only when the corresponding filter is applied: `keywords` `audienceGeo` `audienceLang` `audienceGender` `audienceAge` `followersGrowth` `likesGrowth`. <br />\n\t\tSorting field in which order you want to get the results."
          enum:
            - engagements
            - followers
            - engagementRate
            - keywords
            - audienceGeo
            - audienceLang
            - audienceGender
            - audienceAge
            - audienceRelevance
            - relevance
            - followersGrowth
            - views
            - shares
            - saves
            - likesGrowth
        value:
          type: number
          example: 123
          description: Only required for ```audienceGeo``` sorting.
        direction:
          type: string
          example: desc
          default: desc
          description: Sorting direction
          enum:
            - asc
            - desc
      required:
        - field
    ViewsCount:
      type: object
      properties:
        min:
          type: number
          example: 5000
          description: Minimum views count.
        max:
          type: number
          example: 10000
          description: Maximum views count.
    SharesCount:
      type: object
      properties:
        min:
          type: number
          example: 5000
          description: Minimum shares count (this value will be rounded).
        max:
          type: number
          example: 10000
          description: Maximum shares count (this value will be rounded).
    SavesCount:
      type: object
      properties:
        min:
          type: number
          example: 5000
          description: Minimum saves count (this value will be rounded).
        max:
          type: number
          example: 10000
          description: Maximum saves count (this value will be rounded).
    TikTokFilterOperations:
      type: object
      properties:
        operator:
          type: string
          description: >-
            Logical operations used to combine filters.<br><i>Note: To use the
            `or` operator, you must apply it to at least two filters.</i>
          enum:
            - and
            - or
            - not
        filter:
          type: string
          description: >-
            Filter to apply the operation on. If `keywords` or `relevance` are
            specified then you can not sort by these fields.
          enum:
            - followers
            - engagements
            - engagementRate
            - lastposted
            - bio
            - keywords
            - relevance
            - language
            - gender
            - age
            - location
            - isVerified
            - views
            - textTags
      required:
        - operator
        - filter
    TikTokSearchInfluencerFilters:
      type: object
      properties:
        followers:
          example:
            min: 20000
            max: 70000
          description: >-
            We round followers value in the filter: whenever it's below 5k, we
            round it to the nearest thousand (4123 -> 4000; 4800-> 5000); when
            it's over 5k, we round it to the nearest 5,000 (27k -> 25k; 28k ->
            30k).
          allOf:
            - $ref: '#/components/schemas/FollowersCount'
        engagementRate:
          type: number
          description: Minimum engagement rate.
          maximum: 1
          minimum: 0
          example: 0.02
        location:
          example:
            - 148838
            - 62149
            - 80500
            - 1428125
            - 304716
          description: >-
            Filter by Influencer Location, You can get the locations with our
            locations api end point and send location ids in an array.
          maxItems: 20
          type: array
          items:
            type: number
        language:
          type: string
          example: en
          description: >-
            Filter by Influencer Language, You can get the languages code with
            our languages api end point.
          minLength: 1
          maxLength: 3
        lastposted:
          type: number
          example: 90
          description: >-
            Idenitfy influencers based on when they last posted. The number
            represents days and should be >= 30.
          minimum: 30
        relevance:
          example:
            - '#cars'
            - '@topgear'
          description: >-
            Filter by topic of influencers posts or by similarity of topic to
            other influencer. For example "#cars #audi @topgear" means "Writing
            about #cars and #audi, has similar topic as @topgear account."
            <strong>You can only enter 100 usernames.</strong>
          type: array
          items:
            type: string
        audienceRelevance:
          example:
            - '@topgear'
          description: >-
            Filter by similarity of influencer's audience to another
            influencer's audience. For example "@topgear" means "Has audience
            similar to @topgear account." Audience similarity means followers
            follow accounts with the same topics as those followed by @topgear's
            audience.
          type: array
          items:
            type: string
        gender:
          type: string
          example: MALE
          description: Filter by Influencer gender.
          enum:
            - MALE
            - FEMALE
            - KNOWN
            - UNKNOWN
        age:
          description: >-
            Filter by Influencer age, possible values are: 18, 25, 35, 45, 65.
            You have the option to utilize either the `min` field, the `max`
            field, or both concurrently. <strong>Any number that falls outside
            the accepted range will be disregarded.</strong>
          allOf:
            - $ref: '#/components/schemas/InfluencerAgeRange'
        followersGrowthRate:
          description: Growth rate by followers over a period of time.
          example:
            interval: i6months
            value: 0.01
            operator: gt
          allOf:
            - $ref: '#/components/schemas/GrowthFilter'
        bio:
          type: string
          example: photos videos
          description: Search influencer by their bio description and/or full name
        hasAudienceData:
          type: boolean
          description: >-
            Filter by whether the influencer has audience data available. If
            true, shows only accounts with audience data. If false, shows all
            accounts including those without audience data. If not specified,
            defaults to true.
        views:
          description: Filter by views count
          allOf:
            - $ref: '#/components/schemas/ViewsCount'
        hasContactDetails:
          description: If Influencer has contact details.
          type: array
          items:
            $ref: '#/components/schemas/ContactFilter'
        textTags:
          example:
            - type: hashtag
              value: carsofinstagram
            - type: mention
              value: topgear
          maxItems: 20
          description: >-
            Filter by influencers who have used the defined hashtags or mentions
            in their posts.
          type: array
          items:
            $ref: '#/components/schemas/TextTag'
        keywords:
          type: string
          description: >-
            Identify influencers by a phrase they use within the caption of
            their post.
          example: cars
        isVerified:
          type: boolean
          description: Set to `true` to filter by verified influencers.
        likesGrowthRate:
          description: Growth rate by total likes over a period of time.
          example:
            interval: i1month
            value: 0.2
            operator: gt
          allOf:
            - $ref: '#/components/schemas/GrowthFilter'
        shares:
          description: Filter by shares count
          allOf:
            - $ref: '#/components/schemas/SharesCount'
        saves:
          description: Filter by saves count
          allOf:
            - $ref: '#/components/schemas/SavesCount'
        engagements:
          description: Filter by engagements count
          allOf:
            - $ref: '#/components/schemas/EngagementsCount'
        filterOperations:
          description: >-
            Modify filter operation to use `and`, `or`, or `not`. Example:
            Search for <i>influencer using the keyword *cars* AND `not` from the
            London</i> or <i>Female `or` interested in Beauty &
            Cosmetics</i>.<br><i>If no operator is specified, the default
            operator applied is the `and` operator.</i>
          type: array
          items:
            $ref: '#/components/schemas/TikTokFilterOperations'
    TikTokSearchAudienceFilters:
      type: object
      properties:
        location:
          example:
            - id: 148838
              weight: 0.2
            - id: 62149
              weight: 0.2
            - id: 80500
              weight: 0.2
            - id: 1428125
              weight: 0.2
            - id: 304716
              weight: 0.2
          description: >-
            Filter by Audience Location, You can get the locations with our
            locations api end point and send location ids in an array together
            with their weight percentages. The default percentage is set to 20%
            (0.2)
          type: array
          items:
            $ref: '#/components/schemas/LocationWeightedFilter'
        language:
          example:
            id: en
            weight: 0.2
          description: >-
            Filter by Audience Language, You can get the languages code with our
            languages api end point and send the location id within an object,
            together with the weight percentage. The default percentage is set
            to 20% (0.2)
          allOf:
            - $ref: '#/components/schemas/LanguageWeightedFilter'
        gender:
          example:
            id: MALE
            weight: 0.5
          description: >-
            Filter by gender specific Audience, You can send the gender together
            with the weight percentage. The default percentage is set to 50%
            (0.5)
          allOf:
            - $ref: '#/components/schemas/GenderWeightedFilter'
        age:
          example:
            - id: 18-24
              weight: 0.3
            - id: 65-
              weight: 0.3
          description: >-
            Filter by Audience age. You can send the age together with the
            weight percentage. The default percentage is set to 30% (0.3)
          type: array
          items:
            $ref: '#/components/schemas/AgeWeightedFilter'
        ageRange:
          example:
            min: '18'
            max: '24'
            weight: 0.3
          description: >-
            Filter by audience age range. You can send the age range together
            with the weight percentage. The default percentage is set to 30%
            (0.3). You can't send both age and ageRange together.
          allOf:
            - $ref: '#/components/schemas/AudienceAgeRange'
    TikTokSearchFilters:
