  /user/info:
    get:
      operationId: UserController_info
      summary: Get User Account Info
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: If there is an error
                    type: boolean
                  user:
                    type: object
                    properties:
                      name:
                        examples:
                          - Jane Doe
                        description: >-
                          Deprecated field, it is always empty. We will remove
                          this field in the next version of the API.
                        type: string
                      email:
                        examples:
                          - janedoe@example.com
                        description: >-
                          Deprecated field, it is always empty. We will remove
                          this field in the next version of the API.
                        type: string
                  billing:
                    type: object
                    properties:
                      credits:
                        examples:
                          - 500.5
                        type: number
                      rawRequests:
                        example: 4500
                        type: number
                    required:
                      - rawRequests
                  rateLimits:
                    type: object
                    properties:
                      discoveryRatelimit:
                        example: 500
                        type: number
                      rawRatelimit:
                        example: 500
                        type: number
                    required:
                      - discoveryRatelimit
                      - rawRatelimit
                required:
                  - error
                  - user
                  - billing
                  - rateLimits
      tags:
        - User Account
      security:
        - accessToken: []
  /email-search:
    post:
      operationId: MultiPlatformController_emailSearch
      summary: Search by Email
      description: "For each email provided, identify one or more social media accounts on Instagram, YouTube, or TikTok that have listed this email in their bio or as their contact information.\n\t\t</br>A successful request costs <b>0.02 credits per matched email</b>. To execute this request, the account must have a minimum of 0.02 credits multiplied by the number of provided emails, otherwise a <i>not_enough_credits</i> error will be returned.\n\t\t</br><b>We do not store the email addresses that you send us.</b>"
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailsSearchBody'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailsSearchResponse'
      tags:
        - ''
      security:
        - accessToken: []
  /collaborations/posts:
    post:
      operationId: CollaborationsController_posts
      summary: Get collaboration posts
      description: "This endpoint returns collaborated posts (and stories) where influencers mention brands or vice versa.</br> \t\t\tA story is identified by a <code>feed_type</code> of <code>story_original</code> or <code>story_reshared</code>, and omits <code>stats</code> and <code>description</code> because stories carry no engagement metrics or caption. <code>title</code> is YouTube-only and is omitted for Instagram and TikTok.</br> \t\t\tEvery successful request costs <b>0.2 credit</b>."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollaborationsPostsRequest'
            examples:
              default:
                value:
                  id: cristiano
