          type: number
          description: Engagement rate as a percentage (0.71 = 0.71%)
          example: 0.71
        postingFrequency:
          type: number
          description: Average posts per 30-day month
          example: 12
        viewsCountMedian:
          type: number
          description: Median per-post view count over the last 60 days
