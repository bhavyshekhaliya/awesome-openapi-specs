openapi: 3.1.0
paths:
  /raw/ig/search:
    get:
      operationId: InstagramRawController_search
      summary: Search
      description: Search for users and hashtags.
      parameters:
        - name: keyword
          required: true
          in: query
          schema:
            example: cristiano
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: number
                        user:
                          type: object
                          properties:
                            pk:
                              type: string
                            is_verified:
                              default: false
                              type: boolean
                            profile_pic_url:
                              type: string
                            username:
                              type: string
                            full_name:
                              type: string
                            is_private:
                              default: false
                              type: boolean
                          required:
                            - pk
                            - username
                        hashtag:
                          type: object
                          properties:
                            name:
                              type: string
                            id:
                              type: number
                            media_count:
                              type: number
                            search_result_subtitle:
                              type: string
                          required:
                            - name
                            - id
                            - media_count
                            - search_result_subtitle
                        location:
                          type: object
                          properties:
                            pk:
                              type: string
                            name:
                              type: string
                            lat:
                              type: number
                            lng:
                              type: number
                          required:
                            - pk
                            - name
                      required:
                        - position
                required:
                  - list
      tags:
        - Instagram Raw Data
      security:
        - accessToken: []
  /raw/ig/search-hashtags:
    get:
      operationId: InstagramRawController_searchHashtags
      summary: Search Hashtags
      description: Search for hashtags
      parameters:
        - name: keyword
          required: true
          in: query
          schema:
            example: history
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        media_count:
                          type: number
                        search_result_subtitle:
                          type: string
                      required:
                        - id
                        - name
                        - media_count
                        - search_result_subtitle
                required:
                  - items
      tags:
        - Instagram Raw Data
      security:
        - accessToken: []
  /raw/ig/user-info:
    get:
      operationId: InstagramRawController_userInfo
      summary: User Info
      description: Get details about the user profile
      parameters:
        - name: url
          required: true
          in: query
          description: Username (@handle) or user id
          schema:
            example: selenagomez
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                properties:
                  pk:
                    type: string
                  biography:
                    type: string
                  category:
                    type: string
                  external_url:
                    type: string
                  bio_links:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        lynx_url:
                          type: string
                        url:
                          type: string
                        link_type:
                          type: string
                      required:
                        - title
                        - lynx_url
                        - url
                        - link_type
                  fb_profile_biolink:
                    anyOf:
                      - type: 'null'
                      - type: object
                        properties:
                          url:
                            type: string
                          name:
                            type: string
                        required:
                          - url
                          - name
                  follower_count:
                    type: number
                  following_count:
                    type: number
                  full_name:
                    type: string
                  has_channel:
                    type: boolean
                  has_clips:
                    type: boolean
                  has_videos:
                    type: boolean
                  has_guides:
                    type: boolean
                  has_highlight_reels:
                    type: boolean
                  is_business:
                    type: boolean
                  is_private:
                    type: boolean
                  is_verified:
                    type: boolean
                  media_count:
                    type: number
                  profile_pic_url_hd:
                    anyOf:
                      - type: string
                      - type: 'null'
                  profile_pic_url:
                    type: string
                  total_igtv_videos:
                    type: number
                  username:
                    type: string
                  pronouns:
                    type: array
                    items:
                      type: string
                  address:
                    type: object
                    properties:
                      street_address:
                        anyOf:
                          - type: 'null'
                          - type: string
                      city_id:
                        anyOf:
                          - type: 'null'
                          - type: number
                      city_name:
                        anyOf:
                          - type: 'null'
                          - type: string
                      latitude:
                        anyOf:
                          - type: 'null'
                          - type: number
                      longitude:
                        anyOf:
                          - type: 'null'
                          - type: number
                      zip_code:
                        anyOf:
                          - type: 'null'
                          - type: string
                required:
                  - pk
                  - biography
                  - external_url
                  - follower_count
                  - following_count
                  - full_name
                  - is_business
                  - is_private
                  - is_verified
                  - profile_pic_url_hd
                  - profile_pic_url
                  - username
                  - address
      tags:
        - Instagram Raw Data
      security:
        - accessToken: []
  /raw/ig/user-feed:
    get:
      operationId: InstagramRawController_userFeed
      summary: User Feed
      description: Get users media feed in a paginated manner. 12 posts on the page.
      parameters:
        - name: url
          required: true
          in: query
          description: Username (@handle) or user id
          schema:
            example: cristiano
            type: string
        - name: after
          required: false
          in: query
          description: Use `end_cursor` from the last page to get the next page
          schema:
            type: string
            example: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      anyOf:
                        - type: object
                          properties:
                            pk:
                              type: string
                            can_viewer_reshare:
                              type: boolean
                            pinned_for_users:
                              type: array
                              items:
                                type: string
                            caption:
                              type: object
                              properties:
                                text:
                                  type: string
                            carousel_media_count:
                              type: number
                            carousel_media:
                              type: array
                              items:
                                type: object
                                properties:
                                  pk:
                                    type: string
                                  display_url:
                                    type: string
                                  has_audio:
                                    type: boolean
                                  image_versions2:
                                    type: object
                                    properties:
                                      candidates:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            width:
                                              type: number
                                            height:
                                              type: number
                                            url:
                                              type: string
                                          required:
                                            - width
                                            - height
                                            - url
                                    required:
                                      - candidates
                                  is_dash_eligible:
                                    type: boolean
                                  number_of_qualities:
                                    type: number
                                  video_dash_manifest:
                                    anyOf:
                                      - type: 'null'
                                      - type: string
                                  video_url:
                                    anyOf:
                                      - type: 'null'
                                      - type: string
                                required:
                                  - pk
                                  - display_url
                                  - image_versions2
                            clips_metadata:
                              type: object
                              properties:
                                music_info:
                                  anyOf:
                                    - type: 'null'
                                    - type: object
                                      properties:
                                        music_asset_info:
                                          type: object
                                          properties:
                                            audio_cluster_id:
                                              type: string
                                            display_artist:
                                              type: string
                                            id:
                                              type: string
                                            subtitle:
                                              type: string
                                            title:
                                              type: string
                                          required:
                                            - audio_cluster_id
                            coauthor_producers:
                              type: array
                              items:
                                type: object
                                properties:
                                  pk:
                                    type: string
                                  is_verified:
                                    default: false
                                    type: boolean
                                  profile_pic_url:
                                    type: string
                                  username:
                                    type: string
                                required:
                                  - pk
                                  - username
                            code:
                              type: string
                            comment_count:
                              type: number
                            display_url:
                              anyOf:
                                - type: 'null'
                                - type: string
                            has_audio:
                              type: boolean
                            image_versions2:
                              type: object
                              properties:
                                candidates:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      width:
                                        type: number
                                      height:
                                        type: number
                                      url:
                                        type: string
                                    required:
                                      - width
                                      - height
                                      - url
                              required:
                                - candidates
                            is_dash_eligible:
                              type: boolean
                            location:
                              type: object
                              properties:
                                pk:
                                  type: string
                                address:
                                  type: string
                                city:
                                  type: string
                                lat:
                                  type: number
                                lng:
                                  type: number
                                name:
                                  type: string
                              required:
                                - pk
                            media_type:
                              type: number
                            number_of_qualities:
                              type: number
                            play_count:
                              type: number
                            product_type:
                              anyOf:
