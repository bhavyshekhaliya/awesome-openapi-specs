                                  type: string
                                - const: carousel_container
                                  type: string
                                - const: carousel_item
                                  type: string
                                - const: clips
                                  type: string
                                - const: feed
                                  type: string
                                - const: igtv
                                  type: string
                                - const: longform
                                  type: string
                                - const: story
                                  type: string
                            sponsor_tags:
                              type: array
                              items:
                                type: object
                                properties:
                                  sponsor:
                                    type: object
