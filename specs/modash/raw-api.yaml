  /raw/youtube/uploaded-videos:
    get:
      operationId: YoutubeRawController_uploadedVideos
      summary: Uploaded Videos
      description: >-
        Returns a list of 30 uploaded YouTube videos to the channel with a
        limited list of details.
      parameters:
        - name: url
          required: true
          in: query
          description: >-
            YouTube url to channel's page, i.e.
            https://www.youtube.com/@{channelName}
          schema:
            example: https://www.youtube.com/@MrBeast
            type: string
        - name: sorted_by
          required: false
          in: query
          description: >-
            Sorted by a passed parameter: `"dd"` by Date in descending order
            (default) or `"p"` by Popularity
          schema:
            type: string
        - name: after
          required: false
          in: query
          description: Use `cursor` from the last page to get the next page
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos_list:
                    type: object
                    properties:
                      total:
                        type: number
                      videos:
                        type: array
                        items:
                          type: object
                          properties:
                            video_id:
                              type: string
                            thumbnail:
                              type: string
                            title:
                              type: string
                            time:
                              type: string
                            published_ago:
                              type: string
                            views:
                              type: number
                          required:
                            - video_id
                            - thumbnail
                            - title
                      cursor:
                        type: string
                    required:
                      - total
                      - videos
                      - cursor
                  success:
                    type: boolean
                required:
                  - videos_list
                  - success
      tags:
        - YouTube Raw Data
      security:
        - accessToken: []
