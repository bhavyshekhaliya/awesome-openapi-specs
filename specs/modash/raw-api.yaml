                  - success
      tags:
        - TikTok Raw Data
      security:
        - accessToken: []
  /user/info:
    get:
      operationId: UserController_info
      summary: Get User Account Info
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: If there is an error
                    type: boolean
                  user:
                    type: object
                    properties:
                      name:
                        examples:
                          - Jane Doe
                        description: >-
                          Deprecated field, it is always empty. We will remove
                          this field in the next version of the API.
                        type: string
                      email:
                        examples:
                          - janedoe@example.com
                        description: >-
                          Deprecated field, it is always empty. We will remove
                          this field in the next version of the API.
                        type: string
                  billing:
                    type: object
                    properties:
                      credits:
                        examples:
                          - 500.5
                        type: number
                      rawRequests:
                        example: 4500
                        type: number
                    required:
                      - rawRequests
                  rateLimits:
                    type: object
                    properties:
                      discoveryRatelimit:
                        example: 500
                        type: number
                      rawRatelimit:
                        example: 500
                        type: number
                    required:
                      - discoveryRatelimit
                      - rawRatelimit
                required:
                  - error
                  - user
                  - billing
                  - rateLimits
      tags:
        - User Account
      security:
        - accessToken: []
info:
  title: Modash RAW API
  description: >
    RAW API endpoints return **real-time, unfiltered data** data from public
    social media profiles on Instagram, TikTok, and YouTube. Use them to access
    profiles, content, comments, tags, and hashtag feeds — exactly as they
    appear on the platforms.


    These endpoints are ideal for custom analytics, live monitoring, or building
    your own enrichment workflows.


    > ⚠️ Data is returned as-is, without filtering. Handle rate limits and
    pagination as needed.


    <a
    href="https://help.modash.io/en/articles/14035598-raw-api-best-practices-and-onboarding"
    target="_blank">Read the Raw API Best Practices guide →</a>
  version: "1"
  contact:
    name: API Support
    url: https://www.modash.io
    email: hello@modash.io
  termsOfService: https://www.modash.io/legal/terms-of-service
tags:
  - name: Instagram Raw Data
    description: >-
      Instagram Raw Data API allows you to get public data anonymously from
      Instagram.


      Access to this API is restricted. To get access to this API contact our
      support at [hello@modash.io](mailto:hello@modash.io).


      Our RAW API subscriptions come with a monthly limit for requests, every
      successful request consumes one from the limit. A 404 status code is
      treated as a successful request, indicating that the requested content
      could not be found.
  - name: TikTok Raw Data
    description: >-
      TikTok Raw Data API allows you to get public data anonymously from Tiktok.


      Access to this API is restricted. To get access to this API contact our
      support at [hello@modash.io](mailto:hello@modash.io).


      Our RAW API subscriptions come with a monthly limit for requests, every
      successful request consumes one from the limit. A 404 status code is
      treated as a successful request, indicating that the requested content
      could not be found.
  - name: YouTube Raw Data
    description: >-
      YouTube Raw Data API allows you to get public data anonymously from
      YouTube.


      Access to this API is restricted. To get access to this API contact our
      support at [hello@modash.io](mailto:hello@modash.io).


      Our RAW API subscriptions come with a monthly limit for requests, every
      successful request consumes one from the limit. A 404 status code is
      treated as a successful request, indicating that the requested content
      could not be found.
  - name: User Account
    description: API for Modash user account management
servers:
  - url: https://api.modash.io/v1
components:
  securitySchemes:
    accessToken:
      scheme: bearer
      bearerFormat: token
      description: 'Please enter token in following format: Bearer \<APIToken\>'
      type: http
security:
  - accessToken: []
