            example: '7364804047850884398'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                contentMediaType: video/mp4
      tags:
        - TikTok Raw Data
      security:
        - accessToken: []
  /raw/tiktok/media-download-url:
    get:
      operationId: TiktokRawController_mediaDownloadUrl
      summary: TikTok Media Download URL
      description: >-
        Returns an URL to download the TikTok media video by id. The URL is
        valid for 24 hours.
      parameters:
        - name: url
          required: true
          in: query
          description: TikTok media/post ID
          schema:
            example: '7364804047850884398'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  videoUrl:
                    type: string
                  success:
