  /raw/ig/hashtag-feed:
    get:
      operationId: InstagramRawController_hashtagFeed
      summary: Hashtag Feed
      description: >-
        Get posts for a hashtag. This endpoint mirrors Instagram's curated
        hashtag results; it is **not** an exhaustive archive of every post that
        used the hashtag.


        **`type=top` (recommended for coverage)**

        - Returns featured posts for the hashtag.

        - Ranking is live: the same `after` cursor can return different items
        seconds later, and later pages may reshuffle or re-serve posts already
        returned earlier.

        - Do not pause and resume hours later with an old cursor; paginate in
        one continuous walk.


        **`type=recent` (default)**

        - Intended as newer posts for the hashtag, but Instagram may return only
        a small subset.

        - Ordering is not guaranteed to be strictly chronological.
      parameters:
        - name: hashtag
          required: true
          in: query
          schema:
            type: string
        - name: type
          required: false
          in: query
          description: >-
            Feed variant. `top` = featured hashtag posts (best coverage, live
            ranking, may reshuffle). `recent` = newer posts (often a small
            non-exhaustive subset; not strictly chronological).
          schema:
            default: recent
            enum:
              - recent
              - top
            type: string
        - name: after
          required: false
          in: query
          description: >-
            Use `end_cursor` from the previous response to fetch the next page.
            Cursors are session-bound and not stable for later replay; prefer
            continuous pagination.
          schema:
            type: string
            example: ''
