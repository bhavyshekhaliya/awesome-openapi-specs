openapi: 3.1.0
info:
  title: OpenF1 REST API
  version: 1.0.0
  description: Community-maintained definition of the 18 documented v1 dataset routes. Historical data from 2023
    onward is available without authentication; authenticated real-time data requires a paid subscription. This
    definition covers REST dataset reads and JSON/CSV responses, not MQTT or WebSocket streaming.
  externalDocs:
    description: OpenF1 API documentation
    url: https://openf1.org/docs/
servers:
- url: https://api.openf1.org/v1
  description: OpenF1 v1 REST API
tags:
- name: race-data
  description: Formula 1 sessions, timing, telemetry, and results.
paths:
  /car_data:
    get:
      operationId: getCarData
      summary: Car data
      description: Returns matching records. Each documented scalar attribute can be used as a filter; array-valued
        attributes are not filterable. The provider docs also describe comparison filters and CSV output.
      externalDocs:
        description: OpenF1 endpoint documentation
        url: https://openf1.org/docs/#car-data
      parameters:
      - name: brake
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: date
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: string
      - name: driver_number
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: drs
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: meeting_key
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key. The value `latest` is also supported.
        schema:
          oneOf:
          - type: integer
          - type: string
      - name: n_gear
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: rpm
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: session_key
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key. The value `latest` is also supported.
        schema:
          oneOf:
          - type: integer
          - type: string
      - name: speed
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: throttle
        in: query
        required: false
        description: Filter records by this field. The provider documents comparison operators for range filters;
          encode operator characters in the query key.
        schema:
          type: integer
      - name: csv
        in: query
        required: false
        description: Set to true to request CSV output instead of the default JSON.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Matching records as a JSON array, or CSV text when `csv=true`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    brake:
                      type: integer
                    date:
                      type: string
                    driver_number:
                      type: integer
                    drs:
                      type: integer
                    meeting_key:
                      type: integer
                    n_gear:
                      type: integer
                    rpm:
                      type: integer
                    session_key:
                      type: integer
                    speed:
                      type: integer
                    throttle:
                      type: integer
                  additionalProperties: true
            text/csv:
              schema:
                type: string
      security:
      - {}
      - bearerAuth: []
      tags:
      - race-data
