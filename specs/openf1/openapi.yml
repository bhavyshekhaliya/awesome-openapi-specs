                    meeting_key:
                      type: integer
                    points_current:
                      type: integer
                    points_start:
                      type: integer
                    position_current:
                      type: integer
                    position_start:
                      type: integer
                    session_key:
                      type: integer
                  additionalProperties: true
            text/csv:
              schema:
                type: string
      security:
      - {}
      - bearerAuth: []
      tags:
